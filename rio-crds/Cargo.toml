[package]
name = "rio-crds"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "CustomResourceDefinition types for rio-build (Pool, ComponentScaler)"

# CRD types + thin kube::Error classification helpers, extracted from
# rio-controller so rio-cli (P0237) and rio-scheduler can depend on
# them without pulling the full reconciler stack (~500 transitive
# deps via kube-runtime). No reconcile logic, no kube::Client, no
# tokio runtime — only `kube` with the `derive` feature.
#
# The error helpers (KubeErrorExt/KubeResultExt) live here because
# rio-common is intentionally kube-free and rio-controller is too
# heavy for scheduler/xtask to depend on. This crate is the lightest
# kube-adjacent leaf in the workspace.

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
# Generates infra/helm/crds/*.yaml from the CRD types in this crate.
# Lives here (not rio-controller) so `packages.crds` and `crds-drift`
# depend on the lightest kube-adjacent leaf instead of the full
# reconciler crate — editing rio-store no longer rebuilds crdgen.

[dependencies]
# `derive` feature only — CustomResource + KubeSchema proc-macros.
# NOT `runtime`/`client`: those pull the reconciler machinery.
kube = { workspace = true }
k8s-openapi = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
# kube's CustomResource derive macro emits `serde_json::` paths
# directly in the generated code — must be a direct dep, not dev.
serde_json = { workspace = true }
# Write-only for crdgen (and the crd_serializes test).
serde-saphyr = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `cel` feature pulls kube-cel (pure-Rust CEL interpreter) so unit
# tests can EVALUATE x-kubernetes-validations against test instances
# instead of string-grepping the schema. Dev-only — prod binaries
# don't link the CEL interpreter; the apiserver evaluates rules
# server-side.
kube = { workspace = true, features = ["cel"] }
