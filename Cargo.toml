[workspace]
members = [
  "rio-auth",
  "rio-cli",
  "rio-common",
  "rio-controller",
  "rio-gateway",
  "rio-lease",
  "rio-migrations",
  "rio-nix",
  "rio-proto",
  "rio-scheduler",
  "rio-store",
  "rio-test-support",
  "rio-builder",
  "rio-crds",
  "workspace-hack",
  "xtask",
]
exclude = ["fuzz/rio-nix", "fuzz/rio-store"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rio Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lovesegfault/rio-build"

[workspace.dependencies]
# Internal crates
rio-auth = { path = "rio-auth" }
rio-common = { path = "rio-common" }
rio-migrations = { path = "rio-migrations" }
rio-nix = { path = "rio-nix" }
rio-proto = { path = "rio-proto" }
rio-scheduler = { path = "rio-scheduler" }
# default-features off so members can opt into the lean `schema` feature
# (rio-scheduler) without the server dep cascade. Members that need the
# full store enable `server` (or `test-utils`, which implies it).
rio-store = { path = "rio-store", default-features = false }
rio-test-support = { path = "rio-test-support" }
rio-crds = { path = "rio-crds" }
rio-lease = { path = "rio-lease" }

# Byte buffers
bytes = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SSH server
russh = "0.61"
# Tracks the pre-release russh 0.61 pins exactly (=0.7.0-rc.10) so the
# tree carries a single ssh-key. Drop the -rc once 0.7.0 final lands
# and russh follows.
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "std"] }
async-trait = "0.1"

# gRPC
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"

# Database
# tls-rustls-aws-lc-rs: Aurora PG 15+ has rds.force_ssl=1 by default —
# connections without TLS are rejected. aws-lc-rs matches the workspace
# rustls CryptoProvider (see `rustls` dep below and tonic's tls-aws-lc).
# EKS connection strings use `?sslmode=verify-full` + the vendored RDS
# bundle as sslrootcert (k3s/dev URLs carry no ssl params).
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "sqlite",
  "macros",
  "migrate",
  "uuid",
  "json",
  "tls-rustls-aws-lc-rs",
] }
uuid = { version = "1", features = ["v4", "v7"] }

# S3
aws-sdk-s3 = { version = "1.133", default-features = false, features = [
  "sigv4a",
  "http-1x",
  "default-https-client",
  "rt-tokio",
] }
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
  "credentials-process",
  "sso",
] }

# RDS IAM auth-token minting (rio-common's pg-iam feature).
aws-sigv4 = { version = "1", default-features = false, features = [
  "sign-http",
] }
aws-credential-types = { version = "1", default-features = false }
aws-smithy-runtime-api = { version = "1", default-features = false }
url = "2"

# FUSE. Pinned to master for ReplyOpen::wrap_backing/BackingId::into_raw:
# the unprivileged castore-FUSE replies open() with a backing_id allocated
# by rio-mountd's privileged BACKING_OPEN ioctl, and 0.17.0 can only mint
# a BackingId by doing that ioctl itself (EPERM in the builder). Drop the
# pin at the first release containing cberner/fuser@a664f194. NAR hashes
# for the pinned tree: crate-hashes.json + workspaceCargoVendor (flake.nix).
fuser = { git = "https://github.com/cberner/fuser", rev = "2bdfbc53a116b9b4af5c91d20ab6a4f9b9004645" }

# Linux syscalls
nix = { version = "0.31", features = [
  "mount",
  "sched",
  "fs",
  "user",
  "hostname",
  "process",
  "signal",
  "socket",
  # setrlimit(RLIMIT_NOFILE) at builder startup — passthrough backing
  # fds + chunk-cache fds scale with max_backing_ids and overflow the
  # 1024 default soft limit.
  "resource",
] }
# raw_os_error()/raise()/errno constants where the `nix` crate is
# overkill. Used as a normal dep in rio-gateway (EMFILE/ENFILE accept
# loop classification) and as a dev-dep elsewhere (signal self-delivery
# in tests).
libc = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging & metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
# default-features off: the defaults include `push-gateway`, which drags a
# full hyper+rustls HTTP client we never use — components only expose the
# scrape listener (rio-common init_metrics → with_http_listener).
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = [
  "http-listener",
] }
# `debugging::DebuggingRecorder` snapshotter — dev-dep only, for
# asserting emitted counters in controller/scheduler tests.
metrics-util = { version = "0.20", features = ["debugging"] }

# OpenTelemetry (phase2b: full OTLP, not just stdout — milestone requires
# "traces visible in Jaeger")
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

# Configuration loading (TOML file + RIO_ env + CLI overlay layering) — see
# rio_common::config::load. Replaces figment (dormant upstream: no release
# since 2024-05). default-features off: the defaults pull json/yaml/ron/
# ini/json5 readers and async-source traits we never use; TOML is the only
# on-disk format; `json` exists solely so the compiled-defaults/CLI layers
# can be fed through the JSON value parser (see
# rio_common::config::serialized_layer).
config = { version = "0.15", default-features = false, features = [
  "toml",
  "json",
] }

# Concurrent map (phase2b: scheduler log ring buffers, written from
# BuildExecution recv tasks outside the actor loop)
dashmap = "6"
# Per-tenant SlaEstimator fit cache (ADR-023 §Threat-model gap c).
# aws-sdk-* still pins 0.16.x transitively, so 0.18 carries a (tiny)
# second copy until the SDK catches up.
lru = "0.18"
# Short on-stack vecs (ADR-023 §13a `dispatched_cells` A' set, |A'|≤4
# typical). Already transitive via tokio/dashmap (zero lockfile churn).
smallvec = "1"
# Lead-time/boot quantile sketches (ADR-023 §13b @alg-pool), persisted to
# PG as version-tagged HdrHistogram V2 bytes — a specified, cross-language
# format, unlike the serde shape of the crate it replaced. `serialization`
# only: no `sync` (recording is single-threaded in the reconciler).
# flate2/nom are already in the tree; hdrhistogram pins base64 ^0.21, so a
# second base64 copy (0.21 next to our 0.22) rides along until upstream
# bumps it — same situation as the lru 0.16/0.18 pair above.
hdrhistogram = { version = "7", default-features = false, features = [
  "serialization",
] }

# rio-mountd UDS wire format (rio-builder castore_fuse/mountd_proto.rs):
# one length-prefixed postcard datagram per request/response. no_std serde
# wire format, varint-packed; replaces bincode 2.x (RUSTSEC-2025-0141
# unmaintained).
postcard = { version = "1", features = ["use-std"] }

# Per-tenant rate limiting (phase4b gateway). DefaultKeyedRateLimiter
# keyed on tenant_name (bounded keyspace — authorized_keys comment is
# operator-controlled, not client-forgeable). No eviction needed.
governor = "0.10"

# --- phase2c: chunked CAS ---
# Content-defined chunking. v2020 algorithm — Chunker::new(data, min, avg, max)
# slices at statistically-stable boundaries so small edits only perturb the
# chunk they touch (dedup-friendly).
fastcdc = "4"
# Chunk addressing (internal only — never exposed to Nix).
blake3 = "1"
# In-process chunk cache. Lock-free, weight-based eviction — moka tracks
# byte-size per entry so the 2GB cap is a real memory bound, not just an
# entry count. Singleflight wraps the miss path.
moka = { version = "0.12", features = ["future"] }
# On-the-fly NAR compression for the binary-cache HTTP endpoint. NARs are
# stored uncompressed (chunked) for dedup; zstd only at serve time.
zstd = "0.13"

# /healthz router (rio-common, rio-builder) + dev-dep fake upstream (rio-store).
axum = "0.8"
# narinfo signing (rio-nix/rio-store) + JWT key material (rio-auth, gateway).
# pkcs8 for key encode/decode. Tracks the pre-release russh 0.61 / ssh-key
# 0.7-rc line (=3.0.0-pre.7) so the tree carries a single dalek; drop the
# -pre once 3.0 final lands and russh follows. No `rand_core` feature:
# keys are always built from operator/test-supplied seed bytes
# (`from_bytes`), never `::generate` — deterministic keys, meaningful
# proptest shrinking.
ed25519-dalek = { version = "3.0.0-pre.7", features = ["pkcs8"] }

# --- phase5: JWT tenant tokens (rio-auth) ---
# EdDSA (ed25519) signing — scheduler/store/controller verify the gateway's
# signature + expiry on every gRPC call. The signing key lives in a K8s
# Secret; the public key is distributed via ConfigMap.
# v10: crypto is trait-based; must pick a backend. aws_lc_rs: every binary
# already links aws-lc-rs (rustls CryptoProvider, aws-sdk, russh), so the
# original "rust_crypto avoids a C dep + bindgen" rationale is gone — and
# rust_crypto pulled the whole RustCrypto family set (rsa, p256/p384,
# rand 0.8, a second ed25519-dalek) for algorithms we never mint. Key
# formats at our call sites are backend-agnostic: PKCS#8 DER on sign,
# raw 32-byte key on verify (rio-auth/src/jwt.rs). use_pem stays off —
# we only use DER.
jsonwebtoken = { version = "10", default-features = false, features = [
  "aws_lc_rs",
] }

# --- phase2c: priority scheduling ---
# BinaryHeap over f64 critical-path priority. f64 doesn't impl Ord (NaN);
# OrderedFloat<f64> is the standard workaround.
ordered-float = "5"

# --- phase3a: Kubernetes operator ---
# kube 3.0 breaking from 2.x: chrono→jiff timestamps, ErrorResponse folded
# into Status. runtime = Controller abstraction + watcher. derive =
# #[derive(CustomResource)] + #[kube(...)]. client = kube::Client::try_default
# reads in-cluster service-account token.
# default-features off: kube's defaults select the `ring` rustls provider;
# we re-add client + rustls-tls and pick `aws-lc-rs` instead so the whole
# workspace links a single CryptoProvider (sqlx, tonic, aws-sdk, russh and
# the direct `rustls` dep below are all aws-lc-rs already). xtask adds
# `ws` on top (port-forward/exec).
kube = { version = "3.1", default-features = false, features = [
  "runtime",
  "derive",
  "client",
  "rustls-tls",
  "aws-lc-rs",
] }
# rustls direct: lets binaries call rustls::crypto::…::install_default()
# without relying on transitive re-exports. Historically REQUIRED because
# kube (ring) + aws-sdk (aws-lc-rs) put two providers in the build and
# rustls 0.23 refuses to auto-select; kube now follows the workspace
# aws-lc-rs choice (above), so install_default() is defensive — it keeps
# a future transitive ring revival from turning into a runtime panic.
rustls = { version = "0.23", default-features = false, features = [
  "aws-lc-rs",
] }
# k8s-openapi types are feature-gated by K8s API version. v1_35 is the
# highest this release supports. The feature pins which struct fields
# exist (e.g., ephemeralContainers moved GA in different versions).
k8s-openapi = { version = "0.27", features = ["v1_35"] }
# schemars 1.x NOT 0.8 — kube 3.0 requires the major break. CRD JSON
# schema generation for #[derive(JsonSchema)].
schemars = "1"
# CRD YAML emission (crdgen → infra/helm/crds/) + xtask kubeconfig/values
# parsing. Replaces serde_yml (RUSTSEC-2025-0068, unsound + unmaintained —
# its deny.toml exception went with it). kube's next release moves its
# kubeconfig parsing to serde-saphyr too, so the tree converges on one
# YAML stack once that lands; until then kube still pulls serde_yaml
# transitively.
serde-saphyr = "0.0.26"

# --- phase3a: health + streaming ---
# grpc.health.v1.Health service. K8s readiness probes hit this.
tonic-health = "0.14"
# gRPC-Web on the scheduler's main port (D3: in-process translation
# instead of an Envoy/Cilium grpc_web filter). Browser fetch sends
# application/grpc-web+proto over HTTP/1.1; GrpcWebLayer translates.
tonic-web = "0.14"
# CORS for the gRPC-Web listener — configurable allow-origins so the
# dashboard SPA (different origin) can call the scheduler directly.
tower-http = { version = "0.6", features = ["cors"] }
# Streaming decode for upstream-substituter NAR fetch
# (rio-store::substitute). O(chunk) pipeline, never buffers whole NAR.
# Feature set matches reference Nix's libutil/compression.cc so any
# narinfo cache.nixos.org has ever served can be substituted.
async-compression = { version = "0.4", features = [
  "tokio",
  "zstd",
  "xz",
  "bzip2",
  "brotli",
  "gzip",
] }
# StreamReader: turn a Stream<Item=Bytes> into an AsyncRead. Feeds
# async-compression's ZstdEncoder which needs AsyncBufRead.
tokio-util = { version = "0.7", features = ["io"] }

# --- phase3a: controller testing (dev) ---
# mock::pair() gives a tower Service + Handle. Wrap the Service in
# kube::Client::new() and the reconciler talks to a fake API server.
tower-test = "0.4"
# .collect().await on kube::client::Body for mock response assembly.
http-body-util = "0.1"
# In-process tonic transport: wrap tokio::io::duplex halves so
# start_paused tests don't see spurious auto-advance on real TCP.
hyper-util = "0.1"
http = "1"
# RFC 9110 Retry-After HTTP-date parsing (substitute.rs 429 handling).
# Already transitive via hyper; pinned direct so rio-store's parser
# doesn't break if hyper's deptree shifts.
httpdate = "1"

# Crypto
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.22"
# HMAC-SHA256 for assignment tokens (Phase 3b). Constant-time verify
# via Mac::verify_slice — never compare raw tag bytes with ==.
hmac = "0.13"

# Encoding
hex = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"
# strum::EnumCount: pin variant counts so test arrays can't drift
# silently from `_exhaustive` match arms (guards_tests.rs).
strum = { version = "0.28", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# preserve_order: schemars 1.x schemas are serde_json::Values, so the
# committed config-schema fixtures (and docs/gen JSON) keep their key
# order only while serde_json maps preserve insertion order. The feature
# used to arrive transitively; once that enabler dropped out of the dep
# graph, `BLESS=1` started rewriting fixtures alphabetically. Pin it
# explicitly so snapshot order is deliberate, not an accident.
serde_json = { version = "1", features = ["preserve_order"] }

# Randomness (retry jitter)
rand = "0.10"

# Stream utilities (tonic re-exports, but we need it directly for ReceiverStream etc.)
tokio-stream = "0.1"
futures-util = "0.3"
# Lock-free Arc hot-swap. Read-heavy + rare-write (gateway authorized_keys
# reload on Secret change, I-109): readers .load() without blocking writers.
arc-swap = "1"

# Sync primitives. parking_lot::RwLock for shared hot-path state where
# writes are rare and reads are per-dispatch (no .await across guard).
parking_lot = "0.12"

# --- ADR-023: SLA-driven sizing fit (rio-scheduler) ---
# Dense linear algebra for the NNLS (non-negative least squares) solver
# that fits mem=M(cores) per (pname,system) key. default-features off drops
# rand/serde/macros — we only need DMatrix/DVector + decompositions.
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
# Normal/Student-t CDF + quantile functions (Φ, Φ⁻¹, t.ppf) for the SLA
# quantile bounds. Replaces statrs (no release since 2024; its default
# features dragged a second nalgebra plus rand 0.8 for multivariate/
# sampling code we never call). distrs is exactly these two
# distributions (AS 241 + Hill's t-quantiles); only dep is libm.
distrs = "0.2"

# Testing
proptest = "1"
# Parameterized tests via #[rstest] #[case(...)]. Replaces hand-rolled
# clusters of N near-identical #[test] fns with one fn + N case rows.
# default-features off: skips the async-timeout feature (pulls
# futures-timer); we use #[tokio::test] for async cases directly.
rstest = { version = "0.26", default-features = false }
tempfile = "3"
tracing-test = "0.2"
aws-smithy-mocks = "0.2"
# Dev-only across the workspace: Router::oneshot (ServiceExt) for axum
# handler tests + rio-test-support's in-proc duplex transport. tonic/kube
# pull tower transitively for prod, but no rio-* crate depends on it
# directly outside [dev-dependencies].
tower = { version = "0.5", features = ["util"] }

# Utility
regex = "1"
heck = "0.5"
scopeguard = "1"

# --- xtask (dev tooling) ---
xshell = "0.2"
# Pure-Rust git (no libgit2 C dep). xtask needs rev-parse + dirty-tree
# detection for the ECR image tag. status/dirwalk covers both tracked
# changes and untracked files (the push script hashes `git diff HEAD` +
# `git status --porcelain`).
gix = { version = "0.83", default-features = false, features = [
  "basic",
  "dirwalk",
  "revision",
  "status",
  "blob-diff",
  "sha1",
  "parallel",
] }
aws-sdk-ec2 = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-ecr = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-elasticloadbalancingv2 = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-sts = { version = "1", default-features = false, features = [
  "sigv4a",
  "default-https-client",
  "rt-tokio",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
dotenvy = "0.15"
human-panic = "2"
# Interactive prompts (TTY fallbacks when flags are missing). console
# backend so there's a single terminal-handling crate (ui.rs spinner
# uses `console::Term` for width).
inquire = { version = "0.9", default-features = false, features = [
  "console",
  "fuzzy",
] }
# Timestamp parsing + friendly duration display (rollback picker).
# Already transitive via kube 3.0; direct for jiff::fmt::friendly.
jiff = "0.2"
# Parse workspace Cargo.toml (fuzz-lock auto-discovery). Already
# transitive; direct for toml::from_str.
toml = "1.1"
clap-verbosity-flag = { version = "3", default-features = false, features = [
  "tracing",
] }
console = "0.16"
filetime = "0.2"

[profile.release]
incremental = false
lto = "thin"

[profile.dev]
incremental = false

# Compile dependencies with optimization even in dev/test profile.
# Speeds up crypto-heavy tests (zstd/blake3/sha2/ed25519/fastcdc) — those
# are inner-loop bytes-per-cycle code that's 10-50× slower unoptimized.
# Deps rebuild rarely (per-crate caching via crate2nix), so the one-time
# compile cost is amortized. Workspace crates stay at opt-level=0 for
# fast incremental rebuilds + usable debuginfo.
[profile.dev.package."*"]
opt-level = 2
