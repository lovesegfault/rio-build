# Non-root container (runAsUser, readOnlyRootFilesystem). Master
# process runs foreground; no `user` directive (we're already
# unprivileged — nginx warns on `user` when not root and ignores
# it). pid + temp paths go to /tmp (emptyDir mount in the
# Deployment).
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events { worker_connections 1024; }
http {
  include @mimeTypes@;
  js_import svc from @serviceTokenJs@;
  js_set $rio_service_token svc.token;
  access_log /dev/stdout;
  # All writable paths in /tmp. readOnlyRootFilesystem blocks the
  # compiled-in defaults (/var/cache/nginx/* on most distros,
  # $prefix/client_body_temp/* on nixpkgs). One emptyDir covers
  # all five — nginx only writes to these on large bodies /
  # upstream responses; gRPC-Web POSTs are small proto frames.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # Per-backend upstreams, dialed directly. Both rio-scheduler and
  # rio-store serve gRPC-Web NATIVELY (tonic-web layer, D3) so the
  # in-cluster nginx → backend hop needs no Gateway. The Cilium
  # Gateway is for north-south (browser → cluster) — Cilium's L7
  # redirect fires on the LoadBalancer IP, not the Service ClusterIP,
  # so an in-cluster client targeting the Gateway Service FQDN would
  # just hang (selectorless Service, no Endpoints).
  #
  # The scheduler upstream is the LEADER-ONLY Service.
  # rio-scheduler-leader (NOT rio-scheduler): its selector admits only
  # pods carrying the rio.build/scheduler-role=leader label. The standby
  # never labels itself; the holder labels its own pod and strips the
  # label off any other pod still carrying it (the peer sweep) as part
  # of the same retried reconcile, so the Service's endpoints converge
  # to exactly the current leader on the new holder's first successful
  # reconcile after acquiring (retried once per renew interval until it
  # lands). During an asymmetric partition, requests that reach the
  # stale-labeled, self-fenced ex-leader fail with un-retryable
  # UNAVAILABLE from its self-fence until that first successful
  # reconcile; persistent reconcile failure extends that window and is
  # priced under sched.lease.deletion-cost. The plain rio-scheduler
  # ClusterIP has BOTH replicas as endpoints (readiness is tcpSocket,
  # not leadership); the proxy's upstream connections get pinned to one
  # backend, and nginx cannot retry a Trailers-Only 200 — a dashboard
  # pinned to the standby was completely broken. The remaining failover
  # cost is a brief 0-endpoint window (connection refused / 502), which
  # the browser/test retry loop already handles.
  #
  # GENERATED upstream blocks (bug_238/bug_403): rendered by docker.nix
  # from infra/helm/rio-build/files/dashboard-upstreams.json with
  # ${ENV} placeholders; the image entrypoint envsubsts them (defaults
  # = today's literals; dashboard.yaml overrides from
  # .Values.namespaces). The same JSON generates the dashboard-egress
  # AND backend-ingress CiliumNetworkPolicy pairs — an upstream cannot
  # exist without its network edge.
@upstreamBlocks@
  server {
    # 8080 not 80: runAsNonRoot means no CAP_NET_BIND_SERVICE →
    # can't bind <1024. The k8s Service maps :80 → targetPort:8080.
    # [::] not bare 8080: bare `listen PORT` binds 0.0.0.0 only;
    # in a v6-only pod the kubelet httpGet probe targets the pod's
    # v6 IP and never connects. With Linux bindv6only=0 (default)
    # [::] dual-binds, so v4 lo still works for port-forward.
    listen [::]:8080;

    # SPA: all unknown routes serve index.html, the client-side
    # router (svelte-routing / whatever P0274 picked) handles the
    # path. try_files short-circuits to the real file for static
    # assets (/assets/*.js, *.css).
    location / {
      root @spaRoot@;
      try_files $uri /index.html;
    }

    # r[dash.auth.method-gate+4] ALLOW-LIST: only the readonly
    # methods enumerated in docker.nix dashboardReadonly{Admin,
    # Scheduler,StoreLogs} are proxied; everything else under /rio.*
    # falls through to the catch-all 404 below. This was a 4-method
    # DENY-list, which fail-OPENED ~10 mutating RPCs (ResetSlaModel,
    # SubmitBuild, CancelBuild, ReportExecutorTermination, …) to
    # any port-forwarded browser. Allow-list polarity matches the
    # Cilium Gateway HTTPRoutes and is CI-enforced via
    # dashboard-method-gate-parity.
    #
    # nginx evaluates regex locations in config order, first-match
    # wins — proxy locations FIRST, catch-all 404 LAST.
    #
    # gRPC-Web is plain HTTP/1.1 POST with a length-prefixed proto
    # body; rio-scheduler's and rio-store's tonic-web layers (D3)
    # handle gRPC-Web on the same port as native gRPC.
    #
    # All proxy locations share the directive set — keep them in
    # sync. Unbuffered streaming + long read-timeout are LOAD-BEARING:
    # TailLog/WatchBuild are live-tailing streams; with buffering
    # on, nginx flushes nothing until completion. proxy_read_timeout
    # 3600s matches the backends' http2_keepalive_interval(30s) so
    # quiet streams survive.
    location ~ ^/rio\.admin\.AdminService/(@readonlyAdminAlt@)$ {
      proxy_pass http://rio_scheduler;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Grpc-Web $http_x_grpc_web;
      # r[impl sched.sla.threat.read-path-auth] (documentary — tracey
      # scans only nix/tests/default.nix). The njs variable is
      # computed per request; 60s expiry matches
      # ServiceTokenInterceptor.
      proxy_set_header x-rio-service-token $rio_service_token;
    }
    location ~ ^/rio\.scheduler\.SchedulerService/(@readonlySchedulerAlt@)$ {
      proxy_pass http://rio_scheduler;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Grpc-Web $http_x_grpc_web;
      proxy_set_header x-rio-service-token $rio_service_token;
    }
    # Build logs: rio-store's LogService. The one dashboard RPC that
    # doesn't go to the scheduler — logs live in the store as
    # immutable chunks + a PG manifest. The service token is sent for
    # consistency with the other locations; TailLog IGNORES it by
    # design (tenant-authenticated, no service bypass — bug_290 /
    # store.log.method-credential). The dashboard itself sends no
    # tenant token (registry-declared KeylessOnly, owner decision Q1
    # 2026-06-04): in a jwt-enabled deployment this location returns
    # Unauthenticated and the SPA renders its terminal authRequired
    # state instead of retrying.
    location ~ ^/rio\.store\.LogService/(@readonlyStoreLogsAlt@)$ {
      proxy_pass http://rio_store;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Grpc-Web $http_x_grpc_web;
      proxy_set_header x-rio-service-token $rio_service_token;
    }
    # Fail-closed catch-all for any other /rio.* path (mutating
    # admin RPCs, SubmitBuild/CancelBuild, future methods).
    location ~ ^/rio\. {
      return 404;
    }
  }
}
