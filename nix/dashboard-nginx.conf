# Non-root container (runAsUser, readOnlyRootFilesystem). Master
# process runs foreground; no `user` directive (we're already
# unprivileged — nginx warns on `user` when not root and ignores
# it). pid + temp paths go to /tmp (emptyDir mount in the
# Deployment).
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events { worker_connections 1024; }
http {
  include @mimeTypes@;
  js_import svc from @serviceTokenJs@;
  js_set $rio_service_token svc.token;
  access_log /dev/stdout;
  # All writable paths in /tmp. readOnlyRootFilesystem blocks the
  # compiled-in defaults (/var/cache/nginx/* on most distros,
  # $prefix/client_body_temp/* on nixpkgs). One emptyDir covers
  # all five — nginx only writes to these on large bodies /
  # upstream responses; gRPC-Web POSTs are small proto frames.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # Single upstream: the LEADER-ONLY scheduler Service. The scheduler
  # serves gRPC-Web NATIVELY (tonic-web layer, D3) so the in-cluster
  # nginx → scheduler hop needs no Gateway. The Cilium Gateway is for
  # north-south (browser → cluster) — Cilium's L7 redirect fires on
  # the LoadBalancer IP, not the Service ClusterIP, so an in-cluster
  # client targeting the Gateway Service FQDN would just hang
  # (selectorless Service, no Endpoints).
  #
  # rio-scheduler-leader (NOT rio-scheduler): its selector includes the
  # rio.build/scheduler-role=leader label the lease holder stamps on its
  # own pod, so the only endpoint is the current leader and a
  # Trailers-Only Unavailable from the standby is structurally
  # impossible. The plain rio-scheduler ClusterIP has BOTH replicas as
  # endpoints (readiness is tcpSocket, not leadership); the proxy's
  # upstream connections get pinned to one backend, and nginx cannot
  # retry a Trailers-Only 200 — a dashboard pinned to the standby was
  # completely broken. The cost is a 0-endpoint window during failover
  # (connection refused / 502), which the browser/test retry loop
  # already handles.
  upstream rio_scheduler {
    server rio-scheduler-leader.rio-system.svc.cluster.local:9001;
  }
  server {
    # 8080 not 80: runAsNonRoot means no CAP_NET_BIND_SERVICE →
    # can't bind <1024. The k8s Service maps :80 → targetPort:8080.
    # [::] not bare 8080: bare `listen PORT` binds 0.0.0.0 only;
    # in a v6-only pod the kubelet httpGet probe targets the pod's
    # v6 IP and never connects. With Linux bindv6only=0 (default)
    # [::] dual-binds, so v4 lo still works for port-forward.
    listen [::]:8080;

    # SPA: all unknown routes serve index.html, the client-side
    # router (svelte-routing / whatever P0274 picked) handles the
    # path. try_files short-circuits to the real file for static
    # assets (/assets/*.js, *.css).
    location / {
      root @spaRoot@;
      try_files $uri /index.html;
    }

    # r[dash.auth.method-gate+2] ALLOW-LIST: only the readonly
    # methods enumerated in docker.nix dashboardReadonly{Admin,
    # Scheduler} are proxied; everything else under /rio.* falls
    # through to the catch-all 404 below. This was a 4-method
    # DENY-list, which fail-OPENED ~10 mutating RPCs (ResetSlaModel,
    # SubmitBuild, CancelBuild, ReportExecutorTermination, …) to
    # any port-forwarded browser. Allow-list polarity matches the
    # Cilium Gateway HTTPRoute and is CI-enforced via
    # dashboard-method-gate-parity.
    #
    # nginx evaluates regex locations in config order, first-match
    # wins — proxy locations FIRST, catch-all 404 LAST.
    #
    # gRPC-Web is plain HTTP/1.1 POST with a length-prefixed proto
    # body; rio-scheduler's tonic-web layer (D3) handles gRPC-Web
    # on the same port as native gRPC.
    #
    # Both proxy locations share the directive set — keep them in
    # sync. Unbuffered streaming + long read-timeout are LOAD-BEARING:
    # GetDerivationLogs/WatchBuild are live-tailing streams; with buffering
    # on, nginx flushes nothing until completion. proxy_read_timeout
    # 3600s matches the scheduler's http2_keepalive_interval(30s) so
    # quiet streams survive.
    location ~ ^/rio\.admin\.AdminService/(@readonlyAdminAlt@)$ {
      proxy_pass http://rio_scheduler;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Grpc-Web $http_x_grpc_web;
      # r[impl sched.sla.threat.read-path-auth] (documentary — tracey
      # scans only nix/tests/default.nix). The njs variable is
      # computed per request; 60s expiry matches
      # ServiceTokenInterceptor.
      proxy_set_header x-rio-service-token $rio_service_token;
    }
    location ~ ^/rio\.scheduler\.SchedulerService/(@readonlySchedulerAlt@)$ {
      proxy_pass http://rio_scheduler;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Grpc-Web $http_x_grpc_web;
      proxy_set_header x-rio-service-token $rio_service_token;
    }
    # Fail-closed catch-all for any other /rio.* path (mutating
    # admin RPCs, SubmitBuild/CancelBuild, future methods).
    location ~ ^/rio\. {
      return 404;
    }
  }
}
