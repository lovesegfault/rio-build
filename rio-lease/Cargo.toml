[package]
name = "rio-lease"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Kubernetes Lease-based leader election for rio-build components"

# Extracted from rio-scheduler/src/lease/ so the controller (ADR-023 B6)
# can reuse the same election + LeaderState machinery. Scheduler-specific
# wiring (ActorCommand::LeaderAcquired/Lost, rio_scheduler_* metrics)
# stays in rio-scheduler via the `LeaseHooks` callback trait.

[lints.rust]
# `cfg(kani)` is set by kani-compiler (nix `crateBuildKani` passes
# `--cfg=kani --check-cfg=cfg(kani)`); register it here so the regular
# cargo build doesn't warn `unexpected_cfgs` on the
# `#[cfg_attr(kani, derive(kani::Arbitrary))]` in election.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
# coordination.k8s.io/v1 Lease + Pod (deletion-cost annotation patch).
kube = { workspace = true }
k8s-openapi = { workspace = true }
# KubeErrorExt::is_conflict for the election 409 branches.
rio-crds = { workspace = true }
# rio_common::signal::Token (CancellationToken alias) for the loop's
# shutdown gate.
rio-common = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# clock_gettime(CLOCK_BOOTTIME) for the self-fence blind-time clock
# (src/clock.rs) — std has no suspend-aware clock. Normal-dep precedent:
# rio-gateway's EMFILE/ENFILE constants (rio-gateway/Cargo.toml).
libc = { workspace = true }
# `became_leader_at` RwLock<Option<Instant>> — Instant is 16B, not atomic.
parking_lot = { workspace = true }
# rio_lease_* counters (the standby-strip detection lane) emitted from
# the detached marks tasks, where the per-component `LeaseHooks` metric
# seam does not reach. Names are described in-crate at lease-loop start
# (`describe_lease_metrics`), so every hosting binary carries the HELP.
metrics = { workspace = true }
# HOSTNAME-unset fallback in LeaseConfig::from_parts.
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# ApiServerVerifier mock for the I/O-shell + hung-apiserver tests.
rio-test-support = { workspace = true }
# DebuggingRecorder for the standby-strip counter assertions (W13-I):
# snapshot exactly once per test — the snapshot DRAINS counters.
metrics-util = { workspace = true }
# election.rs mock-apiserver scenarios need http::Method.
http = { workspace = true }
# Model-based testing (src/mbt_tests.rs): replay generated traces from
# docs/spec/models/leaderElection.qnt against the real election +
# LeaderState machinery, diffing the projected state after every step.
# Shells out to `quint` at test time — the mbt_* tests are #[ignore]d in
# the default profile and run by the dedicated check that puts quint on
# the PATH.
quint-connect = { workspace = true }
# ITF (Informal Trace Format) deserialization for the named-run replays:
# `quint test --out-itf` emits the model's per-step states; the replay
# diffs the implementation's projection against them. Already a
# transitive dependency of quint-connect; declared directly because the
# named-run replay parses traces itself (quint-connect's #[quint_test]
# path requires mbt instrumentation that `quint test` does not emit).
itf = { workspace = true }
# The mbt driver owns a current-thread runtime to drive the async
# election API from quint-connect's sync Driver::step, and surfaces
# divergences as anyhow errors (quint-connect's Result alias).
anyhow = { workspace = true }
# The mbt projection structs derive Deserialize (the framework
# deserializes the model's per-step state from the ITF trace into the
# same struct the driver projects into); the `switch!` macro emits
# `serde::Deserialize` paths for nondet-pick extraction.
serde = { workspace = true }
# The mbt driver seeds MockApiServer with the model's initial Lease
# object and projects the stored object back out (both serde_json::Value).
serde_json = { workspace = true }
# test-util: the loop-cadence test (fence_check_latency_bounded_by_one_tick)
# drives run_lease_loop_with_client under a paused clock (start_paused) and
# advances virtual time manually.
tokio = { workspace = true, features = ["test-util"] }
