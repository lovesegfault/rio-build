{{- if .Values.dashboard.enabled }}
{{- $d := .Values.dashboard -}}
{{- $ns := .Values.namespaces.system.name -}}
# nginx-only pod: serves the Svelte SPA and proxies /rio.* gRPC-Web to
# rio-scheduler-leader:9001 DIRECTLY (label-selected leader-only
# Service; failover/partition semantics documented in
# nix/dashboard-nginx.conf). In-cluster traffic can't reach the
# Cilium Gateway ClusterIP — selectorless Service, L7 redirect fires
# only on the LoadBalancer IP; see docker.nix dashboardNginxConf.
# rio-scheduler handles gRPC-Web translation in-process (tonic-web,
# D3). nginx is a thin HTTP/1.1 proxy with the same readonly allow-
# list as the Gateway (parity-checked at build time).
#
# No Ingress. Access via `kubectl port-forward svc/rio-dashboard
# 8080:80` (matches Grafana's model — operator-facing tool, not
# public).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rio-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard" "component" "dashboard") | nindent 4 }}
spec:
  replicas: {{ $d.replicas }}
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-dashboard" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rio.labels" (dict "root" . "name" "rio-dashboard" "component" "dashboard") | nindent 8 }}
    spec:
      # No privileged ops: nginx listens on 8080 (not 80) so we don't
      # need CAP_NET_BIND_SERVICE. No fsGroup — no writable volumes
      # that need group-ownership (emptyDir is world-writable /tmp).
      # seccompProfile: PSA restricted (rio-system namespace) requires
      # it set; RuntimeDefault blocks the ~40 syscalls nginx doesn't
      # need. NOT using rio.podSecurityContext helper — that sets UID
      # 65532 (distroless nonroot) and skips on coverage.enabled;
      # nginx uses 65534 (nobody) and has no LLVM instrumentation
      # (static SPA + proxy, no rio binary).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        # SPA serve + gRPC-Web proxy to the leader-only
        # rio-scheduler-leader Service. The nginx conf is baked into
        # the image (nix/docker.nix dashboardNginxConf) with envsubst
        # placeholders for the upstream FQDNs — the env block below
        # (bug_403) substitutes the LIVE namespace names from
        # .Values.namespaces at pod start, so a namespaces override
        # reaches the baked image AND rolls the pod (env change =
        # template-hash change). Adding an upstream is a
        # files/dashboard-upstreams.json edit + image rebuild.
        - name: nginx
          image: {{ include "rio.image" (list . $d.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            {{- range ($.Files.Get "files/dashboard-upstreams.json" | fromJsonArray) }}
            - name: {{ .env }}
              value: "{{ .service }}.{{ index $.Values.namespaces .namespaceRef "name" }}.svc.cluster.local"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # nginx.conf points pid + all *_temp_path directives at
            # /tmp. One emptyDir covers the lot. /var/log/nginx exists
            # in the image layer (extraCommands) — nginx probes it at
            # parse-start before our error_log /dev/stderr takes over,
            # but never writes (error_log redirects immediately).
            - name: tmp
              mountPath: /tmp
            # r[sched.sla.threat.read-path-auth]: the njs proxy_set_header
            # mints x-rio-service-token (caller=rio-dashboard) per
            # request from this key. Same Secret store.yaml/gateway.yaml
            # mount; readOnly because the key is verify-side-shared.
            - name: service-hmac
              mountPath: /etc/rio/hmac
              readOnly: true
          # / (index.html) is served from the baked-in SPA bundle. If
          # nginx is up, the SPA is servable — no backend dep to
          # readiness-gate on (a registry backend being down means its
          # gRPC-Web calls fail in-browser — nginx dials
          # rio-scheduler-leader/rio-store directly per
          # dashboard-upstreams.json — but the static app still loads
          # and shows its own error state).
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $d.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: service-hmac
          secret:
            secretName: rio-service-hmac
---
apiVersion: v1
kind: Service
metadata:
  name: rio-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard" "component" "dashboard") | nindent 4 }}
spec:
  # ClusterIP — port-forward only (no LoadBalancer, no NodePort).
  # 80→8080: the Service presents the conventional HTTP port; nginx
  # inside the container listens on 8080 (unprivileged, matches
  # runAsNonRoot).
  type: ClusterIP
  selector:
    {{- include "rio.selectorLabels" "rio-dashboard" | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
