{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rio-gateway
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-gateway" "component" "gateway") | nindent 4 }}
spec:
  {{- if not $g.autoscaling.enabled }}
  # Static replica count — autoscaling disabled (environments without
  # the KEDA operator: k3s VM tests, local dev). With autoscaling
  # enabled the KEDA-managed HPA owns the count and helm echoes the
  # live value instead (see the lookup branch in the template).
  replicas: {{ $g.replicas }}
  {{- else }}
  {{- /* The KEDA-managed HPA owns the replica count: rendering the
         static value here would reset it on every `helm upgrade` and
         fight the autoscaler (same reasoning as store.yaml's
         autoscaling branch). But on an EXISTING release whose previous
         manifest carried `replicas: 2`, simply omitting the field is
         not neutral either: helm's three-way merge turns
         present→absent into a patch to null, the API server
         re-defaults the field to 1, and the Deployment controller
         deletes a gateway pod on the spot — outside the surge-first
         strategy and the PDB (both only cover rollouts/evictions),
         while the replacement pod usually waits on a fresh node
         because the required podAntiAffinity still counts the
         hour-draining victim. The only build-submission ingress would
         run single-pod for minutes.

         So when a live Deployment exists, echo ITS current replica
         count: the field stays present at exactly the value KEDA last
         set, the upgrade is a no-op for scale, and helm never fights
         the HPA. `lookup` returns an empty map under `helm template` /
         `--dry-run` and on a fresh install (no live Deployment yet) —
         the field is then omitted, K8s defaults it to 1 on first
         apply, and KEDA's first reconcile raises it to
         minReplicaCount. That ramp happens before the gateway has any
         traffic or NLB targets, so no install-time seed is needed. */}}
  {{- with lookup "apps/v1" "Deployment" .Values.namespaces.system.name "rio-gateway" }}
  replicas: {{ .spec.replicas }}
  {{- end }}
  {{- end }}
  # I-064: surge first so the NLB has a healthy target throughout the
  # rollout. With maxUnavailable: 0 the old pod stays Serving until the
  # new one is Ready; then old goes NotReady → drains sessions → exits.
  # Without this (default 25%/25%), a 2-replica rollout takes one down
  # immediately and any NLB-routed-but-not-yet-propagated connection to
  # the other replica's IP races its termination too.
  #
  # r38 merged_021: `maxUnavailable: 0` + required podAntiAffinity
  # (further down in this pod spec) means a rolling update needs a 3rd
  # `general` node to surge onto. With Karpenter headroom that's a
  # ~30-60s mint; without (k3s, fixed cluster) `helm upgrade --wait`
  # hangs. This is a DELIBERATE trade-off: the I-064 NLB drain race is
  # a session-loss bug; the rollout cost is a transient node mint. If a
  # fixed-size cluster needs hot upgrades, run a single gateway and
  # accept the ~15s reconnect window: either disable autoscaling
  # (`gateway.autoscaling.enabled=false`) and set `gateway.replicas: 1`,
  # or set both `gateway.autoscaling.minReplicas` and `maxReplicas` to 1
  # (the anti-affinity gate keys on the ceiling and the PDB on the
  # floor, so a 1/1 range drops both). Under the default autoscaling=on,
  # `gateway.replicas` is not consulted at all. Or pre-provision a
  # `general` slot. Do NOT set `maxUnavailable: 1` here without
  # re-evaluating I-064.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-gateway" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rio.labels" (dict "root" . "name" "rio-gateway" "component" "gateway") | nindent 8 }}
      annotations:
        # live_064 (parity with the builders' I-126 posture and the
        # store's live_062 stamp): a gateway pod holds every live SSH
        # session and the per-build WatchBuild + log-tail streams —
        # Karpenter consolidating its node severs all of them at once
        # (each one a client-visible build interruption, even when the
        # re-attach machinery recovers). The annotation gates only
        # Karpenter's own disruption controller: kubectl drains and
        # node rotations still ride the eviction API + the rio-gateway
        # PDB (minAvailable 1 when the fleet can run multiple), and
        # KEDA scale-in deletes pods directly — both unaffected.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: rio-gateway
      {{- if .Values.karpenter.enabled }}
      nodeSelector:
        rio.build/node-role: general
      {{- end }}
      # ≥ nlbDeregisterSecs (preStop) + drainGraceSecs + sessionDrainSecs +
      # CANCEL_GRACE(5) + slack. kubelet SIGKILLs at this deadline; the
      # gateway's own session_drain timeout fires first and exits cleanly,
      # so SIGKILL is a backstop for a hung process.
      terminationGracePeriodSeconds: {{ add $g.nlbDeregisterSecs $g.drainGraceSecs $g.sessionDrainSecs 24 }}
      {{- include "rio.podSecurityContext" . | nindent 6 }}
      {{- /* Under autoscaling the gate keys on the CEILING (maxReplicas),
             not the floor: KEDA owns the live count anywhere in
             [minReplicas, maxReplicas], so the spread rule must hold
             whenever the autoscaler MAY run more than one pod. Keying on
             the floor would let an operator-set minReplicas:1 render no
             anti-affinity while KEDA still scales to maxReplicas pods
             that can all bin-pack onto one node — and a required
             anti-affinity rule constrains nothing while only one pod
             exists, so the ceiling costs nothing at the floor. Without
             autoscaling the static replicas is the count.

             Deliberate asymmetry with the rio-gateway PDB (pdb.yaml),
             which keys on the FLOOR: a minAvailable:1 budget against a
             1-pod floor would block every node drain. */}}
      {{- if include "rio.mayRunMultiple" $g }}
      # r37 bug_020 (sweep): rio-gateway is the only build-submission
      # path (SSH ingress). Both replicas on one node → drain stalls
      # behind the PDB but every NLB target is gone for the eviction
      # window. Mirror rio-scheduler.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "rio.selectorLabels" "rio-gateway" | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "rio.image" (list . $g.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "rio.containerSecurityContext" . | nindent 10 }}
          {{- if gt (int $g.nlbDeregisterSecs) 0 }}
          # preStop runs BEFORE SIGTERM. The pod is already Terminating
          # (out of Endpoints), so Cilium's healthCheckNodePort starts
          # failing for ETP=Local and the NLB begins draining this node;
          # but the gateway is still accepting — connections the NLB
          # routes here before its health-check round completes land on
          # a live listener. After this sleep, SIGTERM lands and the
          # gateway's own three-stage drain (r[gw.drain.three-stage])
          # handles the rest. `sleep:` (KEP-3960, GA 1.30) needs no
          # /bin/sleep in the image.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $g.nlbDeregisterSecs }}
          {{- end }}
          ports:
            - name: ssh
              containerPort: 2222
            - name: metrics
              containerPort: 9090
            # tonic-health on separate port (gateway uses russh for SSH, not
            # tonic). Already plaintext — no TLS retarget needed.
            - name: health
              containerPort: 9190
          env:
            {{- include "rio.rustLogEnv" . | nindent 12 }}
            {{- include "rio.mounts" (dict "root" . "form" "env" "want" (list "cov" "jwtSign" "serviceHmac")) | nindent 12 }}
            - name: RIO_LISTEN_ADDR
              value: "[::]:2222"
            # actBuild machineName field — what nom shows as "on <name>".
            # The cluster appears as one machine to ssh-ng clients;
            # per-pod executor IDs are an abstraction leak.
            - name: RIO_GATEWAY_MACHINE_NAME
              value: {{ .Values.gateway.machineName | default .Values.karpenter.clusterName | default "" | quote }}
            - name: RIO_DRAIN_GRACE_SECS
              value: {{ $g.drainGraceSecs | quote }}
            - name: RIO_SESSION_DRAIN_SECS
              value: {{ $g.sessionDrainSecs | quote }}
            # Still used even with balance host — it's the TLS verify domain
            # (cert SAN is `rio-scheduler`).
            - name: RIO_SCHEDULER__ADDR
              value: {{ $g.schedulerAddr | quote }}
            - name: RIO_SCHEDULER__BALANCE_HOST
              value: {{ $g.schedulerBalanceHost | quote }}
            - name: RIO_SCHEDULER__BALANCE_PORT
              value: {{ $g.schedulerBalancePort | quote }}
            - name: RIO_STORE__ADDR
              value: {{ $g.storeAddr | quote }}
            - name: RIO_MAX_TRANSITIVE_INPUTS
              value: {{ $g.maxTransitiveInputs | int | quote }}
            {{- if $g.ssh.authorizedKeysSecret }}
            - name: RIO_HOST_KEY
              value: /var/lib/rio/gateway/host_key
            - name: RIO_AUTHORIZED_KEYS
              value: /etc/rio/ssh/authorized_keys
            {{- end }}
          volumeMounts:
            {{- if $g.ssh.authorizedKeysSecret }}
            - name: gateway-state
              mountPath: /var/lib/rio/gateway
            - name: gateway-ssh
              mountPath: /etc/rio/ssh
              readOnly: true
            {{- end }}
            {{- include "rio.mounts" (dict "root" . "form" "mount" "want" (list "cov" "jwtSign" "serviceHmac")) | nindent 12 }}
          # tonic-health server — NOT_SERVING until connect_forever
          # succeeds (main.rs explicitly gates "" via
          # health_reporter_not_serving; tonic-health's default is
          # SERVING).
          readinessProbe:
            grpc: {port: 9190}
            periodSeconds: 5
            failureThreshold: 3
          # Health port open = process alive. main.rs binds 9190
          # BEFORE connect_forever, so liveness sees the socket while
          # the cold-start retry loop runs. Probing the SSH port (2222)
          # here would let kubelet kill the pod before scheduler/store
          # came up — neutralizing connect_forever.
          livenessProbe:
            tcpSocket: {port: 9190}
            periodSeconds: 10
            failureThreshold: 6
          # 30×10s = 5min cold-start budget. Suppresses livenessProbe
          # until first success — belt-and-suspenders for the ordering
          # fix above (matches scheduler.yaml).
          startupProbe:
            tcpSocket: {port: 9190}
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml $g.resources | nindent 12 }}
      volumes:
        {{- if $g.ssh.authorizedKeysSecret }}
        {{- if $g.ssh.hostKeySecret }}
        # Persistent host key — survives pod reschedule, same key across
        # replicas so clients' known_hosts stays valid.
        - name: gateway-state
          secret:
            secretName: {{ $g.ssh.hostKeySecret }}
        {{- else }}
        # emptyDir: auto-generated host key survives container restart,
        # regenerates on pod reschedule. Breaks known_hosts on reschedule.
        # Prod with replicas>1 should set ssh.hostKeySecret.
        - name: gateway-state
          emptyDir: {}
        {{- end }}
        - name: gateway-ssh
          secret:
            secretName: {{ $g.ssh.authorizedKeysSecret }}
        {{- end }}
        {{- include "rio.mounts" (dict "root" . "form" "volume" "want" (list "cov" "jwtSign" "serviceHmac")) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rio-gateway
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-gateway" "component" "gateway") | nindent 4 }}
  annotations:
    {{- if eq $g.service.type "LoadBalancer" }}
    # Cilium cluster-pool pod IPs are overlay (ULA fd42::/104), NOT
    # VPC-routable — NLB target-type:ip can't reach them. instance
    # mode targets node IPs; Cilium's eBPF kube-proxy-replacement
    # handles the NodePort→pod hop in-kernel.
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    {{- end }}
    {{- with $g.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "rio.ipFamily" . | nindent 2 }}
  type: {{ $g.service.type }}
  {{- with $g.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if eq $g.service.type "LoadBalancer" }}
  # Preserve client source IP for SSH audit logging. With Cilium DSR
  # (loadBalancer.dsrDispatch=geneve in addons.tf), Local works
  # without the usual "traffic only to nodes with a pod" limitation.
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    {{- include "rio.selectorLabels" "rio-gateway" | nindent 4 }}
  ports:
    # External 22 → container 2222. Running on 2222 means no
    # CAP_NET_BIND_SERVICE (ports <1024 need it). Service remap is free.
    - name: ssh
      port: 22
      targetPort: ssh
      {{- with $g.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
