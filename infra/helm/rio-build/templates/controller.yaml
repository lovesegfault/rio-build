{{- /* Named template so the ConfigMap body and the checksum annotation
       hash the SAME rendered string. bug_022: hashing a hand-maintained
       list of input keys (`.scheduler.sla`, `.karpenter.nodeclaimPool`)
       missed `poolDefaults.fuseCacheBytes` + `karpenter.metalSizes` —
       the ConfigMap re-rendered, the (subPath-mounted) pod did not roll.
       `define` must be at top level (not inside `if`). */}}
{{- define "rio.controllerToml" -}}
{{- with .Values.scheduler.sla -}}
{{- /* merged_bug_001: the exposure-uid cluster axis. bug_022: BOTH
       binaries consume the ONE `rio.clusterIdentity` include —
       structural single-sourcing (drift unwritable, not just
       policed), and the helper FAILS the render on an empty id under
       the external-secrets PG path (the shared-capable topology).
       Top-level scalar: MUST render before the [nodeclaim_pool]
       table header. helm/39-cluster-axis-single-source.sh enforces
       TOML-to-TOML parity + the planted-red gate leg; the checksum
       annotation below hashes the rendered body, so a cluster change
       rolls the pod. */}}
cluster = {{ include "rio.clusterIdentity" $ | quote }}
[nodeclaim_pool]
lease_name = {{ $.Values.karpenter.nodeclaimPool.leaseName | default "rio-controller-nodeclaim-pool" | quote }}
{{- /* r40 bug_018: gate `schedulerName=kube-build-scheduler` stamping
       on the chart's predicate ("does the kube-build-scheduler
       Deployment render?"), not just the controller's ("is the
       NodeClaim CRD present?"). Karpenter is terraform-managed in
       prod, so the CRD is present even when `karpenter.enabled=false`
       — without this knob, `buildScheduler.enabled=false` builder
       pods would target a scheduler that doesn't exist (permanent
       Pending, zero alerts: the alerts are gated by the same toggle). */}}
kube_build_scheduler_enabled = {{ $.Values.buildScheduler.enabled }}
reference_hw_class = {{ .referenceHwClass | quote }}
{{- /* sh-043: NO Sprig default (treats integer 0 as empty, swallowing
       the 0 mint-halt). values.yaml owns the default per the
       47-template-default-ban single-default convention; helm/52
       asserts 0 renders 0. r3: `required` because Sprig
       `int64 nil`/`float64 nil` coerce to 0 — without the guard,
       `--set …=null` silently renders the dangerous 0 (a 0s
       lead-time seed reaps every NodeClaim before boot; 0 inflight
       is the operator's mint-halt kill-switch and MUST be explicit).
       Helm `required` checks nil/"" only — explicit 0 passes. */}}
default_lead_time_seed = {{ printf "%.1f" (float64 (required "scheduler.sla.defaultLeadTimeSeed must be set (0 reaps every NodeClaim before boot)" .defaultLeadTimeSeed)) }}
max_fleet_cores = {{ int64 .maxFleetCores }}
max_inflight_unlaunched = {{ int64 (required "karpenter.nodeclaimPool.maxInflightUnlaunched must be set (0 is the explicit mint-halt; nil must not silently become it)" $.Values.karpenter.nodeclaimPool.maxInflightUnlaunched) }}
max_node_claims_per_cell_per_tick = {{ int64 .maxNodeClaimsPerCellPerTick }}
max_lead_time = {{ printf "%.1f" (float64 .maxLeadTime) }}
{{- /* `dataVolumeSize` is a k8s Quantity ("500Gi"); approximate
       allocatable as 90% (kubelet eviction threshold + image cache). */}}
max_node_disk = {{ mulf 0.9 (include "rio.quantityBytes" $.Values.karpenter.dataVolumeSize) | int64 }}
fuse_cache_bytes = {{ int64 $.Values.poolDefaults.fuseCacheBytes }}
fetcher_fuse_cache_bytes = {{ int64 $.Values.poolDefaults.fetcherFuseCacheBytes }}
metal_sizes = {{ toJson $.Values.karpenter.metalSizes }}
{{- with .maxConsolidationTime }}
max_consolidation_time = {{ printf "%.1f" (float64 .) }}
{{- end }}
{{- /* r35 bug_050: per-class-prefix consolidate_after floor. Render
       as a separate table after [nodeclaim_pool]'s scalar keys —
       a TOML table opens a new section, so any scalar after it would
       belong to the table, not [nodeclaim_pool]. */}}
{{- with $.Values.karpenter.nodeclaimPool.minConsolidationTime }}

[nodeclaim_pool.min_consolidation_time]
{{- range $prefix, $v := . }}
{{ $prefix | quote }} = {{ printf "%.1f" (float64 $v) }}
{{- end }}
{{- end }}
{{- with .leadTimeSeed }}

[nodeclaim_pool.lead_time_seed]
{{- range $cell, $v := . }}
{{ $cell | quote }} = {{ printf "%.1f" (float64 $v) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.controller.enabled }}
{{- $c := .Values.controller -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rio-controller
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-controller" "component" "controller") | nindent 4 }}
spec:
  # HARD replicas=1. Only the nodeclaim_pool reconciler is
  # lease-gated (rolling-upgrade surge safety); the Pool reconciler
  # and gc_schedule are NOT — two replicas double-spawn Jobs.
  # kube-runtime handles concurrent reconcile within one process but
  # not across processes. 30s reschedule gap during pod restart is
  # acceptable.
  replicas: 1
  # merged_bug_001: replicas=1 alone does NOT prevent co-run — the
  # default RollingUpdate strategy surges a second pod on every
  # rollout, co-running two node-informers (and two interrupt
  # watchers). The grid-aligned exposure uid makes the co-run
  # dedup-convergent; Recreate closes the residual partial-window
  # seam and the watcher duplication. Cost: exactly the 30s
  # reschedule gap already accepted above.
  # helm/39-cluster-axis-single-source.sh enforces.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-controller" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rio.labels" (dict "root" . "name" "rio-controller" "component" "controller") | nindent 8 }}
      annotations:
        # Controller reads /etc/rio/controller.toml once at boot; subPath
        # mounts don't live-update. Hash the RENDERED body (not a key
        # list — that drifts) so any input that lands in the TOML rolls
        # the pod. helm/16-controller-checksum-covers-toml.sh enforces.
        checksum/controller-toml: {{ include "rio.controllerToml" . | sha256sum }}
    spec:
      serviceAccountName: rio-controller
      {{- if .Values.karpenter.enabled }}
      nodeSelector:
        rio.build/node-role: general
      {{- end }}
      {{- if $c.hostNetwork }}
      # VM-test concession: CoreDNS doesn't know NixOS-test VM hostnames.
      # hostNetwork → pod uses node's /etc/hosts. Production never sets this.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- include "rio.podSecurityContext" . | nindent 6 }}
      containers:
        - name: controller
          image: {{ include "rio.image" (list . $c.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "rio.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9094
            - name: health
              containerPort: 9194
          env:
            {{- include "rio.rustLogEnv" . | nindent 12 }}
            {{- include "rio.mounts" (dict "root" . "form" "env" "want" (list "cov" "serviceHmac")) | nindent 12 }}
            - name: RIO_SCHEDULER__ADDR
              value: {{ $c.schedulerAddr | quote }}
            - name: RIO_STORE__ADDR
              value: {{ $c.storeAddr | quote }}
            {{- if $c.schedulerBalanceHost }}
            # Passed through to builder pods. Workers DNS-resolve the headless
            # Service, health-probe pod IPs, route to leader. Unset → workers
            # fall back to single-channel.
            - name: RIO_SCHEDULER__BALANCE_HOST
              value: {{ $c.schedulerBalanceHost | quote }}
            - name: RIO_SCHEDULER__BALANCE_PORT
              value: {{ $c.schedulerBalancePort | quote }}
            {{- end }}
            {{- if $c.storeBalanceHost }}
            # Same balance pattern for rio-store, but for load
            # distribution across replicas (no leader/standby).
            - name: RIO_STORE__BALANCE_HOST
              value: {{ $c.storeBalanceHost | quote }}
            - name: RIO_STORE__BALANCE_PORT
              value: {{ $c.storeBalancePort | quote }}
            {{- end }}
            {{- with .Values.scheduler.sla }}
            # ADR-023 §13a hw-bench gate: same floor as the scheduler's
            # `[sla].hw_bench_mem_floor` so the controller's create-time
            # `rio.build/hw-bench-needed` decision and the scheduler's
            # threat-model assumption never diverge.
            - name: RIO_HW_BENCH_MEM_FLOOR
              value: {{ int64 .hwBenchMemFloor | quote }}
            {{- end }}
            # database_url stays env (Secret-sourced; never lands in the
            # ConfigMap-rendered TOML). lease_namespace via downward API
            # so the chart isn't namespace-pinned.
            - name: RIO_NODECLAIM_POOL__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: url
            - name: RIO_NODECLAIM_POOL__LEASE_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            # sh-028: ENABLES the gateway deletion-cost annotator
            # (reconcilers/gateway_cost.rs). Gateway and controller
            # share the system namespace, so the downward-API value is
            # both "where am I" and "where the gateway pods are".
            - name: RIO_GATEWAY_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "rio.mounts" (dict "root" . "form" "mount" "want" (list "cov" "serviceHmac")) | nindent 12 }}
            # rio_common::config::load reads /etc/rio/controller.toml. The
            # ConfigMap carries [nodeclaim_pool] (lead_time_seed is a
            # nested map — the RIO_ env layer only yields strings, so
            # it MUST come from TOML). subPath: serviceHmac mounts at
            # /etc/rio/service-hmac; whole-dir CM mount would shadow it.
            # checksum annotation rolls the pod on CM change.
            - name: config
              mountPath: /etc/rio/controller.toml
              subPath: controller.toml
              readOnly: true
          # /healthz: unconditional 200 (process alive + tokio
          # responsive) — bound BEFORE connect_forever so liveness
          # passes during scheduler cold-start. /readyz: 503 until
          # scheduler admin client connected. Already plaintext HTTP —
          # no TLS retarget needed.
          #
          # D-054-1a probe hardening (the rev-5 live values, made
          # durable — helm's three-way merge reverts chart-rendered
          # drift, so the kubectl overlay dies at the next upgrade).
          # live_054: /healthz is an axum task on the SHARED tokio
          # runtime; a 13-21s reconciler stall under admitted load
          # reads as sensor silence, and at timeoutSeconds 1 /
          # failureThreshold 3 kubelet killed a healthy singleton 5×
          # — each restart re-firing the cold-start load that caused
          # the stall. Liveness now tolerates 60s of silence (6×10s,
          # 10s timeout) before the kill verdict; the startupProbe
          # mirrors /healthz with a 30×2s boot budget so the hardened
          # liveness clock never gates first boot. Readiness is
          # shed-wired (failure only removes the pod from Endpoints),
          # so it stays tighter at 5s. Structural honesty: a
          # kill-wired probe served from the guarded runtime is still
          # the wrong failure domain (round-9 banner B / D3) — this
          # block converts brief starvation from kill-loop into
          # delay until guard isolation lands.
          # nix/tests/helm/40-controller-probes.sh pins these values.
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 2
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml $c.resources | nindent 12 }}
      volumes:
        {{- include "rio.mounts" (dict "root" . "form" "volume" "want" (list "cov" "serviceHmac")) | nindent 8 }}
        - name: config
          configMap:
            name: rio-controller-config
---
# Mounted at /etc/rio/controller.toml. The config loader merges this UNDER
# env (RIO_* wins for scalars). The [nodeclaim_pool] table is the ONLY way to
# populate lead_time_seed: the RIO_ env layer yields bare strings, so
# a `HashMap<String, f64>` field cannot load from env. Scalars duplicate
# the scheduler's `[sla]` rendering (single source: `.Values.scheduler.
# sla`) so the controller's deficit-cover caps and the scheduler's
# solve_intent ceilings never diverge. database_url stays env
# (Secret-sourced).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rio-controller-config
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-controller" "component" "controller") | nindent 4 }}
data:
  controller.toml: |
    {{- include "rio.controllerToml" . | nindent 4 }}
{{- end }}
