{{- if .Values.dashboard.enabled }}
{{- $ns := .Values.namespaces.system.name -}}
# r[impl dash.envoy.grpc-web-translate+3]
# r[impl dash.auth.method-gate+5]
#   (markers are documentary — tracey does not scan yaml; the r[verify]
#    for both lives at nix/tests/default.nix which IS scanned)
#
# Cilium Gateway API. gRPC-Web translation is in-process at
# rio-scheduler (tonic-web layer, D3) — the Gateway's job is plain
# HTTP routing. Cilium reconciles the Gateway into a per-Gateway envoy
# Deployment + Service named `cilium-gateway-<gateway-name>` in the
# Gateway's namespace. CORS, idle-timeout, and retry-on-unavailable
# are handled scheduler-side / dashboard-side per the D3 cascade
# table; no vendor CRDs.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: rio-dashboard
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard-gateway" "component" "dashboard") | nindent 4 }}
spec:
  controllerName: io.cilium/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rio-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard-gateway" "component" "dashboard") | nindent 4 }}
spec:
  gatewayClassName: rio-dashboard
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
---
# ── Read-only methods: routed unconditionally ─────────────────────────
# r[dash.auth.method-gate+5] — the method split is here. Status/list/log/
# graph RPCs are idempotent reads; the dashboard hits these on every
# page load. Exposing them via gRPC-Web is low-risk (worst case: an
# attacker learns cluster state they could also learn from /metrics).
#
# HTTPRoute (NOT GRPCRoute): clients send `content-type: application/
# grpc-web+proto` which GRPCRoute does NOT match (it expects
# `application/grpc`). gRPC-Web translation happens in-process at the
# scheduler (tonic-web layer per D3), so the Gateway just routes HTTP.
# gRPC paths are `/<service>/<method>`, so `Exact` path matches give
# the same per-method allowlist GRPCRoute's `method:` matchers did.
#
# SchedulerService: the dashboard only calls WatchBuild (streaming
# status updates for the DAG view) and QueryBuildStatus (poll fallback).
# SubmitBuild/CancelBuild are mutating — the production entrypoint for
# those is ssh-ng via rio-gateway, not the dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rio-scheduler-readonly
  namespace: {{ $ns }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard-gateway" "component" "dashboard") | nindent 4 }}
spec:
  parentRefs:
    - name: rio-dashboard
  rules:
    - matches:
        - path: { type: Exact, value: /rio.admin.AdminService/ClusterStatus }
        - path: { type: Exact, value: /rio.admin.AdminService/ListExecutors }
        - path: { type: Exact, value: /rio.admin.AdminService/ListPoisoned }
        - path: { type: Exact, value: /rio.admin.AdminService/ListBuilds }
        - path: { type: Exact, value: /rio.admin.AdminService/ListTenants }
        - path: { type: Exact, value: /rio.admin.AdminService/GetBuildGraph }
        - path: { type: Exact, value: /rio.admin.AdminService/GetSpawnIntents }
        - path: { type: Exact, value: /rio.scheduler.SchedulerService/WatchBuild }
        - path: { type: Exact, value: /rio.scheduler.SchedulerService/QueryBuildStatus }
      backendRefs:
        - name: rio-scheduler
          port: 9001
---
# ── Build logs: rio-store's LogService ────────────────────────────────
# The one dashboard RPC that doesn't go to the scheduler — build logs
# live in rio-store (immutable chunks + a PG manifest). A separate
# HTTPRoute (not another match in rio-scheduler-readonly) because a
# rule's backendRefs are all-or-nothing per rule and the store is a
# different backend in a different namespace. Read-only and
# unauthenticated (the same posture as the scheduler read-only route);
# the method-gate parity check diffs this route's paths
# against the nginx allow-list alongside rio-scheduler-readonly's.
#
# Cross-namespace backendRef (rio-system → rio-store) requires the
# ReferenceGrant below in the TARGET namespace — without it the
# Gateway controller sets ResolvedRefs=False/RefNotPermitted and the
# route 500s.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rio-store-logs-readonly
  namespace: {{ $ns }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard-gateway" "component" "dashboard") | nindent 4 }}
spec:
  parentRefs:
    - name: rio-dashboard
  rules:
    - matches:
        - path: { type: Exact, value: /rio.store.LogService/TailLog }
      backendRefs:
        - name: rio-store
          namespace: {{ .Values.namespaces.store.name }}
          port: 9002
---
# Allows the HTTPRoute above (in {{ $ns }}) to reference the rio-store
# Service (in {{ .Values.namespaces.store.name }}). Scoped to exactly
# one (from-kind, from-namespace) → (to-kind, to-name) pair — this does
# NOT open the store namespace to arbitrary cross-namespace refs.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: rio-dashboard-logs-to-store
  namespace: {{ .Values.namespaces.store.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard-gateway" "component" "dashboard") | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $ns }}
  to:
    - group: ""
      kind: Service
      name: rio-store
{{- if .Values.dashboard.enableMutatingMethods }}
---
# ── Mutating methods: gated behind values flag ────────────────────────
# ClearPoison   — un-brakes a deliberately blocked derivation
# CreateTenant  — writes PG rows; resource creation
# TriggerGC     — deletes store paths; data loss potential
#
# These are NOT rendered by default (enableMutatingMethods: false).
# With the route absent, the gateway has no match → returns 404 on
# e.g. POST /rio.admin.AdminService/ClearPoison. Use rio-cli for these
# until dashboard-native authz lands.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rio-scheduler-mutating
  namespace: {{ $ns }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-dashboard-gateway" "component" "dashboard") | nindent 4 }}
spec:
  parentRefs:
    - name: rio-dashboard
  rules:
    - matches:
        - path: { type: Exact, value: /rio.admin.AdminService/ClearPoison }
        - path: { type: Exact, value: /rio.admin.AdminService/CreateTenant }
        - path: { type: Exact, value: /rio.admin.AdminService/TriggerGC }
      backendRefs:
        - name: rio-scheduler
          port: 9001
{{- end }}
{{- end }}
