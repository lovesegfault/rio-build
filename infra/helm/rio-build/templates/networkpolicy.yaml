{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Values.namespaces -}}
# Defense in depth. Compromised executor (malicious .drv through the
# sandbox, or sandbox escape) should only reach rio-scheduler and
# rio-store — not exfil, not cloud metadata, not K8s apiserver.
#
# ADR-019 four-namespace split: builders are airgapped (DNS + scheduler
# + store only). Fetchers get world:80,443 minus cluster/link-local —
# the FOD hash check at verify_fod_hashes() is the integrity boundary.
#
# CiliumNetworkPolicy (cilium.io/v2), not networking.k8s.io/v1. The k8s
# NetworkPolicy semantics broke under Cilium: `ipBlock` rules match
# CIDR-as-world only — they do NOT match in-cluster endpoints (pods,
# nodes, apiserver) which Cilium identifies by identity, not IP. The
# old controller-egress `ipBlock: 10.0.0.0/8` (meant to allow
# apiserver) and store-egress `ipBlock: 10.0.0.0/8 port 5432` (meant
# to allow in-cluster postgres) matched nothing under Cilium →
# CrashLoopBackOff. CNP's `toEntities` and `toEndpoints` are the
# identity-aware equivalents.
#
# ONE policy per selector — Cilium merges additively like k8s NP.
---
# r[impl builder.netpol.airgap]
# r[impl builder.netpol.deny-kube-api]
#
# Builder egress: DNS, scheduler, store. AIRGAPPED per ADR-019 — no
# internet egress, no kube-apiserver. FODs route to kind=Fetcher
# pools (separate policy below). NO `toEntities: [kube-apiserver]` and
# no world rule → both DENIED (default-deny on policed endpoints). The
# kube-apiserver deny is the load-bearing isolation: a sandbox-escaped
# builder cannot read Secrets, list pods, or escalate via RBAC.
#
# D3a: CiliumClusterwideNetworkPolicy (not namespaced CNP). With one
# Pool CRD an operator can apply a Pool{kind=Builder} into ANY
# namespace; a namespaced CNP wouldn't select it → Cilium default-allow
# → full egress. CCNP selects by `app.kubernetes.io/component` (which
# the reconciler stamps unconditionally — pool/pod.rs executor_labels)
# regardless of which namespace the Pool lands in.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: builder-egress
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: rio-builder
  egress:
    # CoreDNS. L4-only (port 53 allow); the L7 DNS-proxy rule
    # (`rules: dns:`) is omitted — it would give Hubble DNS visibility
    # and enable toFQDNs, but requires the Cilium DNS proxy to be
    # functional which adds a moving part. toFQDNs (store-egress-
    # upstream) is gated on .Values.store.upstreamCaches and re-adds
    # the L7 rule when actually needed.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    # Scheduler: Heartbeat/BuildExecution. Cross-ns endpoint match via
    # the auto-injected k8s:io.kubernetes.pod.namespace label.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.system.name }}
            k8s:app.kubernetes.io/name: rio-scheduler
      toPorts: [{ports: [{port: "9001", protocol: TCP}]}]
    # Store: GetPath inputs, PutPath outputs, AppendLog log ingest.
    # L7 allow-list (bug_290): untrusted builders may call exactly the
    # data-plane RPCs a build needs — TailLog is deliberately ABSENT,
    # so build-log reads are unreachable from builder pods even with a
    # leaked token. Pinned by nix/tests/helm/29-builder-l7-log-allowlist.sh.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.store.name }}
            k8s:app.kubernetes.io/name: rio-store
      toPorts:
        - ports: [{port: "9002", protocol: TCP}]
          rules:
            http:
              - method: "POST"
                path: "/rio.store.StoreService/PutPath"
              - method: "POST"
                path: "/rio.store.StoreService/PutPathBatch"
              - method: "POST"
                path: "/rio.store.StoreService/GetPath"
              - method: "POST"
                path: "/rio.store.StoreService/QueryPathInfo"
              - method: "POST"
                path: "/rio.store.StoreService/BatchQueryPathInfo"
              - method: "POST"
                path: "/rio.store.StoreService/BatchGetManifest"
              - method: "POST"
                path: "/rio.store.StoreService/FindMissingPaths"
              - method: "POST"
                path: "/rio.store.LogService/AppendLog"
    {{- with .Values.networkPolicy.builderS3Cidr }}
    # S3 VPC endpoint CIDR — builder reads chunks via presigned URL.
    # toCIDR (not toEndpoints) — S3 endpoint is outside the cluster.
    - toCIDR: [{{ . | quote }}]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
    {{- end }}
  # Explicit IMDS deny — second independent control alongside
  # httpPutResponseHopLimit: 1 (karpenter.yaml). Cilium deny rules take
  # precedence over allow at the same L3/L4 scope. Builders have no
  # world allow so this is belt-and-suspenders; the fetcher copy below
  # is the load-bearing one.
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
        - fd00:ec2::254/128
---
# r[impl fetcher.netpol.egress-open+2]
#
# Fetcher egress: same three as builder PLUS world:80,443. Fetchers run
# FODs only (scheduler hard_filter routes by ExecutorKind); the FOD
# outputHash check is the integrity boundary. `toEntities: [world]`
# matches any IP NOT known to Cilium as a cluster identity — so it
# inherently EXCLUDES pod/service/node IPs (no manual `except:`
# carve-out needed; Cilium's identity model does it). IMDS is NOT
# covered by that exclusion: live spike showed a default-ns pod
# TCP-connects to fd00:ec2::254 (gets 401 on bare GET; only the
# token-PUT response TTL-expires at hop-limit 1). The `world` entity
# may or may not match fd00:ec2::254 depending on Cilium's link-local
# classification — explicit egressDeny below removes the ambiguity.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: fetcher-egress
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: rio-fetcher
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.system.name }}
            k8s:app.kubernetes.io/name: rio-scheduler
      toPorts: [{ports: [{port: "9001", protocol: TCP}]}]
    # Same L7 allow-list as the builder copy above (TailLog absent).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.store.name }}
            k8s:app.kubernetes.io/name: rio-store
      toPorts:
        - ports: [{port: "9002", protocol: TCP}]
          rules:
            http:
              - method: "POST"
                path: "/rio.store.StoreService/PutPath"
              - method: "POST"
                path: "/rio.store.StoreService/PutPathBatch"
              - method: "POST"
                path: "/rio.store.StoreService/GetPath"
              - method: "POST"
                path: "/rio.store.StoreService/QueryPathInfo"
              - method: "POST"
                path: "/rio.store.StoreService/BatchQueryPathInfo"
              - method: "POST"
                path: "/rio.store.StoreService/BatchGetManifest"
              - method: "POST"
                path: "/rio.store.StoreService/FindMissingPaths"
              - method: "POST"
                path: "/rio.store.LogService/AppendLog"
    # Public internet on 80/443. `world` entity = any non-cluster IP.
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "443", protocol: TCP}
  # Explicit IMDS deny — second independent control alongside
  # httpPutResponseHopLimit: 1 (karpenter.yaml). Deny takes precedence
  # over the world:80 allow above regardless of how Cilium classifies
  # the IMDS link-local/ULA addresses.
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
        - fd00:ec2::254/128
---
# Controller egress: DNS + kube-apiserver. The controller's ONLY
# upstream is the k8s API (watch/patch CRs across namespaces). The old
# k8s-NP `ipBlock: 10.0.0.0/8` was a workaround for apiserver-isn't-a-
# pod; CNP's `kube-apiserver` entity is the direct expression. No
# RFC1918 CIDR needed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rio-controller-egress
  namespace: {{ $ns.system.name }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rio-controller
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    # kube-apiserver entity covers managed-k8s where the apiserver is
    # outside the cluster. In k3s/embedded-apiserver, the apiserver
    # runs on a cluster node and is classified as `host`/`remote-node`
    # instead. Both are listed so the rule works in either topology.
    - toEntities: [kube-apiserver, host, remote-node]
    # Scheduler (ClusterStatus/CancelBuild admin RPCs) + store (GC
    # tick connects to StoreAdminService). The old k8s-NP RFC1918
    # ipBlock incidentally matched these (ClusterIPs in 10/8); CNP
    # toCIDR does not match in-cluster endpoints.
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: rio-scheduler}
      toPorts: [{ports: [{port: "9001", protocol: TCP}]}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.store.name }}
            k8s:app.kubernetes.io/name: rio-store
      toPorts: [{ports: [{port: "9002", protocol: TCP}]}]
    {{- if .Values.global.postgresCidr }}
    # nodeclaim_pool reconciler persists HdrHistogram lead-time +
    # idle-gap sketches to PG (`nodeclaim_cell_state`, migration 059).
    # Mirrors the scheduler/store toCIDR rule.
    - toCIDR:
        - {{ .Values.global.postgresCidr | quote }}
      toPorts: [{ports: [{port: "5432", protocol: TCP}]}]
    {{- end }}
    {{- if .Values.postgresql.enabled }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.store.name }}
            k8s:app.kubernetes.io/name: postgresql
      toPorts: [{ports: [{port: "5432", protocol: TCP}]}]
    {{- end }}
{{- if .Values.buildScheduler.enabled }}
---
# kube-build-scheduler second kube-scheduler egress: DNS + kube-apiserver
# only (mirrors rio-controller-egress — its sole upstream is the k8s API
# for pod/node watch + binding write). Same `host`/`remote-node`
# fallback for k3s/embedded-apiserver topologies.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-build-scheduler-egress
  namespace: {{ $ns.system.name }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-build-scheduler
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities: [kube-apiserver, host, remote-node]
{{- end }}
---
# Scheduler ingress: gRPC from rio components + health/metrics from
# host (kubelet probes, Prometheus). `host`/`remote-node` entities
# cover kubelet (host-network) without an ipBlock for the node CIDR.
# The Cilium per-Gateway envoy (dashboard route) lives in the Gateway's
# namespace ({{ $ns.system.name }}) under label `gateway.networking.
# k8s.io/gateway-name: rio-dashboard` — same-ns so no namespace label
# needed in its matchLabels.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: scheduler-ingress
  namespace: {{ $ns.system.name }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rio-scheduler
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: rio-gateway}
        - matchLabels: {app.kubernetes.io/name: rio-controller}
        - matchLabels: {gateway.networking.k8s.io/gateway-name: rio-dashboard}
        # D3a: ns-agnostic match on the reconciler-stamped component
        # label. A misplaced Pool's pods are airgapped (CCNP above)
        # AND can reach scheduler/store (here). CNP fromEndpoints
        # WITHOUT a namespace key is implicitly same-namespace
        # (Cilium scopes to the policy's ns) — builder/fetcher pods
        # live in rio-builders/rio-fetchers, so the bare label match
        # silently denied. `io.kubernetes.pod.namespace: Exists`
        # opens it cluster-wide; the component label is the gate.
        - matchLabels: {app.kubernetes.io/component: rio-builder}
          matchExpressions:
            - {key: k8s:io.kubernetes.pod.namespace, operator: Exists}
        - matchLabels: {app.kubernetes.io/component: rio-fetcher}
          matchExpressions:
            - {key: k8s:io.kubernetes.pod.namespace, operator: Exists}
        # Substitution-replacement: the store's materialization executor
        # polls/claims/reports against ExecutorService (the mirror of the
        # store-egress scheduler rule below). Cross-namespace (the store
        # lives in {{ $ns.store.name }}), so the namespace label is
        # mandatory.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.store.name }}
            k8s:app.kubernetes.io/name: rio-store
        # Dashboard nginx → scheduler gRPC-Web (bug_238): generated
        # from files/dashboard-upstreams.json — present iff the
        # registry has a rio-scheduler:9001 record.
        {{- include "rio.dashboardIngressFrom" (list $ "rio-scheduler" 9001) | nindent 8 }}
      toPorts: [{ports: [{port: "9001", protocol: TCP}]}]
    # Metrics: Prometheus scrape from host-network kubelet.
    # `cluster` covers apiserver pods/proxy (kubectl get --raw).
    - fromEntities: [host, remote-node, cluster]
      toPorts:
        - ports:
            - {port: "9091", protocol: TCP}
---
# Store ingress: GetPath/PutPath/FindMissingPaths from rio components
# across three namespaces, plus store↔store for the cross-replica
# TailLog proxy (a reader that lands on a replica that doesn't hold an
# execution's live ingest session relays the stream from the replica
# that does — store pods dial each other's pod IPs on 9002).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: store-ingress
  namespace: {{ $ns.store.name }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rio-store
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.system.name }}
        # store↔store: the cross-replica TailLog proxy. Same-namespace
        # bare label match (CNP fromEndpoints without a namespace key
        # is implicitly the policy's own namespace, which is exactly
        # where the other store replicas live).
        - matchLabels: {app.kubernetes.io/name: rio-store}
        # See scheduler-ingress D3a comment — bare label match is
        # same-namespace-only under CNP; Exists opens cluster-wide.
        - matchLabels: {app.kubernetes.io/component: rio-builder}
          matchExpressions:
            - {key: k8s:io.kubernetes.pod.namespace, operator: Exists}
        - matchLabels: {app.kubernetes.io/component: rio-fetcher}
          matchExpressions:
            - {key: k8s:io.kubernetes.pod.namespace, operator: Exists}
        # Dashboard nginx → store LogService (bug_238): generated from
        # files/dashboard-upstreams.json (redundant with the blanket
        # system-namespace entry above, but structural — the registry
        # guarantees the pair even if that blanket ever narrows).
        {{- include "rio.dashboardIngressFrom" (list $ "rio-store" 9002) | nindent 8 }}
      toPorts: [{ports: [{port: "9002", protocol: TCP}]}]
    - fromEntities: [host, remote-node, cluster]
      toPorts:
        - ports:
            - {port: "9092", protocol: TCP}
---
# r[impl store.netpol.egress+3]
#
# Store egress: DNS + postgres + scheduler ExecutorService + S3 VPC
# endpoint. The store holds S3 creds + postgres creds — a compromised
# store should NOT reach IMDS or arbitrary public IPs. No `world` rule,
# no `kube-apiserver` entity → both DENIED.
#
# Postgres reachability needs BOTH selector forms: in-cluster PG (VM
# tests, dev) is a pod with a Cilium identity → `toEndpoints` matches
# it; external PG (RDS, CloudSQL) is a VPC IP outside the cluster →
# `toCIDRSet` matches it. The old k8s-NP used only ipBlock which
# matched RDS but NOT the in-cluster pod under Cilium (CIDR-as-world).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: store-egress
  namespace: {{ $ns.store.name }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rio-store
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    # S3 chunk uploads + STS + upstream-cache narinfo checks. Upstream
    # caches can be configured at runtime via AdminService (DB-persisted)
    # so the conditional store-egress-upstream CNP isn't sufficient —
    # store needs unconditional :443 egress to world. S3 alone needs it
    # regardless. FindMissingPaths blocks on the upstream check, so a
    # drop here surfaces as a gateway-side gRPC timeout.
    - toEntities:
        - world
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    # store↔store: the cross-replica TailLog proxy dials the replica
    # holding an execution's live ingest session by pod IP on 9002.
    # Same-namespace bare label match (the other replicas of this same
    # Deployment). Pairs with the store-ingress rule above; without
    # BOTH, the proxy connect times out and every cross-replica live
    # tail silently degrades to the history-only view.
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: rio-store}
      toPorts: [{ports: [{port: "9002", protocol: TCP}]}]
    # Store egress to the scheduler's ExecutorService: the
    # materialization executor's ListMaterializationJobs /
    # PullAssignment / ReportOutcome edge (substitution-replacement
    # campaign). Load-bearing: every store replica's executor
    # polls/claims/reports through this edge (the executor spawns iff
    # schedulerAddr is configured — PD-D2).
    # Cross-namespace, so the namespace label is mandatory (a bare
    # label match would be scoped to the policy's own namespace).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.system.name }}
            k8s:app.kubernetes.io/name: rio-scheduler
      toPorts: [{ports: [{port: "9001", protocol: TCP}]}]
    # In-cluster postgres (bitnami chart, VM tests / dev). Subchart
    # deploys into the helm release namespace (system), not store.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns.system.name }}
            k8s:app.kubernetes.io/name: postgresql
      toPorts: [{ports: [{port: "5432", protocol: TCP}]}]
    # External postgres (RDS / CloudSQL) — outside the cluster, so
    # toCIDRSet matches as `world` subspace. rio is v6-only; the CIDR is
    # the deployment's VPC IPv6 block (or ULA range for self-hosted).
    - toCIDRSet:
        - {cidr: {{ .Values.global.postgresCidr | quote }}}
      toPorts: [{ports: [{port: "5432", protocol: TCP}]}]
    {{- with .Values.networkPolicy.storeS3Cidr }}
    # S3 VPC endpoint CIDR — store writes chunks directly.
    - toCIDR: [{{ . | quote }}]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
    {{- end }}
{{- if .Values.store.upstreamCaches }}
---
# r[impl store.substitute.upstream]
#
# Store egress allowlist for upstream binary caches. CNP `toFQDNs`
# replaces the operator-maintained CIDR list — Cilium DNS-proxies the
# lookups (the DNS rule above) and tracks IP→FQDN, so the policy
# matches by hostname. The old k8s-NP comment "upgrade path is a CNI
# with FQDN-aware policies" — this is that upgrade.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: store-egress-upstream
  namespace: {{ $ns.store.name }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rio-store
  egress:
    # toFQDNs requires the L7 DNS proxy so Cilium can map IP→FQDN.
    # This is the ONLY policy that needs it — re-add the rules:dns
    # block here (the base store-egress DNS rule above is L4-only).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              {{- range .Values.store.upstreamCaches }}
              - matchName: {{ .host | quote }}
              {{- end }}
    - toFQDNs:
        {{- range .Values.store.upstreamCaches }}
        - matchName: {{ .host | quote }}
        {{- end }}
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
{{- end }}
{{- if .Values.dashboard.enabled }}
---
# Dashboard egress (bug_238): DNS + ONE edge per record in
# files/dashboard-upstreams.json — the SAME registry that generates
# the nginx upstream blocks (docker.nix) and the backend-ingress
# entries (rio.dashboardIngressFrom), so an upstream cannot exist
# without its policy pair. nginx dials every backend DIRECTLY (the
# old Gateway-proxy hop is gone — in-cluster traffic can't reach the
# Cilium Gateway ClusterIP anyway: selectorless Service, the L7
# redirect fires only on the LoadBalancer IP). The pre-registry
# hand-list narrated that deleted architecture and was missing the
# scheduler:9001 edge entirely — the SPA's scheduler RPCs were
# dropped wherever the policy was enforced.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rio-dashboard-egress
  namespace: {{ $ns.system.name }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rio-dashboard
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    {{- range ($.Files.Get "files/dashboard-upstreams.json" | fromJsonArray) }}
    # {{ .name }} → {{ .service }}.{{ index $.Values.namespaces .namespaceRef "name" }}:{{ .port }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ index $.Values.namespaces .namespaceRef "name" }}
            k8s:app.kubernetes.io/name: {{ .component }}
      toPorts: [{ports: [{port: {{ .port | quote }}, protocol: TCP}]}]
    {{- end }}
{{- end }}
{{- end }}
