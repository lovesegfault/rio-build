{{- if .Values.bootstrap.enabled }}
{{- $ns := .Values.namespaces.system.name -}}
{{- $b := .Values.bootstrap -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rio-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rio-build
  annotations:
    # Hooks run BEFORE all normal chart resources. If the SA were a normal
    # resource, the Job (a hook) would schedule before the SA exists →
    # "serviceaccount not found" → pod forbidden → deadlock until timeout.
    # Weight -1 orders the SA before the Job (weight 0).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with $b.serviceAccount.annotations }}
    # IRSA: secretsmanager:CreateSecret, PutSecretValue, DescribeSecret,
    # GetSecretValue on arn:aws:secretsmanager:*:*:secret:rio/* —
    # GetSecretValue feeds the signing-key pair-consistency probe and
    # the pub re-derive (both delegate byte work to rio-cli; the
    # script never decodes key material). Kept in lockstep with the
    # script by the bootstrap-iam-parity check.
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
---
# Helm pre-install/pre-upgrade hook: runs BEFORE any other chart resource.
# Idempotent — the script checks describe-secret first. On first-ever install,
# generates rio/hmac + rio/signing-key + rio/signing-key-pub in Secrets Manager.
# Subsequent upgrades: hmac/host-key blocks no-op; the signing-key block runs a
# pair-consistency probe — every upgrade's Job log shows either
# "[bootstrap] signing-key pair consistent" or a heal line (re-deriving the pub
# from the live private half via rio-cli; never a key rotation). ESO
# (external-secrets.yaml) then syncs them into k8s Secrets.
#
# before-hook-creation: Helm deletes the previous Job before creating a new
# one. Without this, a second upgrade would conflict with the completed Job
# from the first.
apiVersion: batch/v1
kind: Job
metadata:
  name: rio-bootstrap
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rio-build
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rio-bootstrap
        app.kubernetes.io/part-of: rio-build
    spec:
      serviceAccountName: rio-bootstrap
      restartPolicy: Never
      {{- include "rio.podSecurityContext" . | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ include "rio.image" (list . $b.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "rio.containerSecurityContext" . | nindent 10 }}
          env:
            - name: AWS_REGION
              value: {{ .Values.global.region | quote }}
            # Cilium cluster-pool gives pods IPv6-only overlay addresses
            # (fd42::/104). The default STS/S3/SecretsManager endpoints
            # are v4-only; dualstack endpoints have AAAA records.
            - name: AWS_USE_DUALSTACK_ENDPOINT
              value: "true"
            - name: CHUNK_BUCKET
              value: {{ .Values.store.chunkBackend.bucket | quote }}
            # awscli2 writes config/cache to $HOME/.aws/. With UID 65532 and
            # no explicit HOME, it falls back to / → tries /.aws → EROFS
            # under readOnlyRootFilesystem. Point HOME at the /tmp emptyDir.
            - name: HOME
              value: /tmp
          # readOnlyRootFilesystem=true (rio.containerSecurityContext) makes
          # the in-image /tmp read-only. Script writes /tmp/hmac + mktemp -d
          # → needs a writable mount. emptyDir inherits the pod's fsGroup
          # (65532 from rio.podSecurityContext) so the nonroot UID can write.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
