{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rio-alerts
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-alerts" "component" "monitoring") | nindent 4 }}
spec:
  groups:
    - name: rio.rules
      rules:
        # I-139/I-140: dispatch tail latency was invisible — actor cmd p99
        # >1s means the single-threaded actor loop is backed up (mailbox
        # contention, slow reconcile_one, or a blocking await in the hot
        # path). 2m `for` filters single-tick GC pauses.
        - alert: RioSchedulerActorSlow
          expr: histogram_quantile(0.99, sum by (le) (rate(rio_scheduler_actor_cmd_seconds_bucket[2m]))) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: scheduler actor p99 command latency >1s
            description: >-
              rio-scheduler actor loop p99 is {{`{{ $value | humanizeDuration }}`}}.
              The actor is single-threaded; sustained >1s means dispatch,
              heartbeat, and SubmitBuild are all queueing.

        # Any controller restart is notable — replicas=1, NOT leader-
        # elected. A restart is a 30s reconcile gap; >0 in 5m means it
        # crash-looped at least once.
        - alert: RioControllerRestarts
          expr: increase(kube_pod_container_status_restarts_total{container="controller"}[5m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: rio-controller restarted
            description: >-
              rio-controller container restarted
              {{`{{ $value | humanize }}`}} time(s) in the last 5m.

        # executor-formal OA2 control: pull-mode attempts carry no
        # per-pod heartbeat, so a wedged-but-Ready node
        # (kubelet/containerd hung while the Node object stays Ready)
        # surfaces as its builds silently running out their attempt
        # deadlines and being established by the sweep as unreported
        # executor crashes instead of reporting. Fleet-wide >=2
        # establishments inside 30m is the tripwire, summed across
        # replicas and keyed on the dedicated pull-sweep counter (the
        # attempt_requeue histogram's establishment cause is shared
        # with the stream-mode correlation-TTL sweep and is per-series,
        # so a leader change or a stream establishment could otherwise
        # split or fake the signal); the per-node clustering
        # discrimination is the ledger query in the runbook. The
        # permanent controller-side per-node aggregation (landed at the
        # 1c slice) automates that discrimination and feeds the capped
        # NodeClaim Dead reap; this alert stays as the independent
        # fleet-wide tripwire backing the runbook's manual confirmation.
        - alert: RioSchedulerAttemptEstablishmentCluster
          expr: sum(increase(rio_scheduler_pull_establishments_total[30m])) >= 2
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: ">=2 pull-mode attempts established (unreported) in 30m"
            description: >-
              {{`{{ $value | humanize }}`}} pull-mode attempt(s) were
              established as unreported executor crashes by the
              establishment sweep in the last 30m. If the ledger query
              shows them clustering on one source node this is the OA2
              hung-node signature: follow the manual NodeClaim reap
              procedure in docs/ops/hung-node-manual-reap.typ. Never
              bulk-reap Ready nodes without that per-node confirmation.

        {{- if .Values.buildScheduler.enabled }}
        # ADR-023 §13b: kube-build-scheduler second kube-scheduler.
        # Builder pods set `schedulerName: kube-build-scheduler`; if
        # THIS scheduler's unschedulable/backoff queues are non-empty
        # for 5m, builder pods are stuck Pending (kube-build-scheduler
        # crashlooped, RBAC drift, or NodeClaim deficit cover stalled).
        # The default kube-scheduler ignores kube-build-scheduler pods
        # so they stay Pending forever — page-worthy.
        #
        # r38 bug_002: gated on buildScheduler.enabled — the
        # `kube-build-scheduler` job label only exists when the
        # ServiceMonitor renders, so `absent()` (in KubeBuildSchedulerDown)
        # would fire permanently with the component disabled.
        - alert: KubeBuildSchedulerPendingStuck
          # Upstream `scheduler_pending_pods` is labeled by `queue` only
          # (process-global SchedulingQueue, not per-profile). Select by
          # the ServiceMonitor's `job` label instead.
          #
          # r37 bug_019: a pod that fails to schedule (no feasible node,
          # bind failure) spends ~ms in `activeQ` then moves to
          # `unschedulableQ`/`backoffQ`. `queue="active"` was structurally
          # ≈0 for every failure mode the alert names. Watch the queues
          # un-placeable pods actually sit in.
          expr: sum(scheduler_pending_pods{queue=~"unschedulable|backoff",job="kube-build-scheduler"}) > 0
          # r37 bug_019: 5m is past the EBS cell lead-time (~30s) so a
          # healthy cold-start clears before the alert. Metal cells
          # (~10m lead) WILL still false-positive — RioNodeclaimPoolStuckPending
          # owns the provisioning-stall signal; this alert covers the
          # post-registration scheduling stall. There is no precise
          # gate: `scheduler_pending_pods` and `nodeclaim_live` have no
          # shared join key (the scheduler queue is process-global, the
          # NodeClaim gauge is per-cell), and a global
          # `unless on() (... inflight > 0)` would suppress the RBAC-drift
          # signal whenever ANY cell is mid-boot (see the
          # RioNodeclaimPoolStuckPending comment below — under sustained
          # scale-up the inflight count never touches 0).
          # If metal false-positives are noisy, raise `for:` past
          # 3×maxLeadTime — that is the only safe knob.
          # Do NOT gate on RioNodeclaimPoolStuckPending: it fires at
          # clamp(3×lead, 90, 1800)≈30m for metal, far past the ~10m
          # healthy boot the false-positive names (r38 bug_030).
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: kube-build-scheduler has pods stuck Pending
            description: >-
              {{`{{ $value | humanize }}`}} builder pod(s) are in the
              kube-build-scheduler unschedulable/backoff queue for >5m.
              Check kube-build-scheduler pod health and nodeclaim_pool
              reconciler deficit cover.

        # r37 bug_019: a crashlooped kube-build-scheduler emits no series
        # at all, so a queue-based alert cannot see it. The default
        # kube-scheduler ignores `schedulerName: kube-build-scheduler`
        # pods — there is no fallback path; the only signal is absence.
        - alert: KubeBuildSchedulerDown
          expr: absent(up{job="kube-build-scheduler"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: kube-build-scheduler is not being scraped
            description: >-
              No `up==1` series for kube-build-scheduler for 5m. Builder
              pods with `schedulerName: kube-build-scheduler` cannot be
              bound. Check pod status, RBAC, ServiceMonitor selector.
        {{- end }}

        # ADR-023 §Observability: prediction_ratio = actual/predicted
        # (dim=wall|mem; 1.0=perfect). Sustained p50 outside [0.5, 2.0]
        # means the model is systematically off by 2× — fits are stale,
        # hw_perf_factors drifted, or a hot pname's curve regressed.
        # `sla explain <pname>` to inspect; `sla reset <pname>` to refit.
        - alert: RioSlaPredictionDrift
          expr: |
            histogram_quantile(0.5, sum by (le, dim) (rate(rio_scheduler_sla_prediction_ratio_bucket[15m]))) > 2.0
              or
            histogram_quantile(0.5, sum by (le, dim) (rate(rio_scheduler_sla_prediction_ratio_bucket[15m]))) < 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SLA prediction p50 off by >2× ({{`{{ $labels.dim }}`}})"
            description: >-
              rio_scheduler_sla_prediction_ratio p50 for dim={{`{{ $labels.dim }}`}}
              is {{`{{ $value | humanize }}`}} (1.0=perfect). Model is
              systematically over/under-predicting. Run `rio-cli sla status`
              and `sla explain` on the top pnames; `sla reset` to refit.

        # ADR-023 §Observability: prior_divergence = fleet-median prior
        # parameter ÷ operator-probe basis (labeled `param`). The gauge
        # is set unconditionally every refit; outside [0.5, 2.0] the
        # value is clamped to the band edge (prior.rs `clamp_field`), so
        # ≥2.0 or ≤0.5 ⇔ clamped. Sustained clamp means the [sla].probe
        # operator basis has drifted from what the fleet is actually
        # building — re-probe or widen the band.
        - alert: RioSlaPriorDivergenceClamped
          expr: |
            max by (param) (rio_scheduler_sla_prior_divergence) >= 2.0
              or
            min by (param) (rio_scheduler_sla_prior_divergence) <= 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SLA prior parameter clamped ({{`{{ $labels.param }}`}})"
            description: >-
              rio_scheduler_sla_prior_divergence{param={{`{{ $labels.param }}`}}}
              is {{`{{ $value | humanize }}`}} (clamp band [0.5, 2.0]).
              Fleet-median prior has diverged from the operator-probe
              basis. Check `[sla].probe` config vs `rio-cli sla status`.

        # ADR-023 §Observability: age of the hw-band $/vCPU·hr snapshot.
        # Spot poller refreshes every 600s (cost.rs POLL_INTERVAL_SECS);
        # at 6× (3600s) cost.rs itself clamps price_ratio to the helm
        # seed and emits _hw_cost_fallback_total{reason=stale}. Alert at
        # 3× (1800s) so the operator sees the poller failing BEFORE the
        # cost-ranking degrades. Not emitted under hwCostSource=static
        # (no live source) so this is a no-op in vmtest-full.
        - alert: RioSlaHwCostStale
          # min(): the gauge is PER-REPLICA (deliberately outside the
          # leader_gauges! family — the standby's copy climbs forever,
          # observability.typ blesses it). The alert keys the FLEET:
          # it fires only when no replica has a fresh snapshot
          # (merged_bug_235; contract pair in 34-alert-contracts.sh).
          # Lone-healthy-replica silence is by design — see the
          # sla-model runbook.
          expr: min(rio_scheduler_sla_hw_cost_stale_seconds) > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SLA hw-cost snapshot stale >30m"
            description: >-
              hw-band $/vCPU·hr snapshot is
              {{`{{ $value | humanizeDuration }}`}} old (poller tick=10m;
              auto-clamp at 60m). Check scheduler leader-lease and
              ec2:DescribeSpotPriceHistory IRSA; see
              rio_scheduler_sla_hw_cost_fallback_total{reason}.

        # E4 (the wedged-runtime / tcpSocket-blindness alert): the
        # scheduler's liveness is a blind tcp handshake BY DESIGN
        # (sys.guard.kill-wired-isolated — liveness on is_leader would
        # kill the standby), so a wedged runtime keeps "passing"
        # liveness: the kernel completes handshakes while every worker
        # is starved. Suffices-or-extend derivation, recorded:
        # RioSlaHwCostStale does NOT suffice — min() over the
        # per-replica gauge evaluates to NO DATA when no replica
        # serves /metrics at all (a wedge serves nothing), and every
        # other scheduler alert keys on SERVED series the same way.
        # The only signal that survives a full wedge is the scrape
        # verdict itself: target present, scrape failing.
        #
        # Deliberately `== 0` on present targets, NOT absent(): after
        # a cluster wipe the targets re-register LATE (live_055(d)'s
        # metric-blind window — no series at all), and absent() would
        # page on every wipe recovery. A wiped target is an operator
        # action; the wedge signature is target-present-scrape-dead.
        # `for: 5m` prices the (d) re-registration/boot tail (scrape
        # interval 30s; first scrapes during pod boot may fail) with
        # headroom; a real wedge persists far past it.
        - alert: RioSchedulerScrapeDown
          expr: max(up{job="rio-scheduler-metrics"}) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: scheduler /metrics unscrapeable while pods accept tcp
            description: >-
              Every rio-scheduler metrics target is failing its scrape while
              the pod passes its (blind, tcp-level) liveness probe. This is
              the wedged-runtime trace: kubelet sees an accepting socket, the
              exporter shares the wedged runtime, every served-series alert
              has gone silent for lack of data. Check the pod's skew/stack
              diagnostics and `kubectl describe pod` — restarts are NOT
              expected (a wedge does not crash); a manual restart recovers.

        # F1 (sched.lease.marks-verify, the platform-jurisdiction tier):
        # the rio-scheduler-leader Service selects pods by LABEL MATCH
        # ALONE (selectorLabels + rio.build/scheduler-role=leader), so
        # its ready-endpoint count is the ground truth of who the
        # dashboard's nginx upstream — which can neither health-probe
        # nor retry a Trailers-Only UNAVAILABLE — actually reaches.
        # The in-process detectors (the leader's own-pod verify and the
        # standby's self-check) bound every falsifier that lands ON a
        # scheduler pod; this rule covers the selector-membership faces
        # no pod-side clock can police: a FOREIGN-CREATED pod minted
        # with the app+role labels (it runs no scheduler binary, so no
        # self-check ever runs there), a deleted/orphaned pod, or a
        # label state both replicas' loops have stopped converging.
        # Both polarities in one expr: 0 ready endpoints = dashboard
        # down (no pod carries the label); >=2 = dual serve (standby or
        # foreign pod silently in the data path — requests pin to one
        # backend, so a session can be 100% broken, not ~half).
        # `or vector(0)` makes the zero-endpoint polarity fire (an
        # empty Endpoints object exports NO kube_endpoint_address
        # series); it also means a kube-state-metrics outage surfaces
        # here as a 0-count — this template already leans on KSM
        # (kube_pod_container_status_restarts_total above), and a
        # monitoring hole over the leader Service is itself pageworthy.
        # `for: 5m` prices rollouts and failovers (label converges
        # within one reconcile, ~seconds; the standby self-check bounds
        # a pod-side falsifier at ~MARKS_VERIFY_EVERY renews ≈ 60s+5s);
        # the residual faces this rule exists for persist indefinitely.
        - alert: RioSchedulerLeaderEndpointsNotSingleton
          expr: (sum(kube_endpoint_address{namespace="{{ .Values.namespaces.system.name }}", endpoint="rio-scheduler-leader", ready="true"}) or vector(0)) != 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: rio-scheduler-leader Service has {{`{{ $value }}`}} ready endpoints (want exactly 1)
            description: >-
              The leader-only Service routes by label match alone; its ready
              endpoint count must be exactly 1. 0 means the dashboard data
              path is down (no pod carries the leader label, or
              kube-state-metrics stopped exporting endpoint series); 2+ means
              a non-leader pod is silently serving un-retryable UNAVAILABLE
              to pinned nginx sessions — kubectl label, a foreign controller,
              or a foreign-created pod carrying the selector labels (the
              face no scheduler-pod self-check can repair). Inspect
              `kubectl -n {{ .Values.namespaces.system.name }} get pods
              -l rio.build/scheduler-role=leader` and compare against the
              Lease holder.

        # ADR-023 §13b: ≥3 distinct cells reaping for `reason=ice`
        # (Launched=False — InsufficientCapacity / quota / unfulfillable
        # instance-type). One cell ICE is routine spot churn; ≥3
        # concurrently means an AZ/quota/AMI-tag problem and the
        # admissible-set is shrinking toward `_hw_ladder_exhausted`.
        - alert: RioNodeclaimPoolIceMaskedHigh
          # Both ICE-mask paths feed `report_unfulfillable`: `classify`
          # emits reason=ice; `detect_vanished` (Karpenter ~1s GC outpaces
          # the 10s tick) emits reason=vanished. Match both.
          expr: count(sum by (cell) (rate(rio_controller_nodeclaim_reaped_total{reason=~"ice|vanished"}[5m])) > 0) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "≥3 hw-class cells ICE-masked"
            description: >-
              {{`{{ $value | humanize }}`}} (hw_class,cap) cells are
              reaping NodeClaims for reason=ice. Check Karpenter
              controller logs for InsufficientInstanceCapacity / quota,
              and `rio_scheduler_sla_hw_ladder_exhausted_total`.

        # ADR-023 §13b/§13c: oldest in-flight NodeClaim (created, not
        # Registered) older than 2× the cell's reap timeout. Per-cell
        # threshold (r33 bug_001): a single hardcoded `> 90` was
        # calibrated for the EBS band (leadTimeSeed 17-21s) and
        # false-fires for the entire 7-15min metal boot once §13c adds
        # `metal-*:od` leadTimeSeed=600.
        #
        # r41 bug_026: anchor on `ice_timeout_seconds` — the SAME number
        # `health::classify` reaps at (health.rs:122,
        # `s.ice_timeout(cfg.seed_for(cell))` = `max(2×seed, q_0.99(boot))`,
        # floored at `2×seed` until the cell has 100 boot samples) —
        # NOT `3 × lead_time_seconds` (a proxy: `q_0.9(boot − eta)`
        # which learns DOWN with no floor at the seed). Once a
        # forecast-heavy cell learns `lead_time < (2/3)×seed`, the proxy
        # falls below the reaper's grace period and the alert pages on
        # healthy boots. Anchoring on `ice_timeout` makes that
        # structurally impossible: `2×ice_timeout ≥ 2×(2×seed) > 2×seed`
        # always.
        #
        # Both gauges are emitted with `cell` from the same loop in
        # `emit_live_gauges` (rio-controller nodeclaim_pool/mod.rs), so
        # the join cannot drop a series. `clamp(.., 90, 3×maxLeadTime)`:
        # the 90s floor covers the unseeded cell where ice_timeout reads
        # 0; the 3×maxLeadTime cap stops an absurd `q_0.99` from
        # disarming the alert (r34 bug_017: templated from
        # `.Values.scheduler.sla.maxLeadTime`; `seed ≤ maxLeadTime` is
        # validated at config load so `2×ice_timeout ≤ 4×maxLeadTime`
        # only exceeds the cap when `q_0.99 > 1.5×maxLeadTime`, which
        # the BootTimeoutLoop alert covers). Sits above the controller's
        # own `ice_timeout` reap — a healthy boot or a successful reap
        # clears the gauge before the alert window; a firing alert means
        # the reaper itself failed. Keys on per-cell max age, NOT count:
        # under sustained scale-up the inflight count never touches 0
        # even when every individual claim registers in ~18s, so a
        # count-based `for` fires on every healthy burst. Either
        # Launched=False (ICE — see reaped{reason=ice|vanished}) or
        # Launched=True but kubelet never joined (AMI/nodeadm/CNI break).
        - alert: RioNodeclaimPoolStuckPending
          expr: |
            rio_controller_nodeclaim_inflight_age_max_seconds
              > clamp(2 * rio_controller_nodeclaim_ice_timeout_seconds, 90, {{ max 90 (mulf 3 (float64 .Values.scheduler.sla.maxLeadTime) | int) }})
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "NodeClaim stuck pre-Registered ({{`{{ $labels.cell }}`}})"
            description: >-
              cell={{`{{ $labels.cell }}`}} has a NodeClaim
              {{`{{ $value | humanizeDuration }}`}} past creation without
              Registered=True (threshold: 2× the cell's reap timeout
              `rio_controller_nodeclaim_ice_timeout_seconds`, floor 90s,
              cap 3×maxLeadTime). The reaper SHOULD have deleted this
              NodeClaim — check rio-controller liveness/leases, then
              `kubectl get nodeclaims` Launched/Registered conditions and
              rio_controller_nodeclaim_reaped_total{reason=ice|boot-timeout|vanished}.

        # r34 bug_019 (§Verifier-one-step-removed inverse of r33 bug_001):
        # the StuckPending threshold sits ABOVE the reaper's 2×seed
        # boot-timeout reap by design — a firing alert means the reaper
        # FAILED. The reaper *succeeding repeatedly* is a distinct
        # failure mode: a broken AMI / nodeadm / firmware regression
        # leaves Launched=True but kubelet never registers; health.rs
        # reaps with reason=boot-timeout (NOT ICE-masked — capacity
        # exists, the boot failed); cover_deficit re-mints next tick.
        # `inflight_age_max` sawtooths 0→2×seed→0 and never crosses the
        # StuckPending threshold; IceMaskedHigh excludes `boot-timeout`
        # from its regex and requires ≥3 cells (only 2 metal cells
        # exist). The pre-r33 `> 90` threshold incidentally caught this
        # loop (mixed with bug_001's healthy-boot false positives); this
        # is the dedicated sibling for the loop signal.
        #
        # r35 merged_bug_027: window 4×maxLeadTime + 4×TICK = 2 full
        # reap cycles + tick-grid slack (worst-case cycle 2×seed + 2×TICK:
        # one tick to observe the reap, one for FFD to stop placing on
        # the dying claim before re-mint; r43 bug_024). `>= 2` reaps in
        # the window distinguishes a one-off slow boot (1 reap, never
        # fires) from a sustained loop (≥2 reaps within 2 cycles). The
        # r34 3× window spanned only 1.5 cycles when seed=maxLeadTime
        # (metal cells), giving `>= 2` a ~50% duty cycle — the alert
        # flapped on a sustained loop instead of holding. Default chart:
        # [2440s] window, fires ~25min into a 20min-cycle loop and
        # HOLDS as long as the loop persists.
        - alert: RioNodeclaimPoolBootTimeoutLoop
          expr: |
            sum by (cell) (
              increase(rio_controller_nodeclaim_reaped_total{reason="boot-timeout"}[{{ max 90 (add (mulf 4 (float64 .Values.scheduler.sla.maxLeadTime) | int) 40) }}s])
            ) >= 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $labels.cell }}`}} NodeClaims repeatedly time out at boot"
            description: >-
              cover_deficit keeps minting NodeClaims for
              {{`{{ $labels.cell }}`}} that fail to register before
              2×seed; health::classify reaps them with
              reason=boot-timeout but the cell is NOT ICE-masked, so the
              mint→reap loop is unbounded. Likely a broken AMI / nodeadm
              / firmware: Launched=True but kubelet never joins. Run
              `kubectl get nodeclaims -o wide` and check
              Launched/Registered conditions; see
              docs/ops/sla-model.typ#rionodeclaimpool-boottimeoutloop.

        # r35 B1 (bug_003 second half): when `fallback_cell` finds no
        # configured hw-class that can host an intent, the intent is
        # dropped — no NodeClaim is minted, the pod has a restrictive
        # `nodeSelector` and stays permanently Pending, and pre-B1
        # NOTHING fired (all alerts were NodeClaim-derived). The B1 code
        # fix makes the `system="builtin"` shape unreachable for
        # featured intents, but the alert half is independent and
        # structural: it catches the NEXT "no class can host" gap (a
        # future arch addition without a hwClass, a featureless
        # arch-unmappable system, an over-constrained `requiredFeatures`
        # set). 15m window: each intent is dropped once per nodeclaim
        # tick, so even a low-rate persistent gap accumulates.
        #
        # r41 merged_015: `no_pool_covers` is the same outcome (build
        # permanently Pending, no NodeClaim, no Job) for a different
        # cause (a hwClass advertises a feature with no covering Pool —
        # a rio.build/v1alpha1 ExecutorPool/hwClass config split). It
        # was emitted at mod.rs:923 since r35 with no alert. NOT
        # `unknown_hw_class` or `exceeds_cell_cap`: those are
        # scheduler/controller skew that self-heals within the 300s
        # GetHwClassConfig refresh (`for: 5m` would false-positive on a
        # healthy rollout). They have a `warn!` at the drop site; if
        # the skew persists, watch the warn rate and
        # `intent_dropped_total{reason}` directly — no NodeClaim is
        # minted for either, so StuckPending stays silent, and
        # `ffd_unplaced_cores` iterates `all_cells() ∪ by_cell.keys()`
        # plus a one-shot trailing zero (r41 bug_021 + r43 bug_026), so
        # it DOES have a series for an unknown cell — but only while
        # demand persists; once the intents clear, one zero-write then
        # silence. `exceeds_cell_cap` demand is shown because the cell
        # is configured.
        - alert: RioNodeclaimPoolNoHostingClass
          expr: |
            increase(rio_controller_nodeclaim_intent_dropped_total{reason=~"no_hosting_class|no_pool_covers"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: NodeClaim intents dropped — no configured hw-class or Pool can host
            description: >-
              {{`{{ $value | humanize }}`}} SpawnIntents dropped over 15m
              with reason={{`{{ $labels.reason }}`}}. The build's pod is permanently
              Pending and no NodeClaim will be minted.
              reason=no_hosting_class: check the intent's
              `(system, required_features)` against `[sla.hw_classes]`
              `provides_features`/`max_cores`/`max_mem` and the arch labels.
              reason=no_pool_covers: a hwClass advertises a feature with no
              covering Builder/Fetcher Pool — `kubectl get pools.rio.build -A`
              and check `spec.systems`/`effective_features`.
              See docs/ops/sla-model.typ#rionodeclaimpool-nohostingclass.

        # Sibling of NoHostingClass for the OTHER reason `assign_to_cells`
        # drops a cold-start intent: a class CAN host it, but every
        # hosting cell is ICE-masked because NodeClaim launches are
        # failing in the cloud. Same symptom (build's drv permanently
        # Ready and unroutable), opposite operator action — DON'T add a
        # `[sla.hw_classes]` entry; fix the cloud. Distinguishing the
        # two saves the operator from a config-side spelunk for an
        # account-side gap (a missing AWSServiceRoleForEC2Spot took the
        # `no_hosting_class` warn at face value and lost ~10min on the
        # wrong axis).
        #
        # NOT folded into RioNodeclaimPoolIceMaskedHigh: that alert is
        # cause-side (`reaped{ice|vanished}` per cell, ≥3 cells) and
        # bounds noise with the 3-cell threshold; a kvm-only build whose
        # single `metal-x86:od` cell is ICE'd never reaches 3 cells but
        # IS stuck. This alert is consequence-side (intents actually
        # dropped) — the two are coupled by intent on the runbook page,
        # not by the rule expr.
        #
        # `for: 15m`, not 5m like NoHostingClass: ICE backoff TTLs are
        # 60s × 2^step capped at maxLeadTime, so transient capacity dips
        # self-heal within ~10min. A 5m `for:` would false-fire on every
        # multi-cell spot blip. NoHostingClass is config-static and never
        # self-heals — `for: 5m` is right there.
        - alert: RioNodeclaimPoolAllCellsIceMasked
          expr: |
            increase(rio_controller_nodeclaim_intent_dropped_total{reason="all_cells_ice_masked"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: NodeClaim intents dropped — every hosting cell ICE-masked
            description: >-
              {{`{{ $value | humanize }}`}} SpawnIntents dropped over 15m because
              every cell that could host them is ICE-masked. NodeClaim launches
              are failing in the cloud — this is NOT a `[sla.hw_classes]` config
              gap. Check `kubectl logs -n kube-system deploy/karpenter` for
              CreateFleet errors (capacity, quota, or IAM — e.g. a missing
              `AWSServiceRoleForEC2Spot` SLR fails every spot launch) and
              `rio_controller_nodeclaim_reaped_total{reason=~"ice|vanished"}`.
              Once the cloud-side issue is fixed, `kubectl rollout restart
              deploy/rio-scheduler -n rio-system` clears the in-memory ICE
              backoff immediately (otherwise it self-heals on TTL expiry,
              up to `sla.maxLeadTime`).
              See docs/ops/sla-model.typ#rionodeclaimpool-icemaskedhigh.

        # merged_bug_058: the wave-8 reason split routed the starved-
        # READY population (solved demand, named hosting classes,
        # eta=0 — the live_050(a) hang's measured class) exclusively
        # to reason="ready_all_cells_ice_masked", whose HELP declares
        # it "alert-worthy at low thresholds" — but the only alert
        # exact-matched the disjoint cold-start sibling, so a
        # live_050(a) recurrence paged NOTHING while the less-severe
        # population paged. This row joins the reason to the alert
        # tier; the 42-reason-alert-sync.sh leg pins the join in both
        # directions (every alert-worthy reason ↔ some alert expr).
        #
        # `for: 15m`, same as the cold-start sibling — the noise floor
        # is identical (ICE backoff TTLs 60s × 2^step self-heal
        # transient capacity dips within ~10min; a shorter `for:`
        # would false-fire on every multi-cell spot blip). The
        # difference is IMPACT, not signal quality: these intents have
        # builds actively waiting, which the description carries.
        - alert: RioNodeclaimPoolReadyAllCellsIceMasked
          expr: |
            increase(rio_controller_nodeclaim_intent_dropped_total{reason="ready_all_cells_ice_masked"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: READY NodeClaim intents starved — every hosting cell ICE-masked
            description: >-
              {{`{{ $value | humanize }}`}} READY SpawnIntents (solved demand,
              named hosting classes, eta=0) dropped over 15m because every
              hosting cell is ICE-masked — builds are WAITING on this
              population (the live_050(a) hang class). Same cloud-side causes
              and heal path as RioNodeclaimPoolAllCellsIceMasked: check
              `kubectl logs -n kube-system deploy/karpenter` for CreateFleet
              errors and
              `rio_controller_nodeclaim_reaped_total{reason=~"ice|vanished"}`;
              after the cloud-side fix, `kubectl rollout restart
              deploy/rio-scheduler -n rio-system` clears the in-memory ICE
              backoff immediately.
              See docs/ops/sla-model.typ#rionodeclaimpool-icemaskedhigh.

        # qa-fix-b r37: a NodeClaim whose Karpenter finalizer never
        # clears stays `terminating` indefinitely. `class_budget` and
        # `live_cores` still count it (the EC2 instance bills until the
        # finalizer clears, by design — see ffd.rs); FFD `simulate`
        # excludes it. Effective fleet capacity is permanently reduced
        # and `RioNodeclaimPoolStuckPending` (which watches in-flight
        # age) won't fire.
        #
        # r38 merged_001: keys on per-cell max age, NOT count — same
        # rationale as RioNodeclaimPoolStuckPending. Under sustained
        # scale-down (~1 reap/min, ~80s drain each) `live{state=
        # terminating}` stays at 1-3 continuously; `terminating_age_max`
        # never crosses 300s unless one claim is genuinely stuck.
        - alert: RioNodeclaimPoolStuckTerminating
          expr: rio_controller_nodeclaim_terminating_age_max_seconds > 300
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: NodeClaim stuck terminating (Karpenter finalizer not clearing)
            description: >-
              cell={{`{{ $labels.cell }}`}} has a NodeClaim
              {{`{{ $value | humanizeDuration }}`}} past `metadata.deletionTimestamp`
              without Karpenter's finalizer clearing. Check the Karpenter
              controller and the Node's drain/cordon state;
              `kubectl get nodeclaims -o wide` to find the stuck object.
              See docs/ops/sla-model.typ#rionodeclaimpool-stuckterminating.

        # Substitution-replacement Phase B (PD-20 / design §2.5): the
        # parked-materialization backlog. The housekeeping re-evaluation
        # arm resolves parked jobs whose nodes have buildable dependency
        # closures from-source within one tick — when the conversion-
        # strictness knobs admit it (conversion_requires_worker_charge /
        # conversion_min_park_dwell_secs; establishment-only-parked jobs
        # never convert while the charge knob is ON). A counted job has
        # either no from-source fallback (Holed/Pending closure
        # evidence) or convertible work the knobs deliberately hold.
        # Builds WAIT (never fail) while parked; this alert is the
        # operator's cue to fix the upstream or review the knobs.
        # The gauge is a leader-gauge family member: every replica
        # births it at its declared reset (0) at boot, the leader
        # publishes ground truth each tick, and leadership loss sweeps
        # it back to the reset from the family declaration — so the
        # expr has a series from boot and a deposed leader's frozen
        # backlog cannot keep this alert latched; max() collapses the
        # brief leader/old-leader series overlap across a failover.
        # for: 15m — park backoffs start at 30 s with exponential
        # doubling; 15 minutes of sustained backlog means the re-claim
        # ladder keeps failing, not a transient upstream blip.
        - alert: RioSchedulerMaterializationStalled
          expr: max(rio_scheduler_materialization_stalled) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: materialization jobs parked >15m (upstream dead or misconfigured)
            # Semantics sentence rendered from the canonical describe_*!
            # HELP (generated/metric-help.json via `xtask regen helm-obs`
            # — bug_330); the hand-written tail is operator ACTION only.
            description: >-
              {{ get (($.Files.Get "generated/metric-help.json") | fromJson) "rio_scheduler_materialization_stalled" }}
              Right now: {{`{{ $value | humanize }}`}} job(s) parked over 15
              minutes. Two arms (the MD-D1 runbook): (1) upstream — check
              the conversion-strictness knobs and the tenant's upstream
              cache configuration and health
              (rio_store_substitute_total{result="error"} rate, the store
              logs for the upstream URL), then fix the upstream, adjust
              the knobs, or cancel the affected builds — in that order.
              (2) store replica — a parked job whose ledger rows are all
              establishment-written (zero worker reports), with k8s
              CrashLoopBackOff on a store replica and NO
              rio_store_substitute_total error signal, is the
              crash-looping-replica case: fix the replica, not the
              upstream. Do NOT restart the scheduler to clear a park —
              the park is durable state and survives restarts by design.
              Full index: docs/ops/materialization-deployment-checklist.typ.

        # Substitution-replacement Phase B (T-6.2; the CE-D1 deployment-
        # checklist row's alert, extended to the materialization tables):
        # rio_scheduler_evidence_write_fenced_total counts evidence writes
        # refused by the claims-floor generation fence — topdown/closure
        # stamps, status persists, merge transactions, AND (since Phase A)
        # materialization job-table/wanted-relation writes, which carry
        # the same fence. On a replica that just lost the lease, a BURST
        # of refusals during the failover window is the fence WORKING
        # (deposed-leader writes are now no-ops). On the current leader it
        # must be zero. The discrimination is temporal, not per-pod: a
        # failover burst stops within seconds (the deposed actor stops
        # serving on LeaderLost), so a rate that stays nonzero across
        # 15 minutes means the SERVING leader is being fenced — a
        # generation-capture bug or a PG floor regression. Investigate
        # immediately: evidence writes (including materialization job
        # resolutions) are being silently dropped.
        - alert: RioSchedulerEvidenceWriteFenced
          expr: sum(rate(rio_scheduler_evidence_write_fenced_total[5m])) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: evidence writes are being fenced for >15m (not a failover burst)
            description: >-
              rio_scheduler_evidence_write_fenced_total has been increasing
              for over 15 minutes ({{`{{ $value | humanize }}`}}/s). A
              failover burst self-clears in seconds; a sustained rate means
              the serving leader's writes (derivation evidence AND
              materialization job state) are being refused by the
              claims-floor fence — a generation-capture bug or a PG floor
              regression. Check which pod holds the Lease, its
              serving_generation log lines, and the
              leader_generation_claims table.

        # bug_155 (bughunt-2 wave): recovery failure is alertable —
        # before this alert, NO rule referenced
        # rio_scheduler_recovery_total, so a scheduler that could not
        # load its state was invisible until builds stalled. A failed
        # recovery now steps the leader down (sched.recovery.step-down),
        # so under a persistent PG outage the replica set cycles
        # acquire → fail → step-down at lease cadence: outcome="failure"
        # increments on every cycle, exactly the sustained signature
        # this catches. One transient blip (PG restart at failover
        # time) self-clears inside the for-window; sustained failures
        # mean the scheduler cannot serve and the lease is ping-ponging
        # — check PG health first, then the recovery error log lines
        # (rio_scheduler_recovery_step_down_total tracks the yields).
        - alert: RioSchedulerRecoveryFailing
          expr: sum(increase(rio_scheduler_recovery_total{outcome="failure"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: scheduler state recovery is failing (leader cycling via step-down)
            description: >-
              rio_scheduler_recovery_total{outcome="failure"} increased for
              over 5 minutes ({{`{{ $value | humanize }}`}} failures/5m).
              Failed recoveries never serve — each one steps the leader
              down and the next acquire retries, so no replica is
              dispatching while this fires. Check PG availability and the
              "state recovery FAILED" error lines on the scheduler pods;
              rio_scheduler_recovery_step_down_total counts the yields.

        # Item T (harden-store reconciliation memo §6.2 / §3 row 32):
        # conversion visibility for the Vouched/Pending evidence class.
        # rio_scheduler_materialization_converted_total counts PD-20 park
        # re-evaluations that resolved a job from_source — TIME-driven
        # conversions (infra budget exhausted while from-source stayed
        # viable), not evidence-driven consumption routing. For
        # origin=cache_opportunity that is upstream-available content
        # converting to a from-source build: recorded and bounded, but
        # exactly the incident's outcome class re-entering through
        # exhaustion. A single conversion during a cold-start wave is
        # expected noise (the placeholder-race absorption); the
        # churn-loop signature — a wedged-but-heartbeating ingest owner
        # converting a competing job roughly once a minute per re-created
        # job cycle — is SUSTAINED conversions. Hence the shape: a
        # conversion in every sliding 5m window for 15 consecutive
        # minutes (≈3+ spread conversions), not one blip held for 15m.
        # warning, not page: conversions are walk-equivalent recorded
        # behavior; the strictness knob (whether to refuse them) is a
        # separate owner decision. Counter is pre-registered at 0
        # flag-on, so the expr has series from boot; sum() collapses
        # leader/old-leader series across failovers.
        - alert: RioSchedulerMaterializationConversions
          expr: sum(increase(rio_scheduler_materialization_converted_total{origin="cache_opportunity"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: sustained from-source conversions of upstream-available jobs (>15m)
            description: >-
              Parked materialization jobs with cache_opportunity origin have
              been converting to from-source builds continuously for over 15
              minutes ({{`{{ $value | humanize }}`}} in the last 5m window).
              Each conversion is a derivation whose content the upstream
              cache advertises, built from source anyway because its
              materialization attempts kept failing (the park budget
              exhausted). Sustained conversions usually mean a wedged or
              overloaded store ingest path (check
              rio_store_substitute_stale_reclaimed_total{reason=~"stall_.*"}
              and rio_store_materialization_executions_total{outcome="infra"})
              or a flapping upstream — fix the ingest/upstream side; the
              conversions themselves are recorded, bounded fallbacks, not
              failures.

        # rio_store_putpath_retries_total{reason} is live and alert-seeded
        # at zero from boot (rio-store ALERT_SEEDED_COUNTERS — the
        # alert-metric parity test imports that table), so this alert is
        # armed on day one. >10/s sustained means S3/PG backpressure or
        # the chunk-dedup CAS loop is thrashing.
        - alert: RioStorePutPathRetries
          expr: sum by (reason) (rate(rio_store_putpath_retries_total[1m])) > 10
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: rio-store PutPath retrying >10/s
            description: >-
              PutPath retry rate is {{`{{ $value | humanize }}`}}/s.
              Check S3 5xx rate and PG connection-pool saturation.

        # harden-logs: a failed chunk cut burns a chunk_seq, restores the
        # lines to the ingest buffer, and retries; 3 consecutive failures
        # abort the stream and the builder fails over to another replica.
        # The builders' in-memory retransmit buffers absorb the outage,
        # but they are bounded (one whole log each) — sustained failures
        # for 5m means log durability is degraded and the buffers are
        # filling.
        - alert: RioLogChunkWriteFailures
          expr: increase(rio_store_log_chunk_write_failures_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: rio-store build-log chunk writes failing
            description: >-
              {{`{{ $value | humanize }}`}} failed log-chunk commits in the
              last 5m. Check S3 PUT errors and PG availability on the
              store; builders are buffering un-acked log lines in memory
              until this recovers.

        # harden-logs: a drv_log_chunks manifest row whose S3 object is
        # missing. The manifest is written only after the object PUT
        # succeeds, so this means an object was deleted out from under
        # its row — a hole in a stored build log that cannot be
        # recovered. Any increment is an incident; there is no benign
        # cause.
        - alert: RioLogReadDataLoss
          expr: increase(rio_store_log_read_data_loss_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: rio-store build-log data loss detected on read
            description: >-
              A TailLog read found {{`{{ $value | humanize }}`}} manifest
              row(s) referencing missing chunk objects. Check the store
              logs for the s3_key/exec_id (logged at error!) and audit
              the S3 lifecycle rule and any manual deletions under logs/.

        # merged_bug_164: served-anyway manifest/object divergence
        # (overlong objects, covered shorts). Every claimed line still
        # served — this is a trend signal about the cutter/manifest
        # write path, deliberately split from the page-on-any-increment
        # loss alert above so recoverable divergence cannot page.
        - alert: RioLogReadDivergence
          expr: sum(increase(rio_store_log_read_divergence_total[1h])) > 10
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: rio-store build-log manifest/object divergence trend
            description: >-
              TailLog reads sighted {{`{{ $value | humanize }}`}}
              newly divergent chunk object(s) in the last hour, counted
              once per (exec_id, s3_key) identity (kind label: overlong
              / short_object_covered / missing_object_covered). Lines
              all served; investigate the cutter and manifest write
              path for inconsistent row/object pairs.

        # refcount-formal Wave A1: the chunk collector's mark phase is
        # fail-closed -- ANY existing manifest whose chunk_list fails
        # validation aborts the collect cycle before anything is
        # computed or deleted (treating corrupt input as "references
        # nothing" would collect live data). While this persists, all
        # chunk collection is suspended; path GC is unaffected. The
        # offending store_path_hash values are logged at error level by
        # the store. Live (and harmless) from the additive release: the
        # shadow collector runs the same fail-closed mark.
        - alert: RioStoreGcCollectParseFailure
          expr: increase(rio_store_gc_collect_parse_failures_total[1h]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: rio-store chunk-collect cycle aborted on an unparseable chunk_list
            description: >-
              {{`{{ $value | humanize }}`}} chunk-collect cycle abort(s) in the
              last 1h. ALL chunk collection is suspended (path GC is
              unaffected) until the offending manifest is repaired, deleted,
              or quarantined; the offending store_path_hash is in the store
              error logs ("chunk-collect: unparseable chunk_list"). See
              docs/ops/gc-enablement.typ (chunk collector, parse-failure
              abort) for the remediation ladder.

        # No successful collect cycle ANYWHERE in >25h (daily backstop +
        # slack). Cluster-level: sum() across store replicas is required
        # because each replica arms its own daily backstop and a replica
        # whose tick skips on a held GC_LOCK_ID (or that simply never
        # personally wins a cycle) is not a stall -- per-series
        # evaluation would page on every fresh pod for up to 24h.
        # `for: 30m` keeps a freshly rolled-out store from firing while
        # its first cycle (controller gc-cron startup delay + cycle
        # duration) is still pending. A capped cycle counts as success
        # -- the cap is the designed backlog-drain behavior, not a
        # failure. The ok-outcome counter is pre-registered at 0 at
        # startup so this expression has a series to evaluate from boot
        # (no absent()); DB-error cycles surface separately under
        # outcome="error".
        - alert: RioStoreGcCollectStalled
          expr: sum(increase(rio_store_gc_collect_cycles_total{outcome="ok"}[25h])) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: rio-store chunk-collect cycles are not completing
            description: >-
              No successful chunk-collect cycle on any store replica in the
              last 25h (the daily backstop should produce at least one).
              Either GC and the backstop are not running, every cycle is
              aborting (check RioStoreGcCollectParseFailure and the store
              error logs), or cycles are failing against PostgreSQL (check
              the outcome="error" rate of rio_store_gc_collect_cycles_total
              and the store error logs). See docs/ops/gc-enablement.typ
              (chunk collector, stalled cycles).

        # refcount-formal Wave A1 (collect-soundness assumption, design
        # 4.1): the chunk collector's grace term protects post-snapshot
        # manifests only while no chunk-referencing write transaction
        # outlives the grace window. The chunked-upgrade transaction is
        # the single such transaction; its duration is monitored, not
        # enforced (no statement_timeout). Same alert name, two
        # severities: warning = p99 over 15m above grace/2 (the margin
        # is eroding as a trend); critical = an exact count of committed
        # transactions over grace - 60s in the window, read straight off
        # the 240s histogram bucket boundary -- a p99 structurally
        # tolerates a single overrun once upload volume is non-trivial,
        # and one overrun is all the falsified model trace needs. The
        # histogram is recorded only at commit (success path), so a
        # still-open transaction is invisible to either arm until it
        # commits; the pg_stat_activity query in the runbook is the only
        # live view.
        - alert: RioStoreChunkUpgradeTxSlow
          expr: histogram_quantile(0.99, sum by (le) (rate(rio_store_chunk_upgrade_tx_seconds_bucket[15m]))) > 150
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: rio-store chunked-upgrade transactions approaching the collect grace window
            description: >-
              p99 upgrade_manifest_to_chunked transaction duration over the
              last 15m is {{`{{ $value | humanizeDuration }}`}} (above
              grace/2 = 150s). The chunk collector's soundness margin is
              eroding; find long transactions in pg_stat_activity and see
              docs/ops/gc-enablement.typ (slow upgrade transactions).
        - alert: RioStoreChunkUpgradeTxSlow
          expr: (sum(increase(rio_store_chunk_upgrade_tx_seconds_bucket{le="+Inf"}[15m])) - sum(increase(rio_store_chunk_upgrade_tx_seconds_bucket{le="240"}[15m]))) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: rio-store chunked-upgrade transaction exceeded grace - 60s
            description: >-
              {{`{{ $value | humanize }}`}} committed chunked-upgrade
              transaction(s) exceeded 240s (grace - 60s) in the last 15m.
              A transaction that outlives the grace window can defeat the
              collector's mark-snapshot protection once the live collect
              arm is enabled. Investigate immediately: find long
              transactions in pg_stat_activity and see
              docs/ops/gc-enablement.typ (slow upgrade transactions).

    # The executor-lifecycle deletion-gate recording rules
    # (rio:scheduler_stream_registrations:max over the workers_active
    # gauge, and rio:scheduler_stream_attempts:rate5m over the stream
    # stub-call counter) were removed with the metrics they read once
    # the stream protocol surface itself was deleted (the source series
    # no longer exist on this release). The deployment-time deletion-gate
    # evaluation (checklist rows D6/D7) runs against the chart/release
    # that still emits those series — i.e. the release being upgraded
    # FROM — per docs/ops/pull-rollout-checklist.typ (rows D6/D7).
{{- end }}
