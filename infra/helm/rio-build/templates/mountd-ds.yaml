{{- if .Values.mountd.enabled }}
{{- $m := .Values.mountd -}}
# rio-mountd — privileged per-node broker for castore-FUSE (P0567).
#
# One pod per builder/fetcher node. The unprivileged builder pod cannot
# (a) call FUSE_DEV_IOC_BACKING_OPEN (init-ns CAP_SYS_ADMIN) or
# (b) write the shared node-local cache (integrity boundary). This
# DaemonSet brokers both over a SOCK_SEQPACKET UDS at
# /run/rio-mountd/mountd.sock. It opens no devices and mounts nothing:
# the builder opens /dev/fuse itself, mounts it inside its own mount
# namespace, and hands the daemon a dup in Mount{} for the ioctl
# brokering (P0560 option (b)).
#
# Namespace: rio-builders (PSA privileged). CAP_SYS_ADMIN + hostPath are
# both rejected by PSA baseline/restricted, and rio-system is
# restricted. The pods land on builder AND fetcher nodes regardless of
# the DaemonSet's own namespace.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rio-mountd
  namespace: {{ .Values.namespaces.builders.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-mountd" "component" "mountd") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-mountd" | nindent 6 }}
  updateStrategy:
    rollingUpdate:
      # A node whose mountd is restarting cannot Mount{} new builds,
      # and live builds lose the backing-open/promote broker until it
      # returns (their FUSE connections survive — the builder holds the
      # fd). Roll one node at a time so an upgrade never takes more
      # than one node's worth of builds down at once.
      maxUnavailable: 1
  # There is no readiness probe (nothing routes Service traffic here;
  # builders find the socket by host path), so this is the only thing
  # that stops a crash-looping image from rolling across the fleet: a
  # replacement pod must stay Running this long before the DS controller
  # moves on to the next node. Liveness restarts do NOT pause a rollout.
  minReadySeconds: 30
  template:
    metadata:
      labels:
        {{- include "rio.labels" (dict "root" . "name" "rio-mountd" "component" "mountd") | nindent 8 }}
    spec:
      # Must not be evicted to make room for builder pods: a node
      # without mountd fails every build scheduled onto it.
      priorityClassName: system-node-critical
      # Talks to nothing but the kernel and its UDS peers — keep the
      # default ServiceAccount's token out of a CAP_SYS_ADMIN pod.
      automountServiceAccountToken: false
      # Builder/fetcher nodes only (the nodeclaim_pool reconciler
      # stamps rio.build/node-role onto every NodeClaim it mints —
      # cover.rs NODE_ROLE_LABEL). nodeAffinity rather than nodeSelector
      # because the match is a set, not a single value.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: rio.build/node-role
                    operator: In
                    values: [builder, fetcher]
      # Builder nodes carry rio.build/builder=true:NoSchedule, fetcher
      # nodes rio.build/fetcher=true:NoSchedule, metal nodes
      # rio.build/kvm=true:NoSchedule. Node infrastructure must run on
      # all of them regardless of which taints a future hw-class adds —
      # blanket-tolerate, same as every CNI/node-agent DaemonSet.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 30
      securityContext:
        # Root: the daemon chowns per-build staging dirs to arbitrary
        # peer uids and publishes root-owned 0444 cache entries.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          # Allows the FUSE backing ioctls, umount2 (the startup orphan
          # scan for pre-cutover mounts), and quotactl when paired with
          # CAP_SYS_ADMIN (they sit in the profile's caps-gated group);
          # only pivot_root is missing from that group, and mountd
          # never calls it.
          type: RuntimeDefault
      containers:
        - name: mountd
          image: {{ include "rio.image" (list . $m.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # The rio-builder image's entrypoint is /bin/rio-builder;
          # rio-mountd ships in the same image (same crate).
          command: ["/bin/rio-mountd"]
          args:
            - --socket=/run/rio-mountd/mountd.sock
            - --staging-dir=/var/rio/staging
            - --cache-dir=/var/rio/cache
            - --chunks-dir=/var/rio/chunks
            - --staging-quota-bytes={{ $m.stagingQuotaBytes | int64 }}
            - --allowed-gid={{ $m.allowedGid | int }}
            - --metrics-addr=[::]:9095
          securityContext:
            # NOT privileged: the daemon needs exactly CAP_SYS_ADMIN
            # (FUSE_DEV_IOC_BACKING_OPEN/_CLOSE, quotactl, and the
            # orphan scan's umount2 of pre-cutover leftovers) on top of
            # the ambient root it already has for chown/0444
            # publication. privileged would also disable seccomp and
            # expose every host device. The mount-propagation question
            # P0560's preamble tracked here is resolved: the builder
            # mounts its own fd inside its own mount namespace, so no
            # propagation (and no privileged flip) is needed.
            privileged: false
            # no_new_privs. Does not affect the added capability: runc
            # sets the bounding set from the spec and execve re-grants
            # bounding→effective for a uid-0 process regardless of NNP
            # — NNP only blocks gaining privileges via setuid/file-caps
            # binaries, which this container has no business execing.
            allowPrivilegeEscalation: false
            # Every write target is a volume mount (/run/rio-mountd,
            # /var/rio/*). Same posture as every other component in the
            # chart.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [SYS_ADMIN]
          ports:
            - name: metrics
              containerPort: 9095
          env:
            {{- include "rio.rustLogEnv" . | nindent 12 }}
            {{- /* mountdSigningPub, never mountdSigningKey: this pod
                   runs on every builder/fetcher node and must hold
                   PUBLIC trust roots only (plus its own node name via
                   the downward API) — no Mount-admission minting
                   material ever lands on a node (ADR-022 §P0590;
                   helm/33 locks it). */}}
            {{- include "rio.mounts" (dict "root" . "form" "env" "want" (list "cov" "mountdHmac" "mountdSigningPub")) | nindent 12 }}
          volumeMounts:
            # The socket's PARENT DIRECTORY is mounted, not the socket
            # file: the daemon unlinks and re-binds the socket on
            # restart, and a single-file hostPath pins the dead inode
            # on both sides. A dedicated /run/rio-mountd/ directory
            # (not all of host /run) so a CAP_SYS_ADMIN pod is not
            # handed the host's containerd/systemd/dbus sockets it has
            # no business touching. Builder pods hostPath-mount the
            # same directory read-only (P0559) — connect(2) on a
            # socket inode under a read-only mount is allowed.
            - name: run-rio-mountd
              mountPath: /run/rio-mountd
            - name: var-rio-cache
              mountPath: /var/rio/cache
            - name: var-rio-chunks
              mountPath: /var/rio/chunks
            - name: var-rio-staging
              mountPath: /var/rio/staging
            {{- include "rio.mounts" (dict "root" . "form" "mount" "want" (list "cov" "mountdHmac" "mountdSigningPub")) | nindent 12 }}
          # The daemon serves on a UDS, not TCP — the only TCP listener
          # is the metrics exporter, which binds before the socket
          # accept loop starts. Good enough for liveness (a wedged
          # tokio runtime stops answering HTTP); there is no readiness
          # gate because nothing routes Service traffic to this pod.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      volumes:
        # DirectoryOrCreate: /run is a tmpfs, wiped every boot —
        # kubelet creates the dir (0755 root:root) before the
        # container starts; the daemon's bind_socket() also
        # create_dir_all()s it for non-k8s deployments.
        - name: run-rio-mountd
          hostPath:
            path: /run/rio-mountd
            type: DirectoryOrCreate
        # `type: Directory` (not DirectoryOrCreate): the three trees are
        # created by the AMI's tmpfiles rules ON the XFS-prjquota
        # /var/rio mount (nix/nixos-node/eks-node.nix). DirectoryOrCreate
        # would let kubelet silently create them on whatever is mounted
        # at /var/rio — including the unquota'd root fs if the XFS mount
        # failed — and the staging quota would be a no-op. A missing dir
        # is a loud ContainerCreating failure instead. There is no
        # /var/rio/castore volume: the daemon mounts nothing (the builder
        # mounts its own fd inside its own mount namespace), and the
        # startup orphan scan only looks at the path when it exists
        # (pre-cutover hosts).
        - name: var-rio-cache
          hostPath: {path: /var/rio/cache, type: Directory}
        - name: var-rio-chunks
          hostPath: {path: /var/rio/chunks, type: Directory}
        - name: var-rio-staging
          hostPath: {path: /var/rio/staging, type: Directory}
        {{- include "rio.mounts" (dict "root" . "form" "volume" "want" (list "cov" "mountdHmac" "mountdSigningPub")) | nindent 8 }}
{{- end }}
