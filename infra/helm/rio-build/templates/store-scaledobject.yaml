{{- if and .Values.store.enabled .Values.store.autoscaling.enabled }}
{{- $a := .Values.store.autoscaling -}}
# r[impl infra.store.autoscaling+4] (documentary — .yaml is not tracey-
# scanned; the scannable anchors are xtask deploy.rs and the helm-lint
# fragment 26-store-scaling.sh asserts this render; the fallback
# absence half is asserted by fragment 38-gateway-fallback.sh)
#
# KEDA ScaledObject for rio-store — the SINGLE owner of the store
# Deployment's replica count (the store ComponentScaler CR is gone;
# the CRD and reconciler stay for future targets). In the chart (not
# terraform) so `helm rollback` takes scaling config with the rest;
# gated on store.autoscaling.enabled because the keda.sh CRDs don't
# exist until helm_release.keda (infra/eks/keda.tf) applies — same
# pattern as gateway-scaledobject.yaml.
#
# The store carries three superimposed load classes with different
# leading indicators (decision 5):
#   1. substitution ingest (upstream → store → S3) — dominant after a
#      wipe / large nixpkgs bump / first-time tenant; leading
#      indicator: the scheduler's materialization backlog, known at
#      merge time, minutes before the store feels the load.
#   2. builder read-serving (S3 → store → builder) — the structural
#      steady-state load whenever builders run against a warm store;
#      leading indicator: busy builders.
#   3. builder upload ingest (PutPath → S3) — bursts as derivations
#      finish; same leading indicator.
# All three flow through the same pod NIC, NAR/chunk memory, and PG
# pool (which is why placement is one-replica-per-node, store.yaml).
# KEDA takes the max across the triggers: two leading prometheus
# signals plus CPU as the reactive corrective term for whatever the
# ratios miss.
#
# Why scale-down is safe to actuate FAST (D2 — the abort-aware
# collapse): contraction is gated on quiet CONSENSUS, not on a long
# ladder. The rendered spec is a 300s stabilization window (the N=10
# scrape debounce at the 30s prometheus interval) followed by
# Percent-100/60s (selectPolicy Max): once every trigger — backlog,
# busy builders, CPU, and the demand-side retry inhibitor below —
# agrees the wave is over for 5 minutes, the drain is one HPA pass.
# The guards are the TRIGGERS, not the ladder rate (the scaleDown
# block carries the full derivation; the pre-D2 ladder this replaced
# was 1800s + max(25%, 1 pod)/600s — retired, kept here only as
# history). bind[45-store-scaledown-inhibitor.sh]
# bind[26-store-scaling.sh]
# The gateway's scaledobject deliberately stays Pods-1 (max 8 vs
# 105). Scale-up has no stabilization — adding a pod is cheap and the
# failure mode of being late is the store at the floor through a
# whole substitution wave — but its per-period COMMITMENT is bounded
# (Pods 16/30s, see the scaleUp block).
#
# Kill switch: deleting the ScaledObject freezes replicas at the
# current count; `store.autoscaling.enabled=false` instead re-renders
# the static `store.replicas` on the next upgrade — set it
# deliberately if that path is ever used.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rio-store
  namespace: {{ .Values.namespaces.store.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 4 }}
spec:
  scaleTargetRef:
    # apps/v1 Deployment is KEDA's default target kind; name matches
    # store.yaml's metadata.name.
    name: rio-store
  # The floor carries the first ~1-4 min of a post-wipe wave at reduced
  # throughput until scale-out lands; raising it is a cost decision
  # (store pods request 16 CPU / 8 Gi on EKS). The ceiling is the
  # PG-connection SAFETY BACKSTOP (values.yaml carries the derivation
  # against Aurora's runtime-constant max_connections), never the
  # operative scale limit — Karpenter's rio-store pool limit binds
  # first (D1: the store fleet's own tainted NodePool;
  # bind[44-store-nodepool.sh]); a pod past node capacity just stays
  # Pending one node-mint.
  minReplicaCount: {{ $a.minReplicas }}
  maxReplicaCount: {{ $a.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # D2 (Q6 COMMISSIONED) + live_056-c (bughunt-9): the
          # abort-aware fast collapse WITH demand-side inhibitors.
          # LAW: after a terminal fleet-affecting cancel (all builds
          # terminal + backlog 0) desired reaches floor within T <=
          # 5min — AND the dual law: absence of completed work is NOT
          # evidence of absent demand (live_056-c: KEDA read a
          # reachability outage as idleness and shrank 8->4 mid-wedge;
          # a naive fast collapse would have AMPLIFIED the spiral).
          # The conjunction is structural, not a formula: HPA takes
          # the MAX over all triggers, so collapse requires backlog=0
          # AND builders=0 AND cpu-quiet AND demand-plane retry
          # pressure under threshold (the inhibitor trigger below) —
          # abort evidence and quiet telemetry must AGREE. Nonzero
          # retry pressure holds desired up, which structurally DEFERS
          # the floor clock (the SLO arms only on AGREE — a terminal
          # cancel during an outage does not violate T).
          # 300s window = the N-scrape debounce (N=10 at the 30s
          # prometheus interval), co-derived with WO-S5-4's
          # zero-progress reclaim: post-collapse SIGKILL claim
          # stranding self-heals at <= the stall window, retiring the
          # old 1800s blanket damping whose only job was preventing
          # exactly that stranding. Percent-100/60s: once the window's
          # quiet consensus holds, the drain is one HPA pass — the
          # guards are the TRIGGERS now, not the ladder rate.
          # nix/tests/helm/26-store-scaling.sh +
          # 45-store-scaledown-inhibitor.sh pin window, policy, and
          # the inhibitor trigger.
          stabilizationWindowSeconds: 300
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
        scaleUp:
          # D-052-2 (live_052 close), revised after sh-007c S5/S6. The
          # 60s window damps a leading-signal SPIKE that drains within
          # the window: with the actor's substitution drain rate
          # ~tripled, iter4's 7485-job burst is half-gone by 60s, so
          # averaging over the window asks for ~half the peak instead
          # of fleet-committing on the instantaneous gauge. The
          # original 0s rationale ("stabilization delay is the failure
          # mode") held when the burst lasted ~10min; at ~90s the
          # delay IS the damping. live_052's structural commitment
          # bound (the Pods policy below) stays: 16/30s still walks
          # 2→ceiling without one-pass over-commit on a mis-derived
          # ceiling. (Round-9 A-3 bounded per-period commitment;
          # ceiling clamp is xtask derive_store_ceiling.)
          # nix/tests/helm/26-store-scaling.sh pins window + policy.
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 16
              periodSeconds: 30
  triggers:
    # Substitution backlog (leading, class 1). AverageValue: KEDA
    # divides the fleet-wide backlog by the current replica count, so
    # desiredReplicas = ceil(sum(backlog) / targetBacklogJobsPerReplica).
    # The gauge counts derivations with CLAIMABLE materialization jobs
    # (unclaimed, not parked, not deferred — claimability()'s three
    # axes) — durable PG-backed state published by the scheduler leader
    # each tick (sum() collapses the leader-gated single series; a
    # deposed leader's series is zeroed, not stale).
    # Parked jobs leave the gauge (bug_252: a parked backlog must DRAIN
    # store replicas, not hold them — the park is pacing, and the store
    # cannot make a parked job progress); the parked population stays
    # visible via rio_scheduler_materialization_stalled. DEFERRED jobs
    # (defer_until — the bounded <=300s re-probe window) sit in NEITHER
    # gauge for that window: a defer-heavy cascade reads near-zero here
    # by design, and the trigger scales back up when the window lapses
    # and the jobs return to claimable.
    # Both prometheus triggers render through rio.promTrigger, which
    # unit-checks metric vs knob against files/metric-units.json and
    # fails the render on mismatch (bug_299).
    {{- include "rio.promTrigger" (list $ $a.prometheusAddress
          "sum(rio_scheduler_substituting_derivations)"
          "rio_scheduler_substituting_derivations"
          "targetBacklogJobsPerReplica"
          $a.targetBacklogJobsPerReplica) | nindent 4 }}
    # Builder demand (leading, classes 2-3). rio_scheduler_open_attempts
    # is the busy-fleet gauge (one open pull-mode attempt per in-flight
    # derivation, one attempt per pod). Static ratio seeded from the
    # ComponentScaler's seedRatio era; the CPU trigger below is the
    # corrective term the learned ratio used to provide, and the
    # threshold is re-derived from the warm-phase capture (P10).
    {{- include "rio.promTrigger" (list $ $a.prometheusAddress
          "sum(rio_scheduler_open_attempts)"
          "rio_scheduler_open_attempts"
          "targetBuildersPerReplica"
          $a.targetBuildersPerReplica) | nindent 4 }}
    # Live ingest sessions (live_062 — the store-side TRUTH the
    # scheduler-side leading signals cannot carry through the drain
    # window): builds complete and open_attempts closes while the
    # builders' log uploads are still draining their tails into
    # AppendLog sessions. In the live_062 fan-out KEDA read the
    # closing attempts as "wave over" and killed 5 store pods in
    # ~7min with live sessions on them — each kill burned the 45s
    # ingest-lease steal window on its builders (the write plane
    # self-healed; the cost was latency and the read-plane incident
    # the tail-token blackout escalated). The gauge is paired
    # inc/dec on session open/close (lib.rs seeds it at 0 from
    # boot), so 0 is a true reading and the trigger releases the
    # moment the last tail lands; under the max-over-triggers fold
    # it BINDS only in the drain window, and the existing 300s
    # scale-down stabilization then needs all of {backlog, builders,
    # sessions, retry-inhibitor, cpu} quiet before collapsing.
    # Threshold: targetIngestSessionsPerReplica (values.yaml —
    # derivation there).
    {{- include "rio.promTrigger" (list $ $a.prometheusAddress
          "sum(rio_store_log_active_ingest_sessions)"
          "rio_store_log_active_ingest_sessions"
          "targetIngestSessionsPerReplica"
          $a.targetIngestSessionsPerReplica) | nindent 4 }}
    # Demand-side scale-down INHIBITOR (live_056-c, the D2 dual law):
    # client-plane retry pressure against the store. EMIT-LAW BIND
    # (merged_bug_038): the trigger consumes
    # rio_gateway_putpath_retry_events_total — EVERY failure — quantifier: census(gw.putpath.emit-law — W11-BI pins 1 emit site + 4 streaming terminal arms, zero unsurfaced) —
    # observation at the gateway PutPath chokepoint, labeled by typed
    # status class (the rio_common CODE_CLASS_LABELS closed alphabet;
    # label values aborted / unavailable / deadline_exceeded /
    # resource_exhausted / ... — boot-seeded per class so no arm can
    # be silently non-emitting) — and this query SUMS ACROSS the
    # class label, so an unreachable store (unavailable: the
    # live_056-c outage class) moves the series the trigger consumes.
    # The pre-bind trigger consumed
    # rio_gateway_putpath_aborted_retries_total, which emits on
    # Code::Aborted ONLY — a code a LIVE store mints — so the trigger
    # was structurally flat during the exact reachability outages it
    # guards; that counter persists for the I-168 attempt-budget
    # dashboard, NOT for this inhibitor. The 300s/Percent-100
    # collapse spec stands CONDITIONED on this bound inhibitor.
    # bind[45-store-scaledown-inhibitor.sh] (the per-class legs; the
    # series-moves half lives crate-side beside the emit law).
    # The series is DEMAND-PLANE and probe/scrape-immune BY THE LAW:
    # kubelet grpc readiness probes (store.yaml, real health RPCs
    # every 5s) and tcpSocket liveness handshakes never enter it, so
    # the release edge ("attempts cease") is reachable in production
    # (a store-side SYN/accept or whole-interceptor count would be
    # PERMANENTLY nonzero under probing and veto the Q6 fast collapse
    # forever). Client-plane also has no datapath-blackhole gap: a
    # drop before the store pod's stack lands in the unavailable /
    # deadline_exceeded arms, counted since the class-labeled emit
    # law — the live_056 shape. zero-work AND nonzero-retries => NOT
    # idle => this trigger's ceil(rate/threshold) holds desired up.
    # non-normative[direct-upload]: builders upload straight to the
    # store (runtime/setup.rs) with terminal-outcome-only metrics —
    # incident-scale BUILDER retry cardinality is not observable in
    # this gateway-plane series and is no part of the inhibitor's
    # law; holding desired up under real pressure follows from
    # ceil(rate/threshold) alone.
    # Threshold: the named violable targetRetryAttemptsPerReplica
    # (values.yaml — derivation there).
    {{- include "rio.promTrigger" (list $ $a.prometheusAddress
          "sum(rate(rio_gateway_putpath_retry_events_total[2m]))"
          "rio_gateway_putpath_retry_events_total"
          "targetRetryAttemptsPerReplica"
          $a.targetRetryAttemptsPerReplica) | nindent 4 }}
    # Saturation (reactive, all classes): decompression, hashing,
    # chunking, and serve-path proto/TLS make CPU track all three load
    # classes well enough to act as the corrective term. If the
    # warm-phase capture shows network saturating before CPU, add a
    # prometheus trigger on per-pod network throughput (follow-up).
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ $a.cpuUtilization | quote }}
{{- end }}
