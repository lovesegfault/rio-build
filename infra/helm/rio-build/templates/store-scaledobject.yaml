{{- if and .Values.store.enabled .Values.store.autoscaling.enabled }}
{{- $a := .Values.store.autoscaling -}}
# r[impl infra.store.autoscaling+3] (documentary — .yaml is not tracey-
# scanned; the scannable anchors are xtask deploy.rs and the helm-lint
# fragment 26-store-scaling.sh asserts this render)
#
# KEDA ScaledObject for rio-store — the SINGLE owner of the store
# Deployment's replica count (the store ComponentScaler CR is gone;
# the CRD and reconciler stay for future targets). In the chart (not
# terraform) so `helm rollback` takes scaling config with the rest;
# gated on store.autoscaling.enabled because the keda.sh CRDs don't
# exist until helm_release.keda (infra/eks/keda.tf) applies — same
# pattern as gateway-scaledobject.yaml.
#
# The store carries three superimposed load classes with different
# leading indicators (decision 5):
#   1. substitution ingest (upstream → store → S3) — dominant after a
#      wipe / large nixpkgs bump / first-time tenant; leading
#      indicator: the scheduler's materialization backlog, known at
#      merge time, minutes before the store feels the load.
#   2. builder read-serving (S3 → store → builder) — the structural
#      steady-state load whenever builders run against a warm store;
#      leading indicator: busy builders.
#   3. builder upload ingest (PutPath → S3) — bursts as derivations
#      finish; same leading indicator.
# All three flow through the same pod NIC, NAR/chunk memory, and PG
# pool (which is why placement is one-replica-per-node, store.yaml).
# KEDA takes the max across the triggers: two leading prometheus
# signals plus CPU as the reactive corrective term for whatever the
# ratios miss.
#
# Why scale-down is heavily damped: replica count contracting
# mid-wave re-funnels ingest through fewer NICs exactly when the
# backlog gauge is sawtoothing; the 1800s stabilization window means
# a wave has to be over for 30 minutes before the first pod is
# released. Once draining engages it is geometric, not linear:
# max(25%, 1 pod) per 600s (selectPolicy Max), so an uncapped fleet
# drains 105→2 in ~12-16 periods (~2-2.7h; k8s removes ceil(25%) of
# the remaining count per period — the slower bound assumes floor
# removal) instead of 103 single-pod ticks (~17h of paid 32-vCPU
# nodes); at small scale Pods-1 still floors the rate (14→2 in ~5-8
# periods, at or below the old Pods-1-only pace). The gateway's
# scaledobject deliberately stays Pods-1 (max 8 vs 105). Scale-up has
# no stabilization — adding a pod is cheap and the failure mode of
# being late is the store at the floor through a whole substitution
# wave.
#
# Kill switch: deleting the ScaledObject freezes replicas at the
# current count; `store.autoscaling.enabled=false` instead re-renders
# the static `store.replicas` on the next upgrade — set it
# deliberately if that path is ever used.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rio-store
  namespace: {{ .Values.namespaces.store.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 4 }}
spec:
  scaleTargetRef:
    # apps/v1 Deployment is KEDA's default target kind; name matches
    # store.yaml's metadata.name.
    name: rio-store
  # The floor carries the first ~1-4 min of a post-wipe wave at reduced
  # throughput until scale-out lands; raising it is a cost decision
  # (store pods request 16 CPU / 8 Gi on EKS). The ceiling is the
  # PG-connection SAFETY BACKSTOP (values.yaml carries the derivation
  # against Aurora's runtime-constant max_connections), never the
  # operative scale limit — Karpenter's rio-general pool limit binds
  # first; a pod past node capacity just stays Pending one node-mint.
  minReplicaCount: {{ $a.minReplicas }}
  maxReplicaCount: {{ $a.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 1800
          # Max of the two ⇒ geometric drain at scale, single-pod floor
          # near the bottom (see the damping comment above).
          selectPolicy: Max
          policies:
            - type: Percent
              value: 25
              periodSeconds: 600
            - type: Pods
              value: 1
              periodSeconds: 600
        scaleUp:
          stabilizationWindowSeconds: 0
  triggers:
    # Substitution backlog (leading, class 1). AverageValue: KEDA
    # divides the fleet-wide backlog by the current replica count, so
    # desiredReplicas = ceil(sum(backlog) / targetBacklogJobsPerReplica).
    # The gauge counts derivations with unresolved unclaimed
    # materialization jobs — durable PG-backed state published by the
    # scheduler leader each tick (sum() collapses the leader-gated
    # single series; a deposed leader's series is zeroed, not stale).
    # Both prometheus triggers render through rio.promTrigger, which
    # unit-checks metric vs knob against files/metric-units.json and
    # fails the render on mismatch (bug_299).
    {{- include "rio.promTrigger" (list $ $a.prometheusAddress
          "sum(rio_scheduler_substituting_derivations)"
          "rio_scheduler_substituting_derivations"
          "targetBacklogJobsPerReplica"
          $a.targetBacklogJobsPerReplica) | nindent 4 }}
    # Builder demand (leading, classes 2-3). rio_scheduler_open_attempts
    # is the busy-fleet gauge (one open pull-mode attempt per in-flight
    # derivation, one attempt per pod). Static ratio seeded from the
    # ComponentScaler's seedRatio era; the CPU trigger below is the
    # corrective term the learned ratio used to provide, and the
    # threshold is re-derived from the warm-phase capture (P10).
    {{- include "rio.promTrigger" (list $ $a.prometheusAddress
          "sum(rio_scheduler_open_attempts)"
          "rio_scheduler_open_attempts"
          "targetBuildersPerReplica"
          $a.targetBuildersPerReplica) | nindent 4 }}
    # Saturation (reactive, all classes): decompression, hashing,
    # chunking, and serve-path proto/TLS make CPU track all three load
    # classes well enough to act as the corrective term. If the
    # warm-phase capture shows network saturating before CPU, add a
    # prometheus trigger on per-pod network throughput (follow-up).
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ $a.cpuUtilization | quote }}
{{- end }}
