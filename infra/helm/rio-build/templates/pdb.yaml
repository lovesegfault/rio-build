{{- if .Values.podDisruptionBudget.enabled }}
# No PDB for the controller: replicas=1, and a PDB on a single replica
# doesn't help — minAvailable=1 blocks drain forever, minAvailable=0 is
# a no-op; the controller tolerates a 30s restart gap. (The store HAS a
# PDB below, floor-gated: its KEDA floor is 2.) Store outage →
# PutPath/GetPath fail, scheduler's circuit-breaker handles gracefully,
# workers retry.
#
# Workers don't get a PDB here either — the Pool reconciler creates
# per-pool PDBs (maxUnavailable=1) with ownerRef → GC on delete.
# See build_pdb in reconcilers/pool/.

{{- if and .Values.scheduler.enabled (gt (int .Values.scheduler.replicas) 1) }}
---
# maxUnavailable=1: with replicas=2, one stays up during drain. Leader
# election handles failover (graceful step_down hands over within one 5s
# poll; ungraceful worst case ~20-25s: 19s steal threshold + 5s poll).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rio-scheduler
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-scheduler" "component" "scheduler") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-scheduler" | nindent 6 }}
{{- end }}

{{- $g := .Values.gateway }}
{{- /* Gate on the effective floor — minReplicas under autoscaling, the
       static replicas otherwise. Deliberately NOT the ceiling that
       gateway.yaml's anti-affinity gate keys on: a minAvailable-1 PDB
       against a 1-pod floor would block every node drain, while
       anti-affinity costs nothing at 1 pod and must hold whenever KEDA
       may scale past it. Keying on the static `replicas` would skip
       the PDB for replicas=1 + autoscaling-on (≥2 KEDA-managed pods
       left unprotected) and render a drain-blocking PDB for replicas=2
       + minReplicas=1 (minAvailable=1 against a single pod). */}}
{{- if and $g.enabled (include "rio.alwaysRunsMultiple" $g) }}
---
# minAvailable (not maxUnavailable): SSH ingress must stay up. Killing both
# gateways = no way to submit builds (SSH is the only submission path).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rio-gateway
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-gateway" "component" "gateway") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-gateway" | nindent 6 }}
{{- end }}

{{- $s := .Values.store }}
{{- /* UNCONDITIONAL on the scale axes (merged_bug_378): a PERCENTAGE
       maxUnavailable rounds UP in the disruption controller, so at
       N=1 it allows 1 (drains never blocked — a no-op, not a
       blocker); the floor gate this used to carry protected against
       a hazard percentage budgets do not have, while leaving a
       floor-1 ceiling-many config's KEDA-scaled pods unprotected.
       The gateway PDB above legitimately keeps its floor gate: its
       minAvailable:1 form DOES block every drain at one pod. */}}
{{- if $s.enabled }}
---
# maxUnavailable: 10% — the percentage rounds UP in the disruption
# controller, so 1 is allowed at the floor of 2 (drains never blocked)
# and ~4-5 at the ~40-46 Karpenter-bound scale: `xtask k8s
# rotate-general` (manual; rio-general carries a Drifted budget of 0)
# parallelizes instead of serializing ~40 node drains, while mid-wave
# voluntary capacity loss stays bounded at ~10% — the same harm the
# scale-down damping guards against. Rejected: minAvailable: 1 (the
# gateway's choice, right for a 2-8-replica hard-ingress, but at
# scale-N it permits N−1 concurrent disruptions); integer
# maxUnavailable: 1 (serializes large-N rotations). Namespace: the
# store Deployment lives in namespaces.store.name, not system.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rio-store
  namespace: {{ .Values.namespaces.store.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 4 }}
spec:
  maxUnavailable: 10%
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-store" | nindent 6 }}
{{- end }}

{{- if .Values.buildScheduler.enabled }}
---
# r37 bug_020. maxUnavailable=1: one stays up during drain. Lease TTL is
# 15s (kube-scheduler default leaseDuration); failover ~15s blip. The
# default kube-scheduler ignores `schedulerName: kube-build-scheduler`
# pods, so a window where BOTH are gone leaves every builder pod stuck
# Pending with no fallback path.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kube-build-scheduler
  namespace: {{ .Values.namespaces.system.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "kube-build-scheduler" "component" "scheduler") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "kube-build-scheduler" | nindent 6 }}
{{- end }}
{{- end }}
