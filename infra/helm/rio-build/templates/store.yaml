{{- if .Values.store.enabled }}
{{- $s := .Values.store -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rio-store
  namespace: {{ .Values.namespaces.store.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 4 }}
spec:
  {{- if not $s.autoscaling.enabled }}
  # Static replica count — autoscaling disabled (environments without
  # the KEDA operator: k3s VM tests, local dev). Stateless at runtime
  # (PG + S3 hold everything); sqlx::migrate! takes a PG advisory
  # lock, so concurrent replica startup is safe. With autoscaling
  # enabled the KEDA-managed HPA owns the count and helm echoes the
  # live value instead (the lookup branch below).
  replicas: {{ $s.replicas | default 1 }}
  {{- else }}
  {{- /* The KEDA-managed HPA owns the replica count: rendering the
         static value here would reset it on every `helm upgrade` and
         fight the autoscaler. But on an EXISTING release whose
         previous manifest carried `replicas: N` (the pre-KEDA static
         render, or the ComponentScaler era's first-apply default),
         simply omitting the field is not neutral either: helm's
         three-way merge turns present→absent into a patch to null,
         the API server re-defaults the field to 1, and the Deployment
         controller kills store pods on the spot — mid-wave that
         re-funnels every in-flight NAR ingest through one replica.

         So when a live Deployment exists, echo ITS current replica
         count: the field stays present at exactly the value KEDA last
         set, the upgrade is a no-op for scale, and helm never fights
         the HPA. `lookup` returns an empty map under `helm template` /
         `--dry-run` and on a fresh install (no live Deployment yet) —
         the field is then omitted, K8s defaults it to 1 on first
         apply, and KEDA's first reconcile raises it to
         minReplicaCount. Same shape as gateway.yaml. */}}
  {{- with lookup "apps/v1" "Deployment" .Values.namespaces.store.name "rio-store" }}
  replicas: {{ .spec.replicas }}
  {{- end }}
  {{- end }}
  # I-064-style trade-off analysis for the store (the four prerequisites
  # the old soft-spread exemption deferred):
  #   1. NO STICKY SESSIONS — clients resolve the headless Service to
  #      pod IPs and pick per request (p2c, I-077); the one stateful
  #      surface (live log tails) degrades gracefully: a killed
  #      replica's ingest buffer is lost but readers fall back to the
  #      history view via the TailLog proxy (RIO_STORE_REPLICA_ID note
  #      below).
  #   2. S3+PG-BACKED — no replica-local durable state; store outage →
  #      PutPath/GetPath fail, the scheduler's circuit-breaker handles
  #      it, workers retry (pdb.yaml header).
  #   3. SURGE-FIRST DOES NOT APPLY — unlike the gateway there is no
  #      NLB deregistration race pinning long-lived sessions to a dying
  #      target (gateway.yaml's reason for maxUnavailable: 0). Losing 1
  #      of N during rollout is the same budget the PDB grants, and the
  #      freed node is immediately reusable by the replacement — no
  #      forced node-mint per rollout step. INTEGER 1 (not a percent):
  #      test 21's merged_021 loop does numeric comparison, and the
  #      apps/v1 default 25% rounds DOWN to 0 for N<4 (rollout deadlock
  #      with required anti-affinity on a fixed-size cluster).
  #   4. REQUIRED-SPREAD-BLOCKS-SCALE-OUT — dissolved by Karpenter: a
  #      Pending store pod on the dedicated tainted rio-store NodePool
  #      (D1 — od-only, WhenEmptyOrUnderutilized reclaim) mints a node
  #      in ~30-60s, up to that pool's limits.cpu — which IS the
  #      intended operative scale bound (the KEDA ceiling is only the
  #      PG backstop). bind[44-store-nodepool.sh]
  {{- /* FLOOR-gated (rio.alwaysRunsMultiple — merged_bug_378's axis
         swap): the explicit maxUnavailable: 1 exists to satisfy the
         merged_021 rollout-deadlock rule, but it is only SAFE when a
         second pod is guaranteed. Its own safety note already said
         so — at one LIVE replica, maxUnavailable=1 makes the
         Deployment count as Available at ZERO ready pods, turning
         every `kubectl wait --for=condition=Available` into a vacuous
         pass while the store is still starting — yet the old gate
         keyed on the CEILING, so any floor-1 ceiling-many config
         (minReplicas=1, or KEDA scaled to 1) shipped exactly that
         state. The apps/v1 default (25% rounds down to 0) is right
         for a 1-pod floor; the explicit strategy is right from a
         guaranteed 2. */}}
  {{- if include "rio.alwaysRunsMultiple" $s }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-store" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 8 }}
    spec:
      serviceAccountName: rio-store
      {{- /* One replica per node (decision 5), REQUIRED. All three
             store load classes — substitution ingest, builder
             read-serving, builder upload ingest — share the pod's NIC,
             NAR buffer memory, and PG pool, so a replica only adds
             capacity when it lands on its own node: N replicas must
             mean N NICs, or scale-out merely re-partitions one node's
             bandwidth (the old SOFT spread was capacity-dishonest on
             exactly that premise). Scale-out is never blocked, only
             delayed one Karpenter node-mint (~30-60s on the dedicated
             tainted rio-store NodePool, D1) up to that pool's
             limits.cpu — the operative scale bound
             (bind[44-store-nodepool.sh]). Gate on the CEILING, like
             gateway.yaml: KEDA owns the live count anywhere in
             [minReplicas, maxReplicas], so the rule must hold whenever
             the autoscaler MAY run more than one pod (and a required
             rule constrains nothing while only one pod exists). k3s/dev
             single-node safety: the no-KEDA overlays set
             store.autoscaling.enabled=false with replicas 1, rendering
             no anti-affinity; an operator forcing replicas>1 with
             autoscaling off accepts Pending-on-small-cluster — the same
             documented trade as the gateway. IgnoredDuringExecution:
             already-stacked live pods are not evicted; placement
             converges on the next rollout/scale event.
             (rio.mayRunMultiple = the same ceiling ternary, named —
             behavior-identical re-key, merged_bug_378.) */}}
      {{- if include "rio.mayRunMultiple" $s }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "rio.selectorLabels" "rio-store" | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if .Values.karpenter.enabled }}
      # D1: the store fleet targets its OWN NodePool (rio-store —
      # WhenEmptyOrUnderutilized reclaim; values.yaml karpenter block)
      # instead of squatting rio-general's Drifted-0/WhenEmpty nodes.
      # Gated on karpenter.enabled: the k3s VM tests and local dev run
      # no Karpenter and must stay schedulable on plain nodes.
      nodeSelector:
        rio.build/node-role: store
      tolerations:
        - {key: rio.build/store, value: "true", effect: NoSchedule}
      {{- end }}
      # ≥ RIO_DRAIN_GRACE_SECS(6) + streamDrainSecs + slack. kubelet
      # SIGKILLs at this deadline; the store's own stream_drain timeout
      # fires first and exits cleanly, so SIGKILL is a backstop for a
      # hung process. Same shape as gateway.yaml's three-stage budget.
      terminationGracePeriodSeconds: {{ add 6 ($s.streamDrainSecs | default 90) 24 }}
      {{- include "rio.podSecurityContext" . | nindent 6 }}
      containers:
        - name: store
          image: {{ include "rio.image" (list . $s.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "rio.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: grpc
              containerPort: 9002
            - name: metrics
              containerPort: 9092
          env:
            {{- include "rio.rustLogEnv" . | nindent 12 }}
            {{- include "rio.mounts" (dict "root" . "form" "env" "want" (list "cov" "jwtVerify" "serviceHmac" "assignHmac" "narSign")) | nindent 12 }}
            - name: RIO_LISTEN_ADDR
              value: "[::]:9002"
            # Cross-replica TailLog proxy identity. The replica
            # registers this value in log_ingest_sessions.replica_pod;
            # a reader replica substitutes it into
            # RIO_LOG_PEER_URL_TEMPLATE's {pod} to dial the replica
            # holding an execution's live ingest buffer. status.podIP,
            # NOT the pod name: a Deployment's pods get no per-pod DNS
            # A records (no hostname/subdomain in the pod spec), so
            # `<pod>.rio-store-headless` does not resolve — the IP is
            # the only thing another replica can actually dial. The
            # template stays UNBRACKETED: the store binary brackets a
            # v6 identity itself at dial time (RFC 2732), so a
            # pre-bracketed template would double-bracket and never
            # connect. Without this pairing the proxy never connects
            # and every cross-replica live tail silently serves the
            # history-only view (observable only via
            # rio_store_log_tail_proxy_failures_total).
            - name: RIO_STORE_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RIO_LOG_PEER_URL_TEMPLATE
              # No `| default` shadow: values.yaml owns the single
              # default; nulling the key renders an empty env, which
              # the binary treats as proxy-disabled (fail-closed).
              value: {{ $s.logPeerUrlTemplate | quote }}
            # Dashboard gRPC-Web TailLog CORS (merged_bug_161): the
            # SAME origin list the scheduler renders — the contract is
            # single-sourced in rio_common::cors; the env was simply
            # never wired here, so browser TailLog worked only with an
            # empty-origin (deny-all) layer.
            - name: RIO_LOG_CORS_ALLOW_ORIGINS
              value: {{ .Values.dashboard.cors.allowOrigins | join "," | quote }}
            # Coupled to the S3 logs/ lifecycle via the tf variable
            # (bug_326) — see values.yaml logRetentionDays.
            - name: RIO_LOG_RETENTION_DAYS
              # No `| default` shadow (the convention 14 lines up):
              # values.yaml owns the single default.
              value: {{ $s.logRetentionDays | quote }}
            # P0542: s3.dualstack.{region}.amazonaws.com has AAAA;
            # the default endpoint is v4-only. Without this, v6-only
            # pods reach S3 via DNS64+NAT64 (works, but adds a hop).
            - name: AWS_USE_DUALSTACK_ENDPOINT
              value: "true"
            - name: RIO_DRAIN_GRACE_SECS
              value: "6"  # readinessProbe.periodSeconds (5) + 1
            - name: RIO_STREAM_DRAIN_SECS
              value: {{ $s.streamDrainSecs | default 90 | quote }}
            - name: RIO_CHUNK_PREFETCH_K
              value: {{ $s.chunkPrefetchK | default 64 | quote }}
            - name: RIO_CHUNK_UPLOAD_MAX_CONCURRENT
              value: {{ $s.chunkUploadMaxConcurrent | quote }}
            - name: RIO_S3_MAX_ATTEMPTS
              value: {{ $s.s3MaxAttempts | quote }}
            - name: RIO_MAX_BATCH_PATHS
              value: {{ $s.maxBatchPaths | int | quote }}
            - name: RIO_PG_MAX_CONNECTIONS
              value: {{ $s.pgMaxConnections | quote }}
            {{- if not (kindIs "invalid" $s.substituteAdmissionPermits) }}
            - name: RIO_SUBSTITUTE_ADMISSION_PERMITS
              value: {{ $s.substituteAdmissionPermits | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" $s.substituteStallSecs) }}
            - name: RIO_SUBSTITUTE_STALL_SECS
              value: {{ $s.substituteStallSecs | quote }}
            {{- end }}
            # D4 budget/limit law: the budget is a first-class chart
            # value (paired with limits.memory in values.yaml) and the
            # deployed limit is injected via the downward API, so the
            # binary's validate() refuses budget + reserve > limit at
            # boot — an OOM-kill turned into a typed config error.
            # nix/tests/helm/46-store-memory-identity.sh pins the
            # rendered pair.
            - name: RIO_NAR_BUFFER_BUDGET_BYTES
              value: {{ $s.narBufferBudgetBytes | int64 | quote }}
            - name: RIO_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: store
                  resource: limits.memory
                  divisor: "1"
            # Materialization executor (PD-D2: spawns iff schedulerAddr
            # is configured — the env below is the spawn condition).
            - name: RIO_MATERIALIZATION__EXECUTOR_CONCURRENCY
              value: {{ $s.materialization.executorConcurrency | quote }}
            - name: RIO_MATERIALIZATION__PATH_FANOUT
              value: {{ $s.materialization.pathFanout | quote }}
            - name: RIO_MATERIALIZATION__SCHEDULER_ADDR
              value: {{ $s.materialization.schedulerAddr | quote }}
            - name: RIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: url
            {{- with $s.chunkBackend }}
            {{- if .kind }}
            - name: RIO_CHUNK_BACKEND__KIND
              value: {{ .kind | quote }}
            {{- end }}
            {{- if .bucket }}
            - name: RIO_CHUNK_BACKEND__BUCKET
              value: {{ .bucket | quote }}
            {{- end }}
            {{- if hasKey . "prefix" }}
            - name: RIO_CHUNK_BACKEND__PREFIX
              value: {{ .prefix | quote }}
            {{- end }}
            {{- if .endpoint }}
            - name: AWS_ENDPOINT_URL
              value: {{ .endpoint | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "rio.mounts" (dict "root" . "form" "mount" "want" (list "cov" "jwtVerify" "serviceHmac" "assignHmac" "narSign")) | nindent 12 }}
          # tonic-health set_serving() runs AFTER migrations in main.rs —
          # "PG connected + migrations done" = Ready.
          readinessProbe:
            grpc:
              port: 9002
              service: rio.store.StoreService
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: 9002}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      volumes:
        {{- include "rio.mounts" (dict "root" . "form" "volume" "want" (list "cov" "jwtVerify" "serviceHmac" "assignHmac" "narSign")) | nindent 8 }}
# ClusterIP + headless pair (see rio.grpcServicePair). Builders/fetchers
# resolve the headless name to pod IPs and p2c across them — a sticky
# single-channel against the ClusterIP means scaling rio-store doesn't
# help (I-077: 60 builders all hit pod-0).
{{ include "rio.grpcServicePair" (dict "root" . "name" "rio-store" "ns" .Values.namespaces.store.name "component" "store" "port" 9002) }}
{{- end }}
