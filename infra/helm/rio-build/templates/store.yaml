{{- if .Values.store.enabled }}
{{- $s := .Values.store -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rio-store
  namespace: {{ .Values.namespaces.store.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 4 }}
spec:
  {{- if not .Values.componentScaler.store.enabled }}
  # Stateless at runtime (PG + S3 hold everything). sqlx::migrate! takes
  # a PG advisory lock, so concurrent replica startup is safe.
  #
  # OMITTED when componentScaler.store.enabled=true: the ComponentScaler
  # reconciler patches deployments/scale; if helm also rendered
  # .spec.replicas here, every `helm upgrade` would reset it and fight
  # the controller. K8s defaults an absent .spec.replicas to 1 on first
  # apply; the reconciler's first 10s tick corrects to spec.replicas.min.
  replicas: {{ $s.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rio.selectorLabels" "rio-store" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 8 }}
    spec:
      serviceAccountName: rio-store
      {{- if .Values.karpenter.enabled }}
      nodeSelector:
        rio.build/node-role: general
      {{- else if $s.nodeSelector }}
      # Explicit pin (VM tests: the filesystem chunk backend's PVC is
      # provisioned by local-path, so the pod must always land on the
      # node holding the bound PV or a rollout orphans every
      # previously-written chunk).
      nodeSelector:
        {{- toYaml $s.nodeSelector | nindent 8 }}
      {{- end }}
      # ≥ RIO_DRAIN_GRACE_SECS(6) + streamDrainSecs + slack. kubelet
      # SIGKILLs at this deadline; the store's own stream_drain timeout
      # fires first and exits cleanly, so SIGKILL is a backstop for a
      # hung process. Same shape as gateway.yaml's three-stage budget.
      terminationGracePeriodSeconds: {{ add 6 ($s.streamDrainSecs | default 90) 24 }}
      {{- include "rio.podSecurityContext" . | nindent 6 }}
      containers:
        - name: store
          image: {{ include "rio.image" (list . $s.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "rio.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: grpc
              containerPort: 9002
            - name: metrics
              containerPort: 9092
          env:
            {{- include "rio.rustLogEnv" . | nindent 12 }}
            {{- include "rio.mounts" (dict "root" . "form" "env" "want" (list "cov" "jwtVerify" "serviceHmac" "assignmentHmac")) | nindent 12 }}
            - name: RIO_LISTEN_ADDR
              value: "[::]:9002"
            # P0542: s3.dualstack.{region}.amazonaws.com has AAAA;
            # the default endpoint is v4-only. Without this, v6-only
            # pods reach S3 via DNS64+NAT64 (works, but adds a hop).
            - name: AWS_USE_DUALSTACK_ENDPOINT
              value: "true"
            - name: RIO_DRAIN_GRACE_SECS
              value: "6"  # readinessProbe.periodSeconds (5) + 1
            - name: RIO_STREAM_DRAIN_SECS
              value: {{ $s.streamDrainSecs | default 90 | quote }}
            - name: RIO_CHUNK_PREFETCH_K
              value: {{ $s.chunkPrefetchK | default 64 | quote }}
            - name: RIO_CHUNK_UPLOAD_MAX_CONCURRENT
              value: {{ $s.chunkUploadMaxConcurrent | quote }}
            - name: RIO_S3_MAX_ATTEMPTS
              value: {{ $s.s3MaxAttempts | quote }}
            - name: RIO_MAX_BATCH_PATHS
              value: {{ $s.maxBatchPaths | int | quote }}
            - name: RIO_PG_MAX_CONNECTIONS
              value: {{ $s.pgMaxConnections | quote }}
            {{- if not (kindIs "invalid" $s.substituteAdmissionPermits) }}
            - name: RIO_SUBSTITUTE_ADMISSION_PERMITS
              value: {{ $s.substituteAdmissionPermits | quote }}
            {{- end }}
            - name: RIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: url
            {{- with $s.chunkBackend }}
            {{- if .kind }}
            - name: RIO_CHUNK_BACKEND__KIND
              value: {{ .kind | quote }}
            {{- end }}
            {{- if .baseDir }}
            - name: RIO_CHUNK_BACKEND__BASE_DIR
              value: {{ .baseDir | quote }}
            {{- end }}
            {{- if .bucket }}
            - name: RIO_CHUNK_BACKEND__BUCKET
              value: {{ .bucket | quote }}
            {{- end }}
            {{- if hasKey . "prefix" }}
            - name: RIO_CHUNK_BACKEND__PREFIX
              value: {{ .prefix | quote }}
            {{- end }}
            {{- if .endpoint }}
            - name: AWS_ENDPOINT_URL
              value: {{ .endpoint | quote }}
            {{- end }}
            {{- if and (eq .kind "tiered") .expressBucket }}
            # Local cache tier (S3 Express One Zone directory bucket).
            # Gated on kind so a stale expressBucket can't leak an
            # unknown field into the s3/filesystem config variants.
            # Omitted (not set to "") when empty: Some("") would build
            # an S3 client against a bucket named "" — absent is what
            # deserializes to express_bucket=None / local=None.
            - name: RIO_CHUNK_BACKEND__EXPRESS_BUCKET
              value: {{ .expressBucket | quote }}
            {{- end }}
            {{- if eq .kind "tiered" }}
            # Per-pod Express bucket selection (P0554): the store reads
            # its own zone from this var and picks the matching bucket
            # from EXPRESS_BUCKET_BY_ZONE below at startup. The value is
            # the POD's topology.kubernetes.io/zone label, which the
            # PodTopologyLabelsAdmission plugin (KEP-4742, beta in
            # Kubernetes 1.35) copies from the node at binding — no
            # IMDS, no nodes/get RBAC, no SA token. If the plugin is
            # not enabled the label is absent, this resolves to "", and
            # the store logs the missing piece and runs with local=None
            # (direct S3-standard reads — degraded, never down).
            - name: RIO_NODE_ZONE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/zone']
            {{- end }}
            {{- if and (eq .kind "tiered") .expressBucketByZone }}
            # Zone→bucket map for per-pod selection, one JSON value for
            # the whole Deployment (the per-pod input is RIO_NODE_ZONE
            # above; helm cannot resolve per-pod placement, the store
            # does). Values flow from `tofu output -json
            # express_bucket_by_zone` via xtask --set-json. Rendered as
            # a single env var rather than a mounted TOML fragment: the
            # store has no config file mount today, and one JSON value
            # keeps the whole chunk-backend config in env form (a file
            # layer could not be partially overridden by env — env can
            # override a key but never unset one). Omitted when empty.
            - name: RIO_CHUNK_BACKEND__EXPRESS_BUCKET_BY_ZONE
              value: {{ .expressBucketByZone | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.binaryCacheCompat }}
            # Stock-Nix binary-cache compat (ADR-022 §10). ENABLED is
            # rendered whenever the key is set — hasKey, not truthiness,
            # so an explicit `false` reaches the pod (rio-store's
            # compiled default is ON; a `with`-style falsy skip would
            # silently re-enable it). bucket/compression are omitted
            # when disabled or empty: an empty BUCKET would name a
            # bucket "", and absent is what means "use
            # chunkBackend.bucket".
            {{- if hasKey . "enabled" }}
            - name: RIO_BINARY_CACHE_COMPAT__ENABLED
              value: {{ .enabled | quote }}
            {{- end }}
            {{- if and .enabled .bucket }}
            - name: RIO_BINARY_CACHE_COMPAT__BUCKET
              value: {{ .bucket | quote }}
            {{- end }}
            {{- if and .enabled .compression }}
            - name: RIO_BINARY_CACHE_COMPAT__COMPRESSION
              value: {{ .compression | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "rio.mounts" (dict "root" . "form" "mount" "want" (list "cov" "jwtVerify" "serviceHmac" "assignmentHmac")) | nindent 12 }}
            {{- if eq ($s.chunkBackend).kind "filesystem" }}
            # readOnlyRootFilesystem: the filesystem chunk backend needs
            # a writable mount at baseDir. PVC (not hostPath — forbidden
            # by the namespace's `restricted` PodSecurity level; not
            # emptyDir — a Deployment rollout would orphan every
            # already-written chunk) so a container restart and a
            # rollout both keep the chunk store. The provisioned PV's
            # nodeAffinity pins replacement pods to the node that first
            # bound it.
            - name: chunks
              mountPath: {{ $s.chunkBackend.baseDir | quote }}
            {{- end }}
          # tonic-health set_serving() runs AFTER migrations in main.rs —
          # "PG connected + migrations done" = Ready.
          readinessProbe:
            grpc:
              port: 9002
              service: rio.store.StoreService
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: 9002}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      volumes:
        {{- include "rio.mounts" (dict "root" . "form" "volume" "want" (list "cov" "jwtVerify" "serviceHmac" "assignmentHmac")) | nindent 8 }}
        {{- if eq ($s.chunkBackend).kind "filesystem" }}
        - name: chunks
          persistentVolumeClaim:
            claimName: rio-store-chunks
        {{- end }}
# ClusterIP + headless pair (see rio.grpcServicePair). Builders/fetchers
# resolve the headless name to pod IPs and p2c across them — a sticky
# single-channel against the ClusterIP means scaling rio-store doesn't
# help (I-077: 60 builders all hit pod-0).
{{ include "rio.grpcServicePair" (dict "root" . "name" "rio-store" "ns" .Values.namespaces.store.name "component" "store" "port" 9002) }}
{{- if eq ($s.chunkBackend).kind "filesystem" }}
---
# Backing volume for the filesystem chunk backend. RWO is node-scoped,
# so a rolling update's surge pod (forced onto the same node by the
# bound PV's nodeAffinity) can mount it alongside the terminating pod.
# The cluster-default StorageClass provisions it (k3s: local-path, the
# same provisioner the bundled PostgreSQL PVC binds against).
# `kind: filesystem` is a single-replica/dev shape — production uses
# `s3`/`tiered` and never renders this.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rio-store-chunks
  namespace: {{ .Values.namespaces.store.name }}
  labels:
    {{- include "rio.labels" (dict "root" . "name" "rio-store" "component" "store") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ ($s.chunkBackend).volumeSize | default "10Gi" }}
{{- end }}
{{- end }}
