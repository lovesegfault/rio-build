{{- if .Values.externalSecrets.enabled }}
{{- $ns := .Values.namespaces.system.name -}}
{{- $nsStore := .Values.namespaces.store.name -}}
{{- $es := .Values.externalSecrets -}}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $es.clusterSecretStore }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- /*
Aurora URL + HMAC synced into BOTH rio-system (scheduler) AND rio-store
(store). k8s can't mount cross-namespace secrets, so we duplicate the
ExternalSecret into each consumer's namespace. ESO syncs the same
upstream Secrets Manager value into both — they stay in lockstep.

Signing key is store-only (narinfo signing per rio-store/src/main.rs:73).
*/}}
{{- range $targetNs := list $ns $nsStore }}
{{- if or (ne $targetNs $nsStore) (ne $.Values.postgres.authMode "iam") }}
---
# Aurora URL. ESO's template engine pulls the password from Secrets Manager
# and builds the full connection string. ?sslmode=verify-full: Aurora has
# rds.force_ssl=1; sqlx's tls-rustls-aws-lc-rs handles the handshake and
# verifies the server cert against the vendored RDS trust bundle
# (sslrootcert → rdsCa mount in _helpers.tpl, present in ALL pg-consumer
# pods regardless of postgres.authMode). Verified TLS closes the in-VPC
# MITM gap that plain `require` (encrypt, don't verify) left open — and
# is a precondition for IAM auth, where the password is a replayable
# bearer token.
#
# TLS-posture changes ride a normal rolling upgrade, accepting a small
# window: an OLD-spec pod (no rdsCa mount) that restarts after ESO has
# already re-templated this URL to verify-full crash-loops on the
# missing bundle until the rollout replaces it — minutes-wide and
# self-healing (surge keeps old replicas serving). A two-phase
# mount-then-flip protocol would add a release of latency to every
# posture change to protect that window; deliberately not done.
#
# The STORE-namespace copy is skipped in iam mode: no store-ns consumer
# reads it there (app pods use the inline passwordless URL; the migrate
# runner and xtask qa read the SYSTEM-ns copy, which always renders).
# Flipping back to password re-renders it within one deploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-postgres
  namespace: {{ $targetNs }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-postgres
    template:
      data:
        # urlquery: Aurora's auto-generated password can contain
        # @ : / # — any of which breaks URL parsing (sqlx reads a
        # stray : as the port delimiter → "invalid port number").
        url: "postgres://rio:{{ "{{ .password | urlquery }}" }}@{{ $es.auroraEndpoint }}:5432/rio?sslmode=verify-full&sslrootcert={{ $.Values.postgres.caBundlePath }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $es.auroraSecretArn }}
        property: password
{{- end }}
---
# Assignment-token HMAC: written to Secrets Manager by the bootstrap
# Job, ESO syncs it back. Scheduler signs, store verifies (same key
# file both sides). Regenerating invalidates in-flight assignment
# tokens, so the bootstrap Job's describe-secret guard is load-bearing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-hmac
  namespace: {{ $targetNs }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-hmac
  data:
    # secretKey is the k8s Secret data key → the mounted filename.
    # scheduler.yaml/store.yaml (rio.mounts assignmentHmac) expect
    # /etc/rio/assignment-hmac/hmac.key; the k3s VM-test fixture
    # creates the same hmac.key data key out-of-band.
    - secretKey: hmac.key
      remoteRef:
        key: rio/hmac
        # Binary secret (openssl rand 32, not base64-encoded text).
        decodingStrategy: None
---
# Service-identity HMAC key. Gateway signs, store verifies. SEPARATE
# upstream secret from rio/hmac so a leaked assignment key cannot mint
# service tokens. Same 32-byte raw format.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-service-hmac
  namespace: {{ $targetNs }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-service-hmac
  data:
    # secretKey is the k8s Secret data key → the mounted filename.
    # store.yaml/gateway.yaml expect /etc/rio/hmac/service-hmac.key.
    - secretKey: service-hmac.key
      remoteRef:
        key: rio/service-hmac
        decodingStrategy: None
{{- end }}
---
# Signing key (narinfo .narinfo signatures). Store-only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-signing-key
  namespace: {{ $nsStore }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-signing-key
  data:
    - secretKey: key
      remoteRef:
        key: rio/signing-key
---
# Gateway SSH host key. Server identity — clients pin it in known_hosts
# (same trust model as signing-key). Without a shared key, replicas>1
# present different host keys behind the NLB, and every pod reschedule
# breaks known_hosts. rio-system only (gateway is the sole consumer).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-gateway-host-key
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-gateway-host-key
  data:
    # `host_key` matches the gateway template's volume mount → file
    # lands at /var/lib/rio/gateway/host_key (RIO_HOST_KEY).
    - secretKey: host_key
      remoteRef:
        key: rio/gateway-host-key
{{- end }}
