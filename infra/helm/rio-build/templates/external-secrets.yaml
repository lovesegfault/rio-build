{{- if .Values.externalSecrets.enabled }}
{{- $ns := .Values.namespaces.system.name -}}
{{- $nsStore := .Values.namespaces.store.name -}}
{{- $nsBuilders := .Values.namespaces.builders.name -}}
{{- $es := .Values.externalSecrets -}}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $es.clusterSecretStore }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- /*
Aurora URL + HMAC synced into BOTH rio-system (scheduler) AND rio-store
(store). k8s can't mount cross-namespace secrets, so we duplicate the
ExternalSecret into each consumer's namespace. ESO syncs the same
upstream Secrets Manager value into both — they stay in lockstep.

Signing key is store-only (narinfo signing per rio-store/src/main.rs:73).
*/}}
{{- range $targetNs := list $ns $nsStore }}
---
# Aurora URL. ESO's template engine pulls the password from Secrets Manager
# and builds the full connection string. ?sslmode=require: Aurora has rds.force_ssl=1;
# sqlx's tls-rustls-aws-lc-rs handles the handshake. `require` = encrypt,
# don't verify (RDS CA not in container). Good enough for in-VPC.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-postgres
  namespace: {{ $targetNs }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-postgres
    template:
      data:
        # urlquery: Aurora's auto-generated password can contain
        # @ : / # — any of which breaks URL parsing (sqlx reads a
        # stray : as the port delimiter → "invalid port number").
        url: "postgres://rio:{{ "{{ .password | urlquery }}" }}@{{ $es.auroraEndpoint }}:5432/rio?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $es.auroraSecretArn }}
        property: password
---
# HMAC: written to Secrets Manager by the bootstrap Job, ESO syncs it
# back. Regenerating invalidates in-flight assignment tokens, so the
# bootstrap Job's describe-secret guard is load-bearing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-hmac
  namespace: {{ $targetNs }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-hmac
  data:
    # secretKey is the k8s Secret data key → the mounted filename.
    # _helpers.tpl assignmentHmac family expects
    # /etc/rio/assignment-hmac/hmac.key on scheduler+store
    # (RIO_HMAC_KEY_PATH); set assignmentHmac.secretName=rio-hmac to
    # mount it.
    - secretKey: hmac.key
      remoteRef:
        key: rio/hmac
        # Binary secret (openssl rand 32, not base64-encoded text).
        decodingStrategy: None
---
# Service-identity HMAC key. Gateway signs, store verifies. SEPARATE
# upstream secret from rio/hmac so a leaked assignment key cannot mint
# service tokens. Same 32-byte raw format.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-service-hmac
  namespace: {{ $targetNs }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-service-hmac
  data:
    # secretKey is the k8s Secret data key → the mounted filename.
    # store.yaml/gateway.yaml expect /etc/rio/hmac/service-hmac.key.
    - secretKey: service-hmac.key
      remoteRef:
        key: rio/service-hmac
        decodingStrategy: None
{{- end }}
{{- /*
Mountd Mount-admission HMAC key (ADR-022 §P0559). SEPARATE upstream
secret from rio/hmac so a builder-node compromise (the verifier key is
mounted into the rio-mountd DaemonSet on every builder/fetcher node)
cannot forge store-valid assignment tokens. Synced into rio-system
(the scheduler mints WorkAssignment.mountd_token) and rio-builders
(the DaemonSet verifies Mount{} tokens) — NOT rio-store, which never
sees this token family.
*/}}
{{- range $targetNs := list $ns $nsBuilders }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-mountd-hmac
  namespace: {{ $targetNs }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-mountd-hmac
  data:
    # secretKey is the k8s Secret data key → the mounted filename.
    # _helpers.tpl mountdHmac family expects
    # /etc/rio/mountd-hmac/mountd-hmac.key (RIO_MOUNTD_HMAC_KEY_PATH);
    # set mountdHmac.secretName=rio-mountd-hmac to mount it on the
    # scheduler and the rio-mountd DaemonSet.
    - secretKey: mountd-hmac.key
      remoteRef:
        key: rio/mountd-hmac
        # Binary secret (openssl rand 32, not base64-encoded text).
        decodingStrategy: None
{{- end }}
{{- /*
Mountd Mount-admission Ed25519 keypair (ADR-022 mount-admission
credentials, §P0590) — supersedes rio/mountd-hmac above. Deliberately
asymmetric distribution, the inverse of the dual-namespace loops:
the PRIVATE signing key syncs into rio-system ONLY (the scheduler is
the sole signer), the PUBLIC trust roots sync into rio-builders ONLY
(the rio-mountd DaemonSet verifies offline; public material, the
Secret is just transport). Builder/fetcher nodes therefore never hold
Mount-admission minting material — do NOT "simplify" this into one
two-namespace range like the HMAC entries above.
*/}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-mountd-signing-key
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-mountd-signing-key
  data:
    # secretKey is the k8s Secret data key → the mounted filename.
    # _helpers.tpl mountdSigningKey family expects
    # /etc/rio/mountd-signing/mountd-signing.key
    # (RIO_MOUNTD_SIGNING_KEY_PATH) on the scheduler; set
    # mountdSigning.privateKeySecretName=rio-mountd-signing-key to
    # mount it. Text secret (`rio-mountd-<n>:base64(keypair)`).
    - secretKey: mountd-signing.key
      remoteRef:
        key: rio/mountd-signing-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-mountd-signing-pub
  namespace: {{ $nsBuilders }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-mountd-signing-pub
  data:
    # _helpers.tpl mountdSigningPub family expects
    # /etc/rio/mountd-signing/mountd-signing.pub
    # (RIO_MOUNTD_PUBKEY_PATH) on the rio-mountd DaemonSet; set
    # mountdSigning.publicKeySecretName=rio-mountd-signing-pub to
    # mount it. Text secret, one trust-root line per active key
    # (rotation appends a second line here, then rolls the DS).
    - secretKey: mountd-signing.pub
      remoteRef:
        key: rio/mountd-signing-pub
---
# Signing key (narinfo .narinfo signatures). Store-only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-signing-key
  namespace: {{ $nsStore }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-signing-key
  data:
    - secretKey: key
      remoteRef:
        key: rio/signing-key
---
# Gateway SSH host key. Server identity — clients pin it in known_hosts
# (same trust model as signing-key). Without a shared key, replicas>1
# present different host keys behind the NLB, and every pod reschedule
# breaks known_hosts. rio-system only (gateway is the sole consumer).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rio-gateway-host-key
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rio-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: rio-gateway-host-key
  data:
    # `host_key` matches the gateway template's volume mount → file
    # lands at /var/lib/rio/gateway/host_key (RIO_HOST_KEY).
    - secretKey: host_key
      remoteRef:
        key: rio/gateway-host-key
{{- end }}
