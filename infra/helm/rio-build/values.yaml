        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["6"]}
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
          - {key: karpenter.k8s.aws/instance-local-nvme, operator: Gt, values: ["0"]}
      lo-nvme-arm:
        nodeClass: rio-nvme
        labels:
          - {key: rio.build/hw-band, value: lo}
          - {key: rio.build/storage, value: nvme}
          - {key: kubernetes.io/arch, value: arm64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["6"]}
          - {key: kubernetes.io/arch, operator: In, values: [arm64]}
          - {key: karpenter.k8s.aws/instance-local-nvme, operator: Gt, values: ["0"]}
      lo-ebs-x86:
        nodeClass: rio-default
        labels:
          - {key: rio.build/hw-band, value: lo}
          - {key: rio.build/storage, value: ebs}
          - {key: kubernetes.io/arch, value: amd64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["6"]}
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      lo-ebs-arm:
        nodeClass: rio-default
        labels:
          - {key: rio.build/hw-band, value: lo}
          - {key: rio.build/storage, value: ebs}
          - {key: kubernetes.io/arch, value: arm64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["6"]}
          - {key: kubernetes.io/arch, operator: In, values: [arm64]}
      # §13c: bare-metal hw-classes for kvm derivations (nixos-test /
      # qemu-kvm builds, requiredSystemFeatures=["kvm"]). These replace
      # the pre-§13c static metal NodePool — kvm intents now get
      # full SLA-solve participation routed by `providesFeatures`.
      # BIOS-AMI partition (instance-size In/NotIn) keys on
      # `nodeClass: rio-metal` (cover.rs METAL_NODE_CLASS).
      # M1 (owner, 2026-06-11, SIGNED): metal joins spot+od — the
      # carve-out ("metal is expensive idle, spot interruption
      # mid-VM-test wastes the whole build") was an interruption-
      # economics judgment, NOT market absence: spot EXISTS for 21/21
      # sampled admitted metal types in us-east-2 with live quotes in
      # all three AZs at ~70% od discount (c6i.metal $1.18-1.57/hr vs
      # od ≈$5.44). The owner attacked the carve-out; the doctrine
      # ("ALL CLASSES spot+on-demand — spot if available, else od")
      # now has zero divergences. PRICED RESIDUAL (recorded, signed —
      # a capacity-cost posture, not a safety theorem): a spot
      # interruption mid-VM-test wastes the whole build (no
      # checkpoint), and metal relaunch latency is the worst in the
      # fleet (7-15 min observed boot) — the ladder's od rung is the
      # failover (vanish-as-ICE feeds the rung advance), so an
      # interrupted build re-routes to od at one IceBackoff step +
      # one tick, paying the od premium only while spot evidence
      # stays red. nix/tests/helm/43-metal-capacity-doctrine.sh pins
      # both metal classes to the doctrine.
      # The `rio.build/kvm` label is stamped onto the Node and matched
      # by the per-intent pod nodeAffinity (r33 bug_002: pool-static
      # nodeSelector deleted); the matching taint keeps non-kvm pods
      # off.
      metal-x86:
        nodeClass: rio-metal
        labels:
          - {key: rio.build/kvm, value: "true"}
          - {key: kubernetes.io/arch, value: amd64}
        requirements:
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"]}
          # NO capacity-type requirement — D5 makes it structural via
          # capacityTypes (a requirement here would conflict with the
          # cell-derived `In [spot]` on a (metal, spot) cell → ICE loop).
        # M1 (signed): spot+od — see the doctrine block above.
        capacityTypes: [spot, on-demand]
        taints:
          - {key: rio.build/kvm, value: "true", effect: NoSchedule}
        # §13d (r30 bug_007): nixpkgs `nixosTest` derivations declare
        # `requiredSystemFeatures = ["nixos-test", "kvm"]`. Both are
        # hardware gates (not in `softFeatures`); `features_compatible`
        # is subset-on-required, so a class providing only `[kvm]`
        # rejects them and the ∅-guard rejects every non-metal class →
        # `h_all=[]` → unroutable. The pre-§13c kvm Pool advertised
        # `[kvm, nixos-test, big-parallel]`; §13c dropped `nixos-test`.
        providesFeatures: [kvm, nixos-test]
        # §13c D4a: x86+arm Σ = 10000 (= the maxFleetCores bump amount).
        maxFleetCores: 5000
        # maxCores/maxMem unset → §13c-2 catalog ceiling at boot
        # (largest metal type matching `requirements` ∩ `metalSizes`).
        # SlaConfig::validate() rejects per-class overrides > global;
        # the global cap is the safety net — and helm/17 asserts it.
      metal-arm:
        nodeClass: rio-metal
        labels:
          - {key: rio.build/kvm, value: "true"}
          - {key: kubernetes.io/arch, value: arm64}
        requirements:
          - {key: kubernetes.io/arch, operator: In, values: [arm64]}
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"]}
        # M1 (signed): spot+od — see the doctrine block above.
        capacityTypes: [spot, on-demand]
        taints:
          - {key: rio.build/kvm, value: "true", effect: NoSchedule}
        providesFeatures: [kvm, nixos-test]
        maxFleetCores: 5000
      # §13e: fetcher partition. FODs route by required_features=[fetcher]
      # (derived from is_fixed_output at the scheduler chokepoint, NOT
      # from drv requiredSystemFeatures). The taint keeps non-fetcher
      # pods off; the label feeds the per-intent pod nodeAffinity. The
      # bidirectional ∅-guard means a featureless builder NEVER routes
      # to a fetcher cell and a FOD NEVER routes to a builder cell.
      #
      # Sizing — TWO cold-start regimes by `preferLocalBuild`:
      #  (a) PLB FODs (`preferLocalBuild=true`, e.g. `builtins.fetchurl`,
      #      `writeText`): pinned 1c/minimal-mem/minimal-disk
      #      immediately, no learning — `intent_for` short-circuits
      #      before the cold-start probe. The common case.
      #  (b) Non-PLB FODs (`fetchgit`, large unpacked fetchurls,
      #      pname-bearing fixed-output derivations): cold-start (no
      #      pname samples) gets sla.probe (16c/48GiB default) for
      #      ~3 builds; observed_p_bar then detects the unsaturated CPU
      #      profile (cpu_seconds/wall p90 << 1) and clamps cap_c to
      #      1.0. Steady-state c*=1.
      # A FOD slower than the slowest bounded tier (p99=1200s) falls
      # through to best-effort and gets cap_c = class_ceiling —
      # over-provision cost waste, not a correctness hazard. Operators
      # may add sla.featureProbes.fetcher for a cheaper non-PLB
      # cold-start (cpu must be ≥ 4 per ProbeShape::validate).
      #
      # capacityTypes [spot, on-demand]: a spot interruption mid-FOD is
      # safe (FODs are idempotent, the failure_count machinery retries),
      # and spot is the cheaper default. Narrow if interruption rates
      # prove problematic. (Metal classes run [spot, on-demand] too
      # since M1 — od failover absorbs interruption-prone windows; the
      # od-only-by-nodepool exception is the STORE fleet, not any
      # builder class. bind[43-metal-capacity-doctrine.sh]
      # bind[44-store-nodepool.sh])
      fetcher-x86:
        nodeClass: rio-default
        labels:
          - {key: rio.build/fetcher, value: "true"}
          - {key: kubernetes.io/arch, value: amd64}
        requirements:
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"]}
        capacityTypes: [spot, on-demand]
        taints:
          - {key: rio.build/fetcher, value: "true", effect: NoSchedule}
        providesFeatures: [fetcher]
        # §13e: replaces static rio-fetcher NodePool's `limits: {cpu: 5000}`
        # ("5000 vCPU ≈ 2500 concurrent tiny fetchers"). Without this the
        # fetcher fanout is bounded only by the shared 30000-core global,
        # silently regressing the fanout gate.
        maxFleetCores: 5000
      fetcher-arm:
        nodeClass: rio-default
        labels:
          - {key: rio.build/fetcher, value: "true"}
          - {key: kubernetes.io/arch, value: arm64}
        requirements:
          - {key: kubernetes.io/arch, operator: In, values: [arm64]}
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"]}
        capacityTypes: [spot, on-demand]
        taints:
          - {key: rio.build/fetcher, value: "true", effect: NoSchedule}
        providesFeatures: [fetcher]
        maxFleetCores: 5000
    hwCostSource: spot
    referenceHwClass: mid-ebs-x86
    # Fallback for cells absent from leadTimeSeed (a new hw-class
    # added without re-running `xtask k8s probe-boot`). Non-zero so
    # health::classify's `2×seed` timeout covers ~18s real boot — a
    # 0 default would reap every NodeClaim before it can register.
    defaultLeadTimeSeed: 30.0
    leadTimeSeed:
      "hi-ebs-arm:od": 17.0
      "hi-ebs-arm:spot": 18.0
      # live_050(c) g7 rung cells — PLACEHOLDER seeds pending an
      # `xtask k8s probe-boot` re-run (helm/18 refuses an unseeded
      # cell; the metal/fetcher rows are the precedent). Value =
      # the gen-8 parent's matching-cap seed: same nodeClass, same
      # virtualized boot path — generation does not move the ~18s
      # kubelet boot. The :spot rows joined with the spot+od owner
      # doctrine (every g7 cell must be seeded for helm/18).
      "hi-ebs-arm-g7:od": 17.0
      "hi-ebs-arm-g7:spot": 18.0
      "hi-ebs-x86:od": 16.0
      "hi-ebs-x86:spot": 17.0
      "hi-ebs-x86-g7:od": 16.0
      "hi-ebs-x86-g7:spot": 17.0
      "hi-nvme-arm:od": 17.0
      "hi-nvme-arm:spot": 17.0
      "hi-nvme-arm-g7:od": 17.0
      "hi-nvme-arm-g7:spot": 17.0
      "hi-nvme-x86:od": 18.0
      "hi-nvme-x86:spot": 18.0
      "hi-nvme-x86-g7:od": 18.0
      "hi-nvme-x86-g7:spot": 18.0
      "lo-ebs-arm:od": 20.0
      "lo-ebs-arm:spot": 19.0
      "lo-ebs-x86:od": 17.0
      "lo-ebs-x86:spot": 18.0
      "lo-nvme-arm:od": 21.0
      "lo-nvme-arm:spot": 21.0
      "lo-nvme-x86:od": 18.0
      "lo-nvme-x86:spot": 21.0
      "mid-ebs-arm:od": 20.0
      "mid-ebs-arm:spot": 20.0
      "mid-ebs-x86:od": 18.0
      "mid-ebs-x86:spot": 18.0
      "mid-nvme-arm:od": 20.0
      "mid-nvme-arm:spot": 19.0
      "mid-nvme-x86:od": 18.0
      "mid-nvme-x86:spot": 18.0
      # §13c metal cells — placeholder pending `xtask k8s probe-boot`
      # re-run (bug_018 made the tool able to observe metal cells; the
      # 24 entries above are from the pre-§13c run that had none).
      # Pinned at `maxLeadTime` (600s, the validate() ceiling) so
      # `health::classify`'s `2×seed` reap timeout (1200s) covers AWS
      # .metal POST + firmware + kubelet boot. Observed metal boot is
      # typically 7–15 min; if 1200s proves too tight raise `maxLeadTime`
      # first (it caps the seed). The `RioNodeclaimPoolStuckPending`
      # alert clamp ceiling (3×maxLeadTime) and the
      # `RioNodeclaimPoolBootTimeoutLoop` increase() window
      # (4×maxLeadTime + 4×TICK = 2 reap cycles; r35 merged_bug_027,
      # r43 bug_024) both derive
      # from `maxLeadTime` (see prometheusrule.yaml) so they stay
      # >= 2×maxLeadTime structurally — no manual coordination needed
      # when raising it. The clamp
      # keeps a structural 90s floor in case `maxLeadTime` is ever set
      # below 30 (Prometheus `clamp(v, min, max)` returns an empty
      # vector when min > max). (bug_015, bug_001, r34 bug_017)
      "metal-arm:od": 600.0
      "metal-x86:od": 600.0
      # M1: the spot cells join the ladder at the same maxLeadTime
      # pin as the od rows (AWS .metal POST + firmware + kubelet boot
      # dominates; market makes no boot-time difference) — re-run
      # `xtask k8s probe-boot` to replace with observed seeds, same
      # caveat as the od rows above.
      "metal-arm:spot": 600.0
      "metal-x86:spot": 600.0
      # §13e fetcher cells — placeholder pending `xtask k8s probe-boot`
      # re-run. `nodeClass: rio-default` (virtualized boot, ~18s real
      # like the lo-/mid-/hi- tiers); 30s gives `health::classify` a
      # 60s reap window with headroom. Re-run probe-boot once a deployed
      # chart routes FODs here (B5+) and paste observed seeds.
      "fetcher-arm:od": 30.0
      "fetcher-arm:spot": 30.0
      "fetcher-x86:od": 30.0
      "fetcher-x86:spot": 30.0
    # DESTRUCTIVE one-shot: pass --allow-reference-change for ONE
    # rollout when changing referenceHwClass (resets ref-second state),
    # then revert to false.
    allowReferenceChange: false
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    # 1M-node DAG merge ≈ ~1GB (DerivationState + cycle-check color map +
    # iterative DFS stack) + steady-state node maps. Sized for thousands
    # of concurrent builds at MAX_DAG_NODES=1M (I-137).
    limits: {memory: 4Gi}

# ──────────────────────────────────────────────────────────────────────────
# rio-gateway
# ──────────────────────────────────────────────────────────────────────────
# SSH ingress. Stateless (session state per-connection, no shared state).
# LB distributes SSH round-robin. Dying gateway kills its sessions (nix
# client retries).
gateway:
  enabled: true
  image: rio-gateway
  # Static replica count — only consulted where autoscaling is disabled
  # (environments without the KEDA operator: the k3s VM tests and local
  # dev). Everywhere else the replica count is owned by the
  # ScaledObject below and this field is not rendered.
  replicas: 2
  # Horizontal autoscaling on active session count. This is how the
  # gateway scales, not an optional feature: the per-pod session cap
  # (gateway max_sessions, the OOM backstop) is a safety limit, not a
  # capacity plan — the thing that turns demand into capacity is KEDA
  # adding replicas at 25% of that cap. Enabled by default. The flag
  # exists only because the ScaledObject CR requires the KEDA operator
  # (infra/eks/keda.tf) and a prometheus scraping
  # rio_gateway_channels_active — the k3s VM-test and local-dev
  # profiles run neither, set enabled=false, and fall back to the
  # static `replicas` above. With autoscaling enabled, gateway.yaml
  # renders .spec.replicas as the LIVE Deployment's current value
  # (lookup; omitted on fresh install and under `helm template`), so
  # helm upgrade neither fights the autoscaler nor null-patches the
  # field back to 1 on an existing release.
  #
  # Sizing rationale + the ControlMaster single-connection caveat live
  # in templates/gateway-scaledobject.yaml.
  autoscaling:
    enabled: true
    # Production floor — the pre-autoscaling static topology was 2
    # replicas behind the NLB, and the PDB (minAvailable: 1) needs ≥2
    # for any voluntary disruption to be allowed.
    minReplicas: 2
    maxReplicas: 8
    # Desired replicas = ceil(sum(rio_gateway_channels_active) / this).
    # 1024 = 25% of the per-pod session cap (max_sessions, default 4096
    # = the OOM backstop) — capacity is added long before the gateway
    # starts rejecting exec requests.
    targetSessionsPerPod: 1024
    # Scaler-outage posture (KEDA spec.fallback). The sessions trigger
    # is this ScaledObject's ONLY trigger, so without fallback a
    # prometheus outage leaves the HPA with zero healthy scalers,
    # frozen at whatever count the outage caught — refused sessions if
    # it coincides with a surge. After failureThreshold consecutive
    # scaler failures (~a minute-plus at the HPA's ~15s
    # external-metrics cadence: rides out a prometheus pod restart,
    # catches a real outage) KEDA feeds the HPA
    # replicas × targetSessionsPerPod, i.e. desired = replicas.
    #
    # Blind-at-ceiling: replicas defaults to maxReplicas above. While
    # KEDA cannot see demand it assumes the demand the fleet is sized
    # for (8 × 1024 target sessions; hard cap 8 × max_sessions 4096).
    # The cost asymmetry decides it: 8 gateway pods request a total of
    # 2 vCPU / 4 Gi (resources block below), while a blind floor
    # during a surge refuses build sessions — the SLA-relevant
    # direction. Recovery needs no knob: real metrics resume and the
    # 1800s scale-down stabilization drains the excess at 1 pod/600s.
    # Change this together with maxReplicas (helm-lint fragment 38
    # pins the defaults equal) or justify the gap here.
    #
    # The STORE ScaledObject deliberately carries no fallback: KEDA
    # fallback never applies to cpu/memory triggers, so the store's
    # cpu trigger keeps feeding the HPA real utilization through a
    # prometheus outage — that is its designed degraded mode, and a
    # fallback stanza would instead pin the two prometheus triggers at
    # a load-blind floor (HPA takes the max across triggers) at
    # 16-CPU/8-Gi per pod.
    fallback:
      failureThreshold: 3
      replicas: 8
    # In-cluster prometheus the KEDA scaler queries. Default matches
    # the reference deploy (kube-prometheus-stack release in the
    # `monitoring` namespace, infra/eks/monitoring.tf).
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  # actBuild machineName field (what nom shows as "on <name>"). Defaults
  # to karpenter.clusterName; set explicitly to override. The cluster
  # appears as one machine to ssh-ng clients — per-pod IDs are not sent.
  machineName: ""
  schedulerAddr: rio-scheduler.rio-system:9001
  storeAddr: rio-store.rio-store:9002
  # Balanced-channel: gateway DNS-resolves headless to pod IPs, probes
  # grpc.health.v1 on each, routes to leader.
  schedulerBalanceHost: rio-scheduler-headless
  schedulerBalancePort: 9001
  # Cap on transitive input derivations resolved per build (DoS guard).
  # Matches gateway wire MAX_COLLECTION_COUNT (1M). drv_cache ≈ 1-3GB at
  # the cap (parsed Derivation, not just path strings); gateway memory
  # limit raised to 4Gi (I-134) to accommodate. Lower on memory-
  # constrained gateway pods (I-135).
  maxTransitiveInputs: 1048576
  # I-064 graceful drain. preStop sleep nlbDeregisterSecs (NLB stops
  # routing NEW connections) → SIGTERM → readiness=NotServing → wait
  # drainGraceSecs → stop accepting SSH → wait sessionDrainSecs for
  # open sessions to close → exit. terminationGracePeriodSeconds is
  # computed as nlb+drain+session+24 (template) so kubelet's SIGKILL
  # backstop sits behind all three.
  #
  # nlbDeregisterSecs covers the NLB health-check round (target-type
  # instance + ETP=Local: NLB polls healthCheckNodePort; default 10s
  # interval × 3 unhealthy threshold). drainGraceSecs is now belt-and-
  # suspenders for in-cluster Endpoints propagation post-SIGTERM.
  nlbDeregisterSecs: 30
  drainGraceSecs: 6       # readinessProbe.periodSeconds (5) + 1
  # sessionDrainSecs bounds how long a rollout waits on in-flight
  # `nix-store --realise` sessions. SLA: deploys may interrupt builds
  # running >1h on the evicted gateway replica. Builds past this still
  # get CancelBuild before exit so the scheduler hears it (vs. waiting
  # for its own session-timeout). Surge-first means the new pod is
  # already serving; cost of a long drain is only the old pod's
  # resources, not availability.
  sessionDrainSecs: 3600
  service:
    type: LoadBalancer
    # NO AWS LB annotations here — base is cloud-agnostic. Set via
    # --set-json per deployment. Putting them here was wrong twice: leaks
    # AWS specifics AND legacy in-tree-provider syntax that
    # aws-load-balancer-controller silently ignores.
    #
    # AWS NLB graceful drain: align target-group deregistration with
    # the gateway's own session_drain so the NLB holds existing
    # connections while the pod drains, e.g.:
    #   service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: deregistration_delay.timeout_seconds=60
    annotations: {}
    # CIDRs allowed to reach the LoadBalancer. Empty = no restriction
    # at the LB layer (the default `internal` scheme already scopes to
    # the VPC). When a deployment sets this AND `aws-load-balancer-
    # scheme: internet-facing`, the controller writes NLB SG ingress
    # rules so only these source ranges can connect on port 22.
    loadBalancerSourceRanges: []
  ssh:
    # Secret with key `authorized_keys`. Without it: gateway has no keys to
    # check → all SSH auth fails. Empty string → don't mount (gateway
    # generates ephemeral host key, useful for VM tests that don't SSH in).
    authorizedKeysSecret: rio-gateway-ssh
    # Secret with key `host_key` (persistent SSH host key). Empty → emptyDir
    # holds an auto-generated key (survives container restart, regenerates on
    # pod reschedule — breaks known_hosts). Prod with replicas>1 should use a
    # real Secret so both replicas present the same host key.
    hostKeySecret: ""
  resources:
    # Gateway buffers NAR uploads in-memory (~1MB/concurrent upload, streaming
    # via tee). The dominant cost is drv_cache (parsed Derivation per uploaded
    # .drv, capped at maxTransitiveInputs per session): a 100k-path closure ≈
    # 150-300MB/session (I-134). 4Gi headroom for a few concurrent large-DAG
    # sessions.
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 4Gi}


# ──────────────────────────────────────────────────────────────────────────
# Karpenter NodePools + EC2NodeClass
# ──────────────────────────────────────────────────────────────────────────
# In the chart (not terraform) so `helm rollback` takes node config with
# the rest, and because kubernetes_manifest has the plan-time GVK trap
# (Karpenter CRDs don't exist until helm_release.karpenter applies).
#
# Requires helm_release.karpenter in terraform to have run (installs CRDs).
# xtask deploy sets enabled=true + clusterName + nodeRoleName from
# tofu outputs.
karpenter:
  enabled: false
  nodeclaimPool:
    leaseName: rio-controller-nodeclaim-pool
    # r35 bug_050: per-hw-class-prefix `consolidate_after` floor
    # (seconds). §13e routed Fetcher Pools through the nodeclaim_pool
    # reconciler, dropping Karpenter's `consolidateAfter: 10m` to the
    # NA-model's `boot_median/2` (~15s) — a fetcher node burns a boot
    # every 15s of lull instead of holding 10min. The NA model is
    # correct (it observes the right λ); the *policy floor* was lost in
    # the migration. Keys are class names or `<prefix>*` globs matched
    # against the hw-class half of the cell; longest prefix wins, so
    # `fetcher-*` (len 8) overrides `*` (len 0).
    #
    # `*: 300.0` builder floor. `boot_median/2` (~9s for an 18s-boot
    # builder) is BELOW the boot cost it's supposed to amortize —
    # reaping at 9s when the next sequential build arrives at t=15s
    # burns a ~30s reprovision to save 6s of idle (~$0.0002 at
    # $0.10/node-hr). 300s covers two gaps: (1) the inter-build
    # dispatch gap (output upload + next pod schedule + image pull,
    # ~60s ≈ 3×boot); (2) `>-<` DAG bottlenecks — a wide→narrow→wide
    # build graph idles the fleet during the narrow phase, but the
    # §13b forecast frontier is 1 dep-layer deep (`compute_spawn_
    # intents`'s `eta < lead_time` gate), so the wide-again layer's
    # Queued drvs emit no intents, `placeable` collapses, the threshold
    # drops to the floor, nodes get reaped, then ~50-80s cold-start
    # when the bottleneck clears. Observed bottlenecks are mostly
    # <5min. ~$0.0083/node-hr idle (vs $0.0167 at Karpenter's 10m).
    #
    # The NA model raises the threshold ABOVE the floor under arrival
    # pressure, but only for cells packing ~1 intent/node (r38
    # bug_022): WHENEVER intents pack ≥2-per-node (`E[c_fit] ≤
    # cores/2`, the §13b MostAllocated default), with `w = boot/2` the
    # NA estimator's `λ̂` saturates at `1/w = 2/boot`, so `λ̂·E ≤
    # 2E/boot ≤ cores/boot` always — the keep-condition `λ̂·E >
    # cores/boot` is unsatisfiable. So for bin-packed builder cells
    # the floor IS the threshold, which is fine: DAG-shaped demand is
    # deterministic, not stochastic — a hazard model can't see it.
    #
    # Known gap: this is blind insurance — pays idle cost whether or
    # not work is pending. Targeted fix is a backlog-aware floor:
    # scheduler aggregates Queued+Created cores per cell into
    # `GetSpawnIntentsResponse`, controller raises the cell floor while
    # nonzero. Revisit at production fleet sizes.
    minConsolidationTime:
      "fetcher-*": 600.0
      "*": 300.0
  clusterName: ""   # from tofu output cluster_name
  nodeRoleName: ""  # from tofu output karpenter_node_role_name
  # ADR-021: NixOS node AMI (full cutover — no Bottlerocket). The
  # rio-default EC2NodeClass selects by `rio.build/ami=<tag>` EC2 tag
  # (one term per arch). `cargo xtask k8s -p eks up --ami` builds
  # .#packages.{x86_64,aarch64}-linux.ami, registers them, tags
  # rio.build/ami=<12-hex drvPath hash>, and writes .rio-ami-tag —
  # `up --deploy`
  # reads that file (or recomputes the hash) and sets this. No
  # default: a missing tag is "AMI not built", not
  # "use whatever was last tagged".
  amiTag: ""
  # Root volume (/dev/xvda — single root, NixOS doesn't split OS/data).
  # boot.growPartition expands / to fill on first boot. MUST cover the
  # largest pod ephemeral-storage request a NodeClaim can carry:
  # pod_ephemeral_request(sla.maxDisk, headroom(n_eff=1), poolDefaults.fuseCacheBytes)
  #   = maxDisk × 1.95 + fuseCacheBytes + 1Gi   (worst-case headroom; jobs.rs::pod_ephemeral_request)
  #   = 200×1.95 + 50 + 1 = 441Gi
  # `max_node_disk` is dataVolumeSize × 0.9 (kubelet eviction/image-cache
  # reserve), so the binding inequality is 500×0.9 = 450 ≥ 441 — only ~9Gi
  # of slack. Bumping `maxDisk` or `fuseCacheBytes` will trip
  # 14-disk-ceiling.sh; raise `dataVolumeSize` first. nvme hw-classes
  # ignore this (instance-store provides ephemeral-storage).
  dataVolumeSize: 500Gi
  # gp3 provisioned IOPS+throughput (max for gp3). Build workloads are
  # IOPS-bound; baseline 3000 throttles -j32+. gp3 has no separate
  # provisioned-IOPS account quota — io1/io2 do (300k/100k → 18/6
  # nodes at 16k each). Switch to io1/io2 after quota increase
  # (L-B3A130E6) lands.
  dataVolumeIops: 16000
  dataVolumeThroughputMiBps: 1000
  # live_060-a: the dedicated kubelet quota volume (second EBS
  # mapping, /dev/xvdb) for the EBS-only classes (rio-default/
  # rio-metal). Mounted xfs `-o prjquota` at /var/lib/kubelet by the
  # AMI's rio-kubelet-mount (EBS branch), so kubelet assigns project IDs to
  # emptyDirs and rio-builder's quota.rs produces peak_disk_bytes —
  # the fleet precondition that was never true (159/160 EBS-only
  # nodes, 2022/2022 completions None). With /var/lib/kubelet on
  # THIS volume, the pod_ephemeral_request inequality documented at
  # dataVolumeSize binds here for EBS classes: 500×0.9 = 450 ≥ 441.
  # The root volume keeps its size for the image cache + system; its
  # scratch headroom is now redundant on EBS classes — resizing it
  # is a post-soak optimization, recorded in the live_060 readback,
  # not taken here. IOPS/throughput mirror the data volume: the
  # build scratch is the IOPS-bound surface and it lives here now.
  quotaVolumeSize: 500Gi
  quotaVolumeIops: 16000
  quotaVolumeThroughputMiBps: 1000

  # AWS bare-metal instance-size suffixes, c/m/r gen6+. Single source
  # for the metal/virtualized partition (I-205). New `metal-*` size →
  # add HERE only; the controller's `nodeclaim_pool` reconciler reads
  # this (`controller.toml [nodeclaim_pool] metal_sizes`) for
  # `instance-size In/NotIn` on §13b NodeClaims, and
  # templates/karpenter.yaml injects the same `NotIn` on every NodePool.
  # §13c: kvm builds are now `metal-*` hwClasses (`scheduler.sla.
  # hwClasses.metal-{x86,arm}`) routed by §13b — there is no static
  # metal NodePool.
  # live_050(d): metal-96xl JOINED this list — its omission let 96xl
  # metal variants leak through the band classes' NotIn partition into
  # their ceiling argmax (the author-typed list rotted; the catalog-
  # side exclusion census now diffs this list against the catalog's
  # own metal-size enumeration, so the next omission is a test
  # failure, not a live hang).
  metalSizes: [metal, metal-16xl, metal-24xl, metal-32xl, metal-48xl, metal-96xl]

  # live_050(d)/live_051(a): committed launch-evidence exclusion — the
  # rev-3/rev-4 live-overlay content as the chart DEFAULT (the runtime
  # overlays become duplicates, retired at first deploy per the wave
  # record). Instance-size tokens that EXIST in describe_instance_types
  # but have ZERO launchable capacity in the deployment region (either
  # market): the gen-8 Intel 96xlarge/metal-96xl rows set every hi
  # ceiling to max_cores=383 live and ICE'd every fleet in BOTH markets
  # (the 512/704 hang; the hi->od override ICEd identically). Consumed
  # twice from this ONE list: (a) the scheduler's derive_ceilings
  # synthesizes `instance-size NotIn` for EVERY class (ceiling plane —
  # a loose class cannot re-import a phantom into its ceiling or the
  # global); (b) the scheduler template projects it as a per-class
  # requirement row (fleet plane — NodeClaims carry it to Karpenter's
  # selection).
  unlaunchableSizes: [96xlarge, metal-96xl]

  nodePools:
    # §13e: static `rio-fetcher` NodePool DELETED. Fetcher capacity is
    # `fetcher-x86`/`fetcher-arm` hwClasses (sla.hwClasses above) routed
    # through `rio-nodeclaim-shim` like every other dynamic class — the
    # controller mints fetcher NodeClaims directly with the
    # `rio.build/fetcher=true:NoSchedule` taint and matching label. The
    # FOD intent's `hw_class_names ⊇ {fetcher-*}` drives the pod's
    # nodeAffinity via `cells_to_selector_terms`. The 5000-vCPU fanout
    # gate moved to per-class `maxFleetCores`; the global
    # `sla.maxFleetCores` was bumped to absorb it (see comment there).
    # The only static NodePool left is `rio-general` (control-plane).
    #
    # r35 bug_050: the deleted NodePool's `consolidateAfter: 10m` had no
    # NA-model equivalent — `consolidate_after()` floors at
    # `boot_median/2` (~15s for fetcher cells), so the migration silently
    # turned a 10min idle grace into ~15s and burned a boot per lull.
    # `karpenter.nodeclaimPool.minConsolidationTime` (above) restores the
    # operator policy floor. Even with the knob, fetcher idle behavior is
    # now NA-model-driven (Karpenter never observed arrival rate); the
    # knob is a hard floor — for bin-packed cells (≥2 intents/node, the
    # §13b MostAllocated default) the NA model CANNOT extend past it
    # (r38 bug_022); for cells packing ~1 intent/node it CAN extend
    # under arrival pressure, but it always honors the floor as a
    # minimum.
    # If fetcher boot-thrash shows in `rio_controller_nodeclaim_reaped_
    # total{reason=idle, cell=~"fetcher-.*"}` despite the floor, raise it
    # — the model floor protects against transient lulls, the knob
    # protects against the operator's idle-cost tolerance.

    # D1 (bughunt-9): the STORE fleet's own pool. Store pods previously
    # rode rio-general, whose Drifted-0 budget + the template's blanket
    # WhenEmpty policy (a BUILDER rationale that never applied to the
    # store) meant a 3-millicore store pod pinned a whole 32-vCPU node
    # indefinitely — store reclaim is now WhenEmpty + a 5m grace
    # (Underutilized is structurally unreachable: every store pod
    # carries karpenter.sh/do-not-disrupt — store.yaml live_062 — and
    # required anti-affinity puts exactly one per node; bug_015's
    # 49-disrupt-policy-coherence pins the relationship). Tainted so
    # only store pods (which tolerate it, store.yaml) land here; the
    # one-replica-per-node antiAffinity makes each replica pin a whole
    # node, so limits.cpu/32 IS the hostable replica ceiling — the
    # xtask pg-preflight reads THIS pool's limit for the hostable arm
    # (deploy.rs store_pool_cpu_limit; change together). Capacity stays
    # on-demand BY NODEPOOL (the signed doctrine's store exception:
    # NAR transfers and PG pools don't checkpoint across interruption).
    - name: rio-store
      weight: 50
      labels:
        rio.build/node-role: store
      taints:
        - {key: rio.build/store, value: "true", effect: NoSchedule}
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [c8a, m8a, r8a]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      limits: {cpu: 1500}
      consolidationPolicy: WhenEmpty
      consolidateAfter: 5m

    # General: untainted, for future gateway/scheduler HPA overflow.
    # System nodegroup (min=3 max=5) handles today's load; this absorbs
    # scale-up past that. Longer consolidateAfter because gateway/scheduler
    # pods are connection-stateful (SSH sessions, gRPC streams) — don't churn.
    - name: rio-general
      weight: 50
      labels:
        rio.build/node-role: general
      taints: []
      requirements:
        # Pinned to AMD gen-8 (c8a/m8a/r8a, all amd64) — simplicity
        # over multi-arch placement for control-plane. Images stay
        # multi-arch (xtask still builds+pushes arm64) so the aarch64
        # build path stays exercised; only scheduling is constrained.
        # Graviton4 (c8g) is ~10-20% cheaper per vCPU; revisit the pin
        # if cost matters more than single-arch debug simplicity.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [c8a, m8a, r8a]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      limits: {cpu: 1500}
      consolidateAfter: 5m
      # Control-plane pods are connection-stateful (SSH sessions, gRPC
      # streams). Karpenter's default 10% Drifted budget evicted them
      # mid-session on every AMI change despite PDB minAvailable:1.
      # Budget=0 means rio-general nodes stay Drifted=True until the
      # operator runs `xtask k8s rotate-general` during a quiet
      # window. Builder/fetcher pools keep the default 10% (builders
      # carry karpenter.sh/do-not-disrupt per I-126, so Karpenter
      # waits for the build to finish anyway).
      budgets:
        - nodes: "0"
          reasons: [Drifted]

# ──────────────────────────────────────────────────────────────────────────
# rio-dashboard (Cilium Gateway API)
# ──────────────────────────────────────────────────────────────────────────
# Svelte SPA (nginx proxies in-cluster /rio.* gRPC-Web to the
# leader-only rio-scheduler-leader Service) + optional Cilium Gateway
# north-south route to rio-scheduler, which serves gRPC-Web natively
# via tonic-web (D3). The GatewayClass/Gateway/
# GRPCRoute in dashboard-gateway.yaml render when enabled; they need
# Cilium installed with gatewayAPI.enabled=true and the upstream
# Gateway API CRDs present (cilium-render.nix vendors them).
#
# Disabled by default. Enabling renders BOTH the Gateway API CRs and
# the SPA Deployment (dashboard.yaml — nginx + static bundle).
dashboard:
  enabled: false
  # nginx pod carrying the Svelte dist/ bundle (nix build .#dockerImages.
  # dashboard). Stateless — scale for availability, not load (static
  # SPA + thin proxy).
  replicas: 1
  image: rio-dashboard
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  # ── Method-level authz (r[dash.auth.method-gate+5]) ───────────────────
  # Expose ClearPoison/CreateTenant/TriggerGC via the
  # dashboard gateway. Default false — the GRPCRoute for mutating
  # methods is NOT rendered, so envoy returns 404 on those paths.
  # Use rio-cli with the service-HMAC key for admin operations until
  # dashboard-native authz lands. Flipping this to true is fail-open:
  # any browser that can reach the gateway can issue mutating RPCs
  # (CORS is advisory — a curl client ignores it).
  enableMutatingMethods: false
  # CORS allowed origins for gRPC-Web. The previous default was "*"
  # (any origin could fetch admin RPCs). The dashboard nginx Service
  # is the only legitimate browser origin in-cluster; external access
  # (Ingress/LoadBalancer) should add its public hostname here.
  # Override in prod values with the actual Ingress URL.
  cors:
    allowOrigins:
      # In-cluster nginx Service DNS. Browsers don't normally reach
      # this directly (they hit the Ingress), but it's a safe default
      # that isn't "*". Port-forwarded dev sessions hit localhost,
      # which is also NOT "*" — add localhost in values/dev.yaml if
      # needed.
      - "http://rio-dashboard.rio-system.svc.cluster.local"

# ──────────────────────────────────────────────────────────────────────────
# Pools (one per arch×kind) — Builder OR Fetcher executor pools
# ──────────────────────────────────────────────────────────────────────────
# One Pool per (arch, kind). `pools` is the list to render (each entry
# needs at minimum `name` + `kind` + `systems`); every other field is
# deep-merged from `poolDefaults`. Per-entry overrides go on the list
# item (e.g. arm-specific nodeSelector, kvm-pool features). Overlays
# that want to change a property for ALL pools set it on `poolDefaults`.
# Overlays that want a different POOL LIST replace `pools` (lists are
# replaced wholesale).
#
# Per-pod (cores, mem, disk) come from the scheduler's per-drv
# SpawnIntent (ADR-023) — there is NO per-pool resources knob.
pools:
  - name: x86-64
    kind: Builder
    # r[builder.platform.i686]: x86_64 hosts run i686 natively.
    systems: [x86_64-linux, i686-linux]
  - name: x86-64-fetcher
    kind: Fetcher
    # `builtin` so the spawn-signal intent is self-describing.
    systems: [x86_64-linux, i686-linux, builtin]
    # null-clear so the fetcher pod doesn't inherit the unused
    # poolDefaults builder toleration. Hygienic, not load-bearing:
    # post r37 bug_001 the controller MERGES (never replaces) the
    # rio.build/fetcher toleration with operator-set tolerations, so
    # even a non-null override here would still get the fetcher
    # toleration appended (`r[ctrl.pool.fetcher-tolerations]`).
    tolerations: null
    # §13e: null-clear so the inherited poolDefaults.nodeSelector
    # (rio.build/node-role: builder) doesn't pin fetcher pods to
    # builder nodes — and so the reconciler injects the pool-static
    # {rio.build/fetcher: true} default (§13e B4: load-bearing for
    # builtin FODs whose hw_class_names=[] yields no per-intent
    # affinity). Per-intent affinity (cells_to_selector_terms reads
    # intent.hw_class_names ⊇ {fetcher-*}) composes for arch-typed
    # FODs. Arch is also per-intent (hw.labels carries
    # kubernetes.io/arch); the I-098 pool-static arch nodeSelector
    # is the *builder* mechanism — see pod.rs `if !fetcher && ...`.
    nodeSelector: null
  # Multi-arch: add per-arch entries (EKS deploy.rs does this via
  # --set-json pools):
  #   - {name: aarch64, kind: Builder, systems: [aarch64-linux]}
  #   - {name: aarch64-fetcher, kind: Fetcher,
  #      systems: [aarch64-linux, builtin], tolerations: null,
  #      nodeSelector: null}

# Base for every Pool. The pool.yaml template deep-merges each
# `pools[]` entry over this, so security posture (privileged/
# hostUsers/seccompProfile) and scheduling (tolerations/nodeSelector)
# stay single-sourced across all per-arch pools. Helm's `null`-deletes-
# key deep-merge semantics work for overlays.
#
# kind=Fetcher entries SHOULD NOT inherit privileged/hostUsers/
# seccompProfile (CRD CEL rejects them at admission); the reconciler
# forces ADR-019 hardening regardless. Fetcher entries typically override
# `nodeSelector`; image stays `rio-builder` (controller injects
# RIO_EXECUTOR_KIND per-pod).
poolDefaults:
  enabled: false
  features: []
  image: rio-builder
  # No dispatch-protocol knob: the pull/report unary protocol is the
  # only delivery path (the stream session protocol and the
  # dispatchMode selector are retired). Every executor pod gets the
  # 45s AD5 abort grace.
  # 50Gi. Reconciler adds this verbatim to every BUILDER pod's
  # ephemeral-storage request/limit AND the fuse-cache emptyDir
  # sizeLimit. Single-sourced through controller.toml
  # `[nodeclaim_pool].fuse_cache_bytes` — NOT the per-Pool CRD spec
  # (CEL-rejected for BOTH kinds since r35; see
  # docs/spec/components/controller.typ). Controller fallback when unset
  # is 8Gi (`BUILDER_FUSE_CACHE_BYTES`) — the safe minimum so non-helm
  # Pools schedule on small-disk nodes; prod overrides UP here. Raising
  # this grows EVERY builder pod's ephemeral-storage request — check
  # node capacity headroom before bumping.
  #
  # MEASURED RULED (live_057-d, 2026-06-11 — the signed A1 record):
  # fuseCacheBytes STANDS at 50 GiB until the trigger fires. For warm
  # pods this addend DOMINATES the request — a 1 GiB solve requests
  # 1×1.5 + 50 + 1 = 52.5 GiB (the incident's measured shape), and at
  # the 25 GiB defaultDisk the 88.5 GiB default-pod request is 56%
  # fuse (bind[14-disk-ceiling.sh] — the W10-CQ rows assert these
  # numbers against the live values). A blind static cut is the
  # REJECTED alternative: builder input closures are WORKLOAD-shaped,
  # not script-shaped (contrast fetcherFuseCacheBytes below — a fetch
  # script's deps, safely small), and an undersized cache re-creates
  # the documented retry-to-exhaustion poison with no escalation
  # lane; the cost asymmetry (a wrong cut poisons builds; a wrong
  # keep wastes placement) demands measurement first.
  # TRIGGER (owner queue, EX-2 form; the wipe-redeploy window is the
  # natural application point): p99 per-pod
  # rio_builder_fuse_cache_bytes_used over a 7-day production soak
  # < the candidate budget ⇒ drop fuseCacheBytes to ceil(p99 × 1.5).
  # The occupancy gauge is the cross-plane instrument (statfs-derived
  # on the fuse-cache dir, landed beside the builder quota sample —
  # the H9″ record; quoted here, never re-run).
  # Evidence basis, machine fact — the committed family grep at the
  # decision base ba21f094c (`rg -o 'rio_builder_fuse_[a-z_]+'
  # rio-builder/src/ -N | sort -u`; 8 members, NO bytes-resident /
  # occupancy gauge among them — WHY measurement had to be
  # commissioned rather than assumed):
  #   rio_builder_fuse_cache_hits_total
  #   rio_builder_fuse_cache_misses_total
  #   rio_builder_fuse_circuit_open
  #   rio_builder_fuse_fallback_reads_total
  #   rio_builder_fuse_fetch_bytes_total
  #   rio_builder_fuse_fetch_duration_seconds
  #   rio_builder_fuse_index_divergence_total
  #   rio_builder_fuse_jit_lookup_total
  fuseCacheBytes: 53687091200
  # 4Gi. Fetcher-pod analogue of fuseCacheBytes
  # (`[nodeclaim_pool].fetcher_fuse_cache_bytes`). A FOD's FUSE cache
  # only ever holds the fetch script's input closure (curl/git/JDK-class
  # toolchains), not the artifact it downloads — that lands in the
  # overlay emptyDir, which is sized from the intent's disk_bytes and
  # grows via the scheduler's reactive disk floor on eviction. Unlike
  # the overlay, this dimension does NOT escalate on eviction: a FOD
  # whose input closure exceeds it retries to exhaustion and poisons,
  # so raise it HERE if a fetcher toolchain outgrows it. Controller
  # fallback when unset is 4Gi (`FETCHER_FUSE_CACHE_BYTES`).
  fetcherFuseCacheBytes: 4294967296
  # privileged:true is an ESCAPE HATCH for clusters whose containerd
  # lacks base_runtime_spec device injection. It disables seccomp
  # entirely (ADR-012) and is unacceptable for multi-tenant.
  # Production on EKS/GKE should NOT need this.
  #
  # privileged=false + seccompProfile=Localhost: containerd's
  # RuntimeDefault seccomp profile omits pivot_root from the
  # CAP_SYS_ADMIN allowlist. The Localhost profile (nix/nixos-node/
  # seccomp/rio-builder.json, baked into the AMI) is RuntimeDefault +
  # pivot_root + {ptrace, process_vm_readv} − {bpf, setns,
  # process_vm_writev} — read-side tracing is allowed so sanitizer/
  # debugger check phases work (Yama-confined to descendants); the
  # fetcher profile keeps all five denied.
  #
  # hostUsers default = true here so k3s VM tests work without
  # idmap-mount support on /dev/fuse — and EKS runs true AS WELL:
  # xtask deploy.rs deliberately does NOT override it (I-186:
  # hostUsers:false breaks FUSE passthrough, pinned until P0560
  # deletes FUSE; the previous claim here that deploy.rs flips it to
  # false was FALSE and was one of live_063's three contradiction
  # homes). The posture is load-bearing for disk evidence: kubelet
  # refuses project-quota assignment to host-user pods (quota decline
  # mode #4), so rio-builder self-assigns its projid at overlay setup
  # (rio-builder/src/quota.rs ensure_project_quota) instead of relying
  # on kubelet's userns-only half.
  privileged: false
  hostUsers: true
  seccompProfile:
    type: Localhost
    localhostProfile: operator/rio-builder.json
  # Pairs with the NodePool taint.
  tolerations:
    - key: rio.build/builder
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    rio.build/node-role: builder

# ──────────────────────────────────────────────────────────────────────────
# Conditional subchart: PG (dev only). From nixhelm (FOD), not vendored.
# Dev S3 (Rook) is NOT a subchart — operator-first-then-cluster lifecycle
# doesn't fit; `cargo xtask k8s -p k3s up` installs it as separate helm
# releases.
# ──────────────────────────────────────────────────────────────────────────
postgresql:
  enabled: false
  auth:
    database: rio
    username: rio
    # Used ONLY when existingSecret is unset (VM tests — airgapped,
    # hardcoded is fine). xtask k3s deploy generates a random
    # password, pre-creates rio-postgres + rio-postgres-auth Secrets,
    # and sets existingSecret so this value and postgres-secret.yaml
    # are both bypassed. Keeps the password out of helm values.
    password: rio
    existingSecret: ""
  primary:
    persistence:
      size: 5Gi
