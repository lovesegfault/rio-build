# Default values = prod topology (TLS on, external PG/S3, PDBs, NetworkPolicy).
# values/dev.yaml flips everything for local k3s.
# values/vmtest-full.yaml renders the full chart for k3s VM tests.

global:
  image:
    # Registry prefix (e.g., "123456.dkr.ecr.us-east-2.amazonaws.com").
    # Empty → bare repo names (dev: airgap-loaded images).
    # EKS: xtask passes --set global.image.registry=<ecr> from tofu output.
    registry: ""
    # Set via `--set global.image.tag=<sha>` (xtask computes via
    # git::image_tag()). NEVER committed — private ECR, dev tags include
    # -dirty-<hash>. See infra/eks/README.md.
    tag: ""
    pullPolicy: IfNotPresent
  # Region for ExternalSecrets SecretsManager provider. Set via --set from tofu output.
  region: ""
  # RUST_LOG for all rio-* binaries (gateway, scheduler, store, controller).
  # Full tracing_subscriber::EnvFilter syntax — a simple level name sets
  # everything, or target individual crates/modules:
  #   "debug"                            all crates at debug
  #   "info,rio_gateway=trace"           gateway at trace, rest at info
  #   "warn,rio_scheduler::actor=debug"  one module at debug, rest at warn
  # Empty string → env var omitted → binary's built-in "info" fallback.
  # Builder pods inherit the controller's RUST_LOG verbatim (builders.rs
  # reads its own env and passes it through), so one knob covers all.
  logLevel: "info"
  # IPv6 CIDR containing the postgres endpoint, for the store-egress
  # CiliumNetworkPolicy toCIDRSet rule. EKS: vpc_ipv6_cidr_block
  # (terraform output, set via xtask deploy --set). vmtest-full: the
  # test vlan /64. Default fc00::/7 (ULA) covers a self-hosted PG on a
  # private-range address.
  postgresCidr: "fc00::/7"

# ADR-019 four-namespace split: privileged PSA narrows to the two
# namespaces whose pods actually need CAP_SYS_ADMIN (FUSE mount).
# Control plane + store drop to restricted — runAsNonRoot, drop-ALL,
# seccomp:RuntimeDefault, readOnlyRootFilesystem (templates/
# {scheduler,gateway,controller,store}.yaml set the securityContext
# PSA enforces). All four carry `app.kubernetes.io/part-of: rio-build`
# so NetworkPolicy namespaceSelector rules match without enumerating
# names.
#
# `system` is the control-plane namespace (scheduler, gateway,
# controller) and the one `helm --namespace` anchors to. Cross-ns
# resources (store, pool) set explicit
# `metadata.namespace:` from the other entries.
namespaces:
  create: true
  system:   {name: rio-system,   psa: restricted}
  store:    {name: rio-store,    psa: restricted}
  builders: {name: rio-builders, psa: privileged}
  fetchers: {name: rio-fetchers, psa: privileged}

# LLVM coverage profraw collection. When enabled, each rio pod gets
# LLVM_PROFILE_FILE=/var/lib/rio/cov/rio-$(POD_NAME)-%p-%m.profraw + a
# hostPath volume mounted there. Profraws flush via atexit on graceful
# SIGTERM.
# The k3s-full VM test fixture passes coverage.enabled=true via --set
# when running instrumented binaries.
coverage:
  enabled: false

# JWT tenant tokens — asymmetric ed25519. Gateway signs (Secret),
# scheduler+store verify (ConfigMap). Dual-mode PERMANENT: jwt.enabled
# controls whether the K8s objects render; per-deployment operator
# choice. Off → gateway never mints, verify-side interceptor is inert
# (None pubkey → pass-through), tenant identity flows via
# SubmitBuildRequest.tenant_name instead. Both paths stay maintained.
jwt:
  enabled: false
  # 32-byte ed25519 seed, base64. Generate: `openssl rand -base64 32`.
  # NEVER commit a real value — set via --set or values override file.
  # Gateway decodes this to SigningKey::from_bytes.
  signingSeed: ""
  # 32-byte ed25519 public key, base64. Derived from signingSeed —
  # operator can compute offline or extract from a running gateway's
  # logs (it's public). Verify-side decodes to VerifyingKey::from_bytes.
  publicKey: ""

# External Secrets Operator sync from AWS Secrets Manager.
# When enabled: renders ClusterSecretStore + 3 ExternalSecrets (rio-postgres
# with templated Aurora URL, rio-hmac, rio-signing-key). Requires ESO in the
# cluster and the bootstrap Job (below) to have populated rio/hmac and
# rio/signing-key in Secrets Manager.
externalSecrets:
  enabled: false
  clusterSecretStore: rio-aws-secrets
  # ARN of the Aurora master password secret (manage_master_user_password
  # creates it). Set via --set from tofu output db_secret_arn.
  auroraSecretArn: ""
  # Aurora writer endpoint (hostname only). Set via --set from tofu output.
  auroraEndpoint: ""

# Helm pre-install/pre-upgrade hook Job. Idempotent — describe-secret guards.
# Generates rio/hmac (openssl rand 32) and rio/signing-key (nix-store
# --generate-binary-cache-key) in Secrets Manager IF THEY DON'T EXIST.
# Regenerating would invalidate in-flight assignment tokens / all narinfo
# signatures. The public signing key goes to rio/signing-key-pub so operators
# can read it without touching the private half.
bootstrap:
  enabled: false
  # Nix-built image (awscli2 + openssl + nix). See nix/docker.nix.
  image: rio-bootstrap
  serviceAccount:
    # IRSA: secretsmanager:CreateSecret, PutSecretValue, DescribeSecret on rio/*
    annotations: {}

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true
  # S3 VPC endpoint CIDR for store direct-S3 writes (chunk upload).
  # AWS-specific; varies by VPC. Unset → no S3 egress rule in
  # store-egress (store uses local filesystem backend only).
  storeS3Cidr: ""

# nix.conf knobs for the rio-nix-conf ConfigMap (mounted into worker
# pods at /etc/rio/nix-conf/nix.conf; see rio-builder/src/executor/
# sandbox.rs for the compiled-in fallback).
nixConf:
  # Content-addressed mirror(s) for builtin:fetchurl. When a flat-hash
  # FOD's origin URL is dead, nix-daemon tries {mirror}/{algo}/{hex}
  # first. Only fires for outputHashMode = "flat" — recursive (NAR-hash)
  # FODs skip it. Space-separated list; "" disables the lookup.
  hashedMirrors: "http://tarballs.nixos.org/"

# Prometheus-operator scrape wiring. Renders ServiceMonitor + PodMonitor +
# PrometheusRule (templates/{servicemonitor,prometheusrule}.yaml). Requires
# the monitoring.coreos.com/v1 CRDs — kube-prometheus-stack (infra/eks/
# monitoring.tf on the reference deploy) or a standalone prometheus-operator
# install. Disabled by default so the chart applies on CRD-less clusters
# (k3s VM tests); xtask k8s deploy flips it on for EKS.
monitoring:
  enabled: false
  scrapeInterval: 30s

# ──────────────────────────────────────────────────────────────────────────
# rio-controller
# ──────────────────────────────────────────────────────────────────────────
# K8s operator. Watches Pool CRDs, spawns one Job per
# build/FOD. HARD replicas=1: only the nodeclaim_pool reconciler is
# lease-gated (rolling-upgrade surge safety); the Pool reconciler is
# NOT — two replicas double-spawn Jobs. 30s reschedule gap during pod
# restart is acceptable.
controller:
  enabled: true
  image: rio-controller
  # Addresses passed through to builder pods via the controller's env.
  # Lazy-connected per-reconcile — transient scheduler outage doesn't kill
  # the controller.
  # Cross-ns FQDNs per ADR-019 four-namespace split. Scheduler stays
  # in rio-system; store lives in rio-store. Short names only resolve
  # within the same namespace — the controller's rio-system pod can
  # resolve rio-scheduler but NOT rio-store without the .rio-store.svc
  # suffix. Spelled out here (not templated from .Values.namespaces)
  # because these are passed through to builder/fetcher pods via env,
  # and overriding one without the other is a valid dev-test pattern.
  schedulerAddr: rio-scheduler.rio-system:9001
  storeAddr: rio-store.rio-store:9002
  # Balanced-channel config also passed through to workers. Workers
  # DNS-resolve the headless Service, health-probe pod IPs, route to leader.
  # Empty → workers fall back to single-channel (VM tests don't set this).
  schedulerBalanceHost: rio-scheduler-headless.rio-system
  schedulerBalancePort: 9001
  # Same balance pattern for rio-store: workers p2c across store
  # replicas. All store pods serve (no leader); this is for load
  # distribution. Empty → single-channel fallback.
  storeBalanceHost: rio-store-headless.rio-store
  storeBalancePort: 9002
  # Extra env injected after base vars. Coverage mode injects
  # LLVM_PROFILE_FILE here.
  extraEnv: []
  # hostNetwork: CoreDNS in k3s VM tests doesn't know NixOS-test VM
  # hostnames. hostNetwork → pod uses node's /etc/hosts.
  hostNetwork: false
  resources:
    # Controller watches all builder Jobs (kube-rs reflector cache).
    # 256Mi OOMed at ~1140 Jobs (I-147). Sized for thousands of
    # concurrent builds: ~10k Jobs × ~5KB cached + CRD watches +
    # ComponentScaler endpoint polling.
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# ──────────────────────────────────────────────────────────────────────────
# kube-build-scheduler — second kube-scheduler (ADR-023 §13b)
# ──────────────────────────────────────────────────────────────────────────
# Upstream registry.k8s.io/kube-scheduler with a `MostAllocated`
# NodeResourcesFit scoring profile under `schedulerName:
# kube-build-scheduler`. Builder Jobs set `spec.schedulerName:
# kube-build-scheduler` (B12) so the default kube-scheduler ignores
# them; this instance bin-packs onto the fewest nodes so the
# nodeclaim_pool FFD simulation and Karpenter's consolidation see tight
# residuals. replicas=2, leader-elects on its own Lease
# (kube-build-scheduler in rio-system).
#
# Disabled in airgapped vmtest profiles (registry.k8s.io image isn't
# preloaded). The 10 PriorityClasses (templates/priorityclass.yaml)
# render unconditionally — they're referenced by builder pods regardless.
buildScheduler:
  enabled: true
  # Upstream kube-scheduler image. Digest-pinned (03-digest-pin policy:
  # floating third-party tag → ImagePullBackOff on upstream churn). Tag
  # tracks nix/pins.toml `[cluster] kubernetes_version` so scheduler-API
  # skew stays within the supported ±1 minor. Hand-maintained: bump the
  # tag and digest here when the kubernetes_version pin moves (the VM
  # tests override this with their own preloaded image, so they will
  # not catch a stale default).
  image: registry.k8s.io/kube-scheduler:v1.35.0@sha256:0ab622491a82532e01876d55e365c08c5bac01bcd5444a8ed58c1127ab47819f
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}

# ──────────────────────────────────────────────────────────────────────────
# rio-store
# ──────────────────────────────────────────────────────────────────────────
# PG + S3/inline chunk storage. replicas=1 by default; multi-replica
# is safe — startup migrations serialize via pg_try_advisory_lock
# (r[store.db.migrate-try-lock]).
store:
  enabled: true
  image: rio-store
  # Static replica count — only consulted where autoscaling is
  # disabled (environments without the KEDA operator: the k3s VM tests
  # and local dev). Everywhere else the replica count is owned by the
  # ScaledObject below and this field is not rendered.
  replicas: 1
  # Horizontal autoscaling on the three store load classes (decision
  # 5): substitution backlog (leading — the scheduler's
  # rio_scheduler_substituting_derivations gauge, known at merge time),
  # builders-per-replica (leading — rio_scheduler_open_attempts, the
  # busy-fleet gauge), and CPU (reactive corrective). The KEDA
  # ScaledObject is the SINGLE owner of the store Deployment's replica
  # count — the store ComponentScaler CR it replaces is gone (the CRD
  # and controller reconciler remain for future targets). Enabled by
  # default (the gateway convention); the flag exists only because the
  # ScaledObject CR requires the KEDA operator (infra/eks/keda.tf) and
  # a prometheus scraping the scheduler — the k3s VM-test and
  # local-dev profiles run neither, set enabled=false, and fall back
  # to the static `replicas` above.
  #
  # Trigger rationale + scale-down damping live in
  # templates/store-scaledobject.yaml.
  autoscaling:
    enabled: true
    # Production floor — inherited from the retired ComponentScaler
    # CR's min: 2. Carries the first ~1-4 min of a post-wipe
    # substitution wave at reduced throughput until scale-out lands;
    # raising it is a cost decision (store pods request 16 CPU / 8 Gi
    # on EKS).
    minReplicas: 2
    # PG-connection SAFETY BACKSTOP, NOT a product cap (owner decision
    # 2026-06-02: store scale is Karpenter-bounded; the operative scale
    # knob is karpenter.nodePools[rio-store].limits.cpu below — D1:
    # the store fleet's own pool; rio-general no longer hosts it).
    #
    # This default is the MODELED PG fallback for chart-only consumers
    # (no Karpenter context here — a bare chart install has nothing to
    # clamp against). On EKS, `xtask deploy`'s pg preflight measures
    # the live max_connections, asserts it equals the tf model
    # (infra/eks/rds.tf locals — the AWS PG table at the provisioned
    # capacity), and --sets the ceiling derived from the MEASUREMENT;
    # this value is overridden on every deploy.
    #
    # Derivation (deploy.rs derive_store_ceiling — change together):
    # the MIN of two arms (D-052-1b):
    #   pg arm: floor((0.70 × max_connections − 34) / pgMaxConnections 20)
    #     where 34 = scheduler 2×10 + controller 4 + psql headroom 10
    #   hostable arm: floor(rio-store pool limits.cpu / store node vCPU)
    #     — required one-replica-per-node podAntiAffinity (store.yaml)
    #     means each replica pins a WHOLE node, and Karpenter counts
    #     node capacity (32 vCPU for the 16-cpu request on the gen-8
    #     families) against the pool limit. floor(1500/32) = 46.
    #     (D1: the store fleet moved off rio-general onto its own
    #     rio-store pool; the preflight reads that pool's limit.)
    # At the modeled config (rds.tf: min_capacity=1 lifts the AWS
    # PG min-capacity cap; max_capacity=32 ⇒ max_connections 5,000;
    # owner decision Q1 2026-06-03):
    #   pg arm floor((0.70×5000 − 34)/20) = 173; deployed = min(173,
    #   46) = 46 ⇒ worst case 46×20 + 34 = 954 conns, far under the
    #   70%-of-parameter budget; the pg arm re-binds only if the
    #   karpenter pool grows ~3.7× (limits.cpu ≳ 5,540).
    # WORST CASE (min_capacity ≤ 0.5 re-caps max_connections at
    # 2,000): the pg arm gives 68, still clamped to 46 — the
    # preflight derives and deploys automatically; do not hand-tune
    # this default for it. max_connections is a STATIC parameter: a
    # capacity change takes effect only after an instance reboot.
    # live_052 is why the hostable arm exists: the pg-only ceiling
    # (173) let KEDA commit 4→173 in 75s; 133 replicas were
    # structurally unschedulable and Karpenter churned NodeClaims at
    # the pool limit until a hand --set pinned 46 — which the next
    # `eks up` would have silently clobbered back. The clamp makes
    # the schedulable bound the deployed bound.
    # S3 is not a binding constraint: content-hashed chunk keys spread
    # prefixes uniformly and ~46 replicas × chunkUploadMaxConcurrent=8
    # ≈ 370 concurrent PUTs, orders below S3's per-prefix envelope.
    # Replicas requested past node capacity simply stay Pending until
    # Karpenter mints a node or the pool limit is raised (the
    # AverageValue triggers divide by the scale subresource's count and
    # the CPU trigger averages running pods — no thrash); the clamp
    # keeps that Pending set near zero instead of fleet-sized.
    maxReplicas: 173
    # Desired replicas (backlog trigger) =
    # ceil(sum(rio_scheduler_substituting_derivations) / this).
    # IN JOB UNITS: the gauge counts derivations with unresolved
    # materialization jobs, not store paths (bug_299 — the old
    # paths-per-replica seed divided a jobs gauge, silently
    # under-asking ~7×). Seeded 85 ≈ 600 paths / (~7 paths per job in
    # the reference incident's backlog mix): the same ~7.4k-path
    # (~1,050-job) wave asks for ~12 replicas. Deliberately
    # overscale-biased (owner default Q7 2026-06-03) — more store pods
    # minutes earlier on post-wipe waves — until the post-wipe
    # warm-phase capture (deployment checklist P10) re-derives it.
    # Render-time unit check: rio.promTrigger × files/metric-units.json.
    targetBacklogJobsPerReplica: 85
    # Desired replicas (builder trigger) =
    # ceil(sum(rio_scheduler_open_attempts) / this). Seeded from the
    # ComponentScaler's seedRatio (50; its learned value converged
    # near ~70). Static ratio: the learned-ratio adaptation is traded
    # for the CPU trigger plus an occasional re-tune from the
    # warm-phase capture.
    targetBuildersPerReplica: 50
    # D2/live_056-c demand-side scale-down inhibitor threshold:
    # client-plane PutPath retry rate (retries/s) per replica. R17
    # NAMED VIOLABLE const; derivation: one actively-retrying client
    # emits ~0.1-0.5 retries/s (the gateway's backoff cadence), so
    # 0.05 makes a SINGLE struggling client hold a couple of replicas
    # and incident-scale pressure (hundreds of clients — the live_056
    # shape) saturate the trigger to the ceiling: desired never
    # shrinks below current during a reachability outage. The counted
    # population EXCLUDES platform health traffic BY THE LAW (the
    # series is gateway retry events; kubelet probes never enter it —
    # see store-scaledobject.yaml's inhibitor comment). Lower = more
    # protective (inhibits on fainter demand); raise only with a
    # recorded re-derivation.
    targetRetryAttemptsPerReplica: 0.05
    # live_062 store scale-in safety: desired replicas (ingest-session
    # trigger) = ceil(sum(rio_store_log_active_ingest_sessions) /
    # this). The gauge is store-side TRUTH about live AppendLog
    # sessions; the scheduler-side gauges above LEAD the load but LAG
    # the drain — builds complete (attempts close, backlog empties)
    # while their log tails are still uploading, and the live_062
    # scale-in killed 5 store pods in ~7min mid-fan-out exactly in
    # that window (sessions were not a scaler input; each kill burned
    # a 45s ingest-lease steal on the builders). R17 NAMED VIOLABLE;
    # derivation: one session ≈ one live builder log stream, the same
    # denominator class as targetBuildersPerReplica — seeded equal
    # (50). Under the max-over-triggers fold this trigger only BINDS
    # in the drain window where attempts have closed but sessions
    # linger: replicas hold until the tails land, then the 300s
    # scale-down window sees all triggers quiet and collapses as
    # before. Render-time unit check: rio.promTrigger ×
    # files/metric-units.json.
    targetIngestSessionsPerReplica: 50
    # CPU saturation trigger (percent average utilization).
    cpuUtilization: 70
    # In-cluster prometheus the KEDA scaler queries. Default matches
    # the reference deploy (kube-prometheus-stack release in the
    # `monitoring` namespace, infra/eks/monitoring.tf).
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  serviceAccount:
    # EKS IRSA: eks.amazonaws.com/role-arn set via --set from tofu output.
    # Store needs S3 access; IRSA attaches IAM role via projected token.
    # NO static AWS keys.
    annotations: {}
  chunkBackend:
    # inline = NARs in PG (works out of the box, doesn't scale).
    # s3 requires bucket (+ endpoint/region/creds via env or IRSA).
    kind: s3
    bucket: ""
    # Bucket-level prefix prepended to ALL rio keys (chunks/, logs/).
    # Empty = dedicated bucket (the xtask/EKS assumption): keys land at
    # `chunks/ab/...` and `logs/...` directly. Set only when sharing a
    # bucket with non-rio data, e.g. `prefix: rio` → `rio/chunks/ab/...`.
    prefix: ""
    # For Rook RGW in dev: http://rook-ceph-rgw-rio-store.rook-ceph:80
    endpoint: ""
  # For Rook RGW dev: AWS_ACCESS_KEY_ID etc. Prod uses IRSA (no extra env).
  extraEnv: []
  # Cross-replica TailLog proxy dial template. {pod} is replaced with
  # the owning replica's RIO_STORE_REPLICA_ID (status.podIP via the
  # downward API — see store.yaml). Keep {pod} unbracketed: the store
  # binary brackets v6 identities itself at dial time. Only
  # override if the store stops being a Deployment (a StatefulSet's
  # per-pod DNS names would let this go back to a name-based template).
  # {pod} is substituted with the replica identity (status.podIP via
  # the downward API); the store brackets IPv6 identities itself, so
  # the template stays bare. THE only default — the template renders
  # this value verbatim; null/empty disables the cross-replica proxy
  # fail-closed (history-only view for readers on non-owning replicas).
  logPeerUrlTemplate: "http://{pod}:9002"
  # Upstream binary-cache egress allowlist. Each entry opens 443/TCP
  # to the given FQDN from the rio-store pod via CiliumNetworkPolicy
  # `toFQDNs` (DNS-aware — Cilium's L7 DNS proxy resolves and tracks
  # the IP set, no manual CIDR maintenance). Empty list → the
  # store-egress-upstream CNP does NOT render, and the store cannot
  # reach any public IP (the base store-egress policy allows only
  # DNS + postgres + S3 VPC endpoint).
  upstreamCaches: []
  # - host: cache.nixos.org
  # Max concurrent S3 PutObject calls per put_chunked. Per-replica
  # admission (r[store.substitute.admission]) bounds how many
  # put_chunked calls run at once; this bounds fan-out WITHIN one.
  # Product `substituteAdmissionPermits × this` should sit under the
  # aws-sdk's ~1024 connection pool with headroom — at the default
  # admission=64 that's 512. Lower if DispatchFailure appears in
  # store logs during large-NAR ingest (try s3MaxAttempts first).
  chunkUploadMaxConcurrent: 8
  # GetPath chunk-prefetch depth (.buffered(K)). Cold-cache throughput
  # ceiling ≈ K × 64KiB / s3_ttfb; per-stream memory ≤ K × 256KiB.
  # K=8 (the old hardcoded value) capped a cold 250MB path at ~3m
  # against S3-standard. 64 → ceiling ~90MB/s at 45ms TTFB, ≤16MiB/stream.
  chunkPrefetchK: 64
  # Max wait for in-flight GetPath body streams to complete on SIGTERM,
  # after the drain-grace endpoint-propagation sleep. KEDA scale-down
  # assumes SIGTERM drains in-flight work; without this a 14→2
  # scale-down resets the underlying h2 connection mid-stream and the
  # builder retries the whole NAR from byte 0.
  # terminationGracePeriodSeconds = 6 + this + 24.
  streamDrainSecs: 90
  # aws-sdk retry ceiling per S3 op. Raised from sdk default (3) —
  # S3-compatible backends (Rook RGW, MinIO) recycle idle connections
  # more aggressively than AWS S3; closed-pool-connection surfaces as
  # transient DispatchFailure that retries absorb. Raise further if
  # DispatchFailure persists; each retry has exponential backoff so
  # 10 attempts ≈ 30s worst-case per chunk.
  s3MaxAttempts: 10
  # Cap on paths in a FindMissingPaths request (DoS guard). 100k path
  # strings ≈ 8 MB per request. Raise if a single `nix copy` of a
  # very large closure is rejected with "too many paths"; lower on
  # memory-constrained store pods. Matches gateway wire MAX_COLLECTION_COUNT
  # (1M) — gateway is the trust boundary, store re-bounding tighter only
  # rejects batches gateway already admitted (I-130).
  maxBatchPaths: 1048576
  # PG connection pool size. The QueryPathInfo / FindMissingPaths hot
  # path under autoscaled builder load is bottlenecked on connection
  # acquisition (PK lookups, not query latency).
  #
  # This is the per-replica divisor of the connection budget: the
  # store ceiling is floor((0.70 × max_connections − 34) / THIS) —
  # see autoscaling.maxReplicas above and infra/eks/rds.tf for the
  # budget model. Pools also set idle_timeout=60s so a burst-grown
  # pool shrinks back; live pg_pool_util ≈ 0.01 ⇒ ~0.5 conns actually
  # in use (I-171). xtask deploy --sets this from its single-sourced
  # constant (STORE_PG_MAX_CONNECTIONS_PER_REPLICA).
  pgMaxConnections: 20
  # Per-replica r[store.substitute.admission] gate. Unset → derived as
  # (pgMaxConnections × 3).clamp(64, 128). Override only when the
  # derived value mis-tracks the upstream-fetch bottleneck.
  # substituteAdmissionPermits: 128
  # Build-log retention (days) for the hourly TTL sweep. On EKS this
  # is OVERWRITTEN every deploy from the terraform variable
  # log_retention_days (bug_326): the S3 logs/ lifecycle backstop
  # expires at the SAME variable + 7 days of slack, so the two
  # deleters cannot drift. Chart-only S3 operators (no xtask/EKS):
  # change the tf variable if you have the lifecycle, or keep your
  # bucket's lifecycle ≥ this + slack manually — a lifecycle below
  # the sweep's window hard-deletes chunks the read path still
  # references (the loud symptom is rio_store_log_read_data_loss_total
  # with object-missing causes).
  logRetentionDays: 30
  # Owner-side download stall window, r[store.substitute.stall-abort].
  # Unset → binary default 180 s (= 6 missed progress heartbeats); also
  # the competing-replica stall-reclaim threshold. Persist-phase and
  # PutPath claims are exempt. Override only when upstream transfer
  # cadence genuinely differs from the default's assumptions — 0 aborts
  # every download instantly (cluster-wide substitution outage).
  # substituteStallSecs: 180
  # The store-side materialization-job executor — THE substitution
  # mechanism (design §8): poll → claim → execute → report against the
  # scheduler's ExecutorService, presenting the store-service
  # credential minted from the serviceHmac mount. The executor spawns
  # iff schedulerAddr is set (PD-D2); rollback below the cutover is
  # binary-version rollback, not a values flip.
  materialization:
    # Concurrent jobs per replica (design §2.2 item 1; the binary
    # default stays 8 — this value is the production lever). The
    # workers are I/O-bound poll → fetch → ingest loops (live: pods
    # held 150-310 millicores of the 16-CPU EKS request during a
    # burst at 8), so CPU does not bound n. In-flight NAR bytes are
    # governed by the shared nar_bytes_budget semaphore (one
    # whole-NAR reservation per substitute leg,
    # r[store.put.nar-bytes-budget+6]): under pathological
    # all-large-NAR load extra workers PARK on the byte budget
    # (BudgetParked exempts a parked owner from stall takeover)
    # instead of buffering unbounded NAR bytes — the budget is a
    # backpressure bound, sized independently of this knob.
    # Gate pressure (r[store.materialize.gate-share+1]): the executor's
    # total draw on the r[store.substitute.admission] gate is bounded
    # STRUCTURALLY by the pod path-slot pool — P = effective
    # admission cap / 2 (override-aware; pgMaxConnections 20 →
    # (20×3).clamp(64,128) = 64 → P = 32) — so ≥ cap/2 permits stay
    # available to QueryPathInfo/GetPath miss traffic AT ALL TIMES,
    # for ANY value of this knob and pathFanout. n and F are
    # SHAPING-ONLY levers (n bounds claimed jobs, F bounds per-job
    # width; safety lives in P alone): raising either past the pool
    # shifts queuing to the baseline path-slot (watch
    # rio_store_executor_path_slot_baseline_waiters / _wait_seconds —
    # the n×F > P transient regime is expected and FIFO-fair; n > P
    # additionally warns at boot). PG queuing at 32 workers × short
    # per-query claims vs the 20-conn pool is acceptable — the
    # substitute path never holds a connection across an upstream
    # fetch.
    # History (live_061-R4): the round-6 rejection of n=64 was a
    # WHOLE-GATE occupancy argument (pre-split, full worker occupancy
    # saturated the shared admission gate and self-parked on
    # RESOURCE_EXHAUSTED). The structural P=cap/2 split (e77b67e7c)
    # retired that premise — a future raise is gate-safe by
    # construction and only pool-bound: n=32=P here means full-fleet
    # claim occupancy exactly saturates the path-slot pool; past P,
    # queueing moves to the FIFO-fair baseline acquire (watch
    # rio_store_executor_path_slot_baseline_waiters). live_061's 1-3
    # observed walks were a CLAIM-PLANE starvation, not an n limit.
    executorConcurrency: 32
    # Bounded intra-job substitution fan-out
    # (r[store.materialize.path-fold+1]): per-job path-resolution window
    # width F — up to this many concurrent path fetches per walk. At
    # full worker occupancy walks run ~1 slot each (job-grain
    # parallelism, the backlog-burst case); at low occupancy walks
    # widen toward F (path-grain, the big-closure drain-tail case) —
    # the two regimes self-balance inside the path-slot pool's
    # fair-FIFO yield law. Matches the binary default (gate parity).
    pathFanout: 4
    # The scheduler ExecutorService address — the store→scheduler edge
    # the store-egress netpol allows (port 9001).
    schedulerAddr: rio-scheduler.rio-system:9001
  # Global NAR buffer budget (bytes) — RIO_NAR_BUFFER_BUDGET_BYTES.
  # D4 law (enforced by the binary's validate() against the
  # downward-API memory limit): budget + non-NAR reserve (4 GiB,
  # rio_common::limits::STORE_NON_NAR_RESERVE_BYTES — chunk cache 2 GiB
  # + log ingest 1 GiB + runtime slack 1 GiB) <= limits.memory.
  # Chart default: the MAX_NAR_SIZE floor (4 GiB — one whole-NAR
  # reservation; validate() rejects anything lower), paired with the
  # 8Gi limit below at exactly budget + reserve. EKS deploys override
  # BOTH from one derivation site (xtask deploy: budget 32 GiB,
  # limit 36Gi) — never hand-tune the pair apart.
  narBufferBudgetBytes: 4294967296
  resources:
    # Requests stay small so VM-test k3s (2-node QEMU) can schedule;
    # EKS gets real sizing from xtask deploy. The LIMIT is the D4 pair
    # of narBufferBudgetBytes above: 4 GiB budget + 4 GiB reserve =
    # 8Gi (limits don't reserve node memory, so this schedules
    # anywhere requests fit). nix/tests/helm/46-store-memory-identity.sh
    # pins the rendered pair to the law.
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 8Gi}

# ──────────────────────────────────────────────────────────────────────────
# rio-scheduler
# ──────────────────────────────────────────────────────────────────────────
# Leader-elected via K8s Lease. replicas=2: ONE dispatches; standby merges
# DAGs (state warm) but dispatch_ready early-returns until it acquires.
scheduler:
  enabled: true
  image: rio-scheduler
  replicas: 2
  serviceAccount:
    # EKS IRSA: eks.amazonaws.com/role-arn set via --set from tofu output.
    # Scheduler needs EC2 DescribeSpotPriceHistory/DescribeInstanceTypes
    # for the ADR-023 spot-price poller. (The S3 logs/* grant this role
    # used to carry went away with the log flusher — build logs are
    # written by rio-store now.)
    annotations: {}
  # All replicas contend for SAME Lease. Presence of this name ENABLES lease
  # mode (LeaseConfig::from_env returns None without RIO_LEASE_NAME →
  # always-leader mode, WRONG with replicas>1).
  leaseName: rio-scheduler-leader
  storeAddr: rio-store.rio-store:9002
  # drv_executions lifecycle-row retention (days) for the
  # scheduler-owned execution-row GC (store.log.sweep-ownership).
  # The artifact-before-row order is enforced structurally: the GC
  # refuses rows with surviving log chunks or a live ingest session,
  # under ANY value here. Keeping this >= store.logRetentionDays is
  # an efficiency choice (rows age out right as their chunks do), not
  # a correctness requirement. Rows are reclaimed only when terminal,
  # assignment-closed, unreferenced by the attempt ledger, and
  # artifact-free.
  execRetentionDays: 30
  # I-204: requiredSystemFeatures values that are CAPABILITY HINTS, not
  # hardware gates. Stripped at DAG-insert so spawn/dispatch ignore them.
  # nixpkgs convention: big-parallel = "uses many cores", benchmark =
  # "wants quiet machine". Neither needs special hardware — any builder
  # qualifies. Without this, {big-parallel}-only work routes exclusively
  # to the kvm pool (the only one advertising it) → spawns .metal for
  # firefox/chromium. SLA `solve_intent_for` + `resource_floor` doubling
  # own initial sizing for these (D6).
  softFeatures:
    - big-parallel
    - benchmark
  # ADR-023 SLA-driven sizing. Renders the [sla] table in scheduler.toml
  # — mandatory (the SchedulerConfig has no Option arm). Durations in
  # seconds, sizes in bytes (the Rust SlaConfig deserializer is plain
  # serde — no humantime/bytesize).
  #
  # tiers: ladder of SLA targets. solve_tier picks the TIGHTEST feasible
  #   tier (sorted by p50→p90→p99); a tier with no targets is best-effort.
  # probe: cold-start sizing for never-seen (pname,system,tenant). cpu
  #   MUST be in [4, maxCores/4] — validated at scheduler boot.
  #   deadlineSecs: activeDeadlineSeconds for unfitted (probe/explore)
  #   builds; fitted keys derive from wall_p99.
  # featureProbes: per-requiredSystemFeatures override (e.g. kvm builds
  #   want a high mem floor regardless of cores).
  # max{Cores,Mem,Disk}: hard reject ceilings — solve does NOT clamp.
  #   maxCores < 1024 (PriorityClass bucket range).
  # hwClasses: h → node-label conjunction. MANDATORY (ADR-023 §13a) — keys
  #   match `<band>-<storage>-<arch>`; labels are what Karpenter NodePools
  #   stamp at templates/karpenter.yaml:123-127. 12 = band × storage × arch.
  #   arch in the label-match isolates per-arch hw_perf factor / cost /
  #   lead-time (Option B per ADR-023 hw-class arch design): the 6-class
  #   shape blended Graviton+x86 bench rows into one HwTable.factor[h] and
  #   one CostTable menu per cell. Karpenter NodePools stamp
  #   kubernetes.io/arch as a template label, so each hw-class now resolves
  #   to exactly one NodePool.
  # referenceHwClass: anchors ref-second normalization — IMMUTABLE across
  #   reloads without --allow-reference-change. mid-ebs-x86 chosen as the
  #   broadest us-east-2 quota (gen-6/7 c/m/r, no nvme constraint, x86 is
  #   the dominant build-traffic arch).
  # hwCostSource: "spot" = live DescribeSpotPriceHistory poll (lease-gated;
  #   IRSA `ec2:DescribeSpotPriceHistory` on the scheduler SA). "static" =
  #   fixed spot<od / hi>mid>lo seed ratios (cost.rs) — degrades cost
  #   ranking.
  # leadTimeSeed: populated by `xtask k8s probe-boot` AFTER first deploy.
  sla:
    tiers:
      - {name: normal, p50: 120, p90: 300, p99: 1200}
      - {name: best-effort}
    defaultTier: normal
    probe: {cpu: 16, memPerCore: 1073741824, memBase: 34359738368, deadlineSecs: 3600}
    # sh-008: per-soft-feature cold-start probe override. big-parallel
    # cold-starts at 48c (3× the default probe.cpu) — the explore
    # ladder's first rung is the only sizing signal nixpkgs declared.
    featureProbes:
      # ProbeShape::validate enforces cpu ≤ max_cores/4. The §13c-2
      # catalog-derived max_cores is 191 (not 192 — see the maxCores
      # comment below), so cpu ≤ 47.75. cpu=32 sizes the cold-start
      # probe to a hi-* class with headroom for the validator.
      big-parallel: {cpu: 32, memPerCore: 2147483648, memBase: 34359738368, deadlineSecs: 7200}
    # sh-008: per-soft-feature SIZING bias. Restricts the SLA candidate
    # hwClass set to those whose per-class core ceiling hosts ≥
    # minCores. Bias not constraint — degrades to the unbiased set when
    # no class qualifies. featureProbes is "first-attempt cold-start
    # shape"; this is "regardless of fit, candidate classes must host
    # ≥ minCores"; they compose.
    softFeatureSizing:
      big-parallel: {minCores: 32}
    # §13c-3: global cores/mem ceiling. Unset (the default) → derived
    # at boot from `describe_instance_types` ∩ requirements (Spot
    # only). Set explicitly to cap below the largest catalog type, OR
    # if hwCostSource=static (no catalog). The controller mirrors the
    # resolved global over `GetHwClassConfig`.
    #
    # Risk note: default `probe.cpu=16` requires the resolved global
    # ≥ 64 (the validate rule is `probe.cpu ≤ maxCores/4`). A
    # deployment whose Karpenter requirements only match instances
    # < 64c must EITHER set `probe.cpu ≤ 12` OR pin `maxCores`.
    #
    # The catalog-derived per-class ceiling reserves allocatable from
    # capacity on BOTH axes: `instance_cores − 1` (r40 bug_013) and
    # `instance_mem × 9/10` (r42 bug_005). `class_ceilings` takes
    # `min(catalog, maxCores)` and `min(catalog, maxMem)`, so a pin set
    # to a real instance's raw capacity is dead on either axis —
    # `maxCores: 192` for a 192-vCPU box loses to the catalog's 191,
    # and `maxMem: 1.5 TiB` for a 1.5-TiB box loses to the catalog's
    # 1.35 TiB. That's correct (the raw figure was never placeable)
    # but is a silent change to a hand-pinned value: a `maxMem` set
    # before r42 to a real instance's mem capacity is now a no-op.
    # maxCores: 192
    # maxMem: 1649267441664    # 1.5 TiB
    maxDisk: 214748364800      # 200 GiB
    # 25 GiB (was 100 — live_057-c). The cold-start disk solve for any
    # pname with NO fitted estimate; the DiskFitEnvelope fits the
    # per-pname axis from observation, and the reactive disk ladder
    # recovers a too-small default (25→50→100 doubling, floor
    # persisted once per pname) on worker-classified disk exhaustion.
    # Sized for DENSITY with the ladder as the recovery path: a
    # too-small default self-heals in ≤2 doubled attempts; a too-large
    # default taxes EVERY warm pod's placement forever.
    # ORDER-PIN (live_057-c, RE-DERIVED at live_060): this flip is
    # valid ONLY when the disk ladder is live end-to-end (bind[48-quota-volume-pin.sh]) — and the
    # ladder's quantifier is the DEPLOYED FLEET PRECONDITION, not
    # tree state: live_060 proved both ladders dead for months on a
    # tree where every in-tree witness was green, because the
    # builder pools' storage class (EBS-only, no prjquota) was never
    # part of any check's population. The pin now binds on the
    # values surface the fleet deploys: every EBS-only
    # builder-hosting EC2NodeClass declares the kubelet quota volume
    # (karpenter.quotaVolume*), machine-checked by helm fragment
    # 48-quota-volume-pin.sh (a no-quota builder pool declaration
    # reds the render); the kubelet half rides the AMI
    # (rio-kubelet-mount's EBS branch + the fsquota drop-in, pinned by
    # vm-nixos-node), and the chain end-to-end is
    # vm-kubelet-projquota-standalone's witness. The residual
    # fleet-drift face (a live pool diverging from the deployed
    # values) is the live_060 readback: peak_disk_bytes Some-rate on
    # EBS nodes — a named post-rollout line, never silent green.
    # Tree-state half (still true, still necessary): worker
    # ENOSPC/quota classification → DISK_FULL → scheduler floor
    # bump, the W10-CM cross-crate witness; flipping first
    # retry-poisons every pname whose true overlay need lands in
    # (25, 100] GiB.
    # Density derivation (bind[14-disk-ceiling.sh] — the W10-CP table
    # asserts these rows against pod_ephemeral_request's mirrored
    # constants and the live values; touching ANY input re-derives
    # BOTH):
    #   request(default) = default × 1.5 (no-estimate headroom arm)
    #                      + poolDefaults.fuseCacheBytes (50 GiB)
    #                      + 1 GiB log budget
    #   at 100 GiB: 201   GiB request → 450 GiB allocatable: 2 pods/node
    #   at  25 GiB:  88.5 GiB request → 450 GiB allocatable: 5 pods/node
    #   (allocatable = karpenter.dataVolumeSize 500Gi × 0.9; the
    #   12xlarge nvme class measured 12 pods/node at the 100 GiB
    #   default ⇒ allocatable ∈ [2412, 2613) GiB ⇒ 27–29 pods/node at
    #   25 GiB — a band over instance-store capacities, not a point.)
    defaultDisk: 26843545600   # 25 GiB
    hwCostTolerance: 0.15
    hwExploreEpsilon: 0.02
    hwBenchMemFloor: 8589934592  # 8 GiB
    # §13c D4a: pre-§13c the pre-§13c static metal NodePool's
    # `limits:{cpu:10000}` was a SEPARATE budget from the §13b
    # nodeclaim_pool `maxFleetCores`. Folding metal in adds its capacity
    # to the global pool — bump by 10000 so non-metal keeps its
    # pre-§13c floor.
    # §13e: same fold-shape for fetchers (split per arch). The static
    # `rio-fetcher` NodePool's `limits:{cpu:5000}` was a SHARED budget
    # across both arches; per-class `maxFleetCores` caps don't borrow
    # across arches, so 5000/arch (Σ=10000, 2× the old total) preserves
    # the all-x86 burst ceiling at the cost of doubling the mixed-arch
    # worst case. Bump global by another 10000 so the non-metal
    # non-fetcher floor stays at 10000.
    # INVARIANT (helm/13 asserts the combined form):
    #   Σ(metal-* maxFleetCores) ≤ 10000           (D4a)
    #   Σ(fetcher-* maxFleetCores) ≤ 10000         (§13e)
    #   Σ(metal-*) + Σ(fetcher-*) ≤ maxFleetCores − 10000
    maxFleetCores: 30000
    ladderBudget: 600
    maxForecastCoresPerTenant: 2000
    maxKeysPerTenant: 50000
    maxLeadTime: 600
    # DEPRECATED-IGNORED (live_049 L1): the flat per-cell-per-tick mint
    # cap is retired from the controller's mint law (demand x fleet
    # budget only — ctrl.nodeclaim.mint-deficit-proportional). The row
    # stays so the scheduler template's rendered key keeps parsing
    # against the retained (deny_unknown_fields) SlaConfig field; the
    # value is read by NOTHING.
    maxNodeClaimsPerCellPerTick: 8
    # nodeClass per hw-class: rio-nvme for nvme storage tiers (so
    # instanceStorePolicy:RAID0 applies), rio-default for ebs. The
    # band-loop NodePool template selected this by `$stor`; with that
    # template deleted (B3) the per-class nodeClass is the only place
    # the EC2NodeClass selection lives.
    #
    # §13c-2 per-class ceilings: NOT set here. The scheduler derives
    # the physical `(maxCores, maxMem)` ceiling per class at boot from
    # `describe_instance_types` ∩ `requirements` (the largest real type
    # that matches). `maxCores`/`maxMem` may still be set as an OPTIONAL
    # operator override that **tightens** below the catalog ceiling
    # (e.g. an arm pool you want to cap at 64c for cost reasons) —
    # `validate()` rejects `Some(0)` and any value > the global. Unset
    # → catalog wins; catalog absent (static cost source / fetch
    # failure) → global.
    hwClasses:
      # live_050(c) — the hi band's graceful-degradation posture
      # (ctrl.nodeclaim.capacity-ladder):
      # - `capacityTypes: [spot, on-demand]` is the OWNER DOCTRINE
      #   (signed 2026-06-10, mid-wave): "all classes should be
      #   spot+on-demand — if spot is available great, otherwise we
      #   get on-demand." It SUPERSEDES the rev-2 od-only committed
      #   default (which itself superseded the live override; the
      #   running rev-2 overlay now DIVERGES from this chart default
      #   and is retired at first deploy per the wave-close protocol
      #   — the deploy flips hi to spot-preferred).
      # - `ladder.rungs` names each class's generation-rung sibling
      #   (`*-g7`, declared below the hi parents). The ladder is
      #   MEMBERSHIP authority only: rungs join the intent's hosting
      #   closure (hw_class_names); the realized walk order is
      #   derived from cost — capacity-major (spot ~2.86x cheaper at
      #   the cap-only seed), then the cell_rank name-hash within a
      #   band. Under spot+od the closure spans gen8:{spot,od} ∪
      #   g7:{spot,od} — spot-preferred-with-od-fallback WITHOUT
      #   order enforcement: spot prices rank first, vanish/ICE
      #   evidence masks a dry spot plane at read time (A\masked),
      #   and the all-masked fallback re-offers the full closure, so
      #   od serves exactly when spot cannot (the membership-only
      #   ruling; witnessed by the shipped-values failover red).
      # - sh-016 leaf-closure rule: every class referenced by any
      #   `ladder.rungs[].class` MUST itself declare `ladder` (even if
      #   `rungs: []` to mark an intentional terminal). Helm-lint
      #   `hwclass-ladder-closed` enforces this. The g7 siblings
      #   close to mid-ebs-{x86,arm}; mid-ebs carries the empty-rung
      #   terminal sentinel.
      # - The g7 siblings carry `hw-band: hi-g7` (NOT `hi`): the
      #   controller's match_node walks class conjunctions
      #   lexicographic-first-match, so a sibling whose labels
      #   superset the parent's would mis-attribute g7 Nodes to the
      #   gen-8 class (hw_perf factor pollution). A distinct band
      #   value keeps both conjunctions exact with zero edits to the
      #   parents' live labels.
      # - New rung classes carry PLACEHOLDER leadTimeSeed rows
      #   (parent-derived; see the seed map) until `xtask k8s
      #   probe-boot` is re-run — helm/18 refuses an unseeded cell.
      hi-nvme-x86:
        nodeClass: rio-nvme
        capacityTypes: [spot, on-demand]
        ladder:
          rungs:
            - {class: hi-nvme-x86-g7}
        labels:
          - {key: rio.build/hw-band, value: hi}
          - {key: rio.build/storage, value: nvme}
          - {key: kubernetes.io/arch, value: amd64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["8"]}
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
          - {key: karpenter.k8s.aws/instance-local-nvme, operator: Gt, values: ["0"]}
      hi-nvme-arm:
        nodeClass: rio-nvme
        capacityTypes: [spot, on-demand]
        ladder:
          rungs:
            - {class: hi-nvme-arm-g7}
        labels:
          - {key: rio.build/hw-band, value: hi}
          - {key: rio.build/storage, value: nvme}
          - {key: kubernetes.io/arch, value: arm64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["8"]}
          - {key: kubernetes.io/arch, operator: In, values: [arm64]}
          - {key: karpenter.k8s.aws/instance-local-nvme, operator: Gt, values: ["0"]}
      hi-ebs-x86:
        nodeClass: rio-default
        capacityTypes: [spot, on-demand]
        ladder:
          rungs:
            - {class: hi-ebs-x86-g7}
        labels:
          - {key: rio.build/hw-band, value: hi}
          - {key: rio.build/storage, value: ebs}
          - {key: kubernetes.io/arch, value: amd64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["8"]}
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      hi-ebs-arm:
        nodeClass: rio-default
        capacityTypes: [spot, on-demand]
        ladder:
          rungs:
            - {class: hi-ebs-arm-g7}
        labels:
          - {key: rio.build/hw-band, value: hi}
          - {key: rio.build/storage, value: ebs}
          - {key: kubernetes.io/arch, value: arm64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["8"]}
          - {key: kubernetes.io/arch, operator: In, values: [arm64]}
      # live_050(c): generation-rung siblings for the hi band (the
      # ladder rungs declared above). Full class rows by design — the
      # rung IS a class: its catalog ceiling, labels, taints, and
      # capacity types all come from here, and the cell universe grows
      # through the existing class x capacity product. gen-7 c/m/r,
      # same storage/arch split as the parents; spot+od under the
      # owner doctrine (the full hi walk is gen8:{spot,od} ∪
      # g7:{spot,od} — membership-only, cost-ranked).
      hi-nvme-x86-g7:
        nodeClass: rio-nvme
        capacityTypes: [spot, on-demand]
        ladder:
          rungs:
            - {class: hi-ebs-x86-g7}
            - {class: mid-ebs-x86}
        labels:
          - {key: rio.build/hw-band, value: hi-g7}
          - {key: rio.build/storage, value: nvme}
          - {key: kubernetes.io/arch, value: amd64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          # sh-016: gen-7 x86 c/m/r have NO `d` (instance-store)
          # variants — c7gd/m7gd/r7gd are arm64-only. Widen to gen 6
          # so c6id/m6id/r6id satisfy this; otherwise the (a) (0,0)
          # ceiling excludes the class and the gen8→g7 rung is a no-op.
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["6", "7"]}
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
          - {key: karpenter.k8s.aws/instance-local-nvme, operator: Gt, values: ["0"]}
      hi-nvme-arm-g7:
        nodeClass: rio-nvme
        capacityTypes: [spot, on-demand]
        ladder:
          rungs:
            - {class: hi-ebs-arm-g7}
            - {class: mid-ebs-arm}
        labels:
          - {key: rio.build/hw-band, value: hi-g7}
          - {key: rio.build/storage, value: nvme}
          - {key: kubernetes.io/arch, value: arm64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["7"]}
          - {key: kubernetes.io/arch, operator: In, values: [arm64]}
          - {key: karpenter.k8s.aws/instance-local-nvme, operator: Gt, values: ["0"]}
      hi-ebs-x86-g7:
        nodeClass: rio-default
        capacityTypes: [spot, on-demand]
        ladder:
          rungs:
            - {class: mid-ebs-x86}
        labels:
          - {key: rio.build/hw-band, value: hi-g7}
          - {key: rio.build/storage, value: ebs}
          - {key: kubernetes.io/arch, value: amd64}
        requirements:
          - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
          - {key: karpenter.k8s.aws/instance-generation, operator: In, values: ["7"]}
          - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      hi-ebs-arm-g7:
        nodeClass: rio-default
