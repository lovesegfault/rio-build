# Pull-canary VM-test overlay (vm-pull-canary-k3s only) — layered on
# top of vmtest-full.yaml by nix/tests/fixtures/k3s-full.nix via
# `extraValuesFiles` (Helm -f last-wins, maps deep-merge per key).
#
# Knob 1: pin the SLA probe deadline to the config floor (180 s —
# rio-scheduler/src/sla/config.rs rejects anything lower). The base
# vmtest-full.yaml uses 3600 s, which makes the pull-mode establishment
# window (solved intent deadline + establishment_report_slack, slack
# default 120 s) unobservable inside a VM-test budget. With 180 s the
# window for an unfitted derivation is ~300 s, so the pull-canary
# scenario can assert "an unreported pod death is charged exactly once
# and only after deadline + report-slack" end-to-end.
#
# Intentional side effect: the solved intent deadline also renders into
# builder Job activeDeadlineSeconds (~180 s for unfitted drvs) and the
# derived worker build timeout (~90 s). The pull-canary scenario keeps
# every build sleep <= 60 s for that reason. The other lifecycle splits
# keep vmtest-full.yaml's 3600 s — this overlay is not layered into
# their shared fixture.
scheduler:
  sla:
    probe:
      deadlineSecs: 180

# Knob 2: keep THIS fixture's helm-rendered default pool (x86-64) on
# the legacy stream protocol. The pull-canary scenario's
# stream-baseline arm runs the scripted success+failure sequence on
# that pool and asserts dispatch_mode=stream, so the retry-feed
# equivalence has a stream leg to compare against. The corpus default
# went Pull at the T-1c.2b re-point (vmtest-full.yaml no longer sets
# dispatchMode), so the stream leg needs this explicit per-check pin.
# Retired together with the baseline arm by the 1c' deletion wave
# (deletion commit A, T-1c'.2) when the stream session machinery
# goes; the scenario's own pull pools set dispatchMode: Pull
# explicitly and are unaffected by this default.
poolDefaults:
  dispatchMode: Stream
