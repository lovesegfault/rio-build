apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pools.rio.build
spec:
  group: rio.build
  names:
    categories: []
    kind: Pool
    plural: pools
    shortNames:
    - pl
    singular: pool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.desiredReplicas
      name: Desired
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for PoolSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Spec for a pool. The derive generates a `Pool` struct with
              `.metadata`, `.spec` (this), `.status`.

              `namespaced` because Pools are per-namespace (multiple tenants can
              have their own pools). Printer columns: what `kubectl get pools`
              shows — Kind/Ready/Desired at a glance is the main thing operators
              want.

              `KubeSchema` alongside `CustomResource`: KubeSchema processes
              `#[x_kube(validation)]` attrs into x-kubernetes-validations.
              CustomResource alone ignores them — the schema would have no
              CEL rules and the apiserver would accept invalid specs. The
              two derives cooperate: CustomResource generates the full CRD
              wrapper, KubeSchema handles the schema internals (including
              the JsonSchema impl, so don't derive that separately).
            properties:
              features:
                default: []
                description: |-
                  requiredSystemFeatures this pool advertises (e.g., "kvm",
                  "big-parallel"). Worker's Nix config `system-features`.
                  Fetchers don't advertise features — FODs route by
                  is_fixed_output alone.
                items:
                  type: string
                type: array
              fuseThreads:
                description: |-
                  Castore-FUSE event-loop thread count per build session. Maps to
                  `RIO_FUSE_THREADS`. `None` = worker default (4). Tune up for
                  NAR-heavy build profiles where FUSE dispatch is the bottleneck.
                  Builder-only.
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              hostNetwork:
                description: |-
                  Use the node's network namespace (`hostNetwork: true`).
                  None/false = pod has its own netns (the default).

                  Constraint: `hostNetwork: true` requires `privileged: true`.
                  CEL-forbidden for `kind=Fetcher`.
                nullable: true
                type: boolean
              hostUsers:
                description: |-
                  Explicit `hostUsers` override. `None` defaults per kind:
                  `kind=Builder` → `hostUsers: false` (userns isolation per
                  ADR-012); `kind=Fetcher` → `hostUsers: true` (rio-mountd's UDS
                  gid gate checks the host-side gid, which a non-init userns
                  remaps — userns would EACCES every FOD). Set `true` for k3s/
                  containerd deployments that don't chown the pod cgroup to the
                  userns-mapped root UID. NOT CEL-gated for `kind=Fetcher` (k3s
                  escape hatch).
                nullable: true
                type: boolean
              image:
                description: |-
                  Container image ref. Required — there's no sensible default
                  (depends on how operators build/tag).
                type: string
              imagePullPolicy:
                description: |-
                  Container imagePullPolicy. None = K8s default (IfNotPresent
                  for tagged images, Always for `:latest`). Airgap/dev clusters
                  (k3s with `ctr images import`) MUST set "IfNotPresent" or
                  "Never" — `:latest` otherwise tries docker.io and fails.
                nullable: true
                type: string
              kind:
                description: |-
                  Builder or Fetcher. Required — there is no sensible default
                  (the two have opposite network postures).
                enum:
                - Builder
                - Fetcher
                type: string
              maxConcurrent:
                description: |-
                  Concurrent-Job ceiling. The reconciler spawns one Job per
                  dispatch-need up to this many active at once. `None` = no
                  controller-side cap — Karpenter's NodePool `limits.cpu` (and
                  ultimately the AWS vCPU service quota) becomes the only gate.
                  Excess Jobs sit Pending until nodes provision; reap-excess-
                  pending trims them if demand drops.
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              nodeSelector:
                additionalProperties:
                  type: string
                description: Node selector for the Job pod spec.
                nullable: true
                type: object
              privileged:
                description: |-
                  Run the worker container privileged. None/false = the
                  default granular caps (SYS_ADMIN + SYS_CHROOT), which is
                  sufficient on most clusters. true = full privileged,
                  which disables seccomp and grants ALL caps.

                  When to set true: clusters whose containerd seccomp profile
                  blocks mount(2) even with SYS_ADMIN and whose nodes don't
                  pre-install the Localhost profile. Production on EKS/GKE
                  with proper runtime config should NOT need this.
                  CEL-forbidden for `kind=Fetcher`.
                nullable: true
                type: boolean
              seccompProfile:
                description: |-
                  Seccomp profile kind. `None`/`RuntimeDefault` = the runtime's
                  default filter. `Localhost` = a profile JSON installed at
                  `/var/lib/kubelet/seccomp/<localhost_profile>` on every node.
                  `Unconfined` = no filter (debugging only).

                  Ignored when `privileged: true` — privileged disables seccomp
                  at the runtime level. CEL-forbidden for `kind=Fetcher` (the
                  reconciler forces `Localhost operator/rio-fetcher.json`).
                nullable: true
                properties:
                  localhostProfile:
                    description: |-
                      Path relative to `/var/lib/kubelet/seccomp/`. REQUIRED when
                      `type: Localhost`, FORBIDDEN otherwise (CEL enforces both).
                    nullable: true
                    type: string
                  type:
                    description: |-
                      `RuntimeDefault` / `Localhost` / `Unconfined`. K8s convention
                      is the field is literally `type` in YAML.
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - rule: self.type in ['RuntimeDefault', 'Localhost', 'Unconfined']
                - rule: "self.type == 'Localhost' ? has(self.localhostProfile) : !has(self.localhostProfile)"
              systems:
                description: |-
                  Target systems (e.g., `["x86_64-linux"]`). Builders AND
                  fetchers execute derivation `builder` scripts, so the host
                  system must match.
                items:
                  type: string
                type: array
              terminationGracePeriodSeconds:
                description: |-
                  Pod terminationGracePeriodSeconds. SIGTERM → executor drain
                  (DrainExecutor + wait for in-flight builds to complete). After
                  this many seconds: SIGKILL, builds lost.

                  `None` = per-kind default (7200 builders, 600 fetchers — nix
                  builds can legitimately take 2h; fetches are short). Clusters
                  with known-shorter builds should set this lower so Pool
                  deletion doesn't stall on a stuck/never-Ready pod.
                format: int64
                nullable: true
                type: integer
              tolerations:
                description: |-
                  Tolerations for the Job pod spec. Typed `Toleration` (not
                  `serde_json::Value`); `any_object_array` passthrough because
                  k8s-openapi types don't impl JsonSchema.
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                nullable: true
                type: array
            required:
            - image
            - kind
            - systems
            type: object
            x-kubernetes-validations:
            - message: systems must be non-empty — a pool with no target systems accepts no work
              rule: size(self.systems) > 0
            - message: >-
                hostNetwork:true requires privileged:true — Kubernetes rejects hostUsers:false
                with hostNetwork:true at admission; the non-privileged path sets hostUsers:false
                (see ADR-012)
              rule: "!(has(self.hostNetwork) && self.hostNetwork) || (has(self.privileged) && self.privileged)"
            - message: >-
                kind=Fetcher forbids privileged:true — fetchers face the open internet; the
                escape hatch stays closed (ADR-019)
              rule: self.kind != 'Fetcher' || (!has(self.privileged) || !self.privileged)
            - message: >-
                kind=Fetcher forbids hostNetwork:true — fetchers run on dedicated nodes with
                pod networking (ADR-019)
              rule: self.kind != 'Fetcher' || (!has(self.hostNetwork) || !self.hostNetwork)
            - message: >-
                kind=Fetcher forbids seccompProfile — the reconciler forces Localhost
                operator/rio-fetcher.json (ADR-019)
              rule: self.kind != 'Fetcher' || !has(self.seccompProfile)
            - message: kind=Fetcher forbids fuseThreads — fetches are network-bound, not FUSE-bound
              rule: self.kind != 'Fetcher' || !has(self.fuseThreads)
            - message: >-
                kind=Fetcher forbids spec.features — the controller derives [fetcher] from kind
                (§13e)
              rule: self.kind != 'Fetcher' || !has(self.features) || size(self.features) == 0
            - message: "kind=Fetcher: nodeSelector['rio.build/fetcher'] is reconciler-owned and may only be 'true' — the dedicated-node constraint is universal and cannot be weakened (r35 bug_044)"
              rule: >-
                self.kind != 'Fetcher' || !has(self.nodeSelector) || !('rio.build/fetcher' in
                self.nodeSelector) || self.nodeSelector['rio.build/fetcher'] == 'true'
            - message: >-
                kind=Builder forbids nodeSelector['rio.build/fetcher'] — the fetcher taint
                repels Builder pods (no toleration) so the pod would be permanently Pending (r35
                bug_044)
              rule: >-
                self.kind != 'Builder' || !has(self.nodeSelector) || !('rio.build/fetcher' in
                self.nodeSelector)
          status:
            description: |-
              Pool status — reconciler writes, operators read.

              `Default` because kube-rs initializes it to `None` →
              `Some(default())` on first reconcile. All fields zero-value-is-
              meaningful (0 replicas is a valid observed state).
            nullable: true
            properties:
              conditions:
                default: []
                description: |-
                  Standard K8s Conditions. Currently one type:
                  `SchedulerUnreachable` (status=True when the reconciler's
                  `GetSpawnIntents` RPC fails — disambiguates "scheduler idle,
                  queued=0" from "scheduler down, queued unknown").
                items:
                  properties:
                    type:
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                nullable: true
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredReplicas:
                default: 0
                description: Concurrent-Job target the reconciler is converging on.
                format: int32
                type: integer
              readyReplicas:
                default: 0
                description: |-
                  Jobs whose pod has passed readinessProbe (heartbeating to
                  scheduler).
                format: int32
                type: integer
              replicas:
                default: 0
                description: |-
                  Active Job count. What's actually running (may lag desired
                  during cold start).
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: Pool
        type: object
    served: true
    storage: true
    subresources:
      status: {}
