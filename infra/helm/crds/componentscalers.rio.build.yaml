apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: componentscalers.rio.build
spec:
  group: rio.build
  names:
    categories: []
    kind: ComponentScaler
    plural: componentscalers
    shortNames:
    - cscaler
    singular: componentscaler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.desiredReplicas
      name: Desired
      type: integer
    - jsonPath: .status.learnedRatio
      name: Ratio
      type: number
    - jsonPath: .status.observedLoadFactor
      name: Load
      type: number
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ComponentScalerSpec via `CustomResource`
        properties:
          spec:
            description: |-
              ComponentScaler spec. The derive generates a `ComponentScaler`
              struct with `.metadata`, `.spec` (this), `.status`.

              Namespaced: the ComponentScaler lives alongside its target
              Deployment (rio-store namespace for the store scaler). The
              reconciler patches `deployments/scale` in the SAME namespace.

              `KubeSchema` alongside `CustomResource`: same pattern as
              PoolSpec — KubeSchema processes `#[x_kube]` on nested
              structs (Replicas, TargetRef, LoadThresholds) so their CEL
              rules render.
            properties:
              loadEndpoint:
                description: |-
                  `host:port` of the headless Service whose endpoints are the
                  target's pods. The reconciler DNS-resolves this and calls
                  `StoreAdminService.GetLoad` on each IP. Cross-namespace FQDN
                  (e.g. `rio-store-headless.rio-store:9002`) — the controller
                  runs in `rio-system`.
                type: string
              loadThresholds:
                default:
                  high: 0.8
                  low: 0.3
                description: "Load thresholds for ratio correction. Defaults `{high: 0.8,\nlow: 0.3}`."
                properties:
                  high:
                    default: 0.8
                    description: |-
                      Above this: immediate `+1` AND `learnedRatio *= 0.95`.
                      Asymmetric correction — under-provisioning is dangerous
                      (I-105 cascade). Default 0.8.
                    format: double
                    type: number
                  low:
                    default: 0.3
                    description: |-
                      Below this for `LOW_LOAD_TICKS_FOR_RATIO_GROWTH` consecutive
                      ticks: `learnedRatio *= 1.02`. Slow growth — over-provisioning
                      is cheap. Default 0.3.
                    format: double
                    type: number
                type: object
                x-kubernetes-validations:
                - message: loadThresholds must satisfy 0.0 < low < high <= 1.0
                  rule: self.low > 0.0 && self.low < self.high && self.high <= 1.0
              replicas:
                description: |-
                  Replica bounds. The reconciler clamps to `[min, max]`.
                  `max` for rio-store should be `Aurora max_connections /
                  pgMaxConnections` — at 16ACU≈2800 / 200, that's 14. The
                  `min <= max` CEL rule is on [`Replicas`].
                properties:
                  max:
                    description: |-
                      Ceiling. For rio-store: `Aurora max_connections /
                      pgMaxConnections` — over-provisioning past this is wasted
                      pods that can't open a PG connection.
                    format: int32
                    type: integer
                  min:
                    description: |-
                      Floor. The reconciler never scales below this even at zero
                      builders. For rio-store: at least 2 (PDB `maxUnavailable: 1`
                      needs ≥2 to survive a node drain).
                    format: int32
                    type: integer
                required:
                - max
                - min
                type: object
                x-kubernetes-validations:
                - message: replicas must satisfy 0 <= min <= max
                  rule: self.min >= 0 && self.min <= self.max
              seedRatio:
                default: 50.0
                description: |-
                  Initial `builders_per_replica` for a fresh CR (no
                  `.status.learnedRatio` yet). Empirically ~70 from 555-on-8
                  (I-110); seed at 50 to start slightly over-provisioned (safe
                  side) and let the ratio EMA up.
                format: double
                type: number
              signal:
                default: scheduler-builders
                description: |-
                  Predictive demand signal. Default `scheduler-builders` — the
                  only implemented signal today.
                enum:
                - scheduler-builders
                type: string
              targetRef:
                description: The Deployment to scale. Same-namespace.
                properties:
                  kind:
                    description: "`Deployment`. CEL-enforced."
                    type: string
                  name:
                    description: "`metadata.name` of the Deployment in the SAME namespace as\nthis ComponentScaler."
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: >-
                    targetRef.kind must be 'Deployment' — ComponentScaler patches the apps/v1
                    deployments/scale subresource; StatefulSet targets are not yet supported
                  rule: self.kind == 'Deployment'
            required:
            - loadEndpoint
            - replicas
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: loadEndpoint must be host:port (e.g. rio-store-headless.rio-store:9002)
              rule: self.loadEndpoint.matches('^.+:[0-9]{1,5}$')
          status:
            description: |-
              ComponentScaler status. The reconciler writes ALL fields (single
              SSA field-manager — there's no separate autoscaler task here, the
              reconciler IS the autoscaler).

              `learnedRatio` is the durable bit: a controller restart reads
              this back and continues from where it left off (NOT from
              `seedRatio`). The other fields are observability.
            nullable: true
            properties:
              desiredReplicas:
                default: 0
                description: |-
                  What the reconciler last patched onto `deployments/scale`.
                  May differ from the Deployment's actual `.spec.replicas` if
                  something else patched it.
                format: int32
                type: integer
              lastScaleUpTime:
                description: |-
                  When `desired` last increased. The 5-minute scale-down
                  stabilization window starts here.
                nullable: true
                type: string
              learnedRatio:
                description: |-
                  EMA-adjusted `builders_per_replica`. Persisted across
                  controller restarts. Seeded from `spec.seedRatio` on first
                  reconcile; corrected against `observedLoadFactor` thereafter.
                format: double
                nullable: true
                type: number
              lowLoadTicks:
                default: 0
                description: |-
                  Consecutive ticks with `observedLoadFactor < loadThresholds.
                  low`. At `LOW_LOAD_TICKS_FOR_RATIO_GROWTH` (30), the ratio
                  grows by 2% and this resets. Mirrored to status for
                  observability; the reconciler's authoritative counter is
                  in-process (writing it here every tick would self-trigger the
                  CR watch). Restart resets the streak — at most one extra
                  5-minute over-provisioning window per controller restart.
                format: uint32
                minimum: 0.0
                type: integer
              observedLoadFactor:
                description: |-
                  Max of pg-pool utilization and substitute-admission utilization
                  across the `loadEndpoint` pods that ANSWERED at the last tick.
                  The "observed" half of the predict-then-correct loop. Under
                  partial poll coverage this is a survivor max — the reconciler
                  consumes it asymmetrically (scale-up evidence survives partial
                  coverage; ratio-growth funding demands total coverage).
                format: double
                nullable: true
                type: number
            type: object
        required:
        - spec
        title: ComponentScaler
        type: object
    served: true
    storage: true
    subresources:
      status: {}
