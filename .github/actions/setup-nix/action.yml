name: Setup Nix
description: Configure rio-nix-cache via niks3-action (nix ships in the runner image)
inputs:
  niks3-url:
    description: niks3 server URL (cache-config + push endpoint)
    default: http://niks3.niks3.svc.cluster.local:5751
runs:
  using: composite
  steps:
    # Nix itself is baked into the ARC runner image (rio-infra:
    # nix/runner-image.nix) as a single-user install owned by the
    # runner uid: no installer download, no daemon, no trusted-users
    # dance. KVM runners get `system-features = kvm` from a NIX_CONFIG
    # env var on the pod (rio-infra: arc.tf), not from a workflow
    # input.

    # Warm flake-input fetches (gitv3/tarball-cache) and the eval
    # cache. Restore-only: gen-matrix (ci.yml) is the canonical saver
    # — it runs first, does the deepest eval, and every matrix job
    # `needs:` it, so they restore what it just populated. Keyed on
    # flake.lock since inputs are what invalidate the fetcher cache;
    # restore-keys gives a near-hit on lock bumps.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/nix
        key: nix-eval-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-keys: nix-eval-${{ runner.os }}-${{ runner.arch }}-

    # post-build-hook + uploader + post-job drain. Fetches the
    # substituter URL + public key from /api/cache-config and writes
    # them via NIX_USER_CONF_FILES (so cache.nixos.org default is
    # preserved). Downloads its own SHA-pinned niks3 CLI. Degrades to
    # substituter-only on fork PRs (no id-token:write).
    #
    # The action's isTrustedUser() check passes because single-user
    # nix's store owner is always trusted → hook mode (per-derivation
    # upload, built-paths-only) instead of storescan.
    #
    - uses: Mic92/niks3-action@a3da573cc4d21634990e5f21391abe55ed49ec46 # v1.0.2
      with:
        server-url: ${{ inputs.niks3-url }}
        drain-timeout: 1200
