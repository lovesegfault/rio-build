name: Setup Nix
description: >-
  Configure Nix (installing it only if the runner image doesn't
  pre-bake it) + rio-nix-cache via niks3-action
inputs:
  kvm:
    description: Add kvm/nixos-test system-features
    default: 'false'
  drv-cache:
    description: >-
      Download the gen-matrix job's drv-cache artifact (a file://
      binary cache of the run's derivation closures) and register it
      as a substituter. Build jobs realise bare drv paths instead of
      evaluating the flake; this is where they get the .drv files and
      eval-time sources from. Everything in it is content-addressed,
      so no trusted key is needed.
    default: 'false'
  niks3-url:
    description: niks3 server URL (cache-config + push endpoint)
    default: http://niks3.niks3.svc.cluster.local:5751
runs:
  using: composite
  steps:
    # Must precede the installer: the substituter is registered in
    # extra-conf below, and a registered-but-empty file:// cache makes
    # every substitution attempt warn. Hard-fails if the artifact is
    # missing — a build job only runs when its matrix is non-empty,
    # which implies gen-matrix exported at least that entry's closure.
    - if: inputs.drv-cache == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: drv-cache
        path: ${{ runner.temp }}/drv-cache
    # nix-installer-action's trust-runner-user builds
    #   trusted-users = root $USER
    # but ARC containers spawn steps without a login shell, so $USER
    # is unset → only root is trusted → niks3-action's user-conf
    # extra-substituters and post-build-hook are rejected by the
    # daemon. Export it from getpwuid so the next step's $USER ref
    # expands. Upstream: NixOS/nix-installer-action#12 (id -un).
    - shell: bash
      run: echo "USER=$(id -un)" >> "$GITHUB_ENV"

    # Warm flake-input fetches (gitv3/tarball-cache) and the eval
    # cache. Restore-only: gen-matrix (ci.yml) is the canonical saver
    # — it runs first, does the deepest eval, and every matrix job
    # `needs:` it, so they restore what it just populated. Keyed on
    # flake.lock since inputs are what invalidate the fetcher cache;
    # restore-keys gives a near-hit on lock bumps.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/nix
        key: nix-eval-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-keys: nix-eval-${{ runner.os }}-${{ runner.arch }}-

    # The runner image pre-bakes nix (and python3). Detect it so the
    # installer only runs on images that lack it — installing nix from
    # scratch was ~18s of every job's setup, ~22 runner-minutes per
    # full fan-out. Detection rather than assumption keeps CI working
    # if the image is ever rolled back to a stock one.
    - id: nix
      shell: bash
      run: |
        if command -v nix >/dev/null 2>&1; then
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          echo "pre-installed nix: $(command -v nix) ($(nix --version))"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    # Pre-installed path: the image owns the installation; this step
    # only applies the per-job configuration the installer's
    # extra-conf used to carry. It goes in a user conf file
    # (NIX_USER_CONF_FILES, prepended so the niks3-action's own entry
    # composes) rather than /etc/nix/nix.conf so it needs no sudo and
    # no daemon restart. The image must keep the runner user in
    # trusted-users for the daemon to honor the restricted settings
    # (sandbox, system-features, extra-substituters); if a job fails
    # here with "ignoring untrusted setting", that's the image
    # invariant that broke.
    - if: steps.nix.outputs.preinstalled == 'true'
      shell: bash
      run: |
        conf="$RUNNER_TEMP/rio-nix.conf"
        {
          echo "experimental-features = nix-command flakes"
          echo "max-jobs = auto"
          echo "sandbox = true"
          if [ "${{ inputs.kvm }}" = "true" ]; then
            echo "system-features = nixos-test benchmark big-parallel kvm"
          fi
          if [ "${{ inputs.drv-cache }}" = "true" ]; then
            echo "extra-substituters = file://$RUNNER_TEMP/drv-cache"
          fi
        } > "$conf"
        echo "NIX_USER_CONF_FILES=$conf${NIX_USER_CONF_FILES:+:$NIX_USER_CONF_FILES}" >> "$GITHUB_ENV"

    # Upstream NixOS action (no telemetry). No tags yet — pin by SHA.
    # 6b8548f includes PR#9 (--enable-flakes; the wrapped installer
    # stopped enabling flakes by default) and PR#10 (skip udev write
    # on container runners — what enable-kvm:false below worked around).
    - if: steps.nix.outputs.preinstalled == 'false'
      uses: NixOS/nix-installer-action@6b8548fe06acfb0155a50ab5d561accb215764cc
      with:
        # Default is true; it writes a udev rule to /etc/udev/rules.d/
        # which doesn't exist in ARC runner containers. We handle KVM
        # ourselves: hostPath mount (arc.tf) + system-features below.
        enable-kvm: false
        # extra-conf lands verbatim in /etc/nix/nix.conf before the
        # daemon launches. Substituters + post-build-hook are NOT set
        # here — niks3-action below fetches them from /api/cache-config
        # and writes extra-substituters via NIX_USER_CONF_FILES (additive
        # to the default cache.nixos.org).
        #
        # experimental-features is set explicitly even though the action
        # now passes --enable-flakes (PR#9) — the action's pin is on the
        # wrapper, not the installer it downloads at runtime, so the
        # default can shift again. Belt-and-suspenders.
        extra-conf: |
          experimental-features = nix-command flakes
          max-jobs = auto
          sandbox = true
          ${{ inputs.kvm == 'true' && 'system-features = nixos-test benchmark big-parallel kvm' || '' }}
          ${{ inputs.drv-cache == 'true' && format('extra-substituters = file://{0}/drv-cache', runner.temp) || '' }}

    # post-build-hook + uploader + post-job drain. Fetches the
    # substituter URL + public key from /api/cache-config and writes
    # them via NIX_USER_CONF_FILES (so cache.nixos.org default is
    # preserved). Downloads its own SHA-pinned niks3 CLI. Degrades to
    # substituter-only on fork PRs (no id-token:write).
    #
    # With the runner in trusted-users (pre-step above), the action's
    # isTrustedUser() check passes → hook mode (per-derivation upload,
    # built-paths-only) instead of storescan (drain-time diff that
    # would re-push everything substituted from cache.nixos.org).
    #
    - uses: Mic92/niks3-action@a3da573cc4d21634990e5f21391abe55ed49ec46 # v1.0.2
      with:
        server-url: ${{ inputs.niks3-url }}
        drain-timeout: 1200
