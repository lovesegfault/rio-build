name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # OIDC → niks3 + codecov

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs; never cancel pushes to main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Matrix generator — the ONLY dependency for every build job.
  # ~2min: checkout + nix-install + nix-eval-jobs (parallel eval of
  # all four matrices, ~35s) + S3 cache probe. Entries already in
  # rio-nix-cache are dropped from the matrix so no runner spins up
  # for them. Codecov upload is decoupled into coverage-upload (one
  # job, always runs, substitutes lcov from cache). No workspace
  # build on the critical path.
  gen-matrix:
    name: gen-matrix
    runs-on: rio-ci
    timeout-minutes: 60
    outputs:
      checks: ${{ steps.gen.outputs.checks }}
      fuzz: ${{ steps.gen.outputs.fuzz }}
      vm-test: ${{ steps.gen.outputs.vm-test }}
      coverage: ${{ steps.gen.outputs.coverage }}
      coverage-paths: ${{ steps.gen.outputs.coverage-paths }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - name: Generate matrices from flake
        id: gen
        # nix-eval-jobs --check-cache-status drops entries already in
        # rio-nix-cache S3. Adding a new matrix to flake.nix → add one
        # `outputs:` entry above + one `for m in` entry in the script.
        run: bash .github/scripts/gen-matrix.sh
      # setup-nix restores ~/.cache/nix everywhere; only this job
      # saves. It runs first and does the deepest eval, so downstream
      # jobs (which all `needs:` this one) restore what it just
      # populated. always(): a failed eval still warmed the fetcher
      # cache, which is most of the bytes.
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: always()
        with:
          path: ~/.cache/nix
          key: nix-eval-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}

  checks:
    name: check / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.checks != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.checks) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - run: nix build ".#githubActions.checks.${{ matrix.name }}" --print-build-logs
  fuzz:
    name: fuzz / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.fuzz != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - run: nix build ".#githubActions.fuzz.${{ matrix.name }}" --print-build-logs
  vm-test:
    name: vm / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.vm-test != '[]'
    runs-on: rio-ci-kvm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.vm-test) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          kvm: true
      - name: Verify KVM
        run: '[[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]'
      - run: nix build ".#githubActions.vm-test.${{ matrix.name }}" --print-build-logs
  coverage:
    name: coverage / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.coverage != '[]'
    # Runner selection by naming convention: `vm-*` entries need
    # KVM (instrumented VM tests → profraw → lcov). `unit` runs
    # on spot. See flake.nix githubActions comment.
    runs-on: ${{ startsWith(matrix.name, 'vm-') && 'rio-ci-kvm' || 'rio-ci' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.coverage) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          kvm: ${{ startsWith(matrix.name, 'vm-') }}
      - name: Verify KVM
        if: startsWith(matrix.name, 'vm-')
        run: '[[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]'
      - run: nix build ".#githubActions.coverage.${{ matrix.name }}" --print-build-logs

  # Decoupled from the (cache-filtered, KVM-heavy) build matrix above:
  # this single job substitutes every lcov from S3 and posts each to
  # Codecov under its own flag. Runs even when coverage is fully
  # skipped (all cached) or partially failed (best-effort: a broken VM
  # scenario doesn't blank the whole report). One flag per
  # `githubActions.coverage` entry; count still enforced by
  # `codecov-matrix-sync`.
  coverage-upload:
    needs: [gen-matrix, coverage]
    # always(): run regardless of coverage's result (skipped|success|
    # failure). gen-matrix must have succeeded for coverage-all to be
    # populated; cancellation should still abort.
    if: always() && !cancelled() && needs.gen-matrix.result == 'success'
    runs-on: rio-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      # gen-matrix already evaluated every coverage outPath; pass them
      # through so this step does zero flake eval — just parallel
      # nix-store -r then serial codecovcli per flag. Also reads
      # GITHUB_SHA/GITHUB_REPOSITORY/ACTIONS_ID_TOKEN_REQUEST_* from env.
      - run: nix run .#coverage-upload
        env:
          COVERAGE_PATHS: ${{ needs.gen-matrix.outputs.coverage-paths }}
  # Single stable name for branch protection. Dynamic matrices
  # mean individual entry names change as tests are added/removed —
  # marking them required would break. This job fans-in and succeeds
  # iff every upstream did.
  #
  # alls-green treats `skipped` as failure (GitHub branch protection
  # doesn't, which is a well-known footgun — a skipped required
  # check silently passes).
  ci-gate:
    if: always()
    needs: [gen-matrix, checks, fuzz, vm-test, coverage, coverage-upload]
    runs-on: rio-ci
    timeout-minutes: 60
    steps:
      # alls-green shells out to `python` (not `python3`); ARC's stock
      # image has python3 but not the bare `python` symlink that GH-
      # hosted runners ship. setup-python adds it (~5s).
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # gen-matrix.sh elides cached entries; a fully-cached matrix
          # → job skipped via `if: != '[]'`. gen-matrix and
          # coverage-upload are NOT listed: both must always run — if
          # either skips, something is wrong.
          allowed-skips: checks, fuzz, vm-test, coverage
