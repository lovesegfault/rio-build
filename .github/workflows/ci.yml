name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # OIDC → niks3 + codecov

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs; never cancel pushes to main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Eval once, realise everywhere. gen-matrix is the only job that
# evaluates the flake: it cache-filters every target, pushes the
# uncached targets' DERIVATION closures to niks3, and emits matrices
# of drv paths. Every other job runs `nix build /nix/store/...drv^*`,
# substituting the build graph from the cache instead of re-deriving
# it from a flake eval (~1-2min saved per job, times ~80 jobs).
#
# Two-stage build: the `warm` matrix first realises the trunk — the
# drvs needed by >=2 fan-out clusters of any kind, partitioned into
# dependency-closed shards that build on separate runners — then the
# fan-out matrices substitute it. Without the warm stage, N runners
# with empty stores all rebuild the same uncached trunk
# simultaneously — niks3's post-build-hook can't help because they
# all miss the cache before any of them finishes pushing.
#
# Matrix entries are clusters ({name, targets, drvs}): one runner
# realises several drvs in a single `nix build --keep-going`,
# sharing the store and the scheduler. gen-matrix decides the
# grouping and the warm sets; this file just consumes them.
jobs:
  # Matrix generator — the ONLY dependency for every build job, and
  # the only flake eval in the pipeline. ~2-3min: checkout +
  # nix-install + nix-eval-jobs (parallel eval of all matrices,
  # ~35s) + S3 cache probe + drv-closure upload. Entries already in
  # rio-nix-cache are dropped so no runner spins up for them.
  gen-matrix:
    name: gen-matrix
    runs-on: rio-ci
    timeout-minutes: 60
    outputs:
      warm: ${{ steps.gen.outputs.warm }}
      checks: ${{ steps.gen.outputs.checks }}
      checks-nowait: ${{ steps.gen.outputs.checks-nowait }}
      fuzz: ${{ steps.gen.outputs.fuzz }}
      vm-test: ${{ steps.gen.outputs.vm-test }}
      coverage: ${{ steps.gen.outputs.coverage }}
      coverage-paths: ${{ steps.gen.outputs.coverage-paths }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - name: Generate matrices from flake
        id: gen
        # Cache-filters + clusters every `.#githubActions.<kind>.<name>`,
        # computes each kind's shared trunk from neededBuilds, and
        # exports the uncached entries' drv closures to a local file://
        # binary cache for the artifact upload below. Adding a new
        # matrix kind to flake.nix → add one `outputs:` entry above,
        # one fan-out job below, and teach nix/gen_matrix.py the
        # kind's clustering rule; the warm stage picks up the new
        # kind's shared drvs automatically.
        run: nix run .#gen-matrix
        env:
          DRV_CACHE_DIR: ${{ runner.temp }}/drv-cache
      # The run's build graph: every uncached target's .drv closure
      # (derivation files + eval-time sources, all content-addressed).
      # Build jobs register this as a substituter instead of
      # re-evaluating the flake. Run-scoped by design — the permanent
      # binary cache is for build OUTPUTS; the graph that produces
      # them is ephemeral. ignore: a fully-cached run exports nothing
      # and runs no build jobs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drv-cache
          path: ${{ runner.temp }}/drv-cache
          if-no-files-found: ignore
          retention-days: 1
      # setup-nix restores ~/.cache/nix everywhere; only this job
      # saves. Build jobs no longer evaluate the flake, but they still
      # restore this cache for the fetcher entries (flake input
      # tarballs) their `nix build` may touch. always(): a failed eval
      # still warmed the fetcher cache, which is most of the bytes.
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: always()
        with:
          path: ~/.cache/nix
          key: nix-eval-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}

  # ── Warm stage ─────────────────────────────────────────────────────
  # The trunk: every drv needed by >=2 fan-out clusters, computed
  # globally across all kinds so the overlap between them (the member
  # libs that both the check clusters and the docker images need; the
  # third-party deps both rustc profiles share on a lock bump) is
  # built exactly once. gen-matrix partitions the trunk into
  # dependency-closed components — no shard ever needs a sibling
  # shard's output — and packs them into at most a handful of matrix
  # entries, each realised on its own runner. The post-build hook
  # pushes each constituent to niks3 as it completes, so the gated
  # fan-out substitutes instead of rebuilding. Nothing shared → empty
  # matrix → skipped → zero added latency.
  #
  # No shard needs KVM: building a NixOS image / docker archive is an
  # ordinary nix build. Only *booting* the result needs /dev/kvm.
  # Keeping the warm stage on spot reserves the KVM pool for jobs
  # that actually run VMs.
  #
  # A shard failure (the trunk doesn't compile) skips the gated
  # fan-out: every leaf needing that shard would have failed
  # identically, and ci-gate still goes red on the warm job itself.
  warm:
    name: warm / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.warm != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gen-matrix.outputs.warm) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          drv-cache: 'true'
      - name: Realise trunk shard
        run: |
          read -ra drvs <<< "${{ matrix.drvs }}"
          nix build --keep-going --print-build-logs "${drvs[@]/%/^*}"

  # ── Fan-out stage ──────────────────────────────────────────────────
  # Each job realises its cluster's drv paths in one `nix build
  # --keep-going`: the drvs share a store and a scheduler, so their
  # common deps build once and the leaves build concurrently up to
  # max-jobs. The attribution loop re-checks each drv's outputs (a
  # store stat — no rebuild, no eval) and names the failed targets in
  # the job summary, since a cluster is one GHA job.
  #
  # `!cancelled()` overrides the implicit success() so a SKIPPED warm
  # job (nothing shared) doesn't auto-skip the fan-out; the explicit
  # `result != 'failure'` check still skips it when the warm job
  # actually failed.
  checks:
    name: check / ${{ matrix.name }}
    needs: [gen-matrix, warm]
    if: |
      !cancelled()
      && needs.gen-matrix.result == 'success'
      && needs.warm.result != 'failure'
      && needs.gen-matrix.outputs.checks != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gen-matrix.outputs.checks) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          drv-cache: 'true'
      - name: Build ${{ matrix.targets }}
        run: |
          read -ra targets <<< "${{ matrix.targets }}"
          read -ra drvs <<< "${{ matrix.drvs }}"
          status=0
          nix build --keep-going --print-build-logs "${drvs[@]/%/^*}" || status=$?
          for i in "${!targets[@]}"; do
            nix path-info "${drvs[$i]}^*" >/dev/null 2>&1 \
              || echo "::error title=check failed::${targets[$i]}"
          done
          exit "$status"
  # Clusters with no overlap with the warm set: source-shaped policy
  # checks (treefmt, lints, drift checks) whose feedback should not
  # wait for the rust trunk to compile. Identical to `checks` except
  # it only needs gen-matrix.
  check-nowait:
    name: check / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.checks-nowait != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gen-matrix.outputs.checks-nowait) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          drv-cache: 'true'
      - name: Build ${{ matrix.targets }}
        run: |
          read -ra targets <<< "${{ matrix.targets }}"
          read -ra drvs <<< "${{ matrix.drvs }}"
          status=0
          nix build --keep-going --print-build-logs "${drvs[@]/%/^*}" || status=$?
          for i in "${!targets[@]}"; do
            nix path-info "${drvs[$i]}^*" >/dev/null 2>&1 \
              || echo "::error title=check failed::${targets[$i]}"
          done
          exit "$status"
  fuzz:
    name: fuzz / ${{ matrix.name }}
    needs: [gen-matrix, warm]
    if: |
      !cancelled()
      && needs.gen-matrix.result == 'success'
      && needs.warm.result != 'failure'
      && needs.gen-matrix.outputs.fuzz != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gen-matrix.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          drv-cache: 'true'
      - run: |
          read -ra drvs <<< "${{ matrix.drvs }}"
          nix build --keep-going --print-build-logs "${drvs[@]/%/^*}"
  vm-test:
    name: vm / ${{ matrix.name }}
    needs: [gen-matrix, warm]
    if: |
      !cancelled()
      && needs.gen-matrix.result == 'success'
      && needs.warm.result != 'failure'
      && needs.gen-matrix.outputs.vm-test != '[]'
    runs-on: rio-ci-kvm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gen-matrix.outputs.vm-test) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          kvm: true
          drv-cache: 'true'
      - name: Verify KVM
        run: '[[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]'
      - run: |
          read -ra drvs <<< "${{ matrix.drvs }}"
          nix build --keep-going --print-build-logs "${drvs[@]/%/^*}"
  coverage:
    name: coverage / ${{ matrix.name }}
    needs: [gen-matrix, warm]
    if: |
      !cancelled()
      && needs.gen-matrix.result == 'success'
      && needs.warm.result != 'failure'
      && needs.gen-matrix.outputs.coverage != '[]'
    # Runner selection by naming convention: `vm-*` entries need
    # KVM (instrumented VM tests → profraw → lcov). The single
    # `unit` cluster (every unit-* lcov in one job) runs on spot.
    runs-on: ${{ startsWith(matrix.name, 'vm-') && 'rio-ci-kvm' || 'rio-ci' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gen-matrix.outputs.coverage) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          kvm: ${{ startsWith(matrix.name, 'vm-') }}
          drv-cache: 'true'
      - name: Verify KVM
        if: startsWith(matrix.name, 'vm-')
        run: '[[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]'
      - name: Build ${{ matrix.targets }}
        run: |
          read -ra targets <<< "${{ matrix.targets }}"
          read -ra drvs <<< "${{ matrix.drvs }}"
          status=0
          nix build --keep-going --print-build-logs "${drvs[@]/%/^*}" || status=$?
          for i in "${!targets[@]}"; do
            nix path-info "${drvs[$i]}^*" >/dev/null 2>&1 \
              || echo "::error title=coverage failed::${targets[$i]}"
          done
          exit "$status"

  # Decoupled from the (cache-filtered, KVM-heavy) build matrix above:
  # this single job substitutes every lcov from S3 and posts each to
  # Codecov under its own flag. Runs even when coverage is fully
  # skipped (all cached) or partially failed (best-effort: a broken VM
  # scenario doesn't blank the whole report). One flag per
  # `githubActions.coverage` entry; count still enforced by
  # `codecov-matrix-sync`.
  coverage-upload:
    needs: [gen-matrix, coverage]
    # always(): run regardless of coverage's result (skipped|success|
    # failure). gen-matrix must have succeeded for coverage-paths to
    # be populated; cancellation should still abort.
    if: always() && !cancelled() && needs.gen-matrix.result == 'success'
    runs-on: rio-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      # gen-matrix already evaluated every coverage outPath; pass them
      # through so this step does zero flake eval — just parallel
      # nix-store -r then serial codecovcli per flag. Also reads
      # GITHUB_REPOSITORY/ACTIONS_ID_TOKEN_REQUEST_* from env.
      - run: nix run .#coverage-upload
        env:
          COVERAGE_PATHS: ${{ needs.gen-matrix.outputs.coverage-paths }}
          # On pull_request GITHUB_SHA is the ephemeral refs/pull/N/merge
          # commit; Codecov needs the PR head SHA to associate uploads
          # with the PR's commit list (status checks + after_n_builds).
          COVERAGE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Single stable name for branch protection. Dynamic matrices
  # mean individual entry names change as tests are added/removed —
  # marking them required would break. This job fans-in and succeeds
  # iff every upstream did.
  #
  # alls-green treats `skipped` as failure (GitHub branch protection
  # doesn't, which is a well-known footgun — a skipped required
  # check silently passes).
  ci-gate:
    if: always()
    needs:
      - gen-matrix
      - warm
      - checks
      - check-nowait
      - fuzz
      - vm-test
      - coverage
      - coverage-upload
    runs-on: rio-ci
    timeout-minutes: 60
    steps:
      # alls-green shells out to `python` (not `python3`); ARC's stock
      # image has python3 but not the bare `python` symlink that GH-
      # hosted runners ship. setup-python adds it (~5s).
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # warm skips when nothing is shared across clusters; the
          # build matrices skip when fully cache-filtered or when the
          # warm stage failed (in which case warm is the red one).
          # gen-matrix and coverage-upload are NOT listed: both must
          # always run — if either skips, something is wrong.
          allowed-skips: warm, checks, check-nowait, fuzz, vm-test, coverage
