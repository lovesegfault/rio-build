name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # OIDC → niks3 + codecov

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs; never cancel pushes to main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Flake attr prefix for CI targets. See flake.nix githubActions.
  GHA: githubActions

jobs:
  # Matrix generator — the ONLY dependency for every job.
  # ~2min: checkout + nix-install + nix-eval-jobs (parallel eval
  # of checks/fuzz/vm-test, ~20s) + S3 cache probe. Entries already
  # in rio-nix-cache are dropped from the matrix so no runner spins
  # up for them. coverage is never filtered (codecov needs per-SHA
  # upload). No workspace build on the critical path.
  gen-matrix:
    name: gen-matrix
    runs-on: rio-ci
    timeout-minutes: 60
    outputs:
      checks: ${{ steps.gen.outputs.checks }}
      fuzz: ${{ steps.gen.outputs.fuzz }}
      vm-test: ${{ steps.gen.outputs.vm-test }}
      coverage: ${{ steps.gen.outputs.coverage }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - name: Generate matrices from flake
        id: gen
        # nix-eval-jobs --check-cache-status drops checks/fuzz/vm-test
        # entries already in rio-nix-cache S3; coverage always runs
        # (codecov upload is per-commit). Adding a new matrix to
        # flake.nix → add one `outputs:` entry above + one `for m in`
        # entry in the script.
        run: bash .github/scripts/gen-matrix.sh

  checks:
    name: check / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.checks != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.checks) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - run: nix build ".#${GHA}.matrix.checks.${{ matrix.name }}" --print-build-logs
  fuzz:
    name: fuzz / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.fuzz != '[]'
    runs-on: rio-ci
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - run: nix build ".#${GHA}.matrix.fuzz.${{ matrix.name }}" --print-build-logs
  vm-test:
    name: vm / ${{ matrix.name }}
    needs: gen-matrix
    if: needs.gen-matrix.outputs.vm-test != '[]'
    runs-on: rio-ci-kvm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.vm-test) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          kvm: true
      - name: Verify KVM
        run: '[[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]'
      - run: nix build ".#${GHA}.matrix.vm-test.${{ matrix.name }}" --print-build-logs
  coverage:
    name: coverage / ${{ matrix.name }}
    needs: gen-matrix
    # Runner selection by naming convention: `vm-*` entries need
    # KVM (instrumented VM tests → profraw → lcov). `unit` runs
    # on spot. See flake.nix githubActions comment.
    runs-on: ${{ startsWith(matrix.name, 'vm-') && 'rio-ci-kvm' || 'rio-ci' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.gen-matrix.outputs.coverage) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
        with:
          kvm: ${{ startsWith(matrix.name, 'vm-') }}
      - name: Verify KVM
        if: startsWith(matrix.name, 'vm-')
        run: '[[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]'
      - run: nix build ".#${GHA}.matrix.coverage.${{ matrix.name }}" --print-build-logs
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: result
          flags: ${{ matrix.name }}
          use_oidc: true
          # Fail the job if Codecov's ingest endpoint rejects the upload.
          # One flag per `githubActions.matrix.coverage` entry; count
          # enforced by `codecov-matrix-sync`. Without this, every job
          # goes green even when N-1 uploads are dropped.
          fail_ci_if_error: true
          # `files:` is exhaustive; don't fall back to repo-wide discovery.
          disable_search: true
  # Single stable name for branch protection. Dynamic matrices
  # mean individual entry names change as tests are added/removed —
  # marking them required would break. This job fans-in and succeeds
  # iff every upstream did.
  #
  # alls-green treats `skipped` as failure (GitHub branch protection
  # doesn't, which is a well-known footgun — a skipped required
  # check silently passes).
  ci-gate:
    if: always()
    needs: [gen-matrix, checks, fuzz, vm-test, coverage]
    runs-on: rio-ci
    timeout-minutes: 60
    steps:
      # alls-green shells out to `python` (not `python3`); ARC's stock
      # image has python3 but not the bare `python` symlink that GH-
      # hosted runners ship. setup-python adds it (~5s).
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # gen-matrix.sh elides cached entries; a fully-cached matrix
          # → job skipped via `if: != '[]'`. coverage and gen-matrix
          # are NOT listed: gen-matrix must always run, and coverage
          # always has entries — if either skips, something is wrong.
          allowed-skips: checks, fuzz, vm-test
