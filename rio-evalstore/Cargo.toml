[package]
name = "rio-evalstore"
description = "Client-side eval store: persistent CAS backing the rio:// nix store plugin (ADR-024 M0)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# staticlib: linked into the C++ shim's .so (nix store plugin).
# rlib: keeps crate2nix target detection + unit tests working.
crate-type = ["staticlib", "rlib"]

[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true }
fastcdc = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
prost = { workspace = true }
rio-common = { workspace = true }
rio-nix = { workspace = true }
rio-packstore = { workspace = true }
rio-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
