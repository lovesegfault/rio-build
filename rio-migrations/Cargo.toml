[package]
name = "rio-migrations"
description = "Database migration SQL, embedded migrator, and per-migration commentary"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sqlx = { workspace = true, features = ["migrate"] }
# `migrate::run` poll loop (`tokio::time::sleep`).
tokio = { workspace = true, features = ["time"] }
# `migrate::run` follower-poll log lines.
tracing = { workspace = true }
# `schema::TenantRow::tenant_id` column type.
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `TestDb::new(&MIGRATOR)` ephemeral PG fixture.
rio-test-support = { workspace = true }
# `migration_checksums_frozen` hex-encodes the embedded SHA-384.
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
# Hashes .sqlx/ (and migrations/, where applicable) into tracked rustc
# env-deps — see build.rs.
rio-buildhash = { workspace = true }
