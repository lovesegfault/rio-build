SPECIFICATION Spec

\* The lease loop runs forever; the model bounds the state space via MaxTime
\* (clocks stop ticking) and MaxRv/MaxGen (history stops growing). A
\* "deadlock" at those bounds is the state-space ceiling, not a protocol
\* terminal -- there is no terminal in the production protocol.
CHECK_DEADLOCK FALSE

\* Constants are chosen for COVERAGE -- the smallest state space that still
\* reaches every interleaving class the invariants are about: the two-party
\* CAS race, the deposed-leader steal (one full observed-clock expiry), the
\* crash/recover cycle, the renew-based re-acquisition (a self-fenced or
\* crashed holder whose lease nobody stole leads again without a steal),
\* and one clock-tick of skew. At these constants the full model is
\* 1,612,734 distinct states (10.0M generated, depth 43), ~15s of TLC --
\* well within the budget policy in nix/tla.nix (a check around ~1min
\* needs no optimization). The state-count history: 4.27M pre-generation-fix
\* (the floor-lags-behind interleavings); 1.47M after moving the PG-floor
\* update into Steal; 1.97M after RenewLease restores Leading (the
\* re-acquisition states); 1.61M after anchoring the self-fence clock to
\* the last completed write instead of any read (fence[n] takes fewer
\* distinct values once a bare Get stops churning it).
\*
\* Going UP from here: {n1,n2,n3} x MaxTime=12 x MaxRv=12 is ~200M+
\* distinct states and does not converge. What staying at the current
\* constants loses:
\*   - Nodes=2 (not 3): no spectator replica. Every contention scenario is
\*     two-party; a three-way race where the third node's GET interleaves
\*     between the first two's GET and PUT is not explored. The CAS argument
\*     is pairwise (any k-party race contains a 2-party race as a prefix),
\*     so this is acceptable for AtMostOneCASWinner; a three-party
\*     BoundedDualLeadership violation would need two simultaneously-stale
\*     ex-leaders, which requires two prior leadership cycles -- partially
\*     covered by MaxTime=8 (2 cycles).
\*   - MaxTime=8 (not 12): 2 leadership cycles, not 3. Acquire -> depose ->
\*     re-acquire is reachable; a third handoff is not.
\*   - FenceAfter=StealAfter=3: ZERO separation -- this cfg models the
\*     DEGRADED regime (the pre-asymmetric-TTL production constants, or a
\*     deployment whose clock skew exceeds the margin). Dual belief is
\*     reachable here and BoundedDualLeadership is the operative
\*     property. LeaderElectionAsymmetric.cfg models the healthy regime
\*     (separation > 2*MaxSkew) where NeverDual holds instead. The 3:1
\*     deadline/Renew ratio mirrors production LEASE_TTL=15s /
\*     RENEW_INTERVAL=5s while shrinking the observed-clock state space.
\*
\* NON-VACUITY at these constants (re-verify after any constant change;
\* never shrink past the point where these checks stop firing):
\*   - Dual (two simultaneous believers) is REACHABLE: adding
\*     `INVARIANT NeverDual` to THIS cfg violates it within depth 16
\*     (NeverDual is a permanent definition, checked for real only in
\*     LeaderElectionAsymmetric.cfg where the separation makes it hold).
\*     BoundedDualLeadership's and StaleLeaderHasStaleGeneration's shared
\*     antecedent is satisfiable here.
\*   - BoundedDualLeadership is FALSIFIABLE: weakening Steal's staleness
\*     guard from `> StealAfter` to `>= 0` violates it (BFS terminates at
\*     depth 12 with the write-anchored fence; was depth 6 with the
\*     read-refreshed fence) -- a node deposed immediately after acquiring
\*     has a fresh fence and no discovery path armed. The `> StealAfter`
\*     steal threshold is exactly what arms discovery.
\*   - StaleLeaderHasStaleGeneration is FALSIFIABLE: reverting Steal's
\*     generation derivation to the pre-fix max(gen[n]+1, genHW+1) and
\*     moving the genHW update back to a dispatch-time Persist action
\*     reproduces the depth-12 collision (both believers at gen 2). The
\*     transition-count derivation + the write-ahead claim are what make
\*     the invariant hold, not the surrounding edits. Under the deletion
\*     fault (LeaderElectionDeletion.cfg) the same reversion is
\*     falsified at depth 6 -- see that cfg's non-vacuity section.
\*   - RenewLease's generation update is LOAD-BEARING, both halves:
\*     restoring state[n] to Leading while leaving gen UNCHANGED (no
\*     on_acquire on the renew-based acquire edge) falsifies
\*     StaleLeaderHasStaleGeneration at depth 15 -- a holder that crashes
\*     inside a dual-belief window, recovers, and renews its still-valid
\*     lease would lead at the reset gen=1, below the stale believer it
\*     deposed. Production never reaches that state because
\*     on_acquire(transitions) runs on every acquire edge. (The claim-path
\*     half of the update is only load-bearing under the deletion fault --
\*     see LeaderElectionDeletion.cfg's non-vacuity section.)
\*   - Note: removing SelfFence from Next does NOT violate
\*     BoundedDualLeadership -- the invariant is a state property about
\*     discovery being ARMED, not a temporal property about the fence
\*     FIRING. The steal-threshold weakening is the correct falsification
\*     lever; the fence-firing obligation is LoopInterval's (enforced by
\*     Tick's precondition).
\* MaxDeletes = 0: the Lease-deletion fault is DISABLED in this cfg --
\* DeleteLease is never enabled and the state space is identical to the
\* pre-DeleteLease model. LeaderElectionDeletion.cfg runs the same .tla
\* with MaxDeletes = 1; keeping the base cfg at 0 keeps the
\* deletion-free proof claim separately falsifiable (a regression in the
\* core protocol shows up here, not buried in the larger deletion run).
CONSTANTS
  Nodes   = {n1, n2}
  NULL    = NULL
  FenceAfter = 3
  StealAfter = 3
  Renew   = 1
  MaxSkew = 1
  MaxTime = 8
  MaxGen  = 4
  MaxRv   = 8
  MaxDeletes = 0
  MaxClaimFailures = 0
  MaxRestores = 0

SYMMETRY perm

INVARIANT TypeOK
INVARIANT AtMostOneCASWinner
INVARIANT LoopInterval
INVARIANT BoundedDualLeadership

\* Re-enabled: the generation now derives from the lease's transition
\* count and is claimed in PG at acquisition time (see the FIXED note in
\* LeaderElection.tla). The pre-fix protocol falsified this at depth 12.
INVARIANT StaleLeaderHasStaleGeneration

CONSTRAINT ClockSkewBound
