SPECIFICATION Spec

\* The lease loop runs forever; the model bounds the state space via MaxTime
\* (clocks stop ticking) and MaxRv/MaxGen (history stops growing). A
\* "deadlock" at those bounds is the state-space ceiling, not a protocol
\* terminal -- there is no terminal in the production protocol.
CHECK_DEADLOCK FALSE

\* Constants are tuned for the ~30s CI budget (nix/tla.nix). With the full
\* apiserver action set, {n1,n2,n3} x MaxTime=12 x MaxRv=12 is ~200M+
\* distinct states and does not converge; {n1,n2} x MaxTime=8 x MaxRv=8 is
\* ~1.6M states in ~12s. What the reduction loses:
\*   - Nodes=2 (not 3): no spectator replica. Every contention scenario is
\*     two-party; a three-way race where the third node's GET interleaves
\*     between the first two's GET and PUT is not explored. The CAS argument
\*     is pairwise, so this is acceptable for AtMostOneCASWinner; a
\*     three-party BoundedDualLeadership violation would need two
\*     simultaneously-stale ex-leaders, which requires two prior leadership
\*     cycles -- partially covered by MaxTime=8 (2 cycles).
\*   - MaxTime=8 (not 12): 2 leadership cycles, not 3. Acquire -> depose ->
\*     re-acquire is reachable; a third handoff is not.
\*   - Ttl=3 (not 4): keeps Ttl/Renew = 3 (production LEASE_TTL=15s /
\*     RENEW_INTERVAL=5s) while shrinking the observed-clock state space.
CONSTANTS
  Nodes   = {n1, n2}
  NULL    = NULL
  Ttl     = 3
  Renew   = 1
  MaxSkew = 1
  MaxTime = 8
  MaxGen  = 4
  MaxRv   = 8

SYMMETRY perm

INVARIANT TypeOK

CONSTRAINT ClockSkewBound
