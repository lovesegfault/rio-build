SPECIFICATION Spec

\* The lease loop runs forever; the model bounds the state space via MaxTime
\* (clocks stop ticking) and MaxRv/MaxGen (history stops growing). A
\* "deadlock" at those bounds is the state-space ceiling, not a protocol
\* terminal -- there is no terminal in the production protocol.
CHECK_DEADLOCK FALSE

\* THE PG FAULT MODEL: same .tla as LeaderElection.cfg, with both
\* PostgreSQL-side faults enabled and the Lease-deletion fault DISABLED.
\*   - ClaimFails (MaxClaimFailures = 1): the claim INSERT errors between
\*     the seed read and the claim write and recovery proceeds anyway --
\*     the production proceed-on-failure path
\*     (rio_scheduler_generation_claim_failed_total). The leader
\*     dispatches at a generation the claims ledger does not contain.
\*   - PgRestore (MaxRestores = 1): a point-in-time restore regresses the
\*     floor (claims ledger + assignment history together) to 0.
\*
\* THE RESULT: all five invariants HOLD over 10,060,222 distinct states
\* (65.7M generated, depth 46), ~1min 35s of TLC -- a 6.2x blowup over
\* the base cfg, the same order as the deletion cfg, within the budget
\* policy in nix/tla.nix. EACH PG FAULT ALONE IS SURVIVABLE: the Lease
\* object's transition count is an independent epoch source, and Steal's
\* generation target is max(lease.gen + 2, genHW + 1) -- when the floor
\* term lies (a failed claim left it behind, a restore zeroed it), the
\* lease term still increases strictly across successive stealers,
\* because only a Steal bumps the transition count and nothing in the PG
\* fault set resets it. The Lease object and the PG ledger are REDUNDANT
\* epoch sources; a collision requires destroying both.
\*
\* THE BOUNDARY (the documented residuals are exactly the documented
\* conjunctions -- temporary runs of THIS cfg with MaxDeletes = 1, not
\* CI checks; re-verify after any constant or encoding change):
\*   - DeleteLease + ClaimFails (MaxDeletes=1, MaxClaimFailures=1,
\*     MaxRestores=0): StaleLeaderHasStaleGeneration VIOLATED, 7-state
\*     trace, found in ~1s:
\*       Get(n1), Steal(n1) [claim FAILS: gen[n1]=2 = lease.gen+2,
\*                           genHW stays 0]
\*       DeleteLease        [lease.gen resets to 0; n1 still believes]
\*       Get(n2), Steal(n2) [target = max(0+2, 0+1) = 2 -- the ledger
\*                           never learned n1 was at 2]
\*     Both believers at generation 2. This is the documented one-term
\*     residual of the proceed-on-failure choice: blocking recovery on
\*     the claim would instead wedge a leader that holds the lease but
\*     cannot reach PG.
\*   - DeleteLease + PgRestore (MaxDeletes=1, MaxClaimFailures=0,
\*     MaxRestores=1): VIOLATED, 7-state trace, found in ~1s:
\*       Get(n1), Steal(n1) [claim succeeds: gen[n1]=2, genHW=2]
\*       DeleteLease        [lease.gen resets to 0]
\*       Get(n2), PgRestore [genHW 2 -> 0: the ledger forgets]
\*       Steal(n2)          [target = max(0+2, 0+1) = 2]
\*     Both believers at generation 2. The restore residual: both epoch
\*     sources destroyed, nothing left to be monotonic over. The etcd
\*     analogue's remedy (over-bump the counter past anything that could
\*     have been issued after a restore) is the operational answer.
\*   If either conjunction run ever PASSES, the constants no longer
\*   reach the collision and must be revisited -- that is this cfg's
\*   non-vacuity evidence. If the MaxDeletes=0 run ever FAILS, a PG
\*   fault alone breaks the fence with no operator action: a new
\*   protocol finding, not a tuning problem.
\*
\* Constants otherwise identical to LeaderElection.cfg (symmetric
\* FenceAfter = StealAfter -- the PG faults are orthogonal to the TTL
\* asymmetry and the degraded-regime constants keep this cfg comparable
\* to the base and deletion cfgs); see that file for the
\* coverage-vs-cost argument behind Nodes/MaxTime/MaxGen/MaxRv.
CONSTANTS
  Nodes   = {n1, n2}
  NULL    = NULL
  FenceAfter = 3
  StealAfter = 3
  Renew   = 1
  MaxSkew = 1
  MaxTime = 8
  MaxGen  = 4
  MaxRv   = 8
  MaxDeletes = 0
  MaxClaimFailures = 1
  MaxRestores = 1

SYMMETRY perm

INVARIANT TypeOK
INVARIANT AtMostOneCASWinner
INVARIANT LoopInterval
INVARIANT BoundedDualLeadership
INVARIANT StaleLeaderHasStaleGeneration

CONSTRAINT ClockSkewBound
