SPECIFICATION Spec

\* The lease loop runs forever; the model bounds the state space via MaxTime
\* (clocks stop ticking) and MaxRv/MaxGen (history stops growing). A
\* "deadlock" at those bounds is the state-space ceiling, not a protocol
\* terminal -- there is no terminal in the production protocol.
CHECK_DEADLOCK FALSE

\* THE HEALTHY REGIME: same .tla as LeaderElection.cfg, but with the
\* fence/steal separation the asymmetric-TTL change gives production
\* (SELF_FENCE_AFTER = LEASE_TTL - FENCE_MARGIN, STEAL_AFTER = LEASE_TTL +
\* FENCE_MARGIN). NeverDual -- no two replicas ever simultaneously believe
\* they lead -- HOLDS over the full state space: 916,662 distinct states
\* (5.65M generated, depth 42), ~10s of TLC. The base and deletion cfgs
\* keep zero separation and model the degraded regime, where dual belief
\* is reachable and BoundedDualLeadership (every dual-belief state has a
\* discovery mechanism armed) is the operative property.
\*
\* WHY IT HOLDS -- the separation condition, measured at the boundary:
\*   NeverDual holds  iff  StealAfter - FenceAfter >= Renew + 2*MaxSkew.
\* A thief may steal only after measuring > StealAfter of staleness on its
\* own clock since the last rv change. The victim's fence is anchored to
\* the same rv change (its last completed write -- see Get(n)'s comment on
\* why a bare read does not move the anchor), so the victim's fence age is
\* within 2*MaxSkew of the thief's measurement, i.e. > StealAfter -
\* 2*MaxSkew on the victim's own clock. The victim self-fences at
\* FenceAfter, and LoopInterval gives it at most Renew more ticks past the
\* deadline before the Tick cap forces the fence to fire or the clock to
\* stop. The steal is therefore unreachable while the victim still
\* believes iff StealAfter - 2*MaxSkew >= FenceAfter + Renew.
\*   - Separation 3 (this cfg: FenceAfter=2, StealAfter=5, Renew=1,
\*     MaxSkew=1): 3 >= 1 + 2 -- HOLDS, with equality. The production
\*     translation: 2*FENCE_MARGIN >= RENEW_INTERVAL + 2*clock_skew, i.e.
\*     8s >= 5s + 2*skew -- a 1.5s clock-skew budget. rio-lease's
\*     compile-time assertion encodes this condition; the number comes
\*     from this model run, not from the (incomplete) earlier design
\*     condition that omitted the Renew term.
\*   - Separation 2 (StealAfter = 4): 2 < 3 -- NeverDual VIOLATED (BFS
\*     terminates at depth 21). The boundary from below.
\*   - Separation 0 (StealAfter = 2): NeverDual VIOLATED (BFS terminates
\*     at depth 15). The degraded regime.
\*
\* NON-VACUITY at these constants (re-verify after any constant change;
\* never shrink past the point where these checks stop firing):
\*   - The margin is LOAD-BEARING: the separation-2 and separation-0 runs
\*     above. The invariant holds because of the separation, not because
\*     the constants made dual-belief interleavings unreachable.
\*   - Steals are still REACHABLE at StealAfter = 5: a temporary
\*     `INVARIANT TmpNoSecondAcquisition == lease.gen < 2` is violated
\*     (BFS terminates at depth 21) -- the lease's transition count
\*     reaches 2 only via a steal of a previously-held lease, so the
\*     contention scenario NeverDual constrains actually happens within
\*     MaxTime = 8 (a node that GETs at t=0 needs its observation to age
\*     past StealAfter = 5, so the steal fires at t = 6..8). NeverDual is
\*     not vacuously true.
\*
\* Constants otherwise identical to LeaderElection.cfg; see that file for
\* the coverage-vs-cost argument behind Nodes/MaxTime/MaxGen/MaxRv.
CONSTANTS
  Nodes   = {n1, n2}
  NULL    = NULL
  FenceAfter = 2
  StealAfter = 5
  Renew   = 1
  MaxSkew = 1
  MaxTime = 8
  MaxGen  = 4
  MaxRv   = 8
  MaxDeletes = 0
  MaxClaimFailures = 0
  MaxRestores = 0

SYMMETRY perm

INVARIANT TypeOK
INVARIANT AtMostOneCASWinner
INVARIANT LoopInterval
INVARIANT BoundedDualLeadership
INVARIANT StaleLeaderHasStaleGeneration
INVARIANT NeverDual

CONSTRAINT ClockSkewBound
