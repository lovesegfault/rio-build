SPECIFICATION Spec

\* LeaderElection.tla with the Lease-object-deletion fault enabled
\* (MaxDeletes = 1). Everything else -- constants, invariants, the
\* symmetry set, the skew constraint -- is identical to
\* LeaderElection.cfg; see that file for the coverage-vs-cost argument
\* behind the shared constants. This cfg exists because `kubectl delete
\* lease` is a documented operational remedy for a stuck election in the
\* Kubernetes ecosystem, and it resets the leaseTransitions counter the
\* generation derives from -- the one fault that re-arms the
\* generation-collision failure mode the transition-count derivation
\* closed. The write-ahead claim (genHW advancing inside Steal) is what
\* survives it, and this cfg is the proof.
CHECK_DEADLOCK FALSE

\* At these constants: 12,819,614 distinct states (82.6M generated, depth
\* 43), ~1min 55s of TLC -- a 6.5x blowup over the MaxDeletes=0 run,
\* within the budget policy in nix/tla.nix (over ~1min, under the ~5min
\* tune-it threshold; the interleavings the extra states buy ARE the
\* deletion fault and the post-deletion re-acquisitions, so there is
\* nothing to shrink without losing the coverage this cfg exists for).
\*
\* NON-VACUITY at these constants (re-verify after any constant change):
\*   - The deletion fault is REACHABLE and consequential: with the
\*     write-ahead claim reverted (genHW advancing at a dispatch-time
\*     Persist action instead of inside Steal -- the pre-claim
\*     protocol), StaleLeaderHasStaleGeneration is FALSIFIED at depth 6:
\*       Get(n1), Steal(n1)  -> gen[n1]=2 (= lease.gen+2 = 0+2), genHW
\*                              STAYS 0 (no claim, never persisted)
\*       DeleteLease         -> lease.gen resets to 0, genHW still 0
\*       Get(n2), Steal(n2)  -> gen[n2] = max(1, 0+2, 0+1) = 2
\*     Both believers at generation 2 -- the executor fence cannot tell
\*     their assignments apart. The deletion re-arms the transition-count
\*     derivation's failure mode (both acquisitions see lease.gen=0) and
\*     the lazy persist leaves the PG floor at 0 for both. The claim
\*     closes it: genHW advances to 2 inside Steal(n1), so Steal(n2)
\*     seeds from max(1, 0+2, 2+1) = 3. This red-first run is the cfg's
\*     reason to exist; if a constant change makes the claim-reverted
\*     model pass, the constants no longer reach the deletion collision
\*     and must be revisited.
\*   - A post-deletion dual is REACHABLE: DeleteLease deposes a holder
\*     that has no snapshot and a fresh fence; the empty-holder Steal
\*     branch lets a second node acquire immediately (no Ttl observation
\*     wait). Without BoundedDualLeadership's fourth disjunct (the
\*     delVictims arm) the invariant is falsified at depth 6 -- that is
\*     the non-vacuity evidence for the fourth disjunct.
\*   - A holderless dual is REACHABLE (delete the Lease out from under
\*     an existing dual at depth 12): that state is why
\*     StaleLeaderHasStaleGeneration's holder-exists/holderless split
\*     exists -- the single-stale-believer formulation demands
\*     gen[m] < gen[n] AND gen[n] < gen[m] when neither believer holds
\*     the lease.
\*   - RenewLease's claim-path arm (seeded = genHW + 1 when the floor
\*     exceeds what the lease and the Arc gave us) is LOAD-BEARING under
\*     the deletion fault: encoding only the on_acquire half
\*     (max(gen[n], lease.gen + 1)) falsifies
\*     StaleLeaderHasStaleGeneration at depth 9 --
\*       Steal(n1) -> gen[n1]=2, genHW=2;  DeleteLease -> lease.gen=0;
\*       Steal(n2) -> gen[n2]=max(1,0+2,2+1)=3, genHW=3 (the floor, not
\*                    the recreated lease's count, is what put n2 at 3);
\*       Crash(n2), Recover(n2), Get(n2), RenewLease(n2)
\*                 -> entry = lease.gen+1 = 2, which under-restores: the
\*                    recreated lease's transition count never encoded
\*                    n2's generation. n2 leads at 2 = the deletion
\*                    victim n1's generation.
\*     Production's recovery path closes this (pg_floor > gen_at_entry
\*     -> target = pg_floor + 1 -> n2 re-claims at 4); the model's
\*     RenewLease encodes the same floor comparison. This is the
\*     deletion-specific red test for the seeded half of RenewLease's
\*     generation update.

CONSTANTS
  Nodes   = {n1, n2}
  NULL    = NULL
  Ttl     = 3
  Renew   = 1
  MaxSkew = 1
  MaxTime = 8
  MaxGen  = 4
  MaxRv   = 8
  MaxDeletes = 1

SYMMETRY perm

INVARIANT TypeOK
INVARIANT AtMostOneCASWinner
INVARIANT LoopInterval
INVARIANT BoundedDualLeadership
INVARIANT StaleLeaderHasStaleGeneration

CONSTRAINT ClockSkewBound
