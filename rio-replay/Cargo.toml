[package]
name = "rio-replay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "build-replay campaign engine — evaluation recorder and campaign runner"

[[bin]]
name = "rio-replay"
path = "src/main.rs"

[dependencies]
# HMAC service-token signing for the campaign engine's scheduler
# AdminService calls (`x-rio-service-token`). StoreService calls are
# deliberately anonymous — see `run::grpc::GrpcStoreApi`.
rio-auth = { workspace = true }
# Shared S3 client builder (rio_common::s3::default_client) — same
# config as rio-store/rio-scheduler so credential/retry resolution
# doesn't drift.
rio-common = { workspace = true, features = ["aws"] }
# narinfo text parsing, StorePath/hash_part, nixbase32 encode/decode.
rio-nix = { workspace = true }
# AdminService/StoreService clients for the campaign runner (separate
# plan). Unused by the eval-set builder; declared now so the crate's
# dependency surface is stable across the two plans.
rio-proto = { workspace = true }

anyhow = { workspace = true }
# Streaming NAR decompression (zstd/xz/bzip2/gzip/brotli) for the
# substituter client's relay fetches.
async-compression = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
# S3 checksum headers (x-amz-checksum-sha256) carry base64 of the raw
# digest; the archive publisher converts its hex digests to compare an
# at-rest object against the bytes it has in hand.
base64 = { workspace = true }
clap = { workspace = true }
# In-process reader for the DwarFS images replay archives are published
# as (no external tools needed to read an archive).
dwarfs = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
# Timestamps in the replay-archive manifest (`created_at`/`from`/`to`)
# serialize as RFC 3339 strings; the serde feature is explicit here so
# the archive schema does not depend on feature unification through
# workspace-hack.
jiff = { workspace = true, features = ["serde"] }
regex = { workspace = true }
# `stream` for bytes_stream() on NAR fetch responses — the substituter
# client streams large NARs instead of buffering whole bodies.
reqwest = { workspace = true, features = ["stream"] }
# In-process SSH client for the gateway worker-protocol transport
# (run::transport's GatewayPool / DaemonChannel).
russh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Fresh per-attempt archive staging scratch dirs for the recorder
# (auto-cleaned on failure; published at the deterministic path with an
# atomic rename only once fully staged).
tempfile = { workspace = true }
# Error taxonomy of the supply-execution transport seam (a daemon refusal
# is retried once on a fresh channel, anything else is a failure).
thiserror = { workspace = true }
tokio = { workspace = true }
# StreamReader: adapts the reqwest byte stream into the AsyncRead the
# substituter's streaming NAR decoder consumes.
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# Loopback fake Hydra / fake binary cache for HTTP-client tests (same
# pattern as rio-store's fake upstream).
axum = { workspace = true }
# MockAdmin with scriptable GetDerivationLogs outcomes — the admin
# facade's deadline/retry tests run against a real tonic server.
rio-test-support = { workspace = true }
aws-sdk-s3 = { workspace = true, features = ["test-util"] }
aws-smithy-mocks = { workspace = true }
# Ephemeral ed25519 keys for the transport host-key policy tests.
rand = { workspace = true }
rstest = { workspace = true }
# Politeness-budget spacing test uses paused-clock time (start_paused).
tokio = { workspace = true, features = ["test-util"] }
# Asserts the keyed-result mapping's count-mismatch warning is emitted.
tracing-test = { workspace = true }
