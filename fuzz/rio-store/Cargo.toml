[package]
name = "rio-store-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Own workspace root — excluded from the parent workspace (../../Cargo.toml)
# but has its own Cargo.lock so Nix can vendor its deps independently.
# Mirrors fuzz/rio-nix/Cargo.toml.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rio-store = { path = "../../rio-store" }
# log_chunk_ingest constructs the BuildLogBatch messages IngestSession
# accepts and the per-session UUIDs the chunk keys embed. Both are
# already in rio-store's dependency tree; naming the types requires the
# direct edge.
rio-proto = { path = "../../rio-proto" }
uuid = "1"
# log_accept_kernel / log_dedup_kernel hit the decision kernels
# directly (and log_chunk_ingest's cutter reuses the kernel's
# contiguous-prefix rule). Already in rio-store's dependency tree;
# naming the kernel fns requires the direct edge.
rio-log-kernel = { path = "../../rio-log-kernel" }

[[bin]]
name = "manifest_deserialize"
path = "fuzz_targets/manifest_deserialize.rs"
test = false
doc = false

[[bin]]
name = "log_chunk_ingest"
path = "fuzz_targets/log_chunk_ingest.rs"
test = false
doc = false

[[bin]]
name = "log_accept_kernel"
path = "fuzz_targets/log_accept_kernel.rs"
test = false
doc = false

[[bin]]
name = "log_dedup_kernel"
path = "fuzz_targets/log_dedup_kernel.rs"
test = false
doc = false
