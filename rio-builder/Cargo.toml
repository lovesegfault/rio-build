[package]
name = "rio-builder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Build executor with FUSE store for rio-build"

[[bin]]
name = "rio-builder"
path = "src/main.rs"

# Privileged per-node DaemonSet: /dev/fuse handoff + BACKING_OPEN broker
# + verified cache promotion (ADR-022 §11, P0567). Same crate as the
# builder because both link castore_fuse::mountd_proto.
[[bin]]
name = "rio-mountd"
path = "src/bin/rio-mountd.rs"

# VM-test client for the production rio-mountd daemon (vm-mountd
# scenario). Stands in for the builder side of the UDS protocol until
# P0559's in-process client exists.
[[bin]]
name = "spike_mountd_client"
path = "src/bin/spike_mountd_client.rs"

# xfstests ports against a live castore-FUSE mount (vm-castore-xfstests
# scenario). Every kernel-visible POSIX assertion lives here as Rust
# syscall probes; the NixOS testScript only assembles the mount and
# runs this binary. Selection: rio-builder/tests/xfstests_port/PLAN.md.
[[bin]]
name = "xfstests_runner"
path = "src/bin/xfstests_runner/main.rs"

[features]
# RIO_BUILDER_SCRIPT fixture intercept (sla-sizing VM scenario): skips
# the daemon lifecycle and reports scripted (wall, peak_mem, peak_cpu,
# cpu_seconds) keyed on (pname, cpu_limit). Runtime-gated on the env
# var so default-on is harmless in production; default because crate2nix
# bakes features at lock-time and the VM-test workspace package has no
# per-crate feature override hook.
default = ["test-fixtures"]
test-fixtures = ["dep:toml"]

[dependencies]
rio-common = { workspace = true }
rio-log-kernel = { workspace = true }
rio-nix = { workspace = true }
rio-proto = { workspace = true }
schemars = { workspace = true }

tokio = { workspace = true }
tonic = { workspace = true }
# google.protobuf.Timestamp in BuildResult.start_time/stop_time.
# Scheduler's build_samples insert is gated on both being Some.
prost-types = { workspace = true }
# castore_fuse/tree.rs keys GetDirectory bodies by their recomputed
# canonical digest = blake3(Message::encode_to_vec(dir)).
prost = { workspace = true }
fuser = { workspace = true }
sqlx = { workspace = true }
nix = { workspace = true }
sha2 = { workspace = true }
# FOD hash verification: Nix FODs can declare sha1/sha256/sha512.
# Round 4 Z8: sha1 FODs were rejected with a false-positive because
# verify_fod_hashes hardcoded SHA-256.
sha1 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# IntoStaticStr on ExecutorError — discriminant name for the banner
# footer's `failed (executor: <variant>)` summary.
strum = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
# /healthz + /readyz HTTP endpoints. Worker has no gRPC server
# (it's a gRPC CLIENT of the scheduler) so tonic-health doesn't fit.
# axum on a separate port. K8s readinessProbe hits /readyz.
axum = { workspace = true }
scopeguard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# castore_fuse/mountd_proto.rs UDS wire format (one postcard datagram
# per SOCK_SEQPACKET frame).
postcard = { workspace = true }
# rio-mountd Promote re-hashes staged content before it becomes visible
# in the node-shared cache.
blake3 = { workspace = true }
# ADR-022 §6.1: the fused output walk chunks each regular file
# builder-side. Parameters come from rio_common::limits::FASTCDC_* so
# they cannot drift from the store's chunker.
fastcdc = { workspace = true }
toml = { workspace = true, optional = true }
# I-178b: ANSI-escape strip in is_input_materialization_failure.
regex = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# IdleClock pair-sum property (runtime/idle.rs) — kani none-sensible
# for a bin crate; the proptest is the recorded coverage.
proptest = { workspace = true }
rstest = { workspace = true }
# upload.rs tests use the eager `nar::dump_path` as a byte-exact oracle for
# the streaming upload pipeline.
rio-nix = { workspace = true, features = ["test-oracle"] }
# upload/agreement_tests.rs drives the REAL PutPathChunked handler
# (ephemeral PG + in-memory chunk backend) with what the production
# client assembles, so the fused walk and the store's validate/verify
# pipeline are checked against each other at the wire level.
rio-store = { workspace = true, features = ["test-utils"] }
# Signs the HMAC assignment token the agreement fixture's real
# ChunkService requires — HasChunks rejects anonymous probes, so the
# dedup-through-the-real-probe test needs a verifiable caller identity.
rio-auth = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
rio-test-support = { workspace = true }
# Router::oneshot for health.rs tests (ServiceExt trait).
tower.workspace = true
