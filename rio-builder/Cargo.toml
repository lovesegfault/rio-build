[package]
name = "rio-builder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Build executor with FUSE store for rio-build"

[[bin]]
name = "rio-builder"
path = "src/main.rs"

[features]
# RIO_BUILDER_SCRIPT fixture intercept (sla-sizing VM scenario): skips
# the daemon lifecycle and reports scripted (wall, peak_mem, peak_cpu,
# cpu_seconds) keyed on (pname, cpu_limit). Runtime-gated on the env
# var so default-on is harmless in production; default because crate2nix
# bakes features at lock-time and the VM-test workspace package has no
# per-crate feature override hook.
default = ["test-fixtures"]
test-fixtures = ["dep:toml"]

[dependencies]
rio-common = { workspace = true }
# Native sandbox executor (namespaces, seccomp, pty capture). Two
# consumers until activation wires the full pipeline: the request glue
# (executor/glue/) translates derivations into build-system-agnostic
# ExecutionRequests, and the result classification (executor/native_result)
# consumes ExitOutcome. Nothing Nix-specific lives below that boundary.
rio-exec = { workspace = true }
rio-nix = { workspace = true }
rio-proto = { workspace = true }
schemars = { workspace = true }

tokio = { workspace = true }
tonic = { workspace = true }
# google.protobuf.Timestamp in BuildResult.start_time/stop_time.
# Scheduler's build_samples insert is gated on both being Some.
prost-types = { workspace = true }
fuser = { workspace = true }
nix = { workspace = true }
# llistxattr/lremovexattr in output canonicalisation (executor/
# native_result/canonicalise.rs) — the `nix` crate does not wrap the
# xattr family.
libc = { workspace = true }
sha2 = { workspace = true }
# FOD hash verification: Nix FODs can declare sha1/sha256/sha512.
# Round 4 Z8: sha1 FODs were rejected with a false-positive because
# verify_fod_hashes hardcoded SHA-256.
sha1 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
# /healthz + /readyz HTTP endpoints. Worker has no gRPC server
# (it's a gRPC CLIENT of the scheduler) so tonic-health doesn't fit.
# axum on a separate port. K8s readinessProbe hits /readyz.
axum = { workspace = true }
scopeguard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true, optional = true }
# Native builtin:fetchurl (the __builtin-fetchurl re-exec subcommand):
# streaming HTTP download of FOD sources. rustls via the workspace
# feature set; "stream" for bytes_stream() → file/decoder piping.
reqwest = { workspace = true, features = ["stream"] }
# builtin:fetchurl builds a no-trust rustls config when the sandbox has
# no CA bundle (plain-HTTP fetches must keep working there); shares the
# workspace aws-lc-rs provider already linked via tonic/reqwest.
rustls = { workspace = true }
# xz decode for `unpack = true` fetchurl payloads (same crate the store
# uses for substituter NARs; only the xz codec is exercised here).
async-compression = { workspace = true }
# SyncIoBridge: drives the async xz decoder from the blocking thread
# that runs the synchronous NAR restore.
tokio-util = { workspace = true, features = ["io-util"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
rstest = { workspace = true }
# upload.rs tests use the eager `nar::dump_path` as a byte-exact oracle for
# the streaming upload pipeline.
rio-nix = { workspace = true, features = ["test-oracle"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
rio-test-support = { workspace = true }
# Router::oneshot for health.rs tests (ServiceExt trait).
tower.workspace = true
