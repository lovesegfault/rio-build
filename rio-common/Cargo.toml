[package]
name = "rio-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Shared configuration, observability, and error types for rio-build"

[features]
# Shared aws-sdk-s3 client builder (s3.rs). Only rio-store +
# rio-scheduler enable this.
aws = ["dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
# JSON Schema derivation for Config structs (`docs/gen/config.json`).
schemars = { workspace = true }
# Optional: shared S3 client builder (aws feature).
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }

# Logging & metrics
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Non-blocking stdout writer for the fmt layer (observability.rs).
tracing-appender = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# OpenTelemetry (optional OTLP export, RIO_OTEL_ENDPOINT-gated)
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

# Configuration (config crate: TOML + env + CLI layered)
config = { workspace = true }
serde = { workspace = true }
# serialized_layer: defaults/CLI overlay value-tree round-trip.
serde_json = { workspace = true }

# Async runtime (for spawn_monitored)
tokio = { workspace = true }
futures-util = { workspace = true }
# CancellationToken (graceful shutdown, signal.rs).
tokio-util = { workspace = true }
# Backoff jitter (backoff.rs). Not crypto — thread-local SmallRng.
rand = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
# Health service types for the shared spawn_health_plaintext helper.
tonic-health = { workspace = true }
# HTTP /healthz + /readyz router (kubelet probes) + spawn_axum.
axum = { workspace = true }
# CryptoProvider install in server::bootstrap — every binary's first
# line. Previously 5×-duplicated at each main.rs top.
rustls = { workspace = true }

# PEM body validation (tls.rs validate_pem_sections).
base64 = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
tower-http = { workspace = true }
http = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# Router::oneshot for health-router unit test.
tower.workspace = true
# libc::raise for signal self-delivery test.
libc = { workspace = true }
# start_paused + tokio::time::advance in spawn_drain_task test.
tokio = { workspace = true, features = ["test-util"] }
# TcpListenerStream for test server.
tokio-stream = { workspace = true, features = ["net"] }
