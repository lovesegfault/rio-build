# Dependency-light home for the scheduler's retry/poison decision
# kernels (the reference fold, decide()/classify()/placeable() and their
# CBMC contracts). Extracted from rio-scheduler/src/retry_policy.rs so
# the kani goto model for the proof harnesses closes over THIS crate
# only — inside rio-scheduler's artifact context the same harnesses
# inherited the crate's full reachable code (Arc-backed identifiers,
# f64 timestamp conversions, sqlx/tonic types) and CBMC did not converge
# inside a merge-gate budget. Keep it that way: no dependencies. The
# scheduler-facing vocabulary (AttemptRecord, ExecutorId, the db enums)
# stays in rio-scheduler; rio_scheduler::retry_policy is the projection
# shim and re-export surface.
[package]
name = "rio-retry-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Pure retry/poison decision kernels for the rio-build scheduler (CBMC-verified)"

[lints.rust]
# `cfg(kani)` is set by kani-compiler (nix `crateBuildKani` passes
# `--cfg=kani --check-cfg=cfg(kani)`); register it here so the regular
# cargo build doesn't warn `unexpected_cfgs` on the
# `#[cfg_attr(kani, kani::...)]` contracts and the `#[cfg(kani)]`
# proofs module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# No [dependencies]: the whole point of this crate is that the CBMC
# proof harnesses' call graph stays inside core/alloc/std. It is also
# excluded from hakari's workspace-hack unification
# (.config/hakari.toml [final-excludes]) so it does not even carry the
# feature-unification stub.
[dependencies]
