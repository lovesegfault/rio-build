[package]
name = "rio-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Admin CLI for rio-build — talks to the scheduler's AdminService"

[[bin]]
name = "rio-cli"
path = "src/main.rs"

[dependencies]
rio-log-kernel = { workspace = true }
rio-auth = { workspace = true }
rio-common = { workspace = true }
rio-proto = { workspace = true }
# CRD types only (Pool, ComponentScaler) — NOT rio-controller.
# rio-crds was extracted specifically so rio-cli can import CRD
# structs without pulling the reconciler stack.
rio-crds = { workspace = true }

tokio = { workspace = true }
tonic = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# kube::Client + Api<T> for `wps` subcommand (talks to K8s apiserver,
# not gRPC). Workspace dep already has `client` feature enabled.
kube = { workspace = true }
# Version-feature activation only — no code references it, and
# cargo-machete will flag it as unused. k8s-openapi's build.rs requires
# exactly one v1_NN feature to be enabled by SOME crate in the build
# graph; kube deliberately enables none. The workspace dep carries the
# v1_NN feature (root Cargo.toml `[workspace.dependencies]`), so this
# edge is what makes `cargo build -p rio-cli` (the per-member CI
# builds) compile.
k8s-openapi = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
rio-test-support = { workspace = true }
rstest = { workspace = true }
