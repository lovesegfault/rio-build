syntax = "proto3";
package rio.store;

import "google/protobuf/empty.proto";
import "types.proto";
import "build_types.proto"; // LogService.AppendLog → BuildLogBatch
import "castore.proto"; // DirectoryService.GetDirectory → Directory

// Store service for NAR storage and path metadata.
// Inspired by tvix castore/store protos (MIT).
service StoreService {
  // Upload a store path (metadata + streaming NAR data).
  rpc PutPath(stream rio.types.PutPathRequest) returns (rio.types.PutPathResponse);

  // Upload multiple store paths atomically (multi-output derivation).
  // All outputs commit in ONE database transaction; if any fails
  // validation, none are registered. Use this instead of N independent
  // PutPath calls when cross-output atomicity matters (it always does
  // for multi-output derivations — partial registration breaks the
  // "all outputs or none" contract).
  rpc PutPathBatch(stream rio.types.PutPathBatchRequest) returns (rio.types.PutPathBatchResponse);

  // ADR-022 §6 (P0586): chunked output upload. The builder runs the
  // FastCDC chunking, sends a per-file chunk manifest + the castore
  // Directory DAG up front, then streams only the chunks the store
  // doesn't already have (per ChunkService.HasChunks). The store
  // verifies each chunk's BLAKE3 on arrival, recomputes
  // nar_hash/references/per-file digests from the regenerated NAR
  // framing and the chunk bodies, and commits all outputs in one
  // transaction — without ever buffering a whole NAR in memory. Same
  // atomicity contract as PutPathBatch.
  //
  // Stream shape: Begin (1) → Chunk (one per Begin.novel entry, in
  // novel order).
  //
  // r[impl store.put.chunked]
  // r[impl store.put.chunked-wire]
  rpc PutPathChunked(stream rio.types.PutPathChunkedRequest) returns (rio.types.PutPathChunkedResponse);

  // Download a store path's NAR data (streaming).
  rpc GetPath(rio.types.GetPathRequest) returns (stream rio.types.GetPathResponse);

  // Query metadata for a single store path.
  rpc QueryPathInfo(rio.types.QueryPathInfoRequest) returns (rio.types.PathInfo);

  // Query metadata for many paths in one call. I-110: the builder's
  // input-closure BFS was issuing ~800 QueryPathInfo RPCs per build;
  // with 246 ephemeral builders concurrently that saturated the store's
  // PG pool (acquire times → 11s → FUSE circuit-breaker → EIO). Batch
  // reduces it to ~10 RPCs (one per BFS layer), each backed by ONE
  // `WHERE store_path_hash = ANY(...)` query.
  //
  // r[impl proto.store.batch-rpc]
  // Local-only: unlike QueryPathInfo this does NOT do per-path upstream
  // substitution or sig-visibility gating — both would re-introduce N
  // round-trips. Callers that need those semantics use QueryPathInfo.
  rpc BatchQueryPathInfo(rio.types.BatchQueryPathInfoRequest) returns (rio.types.BatchQueryPathInfoResponse);

  // Batch (PathInfo + complete-manifest availability) lookup — one PG
  // round-trip for many paths. Manifest content is never returned;
  // clients that want the NAR call GetPath.
  //
  // Local-only: same caveats as BatchQueryPathInfo (no substitution,
  // no sig-visibility gate). Returns hint=None for not-found.
  rpc BatchGetManifest(rio.types.BatchGetManifestRequest) returns (rio.types.BatchGetManifestResponse);

  // Batch check which paths are missing from the store.
  rpc FindMissingPaths(rio.types.FindMissingPathsRequest) returns (rio.types.FindMissingPathsResponse);

  // (Retired: rpc SubstitutePath — the single-path progress-streaming
  // substitute. Its only production caller was the scheduler's walk,
  // deleted by the substitution-replacement cutover; the
  // materialization job executor drives the substituter in-process and
  // reports byte progress via SchedulerService.
  // ReportMaterializationProgress instead. Do not reuse the name.)

  // Resolve a store path from its 32-char nixbase32 hash part.
  //
  // wopQueryPathFromHashPart (29) gives us just "abc123..." (the hash-part
  // from /nix/store/{hash-part}-{name}). The Nix daemon looks this up in its
  // ValidPaths table by prefix. We need the same: WHERE store_path LIKE
  // '/nix/store/' || hash_part || '-%'. Without this RPC, the gateway was
  // calling QueryPathInfo with a constructed path that has no name — always
  // a miss.
  rpc QueryPathFromHashPart(rio.types.QueryPathFromHashPartRequest) returns (rio.types.PathInfo);

  // Append signatures to an existing store path's narinfo.
  //
  // wopAddSignatures (37): Nix clients send this after `nix store sign`.
  // Persists: UPDATE narinfo SET signatures = signatures || $2.
  rpc AddSignatures(rio.types.AddSignaturesRequest) returns (rio.types.AddSignaturesResponse);

  // Register a CA derivation realisation (wopRegisterDrvOutput, 42).
  //
  // When Nix finishes building a CA derivation, it sends us the mapping
  // (modular_drv_hash, output_name) -> (output_path, output_hash). We store
  // it so future builds of the same derivation can cache-hit via
  // QueryRealisation — even before Phase 5's full early-cutoff activation.
  //
  // Idempotent (ON CONFLICT DO NOTHING): the same (drv_hash, output_name)
  // always maps to the same output_path (CA derivations are deterministic
  // by construction), so a duplicate registration is a no-op, not an error.
  rpc RegisterRealisation(rio.types.RegisterRealisationRequest) returns (rio.types.RegisterRealisationResponse);

  // Query a CA derivation realisation (wopQueryRealisation, 43).
  //
  // Nix asks "has (drv_hash, output_name) been built before?" and expects
  // back the output_path if yes. NOT_FOUND means "build it yourself" —
  // a normal cache miss, not an error. The gateway translates NOT_FOUND
  // into an empty-set wire response (u64 count = 0).
  rpc QueryRealisation(rio.types.QueryRealisationRequest) returns (rio.types.Realisation);

  // Per-tenant store usage + quota. Gateway calls this before
  // SubmitBuild (r[store.gc.tenant-quota-enforce]) to reject over-quota
  // tenants with STDERR_ERROR. Takes tenant_name (not UUID) so the
  // gateway can call in dual-mode (no JWT → no tenant_id resolved).
  // The store joins tenants on tenant_name to get tenant_id +
  // gc_max_store_bytes, then sums narinfo.nar_size via path_tenants.
  //
  // Cached 30s gateway-side — quota is soft, a few MB of race-window
  // overflow is acceptable. NOT_FOUND on unknown tenant_name (gateway
  // treats as no-quota, passes through).
  rpc TenantQuota(rio.types.TenantQuotaRequest) returns (rio.types.TenantQuotaResponse);

  // r[sched.sla.hw-bench-append-only]
  // ADR-023 phase-10: builder appends one hw_perf_samples row at init.
  // One row per (hw_class, pod_id), upserted (M_046); the hw_perf_factors
  // view aggregates to per-hw_class median. Best-effort from the builder
  // side — a failed append degrades
  // normalization (hw_class stays factor=1.0), not the build itself.
  rpc AppendHwPerfSample(rio.types.AppendHwPerfSampleRequest) returns (google.protobuf.Empty);

  // ADR-022: per-file NAR index for one store path. The index is
  // derived, non-authoritative state (`r[store.index.non-authoritative]`):
  // a missing row triggers a synchronous recompute from the stored NAR
  // (`r[store.index.sync-on-miss]`). NOT_FOUND only if the path itself
  // has no complete manifest.
  rpc GetNarIndex(rio.types.GetNarIndexRequest) returns (rio.types.NarIndex);

  // Batch variant. Build-start fetches O(closure) indices; per-path
  // RTT × ~357 paths is the I-110 PG-wall pattern again. One streamed
  // call, request order preserved.
  rpc GetNarIndexBatch(rio.types.GetNarIndexBatchRequest) returns (stream rio.types.NarIndexResponse);
}

// ADR-022 castore RPC surface (P0573). Tenant-scoped: every RPC joins
// the directory_tenants/file_blob_tenants junction on the caller's
// tenant_id (JWT or HMAC assignment-token claim) — Directory bodies
// leak child names/digests, so cross-tenant exposure is a
// confidentiality issue. See `r[store.castore.tenant-scope]`.
service DirectoryService {
  // recursive=true BFS-walks the subtree server-side; multi-root via
  // field 3. Field semantics in types.proto.
  rpc GetDirectory(rio.types.GetDirectoryRequest) returns (stream rio.castore.Directory);

  // Batch presence probe for the delta-sync pruning loop (ADR-022 §5).
  // A bit set ⇔ the digest is present and tenant-visible.
  rpc HasDirectories(rio.types.HasDirectoriesRequest) returns (rio.types.HasBitmap);
  rpc HasBlobs(rio.types.HasBlobsRequest) returns (rio.types.HasBitmap);

  // Fetch a regular file's bytes by blake3 digest (P0577). The server
  // resolves the digest to a NAR chunk window via file_blobs and the
  // manifest cumsum, then streams the chunks sliced to the file
  // boundary. The caller never sees rio's chunk layout. NotFound if
  // no tenant-visible row.
  rpc ReadBlob(rio.types.ReadBlobRequest) returns (stream rio.types.BlobChunk);

  // Resolve a regular file's chunk window by blake3 digest (P0570).
  // The castore-FUSE open() path calls this for files above the
  // streaming threshold so it can fetch chunks itself (local cache,
  // then GetChunks); smaller files use ReadBlob. NotFound if no
  // tenant-visible row; FailedPrecondition for inline manifests
  // (no chunk list — use ReadBlob).
  rpc StatBlob(rio.types.StatBlobRequest) returns (rio.types.StatBlobResponse);
}

// Chunk-level storage service for content-defined chunking.
// PutPath chunks server-side via cas::put_chunked; PutPathChunked
// (ADR-022 §6) accepts builder-side chunks. GetChunk has no production
// caller today; it is the chunk-level retrieval surface for
// out-of-process reassembly, exercised only by tests.
service ChunkService {
  // Download a chunk by its digest.
  rpc GetChunk(rio.types.GetChunkRequest) returns (stream rio.types.GetChunkResponse);

  // Batched chunk download (P0568). The castore-FUSE fill task (P0559)
  // sends GetChunksRequest frames as it discovers local-cache misses;
  // the server fans out K concurrent backend fetches and streams
  // ChunkData back in completion order. ChunkData carries the digest so
  // the client matches by content, not by request position. Aborts the
  // stream on the first chunk error (NOT_FOUND / DATA_LOSS /
  // UNAVAILABLE) — the client retries the gap, not the whole batch.
  // Unscoped, like GetChunk: knowing a BLAKE3 hash already proves you
  // have (or had) the bytes.
  rpc GetChunks(stream rio.types.GetChunksRequest) returns (stream rio.types.ChunkData);

  // Batch durable-presence probe (ADR-022 §6.2, P0586). Bit i of the
  // response is set IFF digests[i] is referenced by at least one
  // *complete* manifest (`chunks.durable`), not merely refcount ≥ 1 —
  // a chunk mid-upload by a concurrent builder reads as absent, so
  // both builders send it and the second S3 PutObject is an idempotent
  // overwrite (I-201 stranded-chunk race). The builder calls this to
  // compute `PutPathChunkedBegin.novel`. Unscoped, like GetChunk:
  // chunks are content-addressed and tenant-agnostic
  // (`r[store.castore.tenant-scope]` covers Directory/file reads, not
  // chunk presence).
  //
  // r[impl store.chunk.has-chunks-durable]
  rpc HasChunks(rio.types.HasChunksRequest) returns (rio.types.HasBitmap);
}

// Store-side administrative operations. The scheduler's AdminService.
// TriggerGC proxies to this after populating extra_roots from live
// builds. Separate service from StoreService so it can have separate
// RBAC/TLS (admin ops are more privileged than PutPath/GetPath).
service StoreAdminService {
  // Run garbage collection: mark reachable paths (seeded from
  // scheduler_live_pins + uploading manifests + grace period +
  // extra_roots), sweep
  // unreachable complete manifests (DELETE CASCADE + chunk decrement
  // + pending_s3_deletes enqueue). Streams GCProgress updates.
  //
  // dry_run=true: compute stats but ROLLBACK the sweep tx.
  rpc TriggerGC(rio.types.GCRequest) returns (stream rio.types.GCProgress);

  // PG↔backend chunk consistency audit: HeadObject every non-deleted
  // chunk, stream PG-says-exists-but-backend-says-no. I-040 diagnostic —
  // catches chunks stranded by key-format changes or genuinely lost
  // (S3 lifecycle policies, manual deletes). Read-only; no repair.
  rpc VerifyChunks(rio.types.VerifyChunksRequest) returns (stream rio.types.VerifyChunksProgress);

  // Per-tenant upstream cache CRUD (tenant_upstreams, migration 026).
  // r[store.substitute.upstream] — the substitution fetch logic itself
  // lands in P0462; these RPCs configure which upstreams a tenant
  // trusts and with what sig_mode.

  // List a tenant's configured upstreams, ORDER BY priority ASC.
  rpc ListUpstreams(rio.types.ListUpstreamsRequest) returns (rio.types.ListUpstreamsResponse);

  // Add an upstream cache for a tenant. ALREADY_EXISTS on duplicate
  // (tenant_id, url). INVALID_ARGUMENT on bad sig_mode.
  rpc AddUpstream(rio.types.AddUpstreamRequest) returns (rio.types.UpstreamInfo);

  // Remove an upstream by (tenant_id, url). NOT_FOUND if no match.
  rpc RemoveUpstream(rio.types.RemoveUpstreamRequest) returns (google.protobuf.Empty);

  // Per-replica load snapshot for the ComponentScaler reconciler.
  // Returns pg_pool_utilization = (pool.size - pool.num_idle) / max_
  // connections — the fraction of the PG connection pool that is
  // checked out RIGHT NOW. The controller polls this on every store
  // pod (via headless-svc DNS) and takes the max across replicas as
  // the observed load signal that calibrates the learned builders-
  // per-replica ratio. I-105: PG pool exhaustion is the cliff that
  // cascades into FUSE circuit-trip; this is the leading indicator.
  rpc GetLoad(rio.types.GetLoadRequest) returns (rio.types.GetLoadResponse);
}

// Build-log data plane. AppendLog is the builder's authenticated ingest
// stream (x-rio-assignment-token metadata, same as PutPath); TailLog is the
// unauthenticated read/follow stream used by the gateway, dashboard, and CLI.
service LogService {
  // Authenticated builder ingest. Errors: UNAUTHENTICATED on a bad/expired
  // assignment token; PERMISSION_DENIED when the claimed execution does not
  // match the derivation's latest assignment; FAILED_PRECONDITION when the
  // execution's log is already complete; ALREADY_EXISTS when another live
  // ingest session holds this execution; RESOURCE_EXHAUSTED past the
  // per-execution byte cap; UNAVAILABLE when the replica cannot commit
  // chunks (the client should reconnect and replay).
  //
  // Clients MUST write the AppendLogHeader into the request stream before
  // awaiting the RPC; the server does not return response headers until the
  // header message has been read and validated. Awaiting the call first
  // deadlocks: the client waits for headers the server will not send until
  // it receives the AppendLogHeader the client has not sent. All open-time
  // errors (token, binding, admission, lease) are returned from the call
  // itself, before the ack stream exists.
  rpc AppendLog(stream AppendLogRequest) returns (stream AppendLogAck);

  // Unauthenticated read/follow. Errors are yielded in-stream (grpc-web
  // clients cannot read trailers): NOT_FOUND when the derivation has no
  // recorded execution or a pinned exec_id is unknown.
  rpc TailLog(TailLogRequest) returns (stream TailLogChunk);
}

message AppendLogRequest {
  oneof msg {
    AppendLogHeader header = 1;        // first message, exactly once
    rio.types.BuildLogBatch batch = 2; // 0..n subsequent messages
  }
}

// First message on every AppendLog stream. Establishes the stream's identity;
// derivation_path/executor_id embedded in subsequent batches are IGNORED.
message AppendLogHeader {
  string derivation_path = 1; // must drv_log_hash-normalize to the token's drv_hash
  string exec_id = 2;         // UUIDv7; validated against the latest assignments row
}

// Sent after each durably committed chunk (S3 PUT + manifest INSERT both
// done) — and, when the execution already has durable contiguous coverage,
// ONCE at stream open as the open-time coverage ack (the first message on
// the ack stream).
message AppendLogAck {
  // A CONTIGUOUS-PREFIX durability claim: every line at or below this value
  // is durably stored. The consumer's retransmit trim prefix-pops every
  // frame at or below it, so the producer must never emit a value above the
  // contiguous durable frontier — a chunk commit that lands past an
  // unserved hole carries NO ack at all (the server stays silent rather
  // than round up across the hole), and the next ack covers it once the
  // hole fills. Producers derive the value through the store's one frontier
  // formula (the coverage map's contiguous prefix end minus one).
  uint64 durable_through_line = 1;
  // The open-time durable-coverage watermark: one past the highest line of
  // the execution's CONTIGUOUS committed coverage at session open. PRESENT
  // exactly on the open-time coverage ack (never on chunk acks); the server
  // sends that ack only when the watermark is positive, with
  // durable_through_line = open_coverage_next_line - 1 so the message is a
  // true durability statement even for clients that predate this field.
  // The client trims its retransmit buffer below the watermark before
  // replaying — committed-but-unacked content from a previous session is
  // already durable and re-sending it would be dropped (and, pre-trim,
  // double-charged on legacy servers). ABSENT = legacy semantics: a plain
  // chunk ack, or a pre-watermark server that never speaks the letter —
  // the client trims nothing at open and replays its full buffer (the
  // server-side covered-replay drop and merged-account seed keep that
  // correct, just less efficient).
  optional uint64 open_coverage_next_line = 2;
}

message TailLogRequest {
  string derivation = 1; // full path | basename | bare 32-char hash
  string exec_id = 2;    // optional; empty = latest execution for the derivation
  uint64 since_line = 3; // Resume from this line number (0 = from start). Chunk
                         // granularity means the server may send lines before
                         // since_line; clients must tolerate and skip them.
  bool follow = 4;       // true: keep streaming until the ingest session ends (the
                         // client re-opens on premature end); false: drain stored
                         // history and close.
}

message TailLogChunk {
  string exec_id = 1; // resolved server-side
  repeated bytes lines = 2;
  uint64 first_line_number = 3;
  bool is_complete = 4; // meaningful on the final chunk of a non-follow read
}
