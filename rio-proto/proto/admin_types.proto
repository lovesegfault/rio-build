syntax = "proto3";
package rio.types;

// Admin/status wire types — ClusterStatus, ListExecutors/Builds/Tenants,
// ClearPoison, GetSpawnIntents. Data
// types for the AdminService RPCs defined in admin.proto.
//
// Same `package rio.types;` — prost merges by package into a single
// `rio.types.rs` so Rust callers see these at `rio_proto::types::*`.

import "google/protobuf/timestamp.proto";
import "types.proto";       // ExecutorInfo.resources → ResourceUsage
import "build_types.proto"; // BuildInfo.state → BuildState; ExecutorInfo.kind → ExecutorKind

// ───────────────────────────────────────────────────────────────────────────
// Cluster / executors / builds status
// ───────────────────────────────────────────────────────────────────────────

message ClusterStatusResponse {
  // Busy executors: one open pull-mode attempt per in-flight
  // derivation (one attempt per pod). Spawned-but-not-yet-pulled pods
  // are the controller's Job census, not a scheduler count.
  uint32 total_executors = 1;
  // Same count as total_executors (no registration state exists).
  uint32 active_executors = 2;
  // Always 0: per-executor drain retired with the stream session.
  uint32 draining_executors = 3;
  uint32 pending_builds = 4;
  uint32 active_builds = 5;
  uint32 queued_derivations = 6;
  uint32 running_derivations = 7;
  uint64 store_size_bytes = 8;           // Total store usage
  google.protobuf.Timestamp uptime_since = 9;
  // Per-system breakdown of queued_derivations (Ready-only, same
  // semantics as the scalar). Sum across all keys == queued_derivations.
  // Pool autoscalers sum the entries matching pool.spec.systems
  // so an aarch64 pool doesn't scale on x86_64 backlog (I-107). Empty
  // map from old schedulers → controller falls back to the scalar.
  map<string, uint32> queued_by_system = 11;
  // Count of derivations carrying a CLAIMABLE materialization job
  // (unclaimed, not parked, not deferred - the scheduler's
  // claimability() axes; wire-stable field name). Parked jobs ride
  // rio_scheduler_materialization_stalled instead; deferred jobs
  // (bounded <=300s) appear in neither count for that window. Feeds
  // r[ctrl.scaler.signal-substituting].
  uint32 substituting_derivations = 12;
}

message ListExecutorsRequest {
  // Optional. Every open attempt reports "alive"; the other historical
  // values ("draining", "degraded", "connecting") match nothing.
  string status_filter = 1;
}

message ListExecutorsResponse {
  // One entry per open pull-mode attempt (the busy view).
  repeated ExecutorInfo executors = 1;
  // Seconds since this replica acquired leadership. Consumers MUST
  // treat the list as potentially incomplete when this is small; the
  // controller's orphan_reap_gate fail-closes when leader_for_secs <
  // ORPHAN_REAP_GRACE so a freshly-failed-over leader's view is never
  // used to prove absence.
  uint64 leader_for_secs = 2;
}

message ExecutorInfo {
  // The open attempt's executor identity (the attested intent id).
  string executor_id = 1;
  // The system the attempt's derivation targets.
  repeated string systems = 2;
  repeated string supported_features = 3;  // empty (no advertisement exists)
  reserved 4;                            // was max_builds (P0537: always 1)
  reserved 5;                            // was uint32 running_builds (P0537: → bool busy)
  string status = 6;                     // always "alive" (an open attempt is an active build)
  ResourceUsage resources = 7;           // unset (no per-pod telemetry on this surface)
  // Attempt-open time (the pull). Producer contract: set once at the
  // pull and NEVER advances mid-build — pull-mode pods send nothing
  // between the pull and the report, so this is plain attempt age,
  // not a liveness heartbeat. Per-pod liveness = Job/pod phase +
  // attempt age vs deadline (the OA2 wedge alert); clients MUST NOT
  // re-derive a staleness threshold from this field (the stream-era
  // ">30s = dead" reading inverts on long builds). Renamed in place
  // from `last_heartbeat` (same field number, same value semantics —
  // both 8 and 9 already carried attempt-open time); field 9
  // (`connected_since`) deleted as the redundant twin.
  google.protobuf.Timestamp attempt_opened = 8;
  reserved 9;
  reserved "connected_since";
  ExecutorKind kind = 11;                // builder or fetcher (from the attempt's derivation)
  bool busy = 12;                        // always true (an open attempt IS a build in flight)
}

message ListBuildsRequest {
  string status_filter = 1;              // Optional: "pending", "active", "succeeded", "failed", "cancelled"
  uint32 limit = 2;                      // Max results (default: 100)
  uint32 offset = 3;                     // Pagination offset (unstable under concurrent inserts — prefer cursor)
  // Optional: filter by tenant NAME (scheduler resolves to UUID). Empty = all tenants.
  string tenant_filter = 4;
  // Opaque keyset cursor — pass the prior page's next_cursor verbatim.
  // When set, offset is ignored (cursor wins). Server encodes; clients
  // treat as an opaque token.
  optional string cursor = 5;
}

message ListBuildsResponse {
  repeated BuildInfo builds = 1;
  uint32 total_count = 2;               // Total matching builds (for pagination)
  // Opaque cursor for the next page. Unset if this page is the last
  // (fewer rows than limit). Pass as ListBuildsRequest.cursor to continue.
  optional string next_cursor = 3;
}

message BuildInfo {
  string build_id = 1;
  string tenant_id = 2;
  string priority_class = 3;
  BuildState state = 4;                  // (build_types.proto)
  uint32 total_derivations = 5;
  uint32 completed_derivations = 6;
  uint32 cached_derivations = 7;
  google.protobuf.Timestamp submitted_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  string error_summary = 11;
}

// GetDerivationLogsRequest / DerivationLogChunk were removed by the
// build-log data-plane cutover (build logs are read from rio-store's
// LogService.TailLog; see store.proto's TailLogRequest / TailLogChunk).

// ───────────────────────────────────────────────────────────────────────────
// Pod-terminal classification / poison / tenants
// ───────────────────────────────────────────────────────────────────────────

// DrainExecutorRequest/Response and ReportExecutorTerminationRequest/Response
// were removed with their RPCs by the executor-lifecycle proto sweep
// (whole-message deletions need no reserved statements). The
// TerminationReason vocabulary below stays: it is the shared k8s
// pod-terminal classification the controller derives from PodStatus and the
// scheduler's resource-floor arms consume (mapped onto AttemptTerminalReason
// for the wire).

// Why a builder/fetcher Pod's container terminated. Populated by the
// controller from k8s PodStatus (containerStatuses[].state.terminated.
// reason for OOMKilled/Completed/Error; status.reason+message for
// Evicted). The controller sends OomKilled / EvictedDiskPressure over
// ReportAttemptOutcome as the classification fill (never promotes a
// floor); floor promotion consumes this vocabulary WORKER-side only
// (OomKilled <- CgroupOom, DeadlineExceeded <- TimedOut; the disk arm
// is parked -- no live producer).
enum TerminationReason {
  // Wire-default: controller couldn't classify (no terminated state,
  // status not yet populated). Scheduler treats as no-op.
  TERMINATION_REASON_UNKNOWN = 0;
  // containerStatuses[].state.terminated.reason == "OOMKilled". Pod hit
  // memory limit. → bump `resource_floor.mem_bytes`.
  TERMINATION_REASON_OOM_KILLED = 1;
  // status.reason == "Evicted" + message mentions DiskPressure /
  // ephemeral-storage. Node ran out of disk. → bump
  // `resource_floor.disk_bytes` (next pod gets a bigger
  // ephemeral-storage request).
  TERMINATION_REASON_EVICTED_DISK_PRESSURE = 2;
  // status.reason == "Evicted", other cause (MemoryPressure, PID
  // pressure, node-shutdown). NOT a per-drv sizing signal. → no-op.
  TERMINATION_REASON_EVICTED_OTHER = 3;
  // Exit 0. Expected one-shot exit after CompletionReport. → no-op.
  TERMINATION_REASON_COMPLETED = 4;
  // Exit !=0, non-OOM (panic, SIGKILL from operator, node failure).
  // NOT a sizing signal — pod death wasn't the build's fault. → no-op.
  TERMINATION_REASON_ERROR = 5;
  // Job.status.conditions has type=Failed reason=DeadlineExceeded —
  // activeDeadlineSeconds backstop fired (worker wedged past its own
  // daemon_timeout). → bump `resource_floor.deadline_secs` (same
  // bounded ladder as worker-reported TimedOut). Reported by JOB name
  // (pod is already deleted by Job controller).
  TERMINATION_REASON_DEADLINE_EXCEEDED = 6;
}

// ───────────────────────────────────────────────────────────────────────────
// Pull-mode attempt lifecycle (AdminService.ReportAttemptOutcome /
// ListOpenAttempts)
// ───────────────────────────────────────────────────────────────────────────

// Why an attempt's pod/Job went terminal, as classified by the
// controller. Covers both the k8s pod-terminal classifications (the
// TerminationReason vocabulary) and the controller-synthesized
// verdicts emitted when it deletes a Job that still has an open
// attempt (cancelled / preempted / reaped).
enum AttemptTerminalReason {
  // Wire-default: controller couldn't classify. Scheduler treats the
  // fill as an unclassified pod-terminal.
  ATTEMPT_TERMINAL_REASON_UNSPECIFIED = 0;
  ATTEMPT_TERMINAL_REASON_OOM_KILLED = 1;
  ATTEMPT_TERMINAL_REASON_EVICTED_DISK_PRESSURE = 2;
  ATTEMPT_TERMINAL_REASON_EVICTED_OTHER = 3;
  // Pod exited 0 (expected one-shot exit after the outcome report).
  ATTEMPT_TERMINAL_REASON_COMPLETED = 4;
  // Pod exited nonzero, non-OOM (panic, node failure, report never acked).
  ATTEMPT_TERMINAL_REASON_ERROR = 5;
  // Job hit activeDeadlineSeconds.
  ATTEMPT_TERMINAL_REASON_DEADLINE_EXCEEDED = 6;
  // Synthesized by the controller on Job deletion for a cancelled build.
  ATTEMPT_TERMINAL_REASON_CANCELLED = 7;
  // Synthesized by the controller on DisruptionTarget preemption.
  ATTEMPT_TERMINAL_REASON_PREEMPTED = 8;
  // Synthesized by the controller when a reap path deletes the Job.
  ATTEMPT_TERMINAL_REASON_REAPED = 9;
  // Spawn-gate verdict (AD2): every node the intent could currently be
  // scheduled onto is already in the intent's excluded_nodes set, so no
  // Job was created. Not a pod-terminal classification — there is no
  // attempt — and the scheduler maps it to the fleet-exhaust poison arm
  // (Poison(FleetExhausted)) instead of a column fill.
  ATTEMPT_TERMINAL_REASON_NO_ELIGIBLE_SOURCE = 10;
}

message ReportAttemptOutcomeRequest {
  // Attempt identity — exec_id preferred when known; intent_id (== drv
  // hash) and job_name accepted (the Job name is derived from the
  // intent, so either resolves to the same open attempt). At least one
  // must be set.
  string intent_id = 1;
  string job_name = 2;
  string exec_id = 3;
  AttemptTerminalReason reason = 4;
  // kube-authoritative spec.nodeName the pod ran on, when known.
  // Persisted as the attempt's source attribution (AD2c).
  string node_name = 5;
  // C2/124: echo of `SpawnIntent.resubmit_cycle` the verdict was
  // computed against (synthesized verdicts only; pod-reported outcomes
  // ride ReportOutcome). On mismatch with the derivation's current
  // cycle the scheduler acks WITHOUT poisoning — the verdict is stale.
  // 0 is both "first cycle" and "pre-C2 controller": during skew a
  // pre-C2 controller under-poisons (mismatch on cycles >0), the
  // conservative direction.
  uint64 resubmit_cycle = 6;
}

// Ack for ReportAttemptOutcome. Always returned on success so the
// controller never retries on semantics, only on transport.
message ReportAttemptOutcomeResponse {
  // TRUE iff this report was applied to — or matched an
  // already-recorded terminal classification of — an actual attempt:
  // the scheduler holds a verdict for it. ALL charge-free ack arms
  // (no matching attempt, exec-less synthesized verdict refusals,
  // materialization-kind refusals, unclassified-open-attempt acks,
  // and every NoEligibleSource arm — the spawn-gate verdict rides its
  // own poison lane, never an attempt resolution) return false.
  // Rolling-skew posture (proto3 default): a pre-field scheduler
  // reads as false — the consumer direction is bounded over-caution
  // (a controller treats "unresolved" as "keep its own evidence"),
  // never spend.
  bool attempt_resolved = 1;
}

message ListOpenAttemptsRequest {}

// One open pull-mode attempt: an active assignment + execution pair
// minted by PullAssignment with no terminal classification yet.
message OpenAttempt {
  // SpawnIntent.intent_id == drv hash (the DAG key).
  string intent_id = 1;
  // Full .drv store path, when resolvable.
  string derivation = 2;
  // Per-execution identifier (UUIDv7) minted by the pull transaction.
  string exec_id = 3;
  // Executor identity the attempt is bound to (the HMAC-attested
  // intent identity for pull-mode attempts).
  string executor_id = 4;
  // kube-authoritative node the pod was bound to, when known ("" = unknown).
  string source_node = 5;
  // Lease generation the pull transaction committed under.
  uint64 generation = 6;
  // Seconds since the assignment row was (re)written by the pull.
  uint64 assigned_at_age_secs = 7;
  // The intent deadline (activeDeadlineSeconds basis) in seconds, when
  // known to the scheduler; 0 = unknown.
  uint64 deadline_secs = 8;
  // Work class of the attempt's execution row
  // (drv_executions.attempt_kind) — the kind partition's controller-
  // facing backstop (merged_bug_146): consumers that synthesize
  // build-lifecycle verdicts filter on it. Rolling-skew posture:
  // ATTEMPT_KIND_UNSPECIFIED (an older scheduler that predates the
  // field) MUST be read as BUILD — the wire default matches the
  // as-built all-build fleet; the scheduler deploys before the
  // controller.
  rio.types.AttemptKind attempt_kind = 9;
  // assignments.assigned_at as PG-clock epoch seconds (merged_bug_018):
  // lets the wedge consumer compute the attempt's expiry instant
  // (assigned_at + deadline + grace) entirely in the ledger's clock
  // frame instead of reconstructing it from `assigned_at_age_secs`
  // against the controller's tick-start clock — the reconstruction
  // moved ±(RPC preamble + flooring) every tick, so one physical
  // expiry flipped admission at the suppression-watermark boundary.
  // 0 = unknown (an older scheduler): consumers fall back to the
  // age reconstruction for at most the rolling-skew window (the
  // scheduler deploys before the controller, same posture as
  // attempt_kind).
  uint64 assigned_at_epoch_secs = 10;
}

message ListOpenAttemptsResponse {
  repeated OpenAttempt attempts = 1;
  // Seconds since this replica acquired leadership — same fail-closed
  // input shape as ListExecutorsResponse.leader_for_secs.
  uint64 leader_for_secs = 2;
  // C2/120: attempts that reached a terminal status inside the recent
  // window (120 s), with their close cause. The controller's
  // cancelled-Job teardown selects ONLY `CLOSE_CAUSE_CANCELLED`
  // entries — closed-ness alone stopped being a verdict (a normal
  // completion in the Job-status propagation lag window is
  // untouchable by type).
  repeated ClosedAttempt recently_closed = 3;
}

// C2/120: why a recently-closed attempt closed. Mirrors the terminal
// `assignments.status` values — the cause travels WITH the close
// instead of being re-inferred from absence.
enum CloseCause {
  CLOSE_CAUSE_UNSPECIFIED = 0;
  CLOSE_CAUSE_COMPLETED = 1;
  CLOSE_CAUSE_FAILED = 2;
  CLOSE_CAUSE_CANCELLED = 3;
}

// One recently-terminal attempt (see
// `ListOpenAttemptsResponse.recently_closed`).
message ClosedAttempt {
  // Intent id == drv hash (same key as `OpenAttempt.intent_id`).
  string intent_id = 1;
  string exec_id = 2;
  CloseCause cause = 3;
  // Seconds since the attempt reached its terminal status (PG clock).
  uint64 closed_age_secs = 4;
  // Work class of the closed attempt's execution row — the
  // merged_bug_146 cross-crate axis ClosedAttempt was missing
  // (`OpenAttempt` carries it at field 9): consumers that tear down
  // build-lifecycle Jobs filter on it instead of inferring kind from
  // closed-ness. Rolling-skew posture: ATTEMPT_KIND_UNSPECIFIED (an
  // older scheduler) MUST be read as BUILD — the wire default matches
  // the as-built window's build-lane-only producer; the scheduler
  // deploys before the controller.
  rio.types.AttemptKind attempt_kind = 5;
}

message ClearPoisonRequest {
  // Key the scheduler's DAG is keyed on — in production this is the
  // full .drv store path (e.g. `/nix/store/abc...-foo.drv`). rio-cli
  // validates the format client-side so a bare hash doesn't silently
  // return cleared=false.
  string derivation_hash = 1;
}

message ClearPoisonResponse {
  bool cleared = 1;                      // true if the derivation was poisoned and is now cleared
}

message PoisonedDerivation {
  string drv_path = 1;                   // full /nix/store/...drv path (what ClearPoison takes)
  repeated string failed_executors = 2;  // executors that tried and failed
  uint64 poisoned_secs_ago = 3;          // age; TTL is 24h
}

message ListPoisonedResponse {
  repeated PoisonedDerivation derivations = 1;
}

// Actor-state snapshot for one derivation. Unlike GetBuildGraph (PG-backed),
// this reads the in-memory DAG + live stream pool. The golden field is
// executor_has_stream: false for an Assigned/Running derivation = the stream
// is dead, dispatch can never complete. I-025 diagnostic.
message DerivationDiagnostic {
  string drv_path = 1;
  string drv_hash = 2;
  // DerivationStatus enum as string: "Ready", "Assigned", "Running", etc.
  // String not enum so the CLI doesn't need to track every variant.
  string status = 3;
  bool is_fod = 4;                      // Routes to fetcher pool vs builder pool
  // Assignment state (empty unless Assigned/Running).
  string assigned_executor = 5;
  // Whether self.executors.contains_key(assigned_executor). THE I-025 signal.
  // Only meaningful when assigned_executor is non-empty.
  bool executor_has_stream = 6;
  // Retry accounting.
  uint32 retry_count = 7;
  uint32 infra_retry_count = 8;
  // Seconds remaining on retry backoff. 0 = no backoff or elapsed.
  // Answers "why isn't this Ready drv being dispatched".
  uint64 backoff_remaining_secs = 9;
  // How many builds need this derivation (>1 = shared across builds, dedup).
  uint32 interested_build_count = 10;
  // hard_filter inputs (I-062). Three "restart fixes it" stuck-Ready
  // cases where PG looked clean but the actor's in-memory state was
  // unobservable. Same lesson as I-056b's draining/degraded: every
  // field hard_filter reads must be in the diagnostic.
  string system = 11;                     // rejection_reason() any-match against executor.systems
  repeated string required_features = 12; // rejection_reason() all-match against executor.features
  repeated string failed_builders = 13;   // executors hard_filter excludes for this drv
  // I-062: simulated hard_filter against EVERY executor in the live
  // pool, with the FIRST failing clause named. Only populated for
  // status=Ready (the question "why isn't this dispatching" is only
  // meaningful then). Reasons: kind-mismatch, draining, store-degraded,
  // not-registered, stream-closed, at-capacity, intent-reserved,
  // system-mismatch, feature-missing, failed-on, resource-fit, or
  // ACCEPT (would dispatch — if EVERY executor shows ACCEPT and the
  // drv stays Ready, the rejection is outside hard_filter; that's the
  // load-bearing finding for I-062).
  repeated ExecutorRejection rejections = 14;
}

message ExecutorRejection {
  string executor_id = 1;
  string reason = 2;
}

message InspectBuildDagRequest {
  string build_id = 1;
}

message InspectBuildDagResponse {
  repeated DerivationDiagnostic derivations = 1;
  // Executors in the live stream pool. For "this executor is in PG but not here" diff.
  repeated string live_executor_ids = 2;
}

// Actor in-memory snapshot of one executor's connection state. Unlike
// ExecutorInfo (PG-backed via ListExecutors), this reads the live
// `self.executors` HashMap — what dispatch_ready() sees. The I-048b/c
// signal: an entry with has_stream=false is a zombie (heartbeat-created,
// no BuildExecution stream — dispatch can never reach it). PG last_seen
// shows it [alive]; the actor knows it's dead.
// DebugExecutorState / DebugListExecutorsResponse were removed with the
// DebugListExecutors RPC by the executor-lifecycle proto sweep: the
// in-memory executor map they snapshotted is gone with the stream session.

// Tenant info for ListTenants/CreateTenant.
message TenantInfo {
  string tenant_id = 1;                  // UUID as string
  string tenant_name = 2;
  uint32 gc_retention_hours = 3;
  optional uint64 gc_max_store_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  bool has_cache_token = 6;              // whether cache_token is set (don't leak the token itself)
}

message ListTenantsResponse {
  repeated TenantInfo tenants = 1;
}

message CreateTenantRequest {
  string tenant_name = 1;
  optional uint32 gc_retention_hours = 2;
  optional uint64 gc_max_store_bytes = 3;
  optional string cache_token = 4;       // Bearer token for binary cache; NULL = no cache access
}

message CreateTenantResponse {
  TenantInfo tenant = 1;
}

message DeleteTenantRequest {
  string tenant_name = 1;
}

message DeleteTenantResponse {
  // True if a row was deleted; false → tenant_name didn't exist (the
  // RPC also returns NOT_FOUND in that case, but the bool lets a caller
  // that swallows NotFound distinguish "deleted" from "already gone").
  bool deleted = 1;
}

// CreateEphemeralBuilderRequest/Response removed 2026-03 — the
// ControllerService they served was speculative proto with zero
// callers/implementers. reconcile_ephemeral polls ClusterStatus (the
// poll-driven architecture is the explicit design choice; see
// ephemeral.rs module docs). Fields 1-2 reserved in case a future
// push-path lands and wants wire compatibility with old clients that
// somehow shipped the stub — unlikely but cheap insurance.
//
// reserved: CreateEphemeralBuilderRequest {pool=1, hint=2},
//           CreateEphemeralBuilderResponse {job_name=1}

// ───────────────────────────────────────────────────────────────────────────
// GetSpawnIntents (ADR-023)
// One SpawnIntent per Ready derivation, filtered server-side by
// {kind, systems, features}. The controller's pool reconcilers spawn one
// Job per intent with `(cores, mem, disk)` stamped into pod resources.
// ───────────────────────────────────────────────────────────────────────────

// ADR-023: scheduler-computed resources for one to-be-spawned builder
// pod. The controller stamps these into the pod's `resources.requests`
// + `limits` and annotates the pod with `rio.build/intent-id`; the
// builder reads the annotation via downward-API → `RIO_INTENT_ID` →
// HeartbeatRequest.intent_id → scheduler matches the heartbeating pod
// to its pre-computed assignment.
message SpawnIntent {
  // Opaque match key. Scheduler-generated; the controller passes it
  // through verbatim as a pod annotation. NOT a drv path (the
  // scheduler may re-plan before the pod heartbeats).
  string intent_id = 1;
  uint32 cores = 2;
  uint64 mem_bytes = 3;
  uint64 disk_bytes = 4;
  // ADR-023 phase-13: per-(band, cap) targeting. Merged into the
  // pod's nodeSelector by the controller (apply_intent_resources).
  // Empty under hw_cost_source=None — pod lands wherever Karpenter
  // bin-packs cheapest.
  map<string, string> node_selector = 5;
  // D5: Builder vs Fetcher. Controller filters by `intent.kind ==
  // pool.spec.kind` so a single flat intents stream serves all Pool
  // reconcilers regardless of kind.
  ExecutorKind kind = 6;
  // D5: target system (e.g. "x86_64-linux"). Controller filters by
  // `intent.system ∈ pool.spec.systems`.
  string system = 7;
  // D5: required system features (scheduler-effective: §13e
  // `EffectiveFeatures::derive` projects FODs to `[fetcher]` and
  // strips `fetcher` from non-FODs before this lands on the wire).
  // Controller filters by `features_compatible(intent.required_features,
  // effective_features(pool.spec))` (bidirectional ∅-guard, NOT a
  // bare subset check).
  repeated string required_features = 8;
  // D7: scheduler-computed `activeDeadlineSeconds` for the spawned
  // Job. For fitted keys: `wall_p99 × 5`; for probe/explore:
  // `[sla].probe.deadline_secs`. Clamped `[floor.deadline_secs, 86400]`.
  // Precedence in `ephemeral_deadline`: this > spec.deadline_seconds
  // > DEFAULT_EPHEMERAL_DEADLINE_SECS.
  uint32 deadline_secs = 9;
  // Field 10 was `string executor_token` — REMOVED. A signed credential
  // on a multi-caller read-path response is the payload-sensitivity
  // anti-pattern (r[sched.sla.threat.read-path-auth]): GetSpawnIntents
  // is reachable by dashboard/CLI/ComponentScaler, and a compromised
  // builder on port 9001 could harvest another tenant's executor_token.
  // Tokens now mint via `MintExecutorTokens` (rio-controller-only).
  reserved 10;
  reserved "executor_token";
  // ADR-023 §13a: OR-of-ANDs over (h, cap) cells. Each term carries the
  // h-label conjunction PLUS karpenter.sh/capacity-type=cap. Supersedes
  // `node_selector` (field 5, kept for compat — controller writes both
  // until A18 lands; readers prefer `node_affinity` when non-empty).
  repeated NodeSelectorTerm node_affinity = 11;
  // §13a forecast horizon: 0 for Ready derivations; max-dep-ETA
  // (reference-seconds) for not-yet-Ready. Controller filters
  // `eta_seconds > 0` until the §13b NodeClaim pool exists, so
  // forecast intents don't spawn pods that immediately gate on
  // unbuilt deps.
  double eta_seconds = 12;
  // True ⇔ the derivation is in the Ready loop (status==Ready, deps
  // satisfied). False ⇔ forecast frontier (Queued, deps Running with
  // ETA < lead_time). Explicit discriminator so the controller's
  // Ready filter doesn't depend on `eta_seconds == 0.0` — a forecast
  // intent with overdue deps clamps to eta=0.0 and would otherwise
  // pass as Ready (bug_030). `eta_seconds` is now purely the §13b
  // NodeClaim pre-provisioning horizon.
  //
  // `optional` so absence (a pre-§13a scheduler that doesn't know
  // field 13) decodes as `None`, not `false`. Pre-§13a only ever
  // emitted Ready-loop intents, so the controller's filter treats
  // `None` as `true` — `false` would drop everything during a
  // new-controller/old-scheduler skew window (bug_001).
  optional bool ready = 13;
  // §13a hw-class names parallel to `node_affinity` — one entry per
  // term, the operator's `[sla.hw_classes.$h]` key that produced that
  // term's label conjunction. Carries the scheduler-internal name
  // through the wire so the controller doesn't reverse-engineer it
  // from a hardcoded label schema (bug_061). Empty under
  // hw_cost_source=None (same as `node_affinity`).
  repeated string hw_class_names = 14;
  // ADR-023 §sizing: variance-aware overlay-disk headroom multiplier.
  // Computed scheduler-side as `headroom(fit.n_eff_ring)` (fit.rs) so
  // the controller stays a dumb consumer of the curve. `optional` so a
  // pre-§sizing scheduler decodes as `None` and the controller falls
  // back to the flat 1.5× constant. 0.0 is also treated as
  // absent (proto default for `double`).
  optional double disk_headroom_factor = 15;
  // AD2: source nodes already excluded for this derivation — the
  // node-keyed entries of the retry fold's exclusion set (attempt rows
  // carrying drv_attempts.source_node). The controller renders these as
  // required node anti-affinity on the spawned pod and evaluates the
  // spawn-gate exhaustion check (excluded ⊇ spawnable ⇒
  // ReportAttemptOutcome(NO_ELIGIBLE_SOURCE)) against them. Legacy
  // pod-name exclusion keys are NOT carried here (they are meaningless
  // as scheduling constraints); `repeated`, so absence == empty == no
  // exclusions and no back-compat decode distinction is needed.
  repeated string excluded_nodes = 16;
  // C2/124: the derivation's resubmit-cycle count at intent compute
  // time. The controller echoes it back on
  // `ReportAttemptOutcomeRequest.resubmit_cycle` for synthesized
  // verdicts (NoEligibleSource) so the scheduler can drop verdicts
  // computed against a stale cycle. 0 = first cycle (and the pre-C2
  // wire default — see the echo field's skew note).
  uint64 resubmit_cycle = 17;
}

// One conjunction of node-match requirements. Mirrors k8s core/v1
// `NodeSelectorTerm` so a `From<...>` into `k8s_openapi::api::core::v1::
// NodeSelectorTerm` is a field-by-field copy (rio-controller A18).
// Defined here rather than importing k8s-openapi into rio-proto so the
// proto stays buildable without the k8s dep tree.
message NodeSelectorTerm {
  repeated NodeSelectorRequirement match_expressions = 1;
}
message NodeSelectorRequirement {
  string key = 1;
  // "In" only for §13a; full k8s operator set is
  // In/NotIn/Exists/DoesNotExist/Gt/Lt.
  string operator = 2;
  repeated string values = 3;
}

message GetSpawnIntentsRequest {
  // Filter by executor kind. Absent = unfiltered. Controller pool
  // reconcilers set this to `pool.spec.kind` so a kind=Builder Pool
  // sees only `kind=Builder` intents and a kind=Fetcher Pool sees
  // only `kind=Fetcher` (the ADR-019 airgap boundary). `optional`
  // because ExecutorKind has no UNSPECIFIED variant (Builder is
  // wire-0).
  optional ExecutorKind kind = 1;
  // Filter by `intent.system ∈ systems`. Empty = unfiltered (the
  // server-side analogue of `Pool.spec.systems`; I-107/I-143).
  repeated string systems = 2;
  // I-176: when `filter_features=true`, only emit intents whose
  // `required_features ⊆ features` — derivations a worker advertising
  // exactly `features` would pass hard_filter's feature check for.
  // Feature-gated pools (`features ≠ ∅`) ALSO exclude derivations
  // with empty `required_features` (I-181: those are owned by the
  // featureless pool).
  //
  // `filter_features=false` (default) → unfiltered. Distinguishes
  // "no filter" (CLI, status display) from "filter to
  // required_features=∅" (a pool with `features: []`). proto3 repeated
  // can't be optional, hence the explicit bool.
  repeated string features = 3;
  bool filter_features = 4;
}

message GetSpawnIntentsResponse {
  // One intent per Ready derivation that passed the request filter,
  // priority-sorted descending (critical-path first) so a controller
  // truncating to `headroom` drops lowest-priority work.
  repeated SpawnIntent intents = 1;
  // Per-system breakdown of Ready derivations (same population the
  // intent filter sees, before the kind/feature filters apply). Sum
  // across keys == `ClusterStatus.queued_derivations`. Coherent
  // snapshot with `intents` so a controller reading both sees one
  // queue state.
  map<string, uint64> queued_by_system = 2;
  // 3 was `repeated string dead_nodes` — the stream-era heartbeat-fed
  // hung-node detector's output. Removed by the executor-lifecycle proto
  // sweep: the OA2 controller-side wedge clustering over the open-attempt
  // view (`ctrl.nodeclaim.wedge-cluster`) is the successor signal.
  reserved 3;
  reserved "dead_nodes";
  // §13b: per-cell ICE mask ("h:cap" strings) so the controller's
  // @alg-pool excludes the same cells the scheduler has marked
  // ICE-infeasible. Coherent snapshot with `intents` (one tick).
  repeated string ice_masked_cells = 4;
}

// Controller → scheduler ack: "I created Jobs for these intents".
// Arms the Pending-watch (ICE-backoff) timer for each. GetSpawnIntents
// is read-only — it does NOT arm — so dashboard/CLI polls and
// headroom-gated intents the controller never spawns do not false-mark
// `(band, cap)` cells ICE-infeasible.
message AckSpawnedIntentsRequest {
  // The intents the controller successfully created Jobs for this
  // tick. Scheduler reads `intent_id` (== drv_hash) and
  // `node_selector` (to recover the `(band, cap)` cell to arm).
  // Band-agnostic selectors (empty / no `rio.build/hw-band`) are
  // ignored — they don't enter the ICE ladder.
  repeated SpawnIntent spawned = 1;
  // §13b: cells where NodeClaim Launched=False or Registered timed
  // out this tick. "h:cap[@epoch]" string (`rio_common::cell_wire`
  // grammar — the single-sourced codec both sides consume).
  // merged_bug_008: the optional `@<epoch>` suffix carries the
  // controller's per-cell-monotonic evidence epoch (u64 millis,
  // minted once per buffered evidence event, stable across
  // redeliveries of that event); the scheduler applies a cell event
  // iff `epoch > last_applied[cell]`, so redelivery and reorder are
  // no-ops by construction. Epoch-less entries keep the pre-epoch
  // semantics (decode-totality lane; emit + decode shipped together
  // per the signed --wipe rollout, Q6). Scheduler marks each
  // ICE-infeasible on a 60s→120s→… backoff ladder so subsequent
  // `solve_intent_for` routes around the cell. Empty until controller
  // A18 wires the NodeClaim watcher.
  repeated string unfulfillable_cells = 2;
  // §13b: cells where a NodeClaim reached `Registered=True` this
  // tick — the SUCCESS edge that resets ICE backoff. "h:cap[@epoch]"
  // string (same `cell_wire` grammar + epoch law as
  // `unfulfillable_cells`, field 2). Scheduler applies each through
  // the epoch gate onto `ice.clear()`. Distinct from `spawned`
  // (field 1), which is "Job-created OR still-Pending" — never a
  // capacity-success signal (bug_008). Empty until controller A18
  // wires the NodeClaim watcher; interim clear path is
  // first-heartbeat.
  repeated string registered_cells = 3;
  // §13a R24B7 (`r[sched.sla.cost-instance-type-feedback]`):
  // instance types Karpenter resolved for cells that registered this
  // tick. Scheduler folds into `CostTable.cells` so `spot_price_poller`
  // knows what to price. `cell` is "h:cap" (controller `Cell::Display`
  // form, `"od"` not `"on-demand"`); cores/mem_bytes are kubelet
  // allocatable. Edge-detected per NodeClaim — not full-set every tick.
  repeated ObservedInstanceType observed_instance_types = 4;
  // r[sched.admin.hung-node-detector+3]: kube-authoritative
  // `intent_id → spec.nodeName` from the controller's per-tick pod
  // LIST (`PodSnapshot`). Scheduler stores as
  // `authoritative_binding` and `detect_hung_nodes` groups by it instead
  // of any worker-supplied value (worker is NOT trusted; a forged
  // node_name would let 2 colluding tenants reap an arbitrary
  // NodeClaim). Full set every tick — ~1 entry per active build.
  repeated BoundIntent bound_intents = 5;
  // C2/285: explicit presence wrapper for the binding set. `optional`
  // because ABSENCE is consumer-distinguishable: a sender that did not
  // compute bindings this tick (per-pool reconcilers) leaves it unset
  // and the scheduler keeps its map; the nodeclaim-pool reconciler
  // ALWAYS attaches it — present-and-empty correctly CLEARS the
  // scheduler's `authoritative_binding` map (scale-to-zero). Field 5
  // stays as the legacy non-empty-only rebuild path for rolling skew
  // (read-side back-compat arm; never dual-written by a C2 sender).
  optional BindingSnapshot binding_snapshot = 6;
  // live_051(c): per-intent rejection verdicts for intents the
  // controller structurally CANNOT host — minted from the cover fold's
  // `PlacementOutcome::NoHostingClass` arm ONLY (a controller-config
  // gap the scheduler cannot see). ICE-masked populations stay OFF this
  // field: their masks are the scheduler's own (`ice_masked_cells` /
  // `unfulfillable_cells`), so a verdict would re-ship information the
  // scheduler already owns. One entry per rejected intent per ack
  // (bounded by the tick's drop population); re-minted every tick the
  // intent stays unhostable, so a lost ack self-heals on the next tick.
  // The scheduler accumulates consecutive verdicts per drv and poisons
  // at a typed budget with `detail` as the operator-actionable message
  // — a drv never loops Ready unanswered.
  repeated IntentVerdict rejected = 7;
}

// live_051(c): one rejected spawn intent + WHY, carried on
// `AckSpawnedIntentsRequest.rejected`. The controller answers demand it
// cannot host instead of dropping it into a metric-only tally.
message IntentVerdict {
  // The rejected intent (== drv_hash), same identity as
  // `SpawnIntent.intent_id`.
  string intent_id = 1;
  // Closed rejection-reason alphabet. Consumers fold EXHAUSTIVELY
  // (zero wildcard arms) — a new variant forces a consumer decision.
  IntentVerdictReason reason = 2;
  // Human-actionable: names the intent's footprint/arch/features and
  // the configured hw-classes that failed to match, so the poison
  // message an operator reads is never a bare "no hosting class".
  string detail = 3;
}

// Closed reason set for `IntentVerdict.reason`.
enum IntentVerdictReason {
  INTENT_VERDICT_REASON_UNSPECIFIED = 0;
  // No configured `[sla.hw_classes]` entry admits the intent's
  // (arch, footprint, required_features) — persistent until the
  // config changes; the scheduler-side budget consumes this to a
  // terminal poison with `detail`.
  INTENT_VERDICT_REASON_NO_HOSTING_CLASS = 1;
}

// C2/285: the full `intent_id → spec.nodeName` binding set for one
// tick. Wrapper message so empty-set and not-sent are distinct on the
// wire (proto3 repeated fields cannot distinguish them).
message BindingSnapshot {
  repeated BoundIntent bound = 1;
}

message BoundIntent {
  string intent_id = 1;
  string node_name = 2;
  // The rendered deadline the pod was actually dispatched under
  // (`rio.build/deadline-secs` pod annotation = the same
  // `ephemeral_deadline` solve `activeDeadlineSeconds` is rendered
  // from). The scheduler floors the mint-persisted deadline at this
  // value so a between-solve estimate shrink can never establish a
  // healthy attempt still inside its pod's real deadline (bug_106).
  // 0 = absent (annotation missing / pre-upgrade controller): the
  // render floors at 180s, so 0 is never a real deadline — the
  // scheduler falls back to its mint-time re-solve alone.
  uint32 deadline_secs = 3;
}

message ObservedInstanceType {
  string cell = 1;
  string instance_type = 2;
  uint32 cores = 3;
  uint64 mem_bytes = 4;
}

// Mint per-intent `RIO_EXECUTOR_TOKEN`s for the controller's Job-spawn
// loop. rio-controller-only — the credential lives on a controller-only
// surface so dashboard/CLI never hold it (r[sec.executor.identity-token]).
// `intent_ids` are the `SpawnIntent.intent_id` (= drv_hash) the
// controller is about to create Jobs for; the response maps each to its
// HMAC-signed `ExecutorClaims{intent_id, kind, expiry}`. Unknown
// intent_ids (drv left Ready between GetSpawnIntents and this call) are
// omitted from the map; the controller spawns those pods without a token
// (dev-mode parity — the builder omits the header, scheduler rejects
// under HMAC mode, pod idle-exits, next tick re-spawns).
message MintExecutorTokensRequest {
  repeated string intent_ids = 1;
}
message MintExecutorTokensResponse {
  // intent_id → signed ExecutorClaims token. Empty map when the
  // scheduler has no HMAC key configured (dev mode).
  map<string, string> tokens = 1;
}

// ───────────────────────────────────────────────────────────────────────────
// HwClassSampled (ADR-023 §13a hw-bench gating)
// ───────────────────────────────────────────────────────────────────────────

// Controller asks "does any h in this intent's allowed-set A have <3
// distinct pod_id benches?" — if so, set `rio.build/hw-bench-needed` on
// the spawned pod so the builder runs the microbench before the build.
// Batched per controller tick (one RPC for all hw_classes seen this
// tick, not per-intent).
message HwClassSampledRequest {
  repeated string hw_classes = 1;
}
// Per-dimension distinct-tenant count (K=3: [alu, membw, ioseq]).
// Wrapper because proto3 map values cannot be `repeated`.
message HwDimCounts {
  repeated uint32 per_dim = 1;
}
message HwClassSampledResponse {
  // h → distinct **tenant** count per K=3 dim that contributed a
  // `Some(d)` row to `hw_perf_samples`. bug_013: counting pods (or
  // tenants) per-row reopens the per-dim capture threat — one tenant
  // spawning 3 pods writing K=3 to a foreign hw_class would mark
  // `bench_needed=false` there and become the sole `Some(membw)`
  // contributor. Controller checks `∃h ∃d: per_dim[d] < trust_threshold`.
  map<string, HwDimCounts> sampled_count = 1;
  // The scheduler's `FLEET_MEDIAN_MIN_TENANTS` gate value — same unit
  // (tenants), granularity (per-dim), AND value as the
  // `cross_tenant_median` floor that decides whether `factor[d]` is
  // trusted. merged_bug_001: a controller-side hardcoded `3` left a
  // 3..5 dead band where the controller stopped K=3-benching but the
  // scheduler still pinned `factor=[1.0;K]` — calibration deadlock.
  // `optional` so old-scheduler/new-controller skew is detectable
  // (proto3 default `0` would make `n < 0` always false → never bench);
  // controller falls back to the new-scheduler value on absence.
  optional uint32 trust_threshold = 2;
}

// ───────────────────────────────────────────────────────────────────────────
// GetHwClassConfig (ADR-023 §13a)
// Read-only dump of the scheduler's `[sla.hw_classes]` map so the
// controller's post-bind annotator can match a bound Node's labels
// against the OPERATOR'S label schema (not a hardcoded 4-key guess)
// and stamp `hw_perf_samples.hw_class` with the operator's `$h` name.
// ───────────────────────────────────────────────────────────────────────────

// Single `key=value` node-label match. Mirrors
// `rio-scheduler/src/sla/config.rs::NodeLabelMatch` so the
// `From<config::NodeLabelMatch>` is a field-by-field copy.
message NodeLabelMatch {
  string key = 1;
  string value = 2;
}
// One hw-class definition: an ANDed label conjunction (stamped on
// Nodes) plus the Karpenter instance-type requirements that PROVISION
// that hardware. `labels` are post-launch Node stamps (rio.build/*);
// `requirements` are what Karpenter's instance-type discovery resolves
// against (karpenter.k8s.aws/*, kubernetes.io/arch).
message HwClassLabels {
  repeated NodeLabelMatch labels = 1;
  repeated NodeSelectorRequirement requirements = 2;
  // EC2NodeClass name for NodeClaims targeting this hw-class
  // (rio-default / rio-nvme / rio-metal). Per-class so nvme classes
  // get instanceStorePolicy:RAID0 (rio-nvme) and metal gets the BIOS
  // AMI (rio-metal).
  string node_class = 3;
  // Per-class capacity ceilings (`HwClassDef.max_cores/max_mem`).
  // Scheduler-side: `evaluate_cell` ClassCeiling rejects `c* > h.max`.
  // Controller-side: `cover_deficit` builds per-cell SizingCfg with
  // `min(per_class, global)` so claims chunk at the class's actual
  // instance-type ceiling (e.g. arm-only pool topping at 64c) instead
  // of the global cap.
  uint32 max_cores = 4;
  uint64 max_mem = 5;
  // §13c: per-hw-class Node taints (chained after the universal
  // rio.build/builder taint). e.g. metal classes carry
  // rio.build/kvm=true:NoSchedule.
  repeated NodeTaint taints = 6;
  // §13c: requiredSystemFeatures this hw-class can host. The
  // bidirectional ∅-guard (`features_compatible`) routes intents.
  repeated string provides_features = 7;
  // §13c: per-hw-class fleet-core sub-budget. cover_deficit clamps this
  // class's mint at min(global_remaining, max_fleet_cores − live_h −
  // created_h) summed across capacity-types.
  optional uint32 max_fleet_cores = 8;
  // §13c: capacity-types this hw-class is permitted to provision
  // (Karpenter label form: "spot" / "on-demand"). Empty ⇒ both
  // (controller treats absent as ALL). solve_full and the controller's
  // all_cells/fallback_cell iterate THIS so an od-only class never
  // generates a (h, Spot) cell.
  repeated string capacity_types = 9;
}
// §13c: `{key, value, effect}` Node taint. Mirrors
// rio-scheduler/src/sla/config.rs::NodeTaint.
message NodeTaint {
  string key = 1;
  string value = 2;
  string effect = 3;
}
message GetHwClassConfigResponse {
  // h → `[sla.hw_classes.$h].labels`. The controller matches a Node's
  // labels against each conjunction; first all-match wins. Empty when
  // `hw_cost_source=None` (static-mode).
  map<string, HwClassLabels> hw_classes = 1;
  // §13c-3: scheduler's boot-resolved global ceiling
  // (`sla.maxCores`/`maxMem`, or `max(catalog).clamp(MIN, MAX_GLOBAL)`
  // under Spot). The controller's `cover_deficit` clamps per-claim
  // requests at `min(per_class_ceiling, global)`. Proto3 zero-default →
  // a controller against a pre-§13c-3 scheduler reads `0` →
  // `HwClassConfig::global_ceilings()` returns `None` → cover skips
  // the tick, fail-closed (same as a not-yet-loaded config).
  uint32 global_max_cores = 2;
  uint64 global_max_mem = 3;
}

// ───────────────────────────────────────────────────────────────────────────
// SeedCorpus v2 (typed Export/ImportSlaCorpus body)
// ───────────────────────────────────────────────────────────────────────────

// SeedCorpus v2. v1 was an opaque JSON string (`ExportSlaCorpusResponse
// .json` / `ImportSlaCorpusRequest.json`, kept for compat). This typed
// shape lets the import handler range-validate (s,p,q,a,b,n_eff,alpha)
// server-side instead of trusting whatever the JSON parser yielded.
message SeedCorpus {
  // Exporter's full per-hw_class factor vector at export time. One per
  // hw_class in the exporter's table, NOT per entry. Lets a §13a
  // importer reconstruct the exporter's normalize basis even when the
  // local table has drifted. Empty for v1 round-trips.
  repeated double ref_factor_vec = 1;
  // Exporter's reference hw_class (the one with factor closest to 1.0).
  // Same field as the v1 JSON; importers rescale (s,p,q) by
  // `local.factor[ref_hw_class]`.
  string ref_hw_class = 2;
  repeated SeedEntry entries = 3;
}
message SeedEntry {
  string pname = 1;
  string system = 2;
  // Package version string at export time. Informational (operator can
  // tell a stale seed for gcc-12 from a fresh gcc-14). Empty for v1.
  string version = 3;
  double s = 4;
  double p = 5;
  double q = 6;
  double p_bar = 7;
  double a = 8;
  double b = 9;
  // §13a: K=3 hardware mixture α ∈ Δ² (alu, membw, ioseq) from
  // als_fit. #[serde(default)] on the Rust side so v1 JSON (no alpha)
  // imports as empty.
  repeated double alpha = 10;
  // Effective sample count behind this fit. v1 carried `n: u32`
  // (truncated); v2 carries the f64 the partial-pool weighting
  // actually uses. #[serde(default)] for v1 import compat.
  double n_eff = 11;
}

// ───────────────────────────────────────────────────────────────────────────
// InjectBuildSample (sla-sizing VM test fixture)
// ───────────────────────────────────────────────────────────────────────────

// One synthetic build_samples row. Mirrors the columns the SLA fit
// reads; everything else (node_name, …) is left NULL.
message InjectBuildSampleRequest {
  string pname = 1;
  string system = 2;
  string tenant = 3;
  double duration_secs = 4;
  int64 peak_memory_bytes = 5;
  optional double cpu_limit_cores = 6;
  optional double cpu_seconds_total = 7;
  optional string version = 8;
  // hw-normalize subtest: tag the row with a synthetic hw_class so the
  // refit's reference-second normalization can be asserted.
  optional string hw_class = 9;
}

// ADR-023 phase-13: one interrupt_samples row. kind="interrupt"
// (value=1, on a SpotInterrupted Event) or kind="exposure" (value=
// node-uptime seconds, on Node DELETE). hw_class is the controller's
// NodeLabelCache join — same "{mfr}-{gen}-{storage}" string the
// hw_perf_samples path uses.
message AppendInterruptSampleRequest {
  string hw_class = 1;
  string kind = 2;
  double value = 3;
  // K8s Event metadata.uid for kind="interrupt" rows. The watcher
  // consumes `.applied_objects()` which re-yields every still-extant
  // Event on relist/reconnect/controller-restart; the INSERT is
  // `ON CONFLICT (event_uid) DO NOTHING` so re-delivery doesn't
  // double-count into λ's numerator. NULL for exposure rows
  // (timer-driven, no Event).
  optional string event_uid = 4;
}

// ───────────────────────────────────────────────────────────────────────────
// ADR-023 SLA overrides (Set/List/ClearSlaOverride, ResetSlaModel, SlaStatus)
// ───────────────────────────────────────────────────────────────────────────

// One sla_overrides row. Unset optional = NULL / wildcard. `id`/
// `created_at_epoch` are server-populated on Set; clients leave them 0.
message SlaOverride {
  int64 id = 1;
  string pname = 2;
  // NULL system/tenant/cluster = wildcard (r[sched.sla.override-precedence]:
  // each set field adds +1 specificity; ties break newest-wins). Rows
  // with cluster set to a DIFFERENT cluster are filtered server-side.
  optional string system = 3;
  optional string tenant = 4;
  optional string cluster = 5;
  // Named tier from `[sla].tiers`. Mutually independent of cores/mem —
  // a row may force a tier (solve runs against that tier only) OR
  // force exact cores (solve bypassed) OR force mem (solve runs for
  // cores, mem is forced), in any combination.
  optional string tier = 6;
  reserved 7, 8, 9, 12;
  optional double cores = 10;
  optional int64 mem_bytes = 11;
  // Unix epoch seconds. Unset = never expires. Expired rows are
  // filtered server-side (List/resolve both ignore them).
  optional double expires_at_epoch = 13;
  double created_at_epoch = 14;
  optional string created_by = 15;
  // Ad-hoc tier targets (wall-seconds). Any of p50/p90/p99 set →
  // solve runs against a one-off tier built from these (config tier
  // ladder ignored). Mutually independent of `tier` (named tier wins
  // if both set — `tier` is the more specific operator intent).
  // Fields 7/8/9 stay reserved (shipped on wire with prior semantics).
  optional double p50_secs = 16;
  optional double p90_secs = 17;
  optional double p99_secs = 18;
  // `karpenter.sh/capacity-type` pin: "spot" | "on-demand". Filters
  // the admissible set to this cap only; does NOT bypass the
  // hw-aware solve (unlike cores/mem/tier). Field 12 stays reserved.
  optional string capacity_type = 19;
}

message SetSlaOverrideRequest {
  // The override to insert. `id`/`created_at_epoch` ignored.
  SlaOverride override = 1;
}

message ListSlaOverridesRequest {
  // Exact-match filter on pname. Empty = all.
  optional string pname = 1;
}

message ListSlaOverridesResponse {
  // Non-expired overrides, ordered by created_at DESC (newest first).
  repeated SlaOverride overrides = 1;
}

message ClearSlaOverrideRequest {
  int64 id = 1;
}

message ResetSlaModelRequest {
  string pname = 1;
  string system = 2;
  string tenant = 3;
}

message SlaStatusRequest {
  string pname = 1;
  string system = 2;
  string tenant = 3;
}

// Snapshot of one cached FittedParams. Stringly-typed `fit_kind` /
// `mem_kind` so the CLI doesn't need to track every DurationFit variant.
message SlaStatusResponse {
  // false ⇔ key never seen / evicted. All other fields zero-valued.
  bool has_fit = 1;
  // "Probe" / "Amdahl" / "Capped" / "Usl"
  string fit_kind = 2;
  double s = 3;
  double p = 4;
  double q = 5;
  double p_bar = 6;
  // "Coupled" / "Independent"
  string mem_kind = 7;
  uint64 mem_p90_bytes = 8;
  optional uint64 disk_p90_bytes = 9;
  double sigma_resid = 10;
  double n_eff = 11;
  double span = 12;
  optional string tier = 13;
  // Override that would apply to this key under current precedence
  // rules, if any. Lets `rio-cli sla status` show "fit says X, override
  // forces Y" in one call.
  optional SlaOverride active_override = 14;
  // "seed" / "fleet" / "operator" / "" — provenance of the prior
  // partial-pooled into this fit (r[sched.sla.prior-partial-pool]).
  // Empty when no prior was applied (priors disabled or pure per-key).
  string prior_source = 15;
}

message SlaExplainRequest {
  string pname = 1;
  string system = 2;
  string tenant = 3;
}

// One tier's solve attempt. `c_star`/`mem_bytes` are populated as far
// as the solve got before `binding_constraint` fired.
message SlaCandidateRow {
  string tier = 1;
  optional double c_star = 2;
  optional uint64 mem_bytes = 3;
  // "no-bounds" (tier has no p50/p90/p99 → feasible at cap_c) |
  // "serial-floor" | "envelope" | "mem-ceiling" | "disk-ceiling" |
  // "-" (feasible).
  string binding_constraint = 4;
  bool feasible = 5;
}

message SlaExplainResponse {
  // One-line DurationFit description; "(no fit — cold-start probe)" when
  // the key has never been seen.
  string fit_summary = 1;
  // "per-key" | "fleet-prior" | "none".
  string prior_source = 2;
  // Human-readable description of the override that short-circuited the
  // solve (forced_cores), or unset.
  optional string override_applied = 3;
  // One row per tier in the configured ladder (tightest-first).
  repeated SlaCandidateRow candidates = 4;
}

// One configured tier from `[sla].tiers`. Unset bound = no constraint at
// that quantile.
message SlaTier {
  string name = 1;
  optional double p50_secs = 2;
  optional double p90_secs = 3;
  optional double p99_secs = 4;
}

// `[sla].probe` cold-start shape.
message SlaProbeShape {
  double cores = 1;
  uint64 mem_per_core_bytes = 2;
  uint64 mem_base_bytes = 3;
  uint32 deadline_secs = 4;
}

// Active `[sla]` config — feeds `rio-cli sla defaults`. Static config;
// no per-key state. `hw_classes` is names-only (the full label/
// requirement schema is on `GetHwClassConfig`).
message SlaDefaultsResponse {
  // Tightest-first (same order `solve_tier` walks).
  repeated SlaTier tiers = 1;
  string default_tier = 2;
  SlaProbeShape probe = 3;
  uint32 max_cores = 4;
  uint64 max_mem_bytes = 5;
  uint64 max_disk_bytes = 6;
  // Configured hw-class names (keys of `[sla].hw_classes`).
  repeated string hw_classes = 7;
  string reference_hw_class = 8;
}

message GetSlaMispredictorsRequest {
  // Return at most this many entries, sorted by `|1 - ratio|`
  // descending. 0 → server default (10).
  uint32 top_n = 1;
}

message SlaMispredictorEntry {
  string pname = 1;
  string system = 2;
  string tenant = 3;
  // "wall" or "mem" — same dimension as `sla_prediction_ratio{dim=...}`.
  string dim = 4;
  // actual / predicted. >1 = under-predicted; <1 = over-predicted.
  double ratio = 5;
}

// Top-|1-ratio| recent prediction-ratio observations, deduped by
// (pname, system, tenant, dim) keeping the most recent. Feeds `rio-cli
// sla mispredictors` so the `RioSlaPredictionDrift` runbook can name a
// pname (the histogram metric is dim-only).
message GetSlaMispredictorsResponse {
  repeated SlaMispredictorEntry entries = 1;
}

message ExportSlaCorpusRequest {
  // Restrict to one tenant's fits. Unset = all tenants.
  optional string tenant = 1;
  // Floor on n_eff — only export keys with at least this many effective
  // samples. Default 3 (the partial-pool n0: a fit that hasn't yet
  // outweighed its OWN prior is a poor seed for someone else's).
  uint32 min_n = 2;
}

message ExportSlaCorpusResponse {
  // SeedCorpus JSON (see rio-scheduler::sla::prior::SeedCorpus). Carried
  // as an opaque string so the wire format and the on-disk format are
  // the same blob — `rio-cli sla export-corpus -o f.json` is just a
  // write(response.json). Kept for compat; new clients read `corpus`.
  string json = 1;
  uint32 entries = 2;
  // Typed v2 body. Same content as `json` (server populates both);
  // typed so a consuming service can range-validate without re-parsing.
  SeedCorpus corpus = 3;
}

message ImportSlaCorpusRequest {
  // SeedCorpus JSON. Same shape ExportSlaCorpus produces. Kept for
  // compat; server prefers `corpus` when set (non-empty entries).
  string json = 1;
  // Typed v2 body. Server prefers this over `json` when `entries` is
  // non-empty so range-validation runs on the typed fields.
  SeedCorpus corpus = 2;
}

message ImportSlaCorpusResponse {
  // Entries merged into the seed-prior table (post-rescale).
  uint32 entries_loaded = 1;
  // The hw_class the corpus was referenced against, and the local
  // factor it was rescaled by. `rescale_factor=1.0` ⇔ unknown
  // ref_hw_class (passed through unscaled). `rescale_factor=NaN` ⇔ hw
  // table not yet populated; corpus stashed and rescaled on the next
  // populated refresh tick.
  string ref_hw_class = 2;
  double rescale_factor = 3;
}
