syntax = "proto3";
package rio.types;

// Build lifecycle wire types — SubmitBuild/WatchBuild/QueryBuild/CancelBuild
// requests, the BuildEvent stream, and the pull-mode dispatch payloads
// (PullAssignment / ReportOutcome).
//
// Same `package rio.types;` as types.proto / dag.proto / admin_types.proto
// — prost merges by package into a single `rio.types.rs`.

import "google/protobuf/timestamp.proto";
import "dag.proto";   // BuildEvent.derivation → DerivationEvent;
                      // SubmitBuildRequest.{nodes,edges} → DerivationNode/Edge
import "types.proto"; // CompletionReport.final_resources → ResourceUsage;
                      // BuildResult.status → BuildResultStatus

// ───────────────────────────────────────────────────────────────────────────
// Executor kind (ADR-019 builder/fetcher split)
// ───────────────────────────────────────────────────────────────────────────

// r[impl proto.executor.kind]
// What role an executor pod plays. Builders run arbitrary derivation code
// and are airgapped (no internet egress). Fetchers run FOD-only (hash-check
// bounded) and have open internet egress. Same rio-builder binary, different
// RIO_EXECUTOR_KIND env. The scheduler routes FODs to fetchers only and
// non-FODs to builders only — no fallback across kinds.
enum ExecutorKind {
  EXECUTOR_KIND_BUILDER = 0;  // Airgapped, arbitrary derivation code
  EXECUTOR_KIND_FETCHER = 1;  // Open egress, FOD-only, hash-check bounded
}

// ───────────────────────────────────────────────────────────────────────────
// Build events (streamed to gateways and dashboard)
// ───────────────────────────────────────────────────────────────────────────

// A build progress event, streamed from scheduler to gateway/dashboard.
message BuildEvent {
  // 6 was `BuildLogBatch log` — the scheduler-relayed live log tail.
  // Removed by the build-log data-plane cutover: the gateway sources the
  // live tail from rio-store's LogService.TailLog instead.
  reserved 6;
  // 2 was `uint64 sequence` — the per-build monotonic counter that keyed
  // the build_event_log replay. Removed with the WatchBuild resumability
  // layer: reconnection is snapshot-first (the snapshot arm below), so
  // events carry no ordering metadata beyond stream order.
  reserved 2;
  reserved "sequence";
  string build_id = 1;
  google.protobuf.Timestamp timestamp = 3;
  oneof event {
    BuildStarted started = 4;
    BuildProgress progress = 5;
    DerivationEvent derivation = 7;         // Per-derivation status changes (dag.proto)
    BuildCompleted completed = 8;
    BuildFailed failed = 9;
    BuildCancelled cancelled = 10;
    BuildInputsResolved inputs_resolved = 11;
    BuildPhase phase = 12;                  // Per-derivation build phase change (resSetPhase)
    SubstituteProgress substitute_progress = 13;  // Per-derivation upstream-fetch byte progress
    BuildSnapshot snapshot = 14;            // Full-state snapshot (first WatchBuild message)
    // The scheduler-side broadcast ring lagged this watcher and events
    // were irrecoverably dropped (tokio broadcast RecvError::Lagged).
    // The consumer's ONLY correct recovery is to re-attach (fresh
    // WatchBuild) and reconcile from the snapshot — this signal replaces
    // per-consumer guesswork about which event types a gap may have
    // contained. Sent at most once per lagged streak (debounced;
    // re-armed by the next successfully forwarded event).
    ResyncRequired resync_required = 15;
  }
}

// Loss signal: the server dropped events for this watcher (broadcast
// ring overrun). Carries no payload — the snapshot of the re-attach is
// the recovery, not anything in this message.
message ResyncRequired {}

// Full build-state snapshot: the first message on every WatchBuild stream.
//
// Replaces the sequence-numbered replay layer: a (re)connecting watcher
// learns the build's CURRENT state from this one message, then receives
// the live broadcast. The scheduler computes the snapshot atomically with
// the broadcast subscription (single-threaded actor, no await between
// subscribe and snapshot), so the events that arrive after it are exactly
// the events emitted after it — no gap, no overlap, no dedup needed.
//
// SubmitBuild streams do NOT carry a snapshot: the response stream is
// subscribed before the build's first event is emitted, so there is no
// missed state to summarize.
message BuildSnapshot {
  BuildState state = 1;                     // Current build state
  // Aggregate counts — same semantics as BuildStatus (the QueryBuildStatus
  // response): absolute counts, not relative to the recovered DAG subset.
  uint32 total_derivations = 2;
  uint32 completed_derivations = 3;
  uint32 cached_derivations = 4;
  uint32 running_derivations = 5;
  uint32 failed_derivations = 6;
  uint32 queued_derivations = 7;
  // hw-normalized ref-seconds (see BuildProgress.critical_path_remaining_secs)
  optional uint64 critical_path_remaining_secs = 8;
  repeated string assigned_executors = 9;
  // Derivations currently executing (Assigned/Running) for this build,
  // with exec_ids — the gateway re-attaches log tails and re-creates
  // per-drv activities from this set after a reconnect.
  repeated RunningDerivation running = 10;
  // Terminal payload: populated when `state` is terminal, so a watcher
  // that attaches after the build finished learns the outcome from the
  // snapshot alone (mirrors BuildCompleted / BuildFailed / BuildCancelled).
  repeated string output_paths = 11;        // SUCCEEDED: final output store paths
  string error_message = 12;                // FAILED
  string failed_derivation = 13;            // FAILED: which derivation caused it
  BuildResultStatus failure_status = 14;    // FAILED: classification for nix-wire BuildStatus
  string cancel_reason = 15;                // CANCELLED
}

// One currently-executing derivation in a BuildSnapshot.
message RunningDerivation {
  string derivation_path = 1;
  // The execution this run corresponds to (UUIDv7 minted at dispatch; the
  // same value DerivationEvent.exec_id carries on STARTED). Keys the
  // gateway's log-tail subscription. Empty when the assignment has not
  // minted an execution yet (Assigned, pod not yet pulled).
  string exec_id = 2;
  // Which attempt class is running this derivation. BUILD entries get the
  // builder display treatment (log tail + per-drv build activity);
  // MATERIALIZATION entries get the substitution display treatment (no
  // tail, substitute activity pair). Absent-vs-zero: UNSPECIFIED (an old
  // scheduler that predates the field) is treated as BUILD — byte-for-
  // byte the pre-field behavior, so no `optional` is needed.
  AttemptKind kind = 3;
}

// Byte-level progress for a derivation's upstream materialization
// fetch. Emitted by the scheduler's materialization byte-progress relay
// (ReportMaterializationProgress -> the build-event stream; BC-4) while
// the store executor is streaming NAR bytes from cache.nixos.org / a
// tenant upstream. Gateway translates to `actCopyPath` + `resProgress`
// so nom renders a download bar (r[gw.activity.subst-progress]).
//
// Display-only: NOT persisted to PG, reuses the last persisted sequence,
// routed via the log broadcast ring so a Lagged drop
// is harmless (the terminal Cached/Completed stop_activity covers it).
// Throttled at the source (rio-store fetch_nar emits per 1 MiB).
message SubstituteProgress {
  string derivation_path = 1;              // The drv whose closure-walk is fetching
  uint64 bytes_done = 2;                   // Decompressed NAR bytes fetched so far (aggregate across closure)
  uint64 bytes_expected = 3;               // Sum of NarSize for paths whose narinfo has been read so far
  string upstream_uri = 4;                 // Base URL of the upstream serving the current path
}

message BuildStarted {
  uint32 total_derivations = 1;             // Total nodes in DAG
  uint32 cached_derivations = 2;            // Already in store
}

// Scheduler's store cache-check is complete; dispatch begins next.
// Fires AFTER BuildStarted, BEFORE the first DerivationEvent::Started.
// Marks the boundary between "resolving what's already built" and
// "building what isn't" — the cached/total split was reported in
// BuildStarted; this signals the scheduler is done with store queries
// and is moving to dispatch_ready().
//
// Empty message: the signal IS the event. If a gateway wants to
// surface "N derivations to build" via STDERR_NEXT, it subtracts
// BuildStarted.cached from BuildStarted.total.
//
// Originally intended for the Build CRD's InputsResolved condition
// (phase4c A3), but P0294 ripped that CRD. The event survives for the
// gateway path — `nix build` clients may want to know when the
// scheduler has finished cache-resolution.
message BuildInputsResolved {}

message BuildProgress {
  uint32 completed = 1;                     // Derivations completed so far
  uint32 running = 2;                       // Derivations currently building
  uint32 queued = 3;                        // Derivations waiting
  uint32 total = 4;                         // Total derivations
  // Estimated seconds remaining on the critical path (longest chain of
  // incomplete derivations; per-node weight from SLA T_min via
  // critical_path.rs est_duration). Unit is hw-normalized REF-SECONDS
  // (r[sched.sla.hw-ref-seconds]), NOT wall-clock — the value spans
  // future unassigned work, so there is no single hw_factor to
  // denormalize by. Dashboards that want a wall-time ETA divide by
  // fleet median hw_factor client-side. Decreases as derivations
  // complete — root's priority drops when a child goes terminal
  // (update_ancestors excludes terminal children from the max).
  // Dashboard (P0278) shows this in the progress column.
  optional uint64 critical_path_remaining_secs = 5;
  // Executor IDs currently assigned to this build's running/assigned
  // derivations. Deduplicated — an executor building 3 drvs for this
  // build appears once. Sorted for deterministic wire order.
  repeated string assigned_executors = 6;
  // Derivations failed so far — the same summary.failed the snapshot's
  // failed_derivations carries, so a live Progress event can no longer
  // silently zero a count the snapshot just reported. Absent-vs-zero:
  // both render as "no failures", which is the pre-field display for
  // senders that predate the field — no `optional` needed.
  uint32 failed = 7;
}

message BuildCompleted {
  repeated string output_paths = 1;         // Final output store paths
}

message BuildFailed {
  string error_message = 1;
  string failed_derivation = 2;             // Which derivation caused the failure
  BuildResultStatus status = 3;             // Failure classification (for nix-wire BuildStatus at gateway)
}

message BuildCancelled {
  string reason = 1;                        // e.g. "client_disconnect", "user_request"
}

// ───────────────────────────────────────────────────────────────────────────
// Build-task envelope (builder-internal)
// ───────────────────────────────────────────────────────────────────────────

// The builder's internal build-task → runtime envelope: the spawned
// build task sends its CompletionReport (and phase edges) through a
// process-lifetime channel typed with this message; the pull loop
// consumes it and forwards the report via ReportOutcome. NOT sent on
// any wire since the BuildExecution stream was removed (the stream-era
// register/ack/prefetch-ack arms are reserved below).
message ExecutorMessage {
  reserved 4;  // was ProgressUpdate (mid-build ema; consumer removed with legacy sizer)
  // 2 was `BuildLogBatch log_batch` — batched log lines. Removed by the
  // build-log data-plane cutover: builders stream log batches to
  // rio-store's LogService.AppendLog instead of the scheduler.
  reserved 2;
  // 1 was `WorkAssignmentAck ack`, 5 was `ExecutorRegister register`,
  // 6 was `PrefetchComplete prefetch_complete` — removed with the
  // BuildExecution stream (executor-lifecycle collapse).
  reserved 1, 5, 6;
  reserved "ack", "register", "prefetch_complete";
  oneof msg {
    CompletionReport completion = 3;        // Build result
    BuildPhase phase = 7;                   // Build phase change (forwarded resSetPhase)
  }
}

// Build phase change forwarded from the daemon's resSetPhase
// (`STDERR_RESULT{SetPhase}`). Builder-internal (the ExecutorMessage
// envelope above) and the BuildEvent.phase arm's payload type; the
// stream-era scheduler relay that forwarded it is gone.
message BuildPhase {
  string derivation_path = 1;              // Which derivation entered this phase
  string phase = 2;                        // e.g. "unpackPhase", "buildPhase"
}

// Log lines batched for efficiency. Executor buffers up to 64 lines or 100ms.
// Uses bytes (not string) since build output may contain non-UTF-8 data.
message BuildLogBatch {
  string derivation_path = 1;              // Which derivation produced these lines
  repeated bytes lines = 2;                // Batch of log lines (raw bytes)
  // For ordering. Per execution the numbering MUST be strictly increasing
  // across batches: the scheduler rejects a batch that starts at or below
  // the highest line number it already holds for the execution, or whose
  // first_line_number + lines.len() would overflow u64. Forward gaps are
  // allowed (suppressed/undelivered lines).
  uint64 first_line_number = 3;
  string executor_id = 4;                  // For debugging
}

// Executor reports build completion for a derivation.
message CompletionReport {
  string drv_path = 1;                     // Derivation that completed
  BuildResult result = 2;                  // Build result details
  string assignment_token = 3;             // From the WorkAssignment

  // Peak memory in bytes from the per-build cgroup's memory.peak
  // (cgroup v2). Kernel-tracked lifetime peak of the WHOLE process
  // tree under nix-daemon — the daemon itself + the builder it forks
  // + every compiler sub-process. One read at build end, no polling.
  //
  // cgroup v2 memory.peak is essential here (NOT /proc/{pid}/status
  // VmHWM): VmHWM would only measure nix-daemon's own RSS (~10MB)
  // because the daemon forks the builder and waitpid()s — the
  // builder's footprint never appears in the daemon's /proc.
  // memory.peak captures the whole TREE.
  //
  // Feeds build_samples.peak_memory_bytes for the ADR-023 SLA fit
  // (per-key M(c) curve). NOT carried by final_resources (field 8) —
  // memory_used_bytes there is memory.current at last poll, which is
  // near-zero after the builder process has exited.
  //
  // 0 means "couldn't read" — cgroup setup failed (see
  // resource_metrics_degraded below), or build failed before the
  // cgroup was populated. Scheduler treats 0 as no-signal.
  uint64 peak_memory_bytes = 4;

  reserved 5; // was output_size_bytes (sum of uploaded NAR sizes; never consumed)

  // Peak CPU usage in cores-equivalent, sampled 1Hz from the
  // per-build cgroup's cpu.stat usage_usec. Unlike memory, there's
  // no kernel-tracked "peak CPU" — usage_usec is cumulative, so the
  // builder polls it every second and computes:
  //
  //   cores = (usage_usec_now - usage_usec_prev) / elapsed_usec
  //
  // Max over the build's lifetime. Cumulative over the whole tree
  // (cgroup semantics), so a parallel make -j8 that pins 8 cores
  // reports ~8.0. Feeds build_samples.peak_cpu_cores for the ADR-023
  // SLA fit (saturation detection in ingest::refit).
  //
  // 0.0 = build failed before the cgroup was populated (executor
  // error before spawn, or daemon exited too fast to poll). Same
  // sentinel as peak_memory_bytes=0 — scheduler treats it as
  // no-signal. double not uint: fractional cores are real (a build
  // that averages 2.5 cores is useful to know).
  //
  // cgroup v2 is a HARD REQUIREMENT. Executor fails startup if
  // /sys/fs/cgroup isn't cgroup2fs or the subtree isn't delegated.
  // No degraded-mode flag — if you see an executor pod Running, the
  // cgroup setup succeeded.
  double peak_cpu_cores = 6;

  // k8s spec.nodeName the executor pod ran on (downward API →
  // RIO_NODE_NAME). For ADR-023's hw_class join: the SLA model groups
  // build samples by node instance type, which the scheduler resolves
  // from this via the Node object. optional for wire-compat — old
  // executors omit, scheduler treats absent as unknown-hw.
  optional string node_name = 7;

  // Final cgroup-poll snapshot at completion time. Carries the ADR-023
  // telemetry (cpu_limit_cores, cpu_seconds_total, peak_io_pressure_pct,
  // peak_disk_bytes) — the scheduler's completion handler reads this
  // when writing build_samples. This is the ONLY telemetry channel
  // (CompletionReport is not droppable). Does NOT carry peak memory/cpu
  // — fields 4/6 above remain the only source for those
  // (memory_used_bytes here is memory.current, near-zero post-exit).
  optional ResourceUsage final_resources = 8;

  // ADR-023 phase-10 hw_class (controller-stamped pod annotation
  // `rio.build/hw-class` → downward-API → RIO_HW_CLASS). Written
  // through to build_samples.hw_class so HwTable.normalize can map this
  // sample's wall-seconds to reference-seconds. The scheduler has no
  // Node informer, so this is the only path; absent → factor=1.0.
  optional string hw_class = 9;

  // Total log lines this execution emitted, INCLUDING the banner header (3)
  // and footer (2) lines. The store's log-completeness predicate is
  // "drv_log_chunks covers a contiguous [0, final_line_count)".
  // 0 means "never reported" (older builders do not set this).
  uint64 final_line_count = 10;
}

// Result of building a single derivation.
message BuildResult {
  BuildResultStatus status = 1;
  string error_msg = 2;                    // Non-empty on failure
  reserved 3;                              // was times_built (repeat builds; scheduler never read it)
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp stop_time = 5;
  repeated BuiltOutput built_outputs = 6;  // Realized output paths with hashes
}

// A single realized output from a build.
message BuiltOutput {
  string output_name = 1;                  // e.g. "out", "dev"
  string output_path = 2;                  // Realized store path
  bytes output_hash = 3;                   // SHA-256 digest of the output NAR
}

// BuildResultStatus lives in types.proto (shared with dag.proto's
// DerivationFailed — avoids circular import dag.proto ↔ build_types.proto).

// Work assignment from scheduler to executor.
message WorkAssignment {
  string drv_path = 1;                    // Store path of the .drv file
  bytes drv_content = 2;                  // Inline ATerm content. Empty = fallback (budget exceeded / cache-hit / store-error safe-degrade); executor fetches via GetPath.
  // Field 3 (input_paths) was never populated — scheduler always sent
  // empty, executor always computed closure via QueryPathInfo BFS (the
  // executor's own manifest prime + JIT fetch is the warm path).
  reserved 3;
  reserved "input_paths";
  repeated string output_names = 4;       // Outputs to build (e.g. ["out", "dev"])
  BuildOptions build_options = 5;         // Build configuration
  string assignment_token = 6;            // HMAC-SHA256-signed claims (executor_id, drv_hash,
                                          //  expected_outputs, expiry) — store verifies on PutPath
  // 7 was `uint64 generation` — the stream-era worker-side fence input.
  // The generation fence is transaction-side (the pull mint checks the
  // durable claims floor); the payload no longer carries it.
  reserved 7;
  reserved "generation";
  bool is_fixed_output = 8;              // FOD: needs network access, verify output hash
  // W3C traceparent for distributed tracing across the SSH boundary.
  // ssh-ng has no gRPC metadata channel, so the scheduler injects its
  // current span's traceparent here and the executor extracts it to
  // parent the spawned build task's span. Empty = fresh root span.
  string traceparent = 9;
  // ADR-023 SLA-sizing: the resource triple the scheduler solved for
  // this assignment and requested on the executor pod.
  // assigned_cores reaches nix-daemon as
  // wopSetOptions.buildCores → NIX_BUILD_CORES → make -jN. Without this
  // the SLA model fits noise: build_options.build_cores is the CLIENT's
  // request (almost always 0 = "all"), and the cgroup-clamp ceil()s
  // fractional limits — neither tells the scheduler what -jN actually ran.
  // optional for wire-compat: absent → executor falls back to the cgroup
  // cpu.max clamp (pre-ADR-023 behavior).
  optional uint32 assigned_cores = 10;
  optional uint64 assigned_mem_bytes = 11;
  optional uint64 assigned_disk_bytes = 12;
  // Per-execution identifier minted by the scheduler at dispatch (UUIDv7
  // string). Echoed by the worker in the log header (display-only, not
  // load-bearing). Keys logs/{drv_hash}/{exec_id}.log.zst.
  string exec_id = 13;
}

// Build configuration options propagated from the client.
message BuildOptions {
  uint64 max_silent_time = 1;             // Max seconds without output before timeout
  uint64 build_timeout = 2;              // Max total build time in seconds
  uint64 build_cores = 3;               // Number of cores to use (0 = all)
  // Field 4 (keep_going) — wrong layer. keep_going is per-BUILD (DAG-level:
  // "continue dispatching sibling derivations after one fails"), handled
  // scheduler-side by r[sched.build.keep-going]. Per-DERIVATION keep_going
  // is meaningless for wopBuildDerivation (one drv → one daemon call).
  // The BUILD-level flag lives on SubmitBuildRequest.keep_going (field 8).
  reserved 4;
  reserved "keep_going";
}

// CancelSignal, PrefetchHint and PrefetchComplete were removed with the
// BuildExecution stream (executor-lifecycle collapse): cancellation and
// preemption are pod terminations (the controller deletes the Job and the
// builder's SIGTERM-abort cgroup-kills the build), and input warm-up is the
// executor's own manifest prime + JIT fetch. Whole-message deletions need no
// reserved statements; the messages were only ever carried inside the
// removed stream envelopes.


// HeartbeatRequest / HeartbeatResponse were removed with the Heartbeat RPC
// (executor-lifecycle collapse): there is no scheduler-side registration or
// liveness state to feed — pod liveness belongs to the kubelet/Job
// lifecycle, attempt liveness to the durable open-attempt row plus the
// establishment sweep.

// ───────────────────────────────────────────────────────────────────────────
// Pull-mode dispatch (ExecutorService.PullAssignment / ReportOutcome)
// ───────────────────────────────────────────────────────────────────────────

// The pull-mode pod's one ask: "give me the work I was spawned for."
message PullAssignmentRequest {
  // The HMAC-signed executor token injected at Job spawn
  // (RIO_EXECUTOR_TOKEN). Same credential the stream/heartbeat path
  // carries in `x-rio-executor-token` metadata; carried in the body
  // here so the unary is self-contained for clients that cannot set
  // per-call metadata. The scheduler accepts either carrier and
  // verifies the token↔intent binding before any state is touched
  // (sec.executor.identity-token, applied per-unary).
  string executor_token = 1;
  // The SpawnIntent.intent_id (== drv hash) this pod was spawned for
  // (RIO_INTENT_ID). Must match the token's attested intent.
  string intent_id = 2;
  // NEW (additive, substitution-replacement Phase A): the attempt class
  // this pull claims. Absent/UNSPECIFIED = BUILD — deployed builder pods
  // that predate this field send nothing and behave bit-for-bit as
  // before (the frozen pull-contract addendum).
  AttemptKind kind = 3;
  // NEW (additive): per-replica executor identity for materialization
  // pulls (the store replica's pod name). Ignored for kind=BUILD —
  // build-pull identity remains the attested intent (the as-built rule).
  string executor_instance = 4;
  // NEW (additive, this wave — merged_bug_158): materialization
  // re-delivery resume token. A materialization claim that finds the
  // attempt already Claimed by THIS composite identity is re-delivered
  // ONLY when this field carries the original assignment's exec_id —
  // a fresh claim (empty field) answers NotYetReady, so a colliding
  // identity (two workers folding to one label) can never steal a live
  // attempt. Empty == absent (proto3 string; both mean "no token").
  // Build-kind pulls ignore it (lost-ack resume stays tokenless).
  // Deploy order: scheduler before store (old schedulers ignore it —
  // delivery stays gated scheduler-side either way).
  string resume_exec_id = 5;
}

// The drv is no longer wanted (cancelled, substituted, completed,
// queue re-solved). The pod exits 0; the Job completes successfully and
// charges nothing.
message Gone {}

// The drv is still wanted but not currently deliverable to THIS pod:
// its dependencies are not yet built (forecast-spawned pod arrived
// early), or the drv is currently open on another executor (a stream
// assignment during coexistence, or an open attempt bound to a
// different pod). Never a write; the pod re-pulls after retry_after.
message NotYetReady {
  // Server-suggested re-pull delay in seconds. The pod adds jitter.
  uint32 retry_after_seconds = 1;
}

message PullAssignmentResponse {
  oneof outcome {
    // Deps Ready and the open attempt is bound to this pod: the
    // existing dispatch payload, identical on every re-pull while the
    // attempt is open. `WorkAssignment.generation` is observability
    // only on this path — the generation fence is transaction-side.
    WorkAssignment assignment = 1;
    Gone gone = 2;
    NotYetReady not_yet_ready = 3;
  }
}

// Terminal outcome for a pulled assignment, idempotent by exec_id.
message ReportOutcomeRequest {
  // The per-execution identifier the PullAssignment payload carried
  // (`WorkAssignment.exec_id`). Identifies the open attempt; a report
  // for an unknown/never-pulled exec_id is acknowledged and ignored.
  string exec_id = 1;
  // Today's completion payload, unchanged (drv_path, BuildResult,
  // telemetry, final_line_count).
  CompletionReport report = 2;
  // NEW (additive, substitution-replacement Phase A): set INSTEAD of
  // `report` for materialization attempts. Message-typed => proto3
  // tracks presence; absent = build report, exactly as before. A
  // request carrying both is rejected.
  MaterializationOutcome materialization_outcome = 3;
}

// Empty ack. Returned only after the scheduler's appending transaction
// committed — the pod may exit 0 once it has this.
message ReportOutcomeResponse {}

// ─────────────────────────────────────────────────────────────────────────
// Materialization attempts (substitution-replacement campaign, Phase A).
// Additive and dormant: builder pods never set these fields; a request
// without them is a build pull, bit-for-bit as before.
// ─────────────────────────────────────────────────────────────────────────

// The attempt class a pull claims. Proto3 zero value (UNSPECIFIED) is
// treated as BUILD by the scheduler — deployed builder pods that predate
// this field send nothing and must keep working unchanged (the frozen
// pull-contract addendum, executor-invariant-map.md).
enum AttemptKind {
  ATTEMPT_KIND_UNSPECIFIED = 0;
  ATTEMPT_KIND_BUILD = 1;
  ATTEMPT_KIND_MATERIALIZATION = 2;
}

// Outcome payload for a materialization attempt (design §2.4's alphabet).
// Carried by ReportOutcomeRequest.materialization_outcome; mutually
// exclusive with `report` (a request carrying both is rejected).
message MaterializationOutcome {
  message Success {
    // Paths this execution ingested (fetched + put).
    repeated string ingested_paths = 1;
    // Paths verified already-present (and pinned).
    repeated string verified_paths = 2;
  }
  message Unobtainable {
    // Paths confirmed absent upstream after the full per-path retry ladder.
    repeated string missing_paths = 1;
    repeated string verified_paths = 2;
    // Human-readable cause (the demotion-reason taxonomy successor).
    string cause = 3;
  }
  message InfraFailure {
    // upstream 5xx/timeout/store-internal/no-tenant-context — nothing
    // is confirmed; never routes from-source, never fail-fasts (B3).
    string detail = 1;
  }
  message Aborted {
    // The walk was aborted by the worker (SIGTERM during a store
    // rollout/drain): nothing is confirmed either way. The scheduler
    // closes the attempt CHARGE-FREE (AD5 parity for the
    // materialization kind — owner default Q3, 2026-06-03): no
    // MaterializationInfra row, job back to pending claimable, so
    // routine store rollouts never burn the 3-attempt park budget.
    // Deploy order: scheduler before store (an old scheduler answers
    // a report carrying this variant with InvalidArgument and the
    // establishment sweep closes the attempt — bounded skew).
    string detail = 1;
  }
  oneof outcome {
    Success success = 1;
    Unobtainable unobtainable = 2;
    InfraFailure infra_failure = 3;
    // 4 reserved for RetryLater (A4, this wave).
    Aborted aborted = 5;
  }
}

// ── ListMaterializationJobs (the GetSpawnIntents analogue for store
//    replicas; leader-served; design §2.2 item 1) ──
message ListMaterializationJobsRequest {
  // Store-service token (same HMAC family as executor tokens).
  string service_token = 1;
  // Cap on returned descriptors (server clamps to its own max).
  uint32 limit = 2;
}
message MaterializationJobDescriptor {
  string job_id = 1;
  string drv_hash = 2;
  // Empty = no tenant context (the executor re-resolves; design §2.2 item 3).
  string tenant_id = 3;
  // pruned | cache_opportunity | stale_reset | reprobe (observability).
  string origin = 4;
}
message ListMaterializationJobsResponse {
  repeated MaterializationJobDescriptor jobs = 1;
}

// ── ReportMaterializationProgress (display-only, droppable; emission
//    wiring is Phase B — the proto lands now so the wire contract is
//    complete in one addendum) ──
message ReportMaterializationProgressRequest {
  string exec_id = 1;
  uint64 bytes_done = 2;
  uint64 bytes_expected = 3;
  string upstream_uri = 4;
}
message ReportMaterializationProgressResponse {}

// ───────────────────────────────────────────────────────────────────────────
// Build status (QueryBuildStatus)
// ───────────────────────────────────────────────────────────────────────────

// Overall build status returned by QueryBuildStatus.
message BuildStatus {
  string build_id = 1;
  BuildState state = 2;
  uint32 total_derivations = 3;
  uint32 completed_derivations = 4;
  uint32 cached_derivations = 5;
  uint32 running_derivations = 6;
  uint32 failed_derivations = 7;
  uint32 queued_derivations = 8;
  google.protobuf.Timestamp submitted_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  string error_summary = 12;              // Non-empty if state is FAILED
  // Same semantics + unit (hw-normalized ref-seconds, NOT wall-clock)
  // as BuildProgress.critical_path_remaining_secs / assigned_executors
  // — BuildStatus is the polling-query snapshot, BuildProgress is the
  // stream-event delta. Both pull from the scheduler's build_summary()
  // single-pass.
  optional uint64 critical_path_remaining_secs = 13;
  repeated string assigned_executors = 14;
}

enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_PENDING = 1;
  BUILD_STATE_ACTIVE = 2;
  BUILD_STATE_SUCCEEDED = 3;
  BUILD_STATE_FAILED = 4;
  BUILD_STATE_CANCELLED = 5;
}

// ───────────────────────────────────────────────────────────────────────────
// Submit / Watch / Query / Cancel build requests
// ───────────────────────────────────────────────────────────────────────────

message SubmitBuildRequest {
  reserved 1;
  reserved "tenant_id";
  string priority_class = 2;             // "ci", "interactive", or "scheduled"
  repeated DerivationNode nodes = 3;     // All derivations in the DAG (dag.proto)
  repeated DerivationEdge edges = 4;     // Dependency edges (dag.proto)
  uint64 max_silent_time = 5;            // Client build option
  uint64 build_timeout = 6;              // Client build option
  uint64 build_cores = 7;               // Client build option
  bool keep_going = 8;                   // Continue on failure
  // Tenant name (from gateway's authorized_keys comment); scheduler
  // resolves to UUID via tenants table — see r[sched.tenant.resolve].
  // Empty string = single-tenant mode.
  string tenant_name = 9;
}

message WatchBuildRequest {
  // 2 was `uint64 since_sequence` — the replay resume point. Removed with
  // the WatchBuild resumability layer: the response stream is snapshot-
  // first (BuildEvent.snapshot), so there is nothing to resume from.
  reserved 2;
  reserved "since_sequence";
  string build_id = 1;
}

message QueryBuildRequest {
  string build_id = 1;
}

message CancelBuildRequest {
  string build_id = 1;
  string reason = 2;                     // e.g. "client_disconnect", "user_request"
}

message CancelBuildResponse {
  bool cancelled = 1;                    // Whether the build was found and cancelled
}
