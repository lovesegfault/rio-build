syntax = "proto3";
package rio.builder;

import "build_types.proto";

// Executor-facing RPCs served by the rio-scheduler process.
// "Executor" is the generic term for both builders (airgapped, arbitrary
// derivation code) and fetchers (open egress, FOD-only, hash-check bounded)
// — same binary, same pair of unaries, different RIO_EXECUTOR_KIND env.
//
// Separated from SchedulerService for distinct auth/rate-limiting interceptors
// and independent evolution. Both services run in the same scheduler binary.
//
// The stream session protocol (BuildExecution bidi stream, Heartbeat
// unary, ExecutorRegister/WorkAssignmentAck/HeartbeatRequest/
// HeartbeatResponse messages) was removed by the executor-lifecycle
// collapse: a pod is born knowing its derivation (RIO_INTENT_ID + HMAC
// executor token injected at Job spawn) and speaks exactly the two
// idempotent unaries below. Service-level RPCs have no wire numbers to
// reserve in proto3.
service ExecutorService {
  // The pod's first and only ask. Leader-served, three-outcome:
  // WorkAssignment (the existing payload, deps Ready, this pod now owns
  // the open attempt), Gone (drv no longer wanted — pod exits 0,
  // charge-free), or NotYetReady{retry_after_seconds} (wanted but not
  // currently deliverable to THIS pod — deps not yet built, or the drv
  // is open on another executor; the pod re-pulls after the suggested
  // delay). Idempotency key: the open attempt for (intent, pod) — a
  // re-pull while the attempt is open returns the identical payload and
  // exec_id; the bind/transition/mint/pin writes happen exactly once,
  // fenced by the serving replica's lease generation against the
  // durable claims floor.
  rpc PullAssignment(rio.types.PullAssignmentRequest) returns (rio.types.PullAssignmentResponse);

  // Terminal outcome report for a pulled assignment. Leader-served,
  // retried by the pod until acked; the ack is returned only after the
  // appending transaction commits (the pod's exit-0 depends on it).
  // Idempotency key: exec_id — a duplicate or post-establishment report
  // is acknowledged and ignored (the row-already-terminal guard); a
  // report whose exec_id matches no open attempt acknowledges and
  // writes nothing.
  rpc ReportOutcome(rio.types.ReportOutcomeRequest) returns (rio.types.ReportOutcomeResponse);

  // Store-replica poll for claimable materialization jobs
  // (substitution-replacement Phase A; dormant until the materialization
  // flags enable it). Leader-served; returns an empty list when
  // materialization dispatch is disabled or no jobs are pending.
  // Read-only (no state change).
  rpc ListMaterializationJobs(rio.types.ListMaterializationJobsRequest)
      returns (rio.types.ListMaterializationJobsResponse);

  // Fire-and-forget byte progress for a running materialization attempt.
  // Display-only, droppable (the same semantics as the legacy walk's
  // try_send progress relay). The scheduler relays to build events in
  // Phase B; in Phase A the handler acknowledges and drops.
  rpc ReportMaterializationProgress(rio.types.ReportMaterializationProgressRequest)
      returns (rio.types.ReportMaterializationProgressResponse);
}
