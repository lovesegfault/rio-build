syntax = "proto3";
package rio.types;

// DAG wire types — derivation nodes/edges and per-derivation events.
//
// Same `package rio.types;` as types.proto / build_types.proto /
// admin_types.proto — prost merges by package into a single
// `rio.types.rs`, so Rust callers see all types at `rio_proto::types::*`
// regardless of which .proto file defines them.

import "types.proto"; // DerivationEvent.failure_status → BuildResultStatus

// ───────────────────────────────────────────────────────────────────────────
// Derivation DAG (submitted via SubmitBuildRequest)
// ───────────────────────────────────────────────────────────────────────────

// A node in the derivation DAG submitted by the gateway.
message DerivationNode {
  string drv_path = 1;                      // Store path of the .drv file
  string drv_hash = 2;                      // Input-addressed: store path; CA: modular hash
  string pname = 3;                         // Package name (for duration estimation)
  string system = 4;                        // e.g. "x86_64-linux"
  repeated string required_features = 5;    // requiredSystemFeatures
  repeated string output_names = 6;         // e.g. ["out", "dev"]
  bool is_fixed_output = 7;                 // FOD detection (fetchurl etc.)
  // Expected store paths of each output (parallel to output_names).
  // Populated by the gateway from the parsed derivation so the scheduler
  // can re-check the store at merge time, closing the TOCTOU window
  // between the gateway's FindMissingPaths and the scheduler's queue.
  repeated string expected_output_paths = 8;
  // ATerm-serialized .drv content. Empty = scheduler/executor fetches
  // from store (the inline-content fallback). Two gateway producers:
  // filter_and_inline_drv inlines cache-resident derivations whose
  // outputs are missing from the store (≤64 KiB each, 16 MiB total
  // budget — cache-hit nodes stay empty), and the content-bound hook
  // fallback (build_fallback_node) carries a single derivation up to
  // 1 MiB (rio-common MAX_DRV_CONTENT_BYTES). The scheduler validates
  // the same shared bound defensively at SubmitBuild ingress.
  bytes drv_content = 9;
  reserved 10;  // was input_srcs_nar_size (closure-size proxy; ADR-023 supersedes)

  // Phase 5 CA cutoff: set by gateway translate.rs from
  // has_ca_floating_outputs() || is_fixed_output(). Scheduler uses
  // this to gate the hash-compare branch in completion.rs.
  bool is_content_addressed = 11;

  // For CA derivations: the modular derivation hash (hashDerivationModulo
  // SHA-256). This is the `drv_hash` half of the realisations table
  // composite PK — the same value Nix sends as the `sha256:<hex>` prefix
  // of wopRegisterDrvOutput's `id` field. Populated by the gateway after
  // DAG BFS from the same drv_cache that resolves inputDrvs (so the full
  // transitive closure is available). Empty (zero-length) for
  // input-addressed derivations. For the single-node BasicDerivation
  // fallback, build_fallback_node populates it when the inline
  // derivation is content-addressed (CppNix staticOutputHashes:
  // hashDerivationModulo over the lifted derivation, which has no
  // inputDrvs); the scheduler's authoritative-content validation
  // requires it to match the inline drv_content whenever a floating-CA
  // output is present (FOD-only fallbacks may leave it empty, but a
  // present value must still match).
  bytes ca_modular_hash = 12;

  // ADR-018 Appendix B `shouldResolve`: true if this derivation needs
  // dispatch-time placeholder resolution. Set by the gateway post-BFS
  // from has_ca_floating_outputs() OR any inputDrv is floating-CA
  // (ia.deferred — an IA derivation depending on a floating-CA input
  // has that input's placeholder embedded in its env/args, so it needs
  // resolve even though it's IA itself). Scheduler's maybe_resolve_ca
  // gates on this instead of is_content_addressed.
  bool needs_resolve = 13;

  // ADR-023 sizing inputs — extracted from drv.env at gateway
  // translate-time so the scheduler's SLA model can short-circuit
  // exploration. All optional: absent ≠ false/empty.
  //
  // version: feeds version-distance sample weighting (closer versions
  // of the same pname → higher weight in duration estimate).
  optional string version = 14;
  // enableParallelBuilding: when explicitly false → fix p̄=1 (no
  // multi-core exploration). Absent is NOT false — historical stdenv
  // default was unset and nixpkgs is migrating to default-true, so
  // None means "unknown, explore".
  optional bool enable_parallel_building = 15;
  // preferLocalBuild: true → trivially short (writeText, symlinkJoin,
  // etc.), skip learning entirely.
  optional bool prefer_local_build = 16;
  // enableParallelChecking: ADR-023 §Model-staging — `enableParallelBuilding
  // && !enableParallelChecking` is the common stdenv split where compile
  // scales but checkPhase is serial. Recorded into build_samples
  // (migration 056) so a later p̄:=1 seed can distinguish. Absent ≠ false
  // (same as enable_parallel_building).
  optional bool enable_parallel_checking = 17;

  // Demand-driven completeness: the subset of output_names that any
  // consumer actually references (union over all parents' inputDrvs
  // output-name sets) ∪ the root request's OutputsSpec. Computed by the
  // gateway post-BFS (populate_wanted_outputs). Used by the scheduler
  // ONLY for the cache-hit / substitutability classification — the
  // assignment-token allowlist, GC pins, and the client-facing output
  // report keep using the full output_names/expected_output_paths pair.
  // EMPTY MEANS "ALL DECLARED OUTPUTS WANTED" (the BasicDerivation
  // fallback, pre-migration recovery rows, and ^* roots).
  repeated string wanted_output_names = 18;

  // Set by the gateway on every node that a client named as a build
  // target in the originating request (each Built target of
  // wopBuildPaths / wopBuildPathsWithResults, the wopBuildDerivation
  // root). A multi-target request whose targets overlap can fold one
  // requested target INSIDE another target's inputDrv closure, making
  // it a non-root of the combined submission — the scheduler's
  // roots-only prune must verify and retain such nodes even when they
  // are not structural roots. False (the proto3 default) means "only
  // demanded as a dependency", which is the pre-addition behaviour.
  bool explicitly_requested = 19;

  // Set by the gateway when the inline drv_content is the ONLY copy of
  // the derivation anywhere (content-bound hook fallback: the .drv was
  // never uploaded and the gateway never writes its re-serialization to
  // any store). The scheduler MUST persist these bytes with the
  // derivation row so a post-failover dispatch still carries them —
  // otherwise the build can only fail after recovery. False for the
  // inline-.drv optimization (the worker can always fetch those from
  // the store).
  bool drv_content_authoritative = 20;
}

// A dependency edge in the derivation DAG.
message DerivationEdge {
  string parent_drv_path = 1;               // Derivation that depends on child
  string child_drv_path = 2;                // Dependency
}

// ───────────────────────────────────────────────────────────────────────────
// Per-derivation events (nested inside BuildEvent in build_types.proto)
// ───────────────────────────────────────────────────────────────────────────

// Per-derivation status change within a build. Flat enum + per-kind
// payload fields rather than a oneof of five near-empty messages
// (Queued/Started/Completed/Cached/Failed). Helper ctors in
// rio-proto/src/lib.rs (DerivationEvent::started/completed/...) keep
// the producer call sites one-liners and document which fields each
// kind populates.
message DerivationEvent {
  string derivation_path = 1;
  DerivationEventKind kind = 2;
  string executor_id = 3;                   // STARTED only
  repeated string output_paths = 4;         // COMPLETED, CACHED, SUBSTITUTING only
  string error_message = 5;                 // FAILED only
  BuildResultStatus failure_status = 6;     // FAILED only (types.proto)
}

enum DerivationEventKind {
  DERIVATION_EVENT_KIND_QUEUED = 0;
  DERIVATION_EVENT_KIND_STARTED = 1;
  DERIVATION_EVENT_KIND_COMPLETED = 2;
  DERIVATION_EVENT_KIND_CACHED = 3;
  DERIVATION_EVENT_KIND_FAILED = 4;
  // Detached upstream substitute fetch spawned (r[sched.substitute.detached]).
  // Gateway renders as actSubstitute; pairs with CACHED on success.
  DERIVATION_EVENT_KIND_SUBSTITUTING = 5;
}

// ───────────────────────────────────────────────────────────────────────────
// Dashboard DAG (GetBuildGraph — AdminService)
// ───────────────────────────────────────────────────────────────────────────

// Dashboard DAG — deliberately THIN (~200B/node). DerivationNode carries
// inline drv_content (typically ≤64KB, up to 1 MiB for hook-fallback
// nodes). 2000 nodes × 64KB = 128MB > max_encoding_message_size.
// GraphNode carries a handful of strings — just what the dashboard needs to render a
// node box with a status color.
message GraphNode {
  string drv_path = 1;
  string pname = 2;
  string system = 3;
  string status = 4;               // derivations.status CHECK constraint values
  string assigned_executor_id = 5; // empty if unassigned
  // exec_id of the execution this build observed for this drv. Set after
  // a terminal where an execution actually ran; empty when no execution
  // was ever observed for this (build, drv) pair (cache hit, cascaded
  // failure, never dispatched, non-terminal). Empty → dashboard falls
  // back to latest. Exact terminal-path enumeration:
  // r[sched.merge.exec-correlation] in the scheduler spec.
  string exec_id = 6;
}

message GraphEdge {
  string parent_drv_path = 1;
  string child_drv_path = 2;
  // Field 3 RESERVED (retro P0027: was is_cutoff, always-FALSE — P0252
  // uses DerivationStatus::Skipped not an edge flag; GraphNode.status
  // already carries it).
  reserved 3;
}

message GetBuildGraphRequest {
  string build_id = 1;
}

message GetBuildGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  bool truncated = 3;              // server caps at DASHBOARD_GRAPH_NODE_LIMIT=5000
  uint32 total_nodes = 4;
}
