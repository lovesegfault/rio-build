[package]
name = "rio-proto"
description = "Protobuf/gRPC service definitions for rio-build"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tonic = { workspace = true }
# NOTE: tonic-prost, prost-types, and serde are referenced by the
# build.rs-generated code in OUT_DIR (tonic_prost::ProstCodec in every
# service stub, prost_types::Timestamp fields, the serde::Serialize
# derives injected via type_attribute) — cargo-machete cannot see
# generated code and will flag all three as unused. They are not.
tonic-prost = { workspace = true }
# Health-aware balanced channel (client/balance.rs) probes
# grpc.health.v1/Check on each pod IP to find the leader.
tonic-health = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
# castore_util::directory_digest — the canonical dir_digest both the
# builder (producer) and store (validator) compute.
blake3 = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio-stream = { workspace = true }
tokio = { workspace = true }
# CancellationToken for connect_with_retry's shutdown-aware sleep.
tokio-util = { workspace = true }
futures-util = { workspace = true }
rio-common = { workspace = true }
rio-nix = { workspace = true }
tracing = { workspace = true }

# phase2b: W3C traceparent inject/extract via tonic interceptor
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# Interceptor roundtrip test needs a real (non-noop) tracer to get
# non-zero trace IDs, and the W3C propagator to register.
opentelemetry_sdk = { workspace = true }
rstest = { workspace = true }
# connect_with_retry tests use paused-clock time (start_paused/advance).
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
tonic-prost-build = { workspace = true }
